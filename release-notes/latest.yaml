# The release note every app bundles. Tapping the version in Account opens it.
#
# One file, the latest release only. `npm run gen` copies it into each app as
# JSON (see gen/release-notes.mjs); the web reads it through loadReleaseNotes().
# Edit this file, never the generated copies.
#
#   version    the release this note describes, as people see it ("2026.11")
#   date       the release date, YYYY-MM-DD
#   localizations.<locale>
#     title    the note's heading
#     intro    optional paragraph under the heading
#     sections ordered; each { heading (optional), items: [bullet, ...] }
#
# `en` is required. Any other store locale may be added.
#
# Every app shows the note the same way (README.md, "Release notes"): the title,
# then "<version> · <date>" (this file's version and date, not the running
# build's), the intro, then each section's heading over its bullets. The
# language is the app's own UI language: that exact store locale, else the same
# language in another form (the bare language first, pt-BR -> pt, then another
# region, pt-PT -> pt-BR), never across Chinese scripts (zh is Simplified,
# zh-HK Traditional), else `en`. The note is laid out in its own language's
# direction, so the English fallback reads left to right in an Arabic UI.
version: "2026.11"
date: "2026-11-19"
localizations:
  en:
    title: "What's new"
    intro: "This release is named Champion. It includes 2 months of improvements to:"
    sections:
      - items:
          - "Packet flow performance, including optimizations for diverse network conditions"
          - "Extenders and VLESS support, to make the network more accessible"
          - "Memory and CPU optimizations"
          - "Expanded DNS options"
          - "SN25/ur.xyz earnings integration"
          - "Improved session management"
          - "Bug fixes"
