description: "Device list: the line above the list. A slot is one of the plan's concurrent connections (2 on the free plan); a connected device or hosted proxy takes one."
source: "Each connected device or proxy uses a slot of your plan. Remove one you no longer use to free its slot."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "يستخدم كل جهاز أو وكيل متصل مكانًا من خطتك. أزل ما لم تعد تستخدمه لتحرير مكانه."
  cs: "Každé připojené zařízení nebo proxy zabírá jedno místo vašeho tarifu. Odeberte to, které už nepoužíváte, a uvolněte jeho místo."
  de: "Jedes verbundene Gerät und jeder Proxy belegt einen Platz deines Tarifs. Entferne eines, das du nicht mehr nutzt, um seinen Platz freizugeben."
  el: "Κάθε συνδεδεμένη συσκευή ή διακομιστής μεσολάβησης καταλαμβάνει μία θέση του προγράμματός σας. Αφαιρέστε όποιο δεν χρησιμοποιείτε πια για να ελευθερώσετε τη θέση του."
  en: "Each connected device or proxy uses a slot of your plan. Remove one you no longer use to free its slot."
  es: "Cada dispositivo o proxy conectado ocupa una plaza de tu plan. Quita el que ya no uses para liberar su plaza."
  es-419: "Cada dispositivo o proxy conectado ocupa un lugar de tu plan. Quita el que ya no uses para liberar su lugar."
  es-MX: "Cada dispositivo o proxy conectado ocupa un lugar de tu plan. Quita el que ya no uses para liberar su lugar."
  fr: "Chaque appareil ou proxy connecté occupe une place de votre offre. Retirez celui que vous n’utilisez plus pour libérer sa place."
  he: "כל מכשיר או פרוקסי מחובר תופס מקום אחד בתוכנית שלך. הסר את מה שאינך משתמש בו עוד כדי לפנות את מקומו."
  hi: "हर कनेक्ट डिवाइस या प्रॉक्सी आपके प्लान की एक जगह लेता है। जिसका अब इस्तेमाल नहीं करते, उसे हटाकर उसकी जगह खाली करें।"
  id: "Setiap perangkat atau proxy yang terhubung memakai satu slot paket Anda. Hapus yang tidak lagi Anda gunakan untuk mengosongkan slotnya."
  it: "Ogni dispositivo o proxy collegato occupa un posto del tuo piano. Rimuovi quello che non usi più per liberarne il posto."
  ja: "接続中のデバイスやプロキシは、それぞれプランの枠を 1 つ使います。使わなくなったものを削除すると、その枠が空きます。"
  ko: "연결된 기기나 프록시는 각각 요금제의 자리를 하나씩 사용합니다. 더 이상 사용하지 않는 것을 제거하면 자리가 비워집니다."
  nl: "Elk verbonden apparaat of elke proxy gebruikt een plek van je abonnement. Verwijder er een die je niet meer gebruikt om de plek vrij te maken."
  pl: "Każde połączone urządzenie lub serwer proxy zajmuje jedno miejsce w Twoim planie. Usuń to, którego już nie używasz, aby zwolnić miejsce."
  pt: "Cada dispositivo ou proxy conectado ocupa uma vaga do seu plano. Remova o que você não usa mais para liberar a vaga."
  pt-BR: "Cada dispositivo ou proxy conectado ocupa uma vaga do seu plano. Remova o que você não usa mais para liberar a vaga."
  pt-PT: "Cada dispositivo ou proxy ligado ocupa uma vaga do seu plano. Remova o que já não utiliza para libertar a vaga."
  ru: "Каждое подключённое устройство или прокси занимает одно место в тарифе. Удалите то, которым больше не пользуетесь, чтобы освободить место."
  sv: "Varje ansluten enhet eller proxy använder en plats i din plan. Ta bort en som du inte längre använder för att frigöra platsen."
  sw: "Kila kifaa au proksi iliyounganishwa hutumia nafasi moja ya mpango wako. Ondoa usichokitumia tena ili kuachilia nafasi yake."
  th: "อุปกรณ์หรือพร็อกซีที่เชื่อมต่ออยู่แต่ละรายการใช้ช่องหนึ่งในแพ็กเกจของคุณ นำรายการที่ไม่ได้ใช้แล้วออกเพื่อเพิ่มช่องว่าง"
  uk: "Кожен підключений пристрій або проксі займає одне місце у вашому тарифі. Видаліть той, яким більше не користуєтеся, щоб звільнити місце."
  vi: "Mỗi thiết bị hoặc proxy đang kết nối dùng một chỗ trong gói của bạn. Hãy xóa cái bạn không còn dùng để giải phóng chỗ."
  zh: "每个已连接的设备或代理都会占用您套餐的一个名额。移除不再使用的设备或代理即可释放名额。"
  zh-HK: "每部已連接的裝置或代理都會佔用你計劃的一個名額。移除不再使用的裝置或代理即可釋放名額。"
