description: "Subscription: Stripe-billed body"
source: "Your Pro subscription is billed through Stripe. Update your payment details or cancel anytime below."
platforms:
  - site
localizations:
  ar: "يتم تحصيل اشتراك Pro الخاص بك عبر Stripe. حدّث تفاصيل الدفع أو ألغِ الاشتراك في أي وقت أدناه."
  cs: "Vaše předplatné Pro je účtováno přes Stripe. Níže můžete kdykoli aktualizovat platební údaje nebo předplatné zrušit."
  de: "Dein Pro-Abo wird über Stripe abgerechnet. Unten kannst du jederzeit deine Zahlungsdaten aktualisieren oder kündigen."
  el: "Η συνδρομή σας Pro χρεώνεται μέσω Stripe. Ενημερώστε τα στοιχεία πληρωμής ή ακυρώστε ανά πάσα στιγμή παρακάτω."
  en: "Your Pro subscription is billed through Stripe. Update your payment details or cancel anytime below."
  es: "Tu suscripción Pro se factura a través de Stripe. Actualiza los datos de pago o cancela cuando quieras más abajo."
  es-419: "Tu suscripción Pro se factura a través de Stripe. Actualiza los datos de pago o cancela cuando quieras más abajo."
  es-MX: "Tu suscripción Pro se factura a través de Stripe. Actualiza los datos de pago o cancela cuando quieras más abajo."
  fr: "Votre abonnement Pro est facturé via Stripe. Mettez à jour vos informations de paiement ou annulez à tout moment ci-dessous."
  he: "המנוי Pro שלך מחויב דרך Stripe. עדכן את פרטי התשלום או בטל בכל עת למטה."
  hi: "आपकी Pro सदस्यता Stripe के माध्यम से बिल की जाती है। नीचे कभी भी अपने भुगतान विवरण अपडेट करें या सदस्यता रद्द करें।"
  id: "Langganan Pro Anda ditagih melalui Stripe. Perbarui detail pembayaran atau batalkan kapan saja di bawah ini."
  it: "Il tuo abbonamento Pro viene fatturato tramite Stripe. Aggiorna i dati di pagamento o annulla in qualsiasi momento qui sotto."
  ja: "Pro サブスクリプションは Stripe 経由で請求されています。以下でいつでもお支払い情報の更新や解約ができます。"
  ko: "Pro 구독은 Stripe를 통해 청구됩니다. 아래에서 언제든지 결제 정보를 업데이트하거나 구독을 취소할 수 있습니다."
  nl: "Je Pro-abonnement wordt gefactureerd via Stripe. Werk hieronder je betaalgegevens bij of zeg op wanneer je wilt."
  pl: "Twoja subskrypcja Pro jest rozliczana przez Stripe. Poniżej możesz w każdej chwili zaktualizować dane płatności lub anulować subskrypcję."
  pt: "A sua assinatura Pro é faturada através da Stripe. Atualize os dados de pagamento ou cancele quando quiser abaixo."
  pt-BR: "Sua assinatura Pro é cobrada através da Stripe. Atualize os dados de pagamento ou cancele quando quiser abaixo."
  pt-PT: "A sua assinatura Pro é faturada através da Stripe. Atualize os dados de pagamento ou cancele quando quiser abaixo."
  ru: "Ваша подписка Pro оплачивается через Stripe. Ниже вы можете в любой момент обновить платёжные данные или отменить подписку."
  sv: "Din Pro-prenumeration faktureras via Stripe. Uppdatera dina betaluppgifter eller avsluta när som helst nedan."
  sw: "Usajili wako wa Pro unatozwa kupitia Stripe. Sasisha maelezo ya malipo au ughairi wakati wowote hapa chini."
  th: "ระบบเรียกเก็บเงินการสมัคร Pro ของคุณผ่าน Stripe อัปเดตรายละเอียดการชำระเงินหรือยกเลิกได้ทุกเมื่อด้านล่าง"
  uk: "Ваша підписка Pro оплачується через Stripe. Нижче ви можете будь-коли оновити платіжні дані або скасувати підписку."
  vi: "Gói đăng ký Pro của bạn được thanh toán qua Stripe. Cập nhật thông tin thanh toán hoặc hủy bất cứ lúc nào ở bên dưới."
  zh: "您的 Pro 订阅通过 Stripe 计费。您可以在下方随时更新付款信息或取消订阅。"
  zh-HK: "您的 Pro 訂閱透過 Stripe 計費。您可以在下方隨時更新付款資料或取消訂閱。"
