description: "Shown when the account holds its cap of active sessions and refused a request that would start one, while the user is signed in to the account: adding a sign-in method (its verification step) in every app, and creating a hosted proxy on ur.io. On ur.io a button that opens Account > Sessions (sessions_open) is next to it. 'Account' and 'Sessions' are the names of those screens; keep them as the app names them."
source: "Too many active sessions. Sign out sessions you no longer use in Account > Sessions, then try again."
platforms:
  - apple
  - android
  - windows
  - linux
  - site
localizations:
  ar: "توجد جلسات نشطة كثيرة جدًا. سجّل الخروج من الجلسات التي لم تعد تستخدمها في الحساب > الجلسات، ثم حاول مرة أخرى."
  cs: "Příliš mnoho aktivních relací. V části Účet > Relace odhlaste relace, které už nepoužíváte, a zkuste to znovu."
  de: "Zu viele aktive Sitzungen. Melde unter Konto > Sitzungen die Sitzungen ab, die du nicht mehr nutzt, und versuche es dann erneut."
  el: "Υπάρχουν πάρα πολλές ενεργές συνεδρίες. Αποσυνδέστε τις συνεδρίες που δεν χρησιμοποιείτε πια από το Λογαριασμός > Συνεδρίες και δοκιμάστε ξανά."
  en: "Too many active sessions. Sign out sessions you no longer use in Account > Sessions, then try again."
  es: "Hay demasiadas sesiones activas. Cierra las sesiones que ya no uses en Cuenta > Sesiones y vuelve a intentarlo."
  es-419: "Hay demasiadas sesiones activas. Cierra las sesiones que ya no uses en Cuenta > Sesiones y vuelve a intentarlo."
  es-MX: "Hay demasiadas sesiones activas. Cierra las sesiones que ya no uses en Cuenta > Sesiones y vuelve a intentarlo."
  fr: "Trop de sessions actives. Déconnectez les sessions que vous n’utilisez plus dans Compte > Sessions, puis réessayez."
  he: "יש יותר מדי הפעלות פעילות. נתקו את ההפעלות שאתם כבר לא משתמשים בהן בחשבון > הפעלות, ואז נסו שוב."
  hi: "बहुत सारे सक्रिय सत्र हैं। खाता > सत्र में उन सत्रों से साइन आउट करें जिनका आप अब उपयोग नहीं करते, फिर पुनः प्रयास करें।"
  id: "Terlalu banyak sesi aktif. Keluar dari sesi yang tidak Anda gunakan lagi di Akun > Sesi, lalu coba lagi."
  it: "Troppe sessioni attive. Chiudi le sessioni che non usi più in Account > Sessioni, poi riprova."
  ja: "アクティブなセッションが多すぎます。アカウント > セッションで、使用しなくなったセッションからサインアウトしてから、もう一度お試しください。"
  ko: "활성 세션이 너무 많습니다. 계정 > 세션에서 더 이상 사용하지 않는 세션에서 로그아웃한 후 다시 시도하세요."
  nl: "Te veel actieve sessies. Log de sessies die je niet meer gebruikt uit via Account > Sessies en probeer het opnieuw."
  pl: "Zbyt wiele aktywnych sesji. Wyloguj sesje, których już nie używasz, w sekcji Konto > Sesje, a potem spróbuj ponownie."
  pt: "Demasiadas sessões ativas. Termine as sessões que já não utiliza em Conta > Sessões e tente novamente."
  pt-BR: "Há sessões ativas demais. Encerre as sessões que você não usa mais em Conta > Sessões e tente novamente."
  pt-PT: "Demasiadas sessões ativas. Termine as sessões que já não utiliza em Conta > Sessões e tente novamente."
  ru: "Слишком много активных сеансов. Завершите неиспользуемые сеансы в разделе «Аккаунт > Сеансы» и попробуйте снова."
  sv: "För många aktiva sessioner. Logga ut sessioner som du inte längre använder under Konto > Sessioner och försök sedan igen."
  sw: "Kuna vipindi vingi mno vilivyo hai. Toka kwenye vipindi usivyotumia tena katika Akaunti > Vipindi, kisha ujaribu tena."
  th: "มีเซสชันที่ใช้งานอยู่มากเกินไป ออกจากระบบเซสชันที่คุณไม่ได้ใช้แล้วใน บัญชี > เซสชัน แล้วลองอีกครั้ง"
  uk: "Забагато активних сеансів. Завершіть сеанси, якими ви більше не користуєтеся, у розділі «Обліковий запис > Сеанси» і спробуйте ще раз."
  vi: "Có quá nhiều phiên đang hoạt động. Hãy đăng xuất các phiên bạn không còn dùng trong Tài khoản > Phiên đăng nhập, rồi thử lại."
  zh: "活跃会话过多。请在“账户 > 登录会话”中退出不再使用的会话，然后重试。"
  zh-HK: "使用中的工作階段太多。請在「帳戶 > 登入工作階段」中登出不再使用的工作階段，然後再試一次。"
