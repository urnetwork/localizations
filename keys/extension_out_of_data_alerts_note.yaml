description: "Browser extension popup, under the settings toggles, beside the Turn on alerts button (extension_turn_on_alerts): what the alerts are. Once the user allows it, the browser shows one notification when the account's data runs out, also while the popup is closed."
source: "Get a notification when your data runs out."
