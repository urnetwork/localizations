description: "Used in Shared/Views/UpgradeSubscriptionSheet.swift."
source: "Your purchase needs to be approved before it can complete. UR Pro will turn on by itself once it goes through — there's no need to buy again."
platforms:
  - apple
localizations:
  ar: "يحتاج شراؤك إلى موافقة قبل أن يكتمل. سيتم تفعيل UR Pro تلقائيًا بمجرد إتمام الموافقة — لا حاجة إلى الشراء مرة أخرى."
  cs: "Váš nákup musí být před dokončením schválen. UR Pro se zapne automaticky, jakmile schválení projde — není potřeba kupovat znovu."
  de: "Dein Kauf muss noch genehmigt werden, bevor er abgeschlossen werden kann. UR Pro wird automatisch aktiviert, sobald es so weit ist – du musst nichts erneut kaufen."
  el: "Η αγορά σας πρέπει να εγκριθεί για να ολοκληρωθεί. Το UR Pro θα ενεργοποιηθεί από μόνο του μόλις περάσει — δεν χρειάζεται να αγοράσετε ξανά."
  en: "Your purchase needs to be approved before it can complete. UR Pro will turn on by itself once it goes through — there's no need to buy again."
  es: "Tu compra necesita aprobación para completarse. UR Pro se activará solo en cuanto se apruebe — no hace falta que vuelvas a comprar."
  es-419: "Tu compra necesita aprobación para completarse. UR Pro se activará solo en cuanto se apruebe — no necesitas volver a comprar."
  es-MX: "Tu compra necesita aprobación para completarse. UR Pro se activará solo en cuanto se apruebe — no necesitas volver a comprar."
  fr: "Votre achat doit être approuvé avant de pouvoir aboutir. UR Pro s'activera tout seul une fois l'achat validé — pas besoin d'acheter à nouveau."
  he: "הרכישה שלך צריכה לקבל אישור לפני שתושלם. UR Pro יופעל מעצמו ברגע שהיא תאושר — אין צורך לרכוש שוב."
  hi: "आपकी खरीद पूरी होने से पहले उसे मंज़ूरी मिलनी ज़रूरी है। मंज़ूरी मिलते ही UR Pro अपने आप चालू हो जाएगा — दोबारा खरीदने की ज़रूरत नहीं।"
  id: "Pembelian Anda perlu disetujui sebelum dapat diselesaikan. UR Pro akan aktif dengan sendirinya setelah disetujui — tidak perlu membeli lagi."
  it: "Il tuo acquisto deve essere approvato prima di poter essere completato. UR Pro si attiverà da solo una volta andato a buon fine — non serve acquistare di nuovo."
  ja: "購入を完了するには承認が必要です。承認されるとUR Proは自動的に有効になります。もう一度購入する必要はありません。"
  ko: "구매를 완료하려면 승인이 필요합니다. 승인이 완료되면 UR Pro가 자동으로 켜지므로 다시 구매하지 않아도 됩니다."
  nl: "Je aankoop moet worden goedgekeurd voordat die kan worden afgerond. UR Pro wordt vanzelf ingeschakeld zodra dat gebeurt – je hoeft niets opnieuw te kopen."
  pl: "Twój zakup wymaga zatwierdzenia, zanim będzie mógł zostać sfinalizowany. UR Pro włączy się automatycznie, gdy tylko to nastąpi — nie musisz kupować ponownie."
  pt: "A sua compra precisa de ser aprovada para poder ser concluída. O UR Pro é ativado automaticamente assim que a aprovação chegar — não precisa de comprar novamente."
  pt-BR: "Sua compra precisa ser aprovada para poder ser concluída. O UR Pro será ativado automaticamente assim que a aprovação sair — não precisa comprar de novo."
  pt-PT: "A sua compra precisa de ser aprovada para poder ser concluída. O UR Pro é ativado automaticamente assim que a aprovação chegar — não precisa de comprar novamente."
  ru: "Покупку нужно подтвердить, чтобы она завершилась. UR Pro включится сам, как только всё пройдёт — покупать заново не нужно."
  sv: "Ditt köp måste godkännas innan det kan slutföras. UR Pro aktiveras automatiskt när det går igenom — du behöver inte köpa igen."
  sw: "Ununuzi wako unahitaji kuidhinishwa kabla ya kukamilika. UR Pro itawashwa yenyewe mara idhini itakapokamilika — huhitaji kununua tena."
  th: "การซื้อของคุณต้องได้รับการอนุมัติก่อนจึงจะสำเร็จ เมื่ออนุมัติแล้ว UR Pro จะเปิดใช้งานเองโดยอัตโนมัติ — ไม่ต้องซื้อซ้ำ"
  uk: "Покупку потрібно підтвердити, щоб вона завершилася. UR Pro увімкнеться сам, щойно все пройде — купувати повторно не потрібно."
  vi: "Giao dịch của bạn cần được phê duyệt trước khi hoàn tất. UR Pro sẽ tự bật ngay khi được duyệt — bạn không cần mua lại."
  zh: "你的购买需要获得批准才能完成。一旦通过，UR Pro 会自动开启 — 无需重新购买。"
  zh-HK: "你的購買需要獲得批准才能完成。一旦通過，UR Pro 會自動開啟 — 無需重新購買。"
