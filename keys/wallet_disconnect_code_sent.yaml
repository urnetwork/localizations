description: "Earnings, the dialog that disconnects the payout wallet, once the code is sent. The argument is the masked sign-in email addresses it went to, joined with commas (j…@example.com)."
source: "We sent a code to %@. Enter it to disconnect the wallet."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: emails
    type: string
localizations:
