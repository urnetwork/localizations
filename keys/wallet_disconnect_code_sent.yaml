  sw: "Tumetuma msimbo kwa {emails}. Uweke ili kutenganisha pochi."
  th: "เราส่งรหัสไปที่ {emails} แล้ว ป้อนรหัสเพื่อยกเลิกการเชื่อมต่อวอลเล็ต"
  tr: "Bir kod gönderdik: {emails}. Cüzdanın bağlantısını kesmek için kodu girin."
