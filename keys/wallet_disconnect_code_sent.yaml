  cs: "Poslali jsme kód na {emails}. Zadejte ho a peněženka se odpojí."
  de: "Wir haben einen Code an {emails} gesendet. Gib ihn ein, um die Wallet zu trennen."
  el: "Στείλαμε έναν κωδικό στο {emails}. Εισαγάγετέ τον για να αποσυνδέσετε το πορτοφόλι."
  en: "We sent a code to {emails}. Enter it to disconnect the wallet."
  es: "Enviamos un código a {emails}. Introdúcelo para desconectar la billetera."
  es-419: "Enviamos un código a {emails}. Ingrésalo para desconectar la billetera."
  es-MX: "Enviamos un código a {emails}. Ingrésalo para desconectar la cartera."
