description: "Setup wallet"
source: "To start earning, connect your cryptocurrency wallet to URnetwork or set one up with Circle."
platforms:
  - android
localizations:
  ar: "للبدء في الربح، اربط محفظة العملات المشفرة الخاصة بك بـ URnetwork أو قم بإعداد واحدة باستخدام Circle."
  cs: "Chcete-li začít vydělávat, připojte svou kryptoměnovou peněženku k URnetwork nebo si s pomocí Circle nastavte novou."
  de: "Um mit dem Verdienen zu beginnen, verbinde deine Kryptowährungs-Wallet mit URnetwork oder richte eine mit Circle ein."
  el: "Για να ξεκινήσετε να κερδίζετε, συνδέστε το πορτοφόλι κρυπτονομισμάτων σας στο URnetwork ή ρυθμίστε ένα με το Circle."
  en: "To start earning, connect your cryptocurrency wallet to URnetwork or set one up with Circle."
  es: "Para empezar a ganar, conecta tu billetera de criptomonedas a URnetwork o configura una con Circle."
  es-419: "Para empezar a ganar, conecta tu billetera de criptomonedas a URnetwork o configura una con Circle."
  es-MX: "Para empezar a ganar, conecta tu cartera de criptomonedas a URnetwork o configura una con Circle."
  fr: "Pour commencer à gagner, connectez votre portefeuille de crypto-monnaie à URnetwork ou configurez-en un avec Circle."
  he: "כדי להתחיל להרוויח, חבר את ארנק הקריפטו שלך ל-URnetwork או הגדר אחד עם Circle."
  hi: "कमाई शुरू करने के लिए, अपने क्रिप्टोकरेंसी वॉलेट को URnetwork से कनेक्ट करें या Circle के साथ एक सेट करें।"
  id: "Untuk mulai menghasilkan, hubungkan dompet mata uang kripto Anda ke URnetwork atau siapkan dengan Circle."
  it: "Per iniziare a guadagnare, collega il tuo portafoglio di criptovalute a URnetwork o creane uno con Circle."
  ja: "収益を得始めるには、暗号通貨ウォレットをURnetworkに接続するか、Circleでセットアップしてください。"
  ko: "수익을 얻기 시작하려면 암호화폐 지갑을 URnetwork에 연결하거나 Circle로 설정하세요."
  nl: "Om te beginnen met verdienen, verbind je cryptocurrency-wallet met URnetwork of stel er een in via Circle."
  pl: "Aby zacząć zarabiać, połącz swój portfel kryptowalutowy z URnetwork lub skonfiguruj go za pomocą Circle."
  pt: "Para começar a ganhar, conecte sua carteira de criptomoedas à URnetwork ou configure uma com a Circle."
  pt-BR: "Para começar a ganhar, conecte sua carteira de criptomoedas à URnetwork ou configure uma com a Circle."
  pt-PT: "Para começar a ganhar, conecte sua carteira de criptomoedas à URnetwork ou configure uma com a Circle."
  ru: "Чтобы начать зарабатывать, подключите свой криптовалютный кошелек к URnetwork или создайте новый с помощью Circle."
  sv: "För att börja tjäna, anslut din kryptovaluta-plånbok till URnetwork eller skapa en med Circle."
  sw: "Ili kuanza kupata, unganisha pochi yako ya cryptocurrency kwa URnetwork au usanidi moja na Circle."
  th: "หากต้องการเริ่มหารายได้ ให้เชื่อมต่อกระเป๋าเงินคริปโตของคุณกับ URnetwork หรือตั้งค่ากระเป๋าใหม่ด้วย Circle"
  uk: "Щоб почати заробляти, підключіть свій криптовалютний гаманець до URnetwork або створіть його з Circle."
  vi: "Để bắt đầu kiếm tiền, kết nối ví tiền mã hóa của bạn với URnetwork hoặc tạo ví với Circle."
  zh: "要开始赚取收入，请将您的加密货币钱包连接到 URnetwork 或使用 Circle 设置一个。"
  zh-HK: "要開始賺取收益，請將您的加密貨幣錢包連接到 URnetwork，或使用 Circle 設定一個。"
