description: "DNS settings: the name of DNS4EU's child protection preset that also blocks ads and trackers, in \"Family\". \"no ads\" means the person sees no ads, because they are blocked. Next to it is the same protection without ad blocking (dns_preset_name_child). Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: DNS4EU Child, no ads\" and \"DNS4EU Child, no ads isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example DNS4EU); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ Child, no ads"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: provider
    type: string
