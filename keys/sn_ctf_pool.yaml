description: "Earnings, the settlement v2 tile, the claim sheet and the claim dialog: names the coldkey's account in URnetwork's capture the flag pool (an account whose kind is ctf), in place of Pool {no_id} (sn_ledger_pool). Capture the flag is a draw in each country: each epoch it picks up to five of the providers and up to five of the extenders that were online there for at least half the epoch, and pays them SN25α into this account. A short title: use your language's name for the game capture the flag, never the hacking contest."
