description: "Connect: extension logged-out alert body"
source: "The extension is installed but signed out. Set it up with your network to connect."
platforms:
  - site
localizations:
  ar: "الإضافة مثبّتة لكن لم يتم تسجيل الدخول. أعدّها مع شبكتك للاتصال."
  cs: "Rozšíření je nainstalováno, ale odhlášeno. Nastavte ho pro vaši síť a připojte se."
  de: "Die Erweiterung ist installiert, aber abgemeldet. Richte sie mit deinem Netzwerk ein, um dich zu verbinden."
  el: "Η επέκταση είναι εγκατεστημένη αλλά αποσυνδεδεμένη. Ρυθμίστε την με το δίκτυό σας για να συνδεθείτε."
  en: "The extension is installed but signed out. Set it up with your network to connect."
  es: "La extensión está instalada pero con la sesión cerrada. Configúrala con tu red para conectarte."
  es-419: "La extensión está instalada pero con la sesión cerrada. Configúrala con tu red para conectarte."
  es-MX: "La extensión está instalada pero con la sesión cerrada. Configúrala con tu red para conectarte."
  fr: "L'extension est installée mais déconnectée. Configurez-la avec votre réseau pour vous connecter."
  he: "התוסף מותקן אך מנותק. הגדר אותו עם הרשת שלך כדי להתחבר."
  hi: "एक्सटेंशन इंस्टॉल है लेकिन साइन आउट है। कनेक्ट करने के लिए इसे अपने नेटवर्क के साथ सेट करें।"
  id: "Ekstensi sudah terpasang tetapi belum masuk. Siapkan dengan jaringan Anda untuk terhubung."
  it: "L'estensione è installata ma non ha effettuato l'accesso. Configurala con la tua rete per connetterti."
  ja: "拡張機能はインストールされていますが、サインアウトしています。接続するにはご自分のネットワークでセットアップしてください。"
  ko: "확장 프로그램이 설치되어 있지만 로그아웃 상태입니다. 연결하려면 내 네트워크로 설정하세요."
  nl: "De extensie is geïnstalleerd maar afgemeld. Stel deze in met je netwerk om te verbinden."
  pl: "Rozszerzenie jest zainstalowane, ale wylogowane. Skonfiguruj je ze swoją siecią, aby się połączyć."
  pt: "A extensão está instalada mas com a sessão terminada. Configure-a com a sua rede para se ligar."
  pt-BR: "A extensão está instalada, mas desconectada. Configure-a com a sua rede para se conectar."
  pt-PT: "A extensão está instalada mas com a sessão terminada. Configure-a com a sua rede para se ligar."
  ru: "Расширение установлено, но вход не выполнен. Настройте его для вашей сети, чтобы подключиться."
  sv: "Tillägget är installerat men utloggat. Konfigurera det med ditt nätverk för att ansluta."
  sw: "Kiendelezi kimesakinishwa lakini hakijaingia. Kisanidi na mtandao wako ili kuunganisha."
  th: "ติดตั้งส่วนขยายแล้วแต่ยังไม่ได้ลงชื่อเข้าใช้ ตั้งค่าด้วยเครือข่ายของคุณเพื่อเชื่อมต่อ"
  uk: "Розширення встановлено, але вхід не виконано. Налаштуйте його для вашої мережі, щоб підключитися."
  vi: "Tiện ích mở rộng đã được cài đặt nhưng chưa đăng nhập. Hãy thiết lập với mạng của bạn để kết nối."
  zh: "扩展已安装但尚未登录。请使用您的网络进行设置以便连接。"
  zh-HK: "擴充功能已安裝但尚未登入。請使用您的網絡進行設定以便連接。"
