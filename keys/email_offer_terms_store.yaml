description: "Onboarding emails E3a, E4b, E5b, for networks billed by the App Store or Google Play: the terms line under the button, WITHOUT a price (the store shows its own local price before the purchase). The renewal is stated in the body (email_e3_joined_trial), not only in this grey line (2026-11-13 review)."
source: "14 days free for new subscribers, then a year of Pro with 3 months free. Your store shows the price before you pay. Cancel anytime."
platforms:
  - email
