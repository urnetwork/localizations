description: "Developer tools screen: explanatory subtext under the 'comparative connect' control."
source: "Drop an exit that has established nothing sooner when two sibling exits are receiving. Off waits the full 30s connect bar"
platforms:
  - android
localizations:
  ar: "يُسقط مبكرًا المخرج الذي لم يُنشئ أي اتصال عندما يستقبل مخرجان شقيقان البيانات. عند الإيقاف، ينتظر عتبة الاتصال الكاملة البالغة 30 ثانية"
  cs: "Vyřadí dříve výstup, který nic nenavázal, když dva sesterské výstupy přijímají. Vypnuto čeká celý 30s práh připojení"
  de: "Verwirft einen Exit, der nichts aufgebaut hat, früher, wenn zwei Geschwister-Exits empfangen. Aus: wartet die vollen 30 s der Verbindungsschwelle ab"
  el: "Απορρίπτει νωρίτερα μια έξοδο που δεν έχει δημιουργήσει τίποτα όταν δύο αδελφές έξοδοι λαμβάνουν. Η απενεργοποίηση περιμένει ολόκληρο το όριο σύνδεσης των 30 δ"
  en: "Drop an exit that has established nothing sooner when two sibling exits are receiving. Off waits the full 30s connect bar"
  es: "Descarta antes una salida que no ha establecido nada cuando dos salidas hermanas están recibiendo. Si está desactivado, se espera el umbral de conexión completo de 30 s"
  es-419: "Descarta antes una salida que no estableció nada cuando dos salidas hermanas están recibiendo. Si está desactivado, se espera el umbral de conexión completo de 30 s"
  es-MX: "Descarta antes una salida que no estableció nada cuando dos salidas hermanas están recibiendo. Si está desactivado, se espera el umbral de conexión completo de 30 s"
  fa: "وقتی دو خروجی هم‌گروه در حال دریافت هستند، خروجی‌ای که هنوز هیچ اتصالی برقرار نکرده است زودتر کنار گذاشته می‌شود. در حالت خاموش، تا پایان کامل آستانهٔ 30 ثانیه‌ای اتصال صبر می‌کند"
  fr: "Écarte plus tôt une sortie qui n’a rien établi quand deux sorties sœurs reçoivent. Désactivé attend le seuil de connexion complet de 30 s"
  he: "הסרה מוקדמת יותר של יציאה שלא הקימה דבר כששתי יציאות אחיות מקבלות. כיבוי ממתין לכל סף החיבור של 30 שניות"
  hi: "जब दो सहोदर एग्ज़िट डेटा पा रहे हों, तो कुछ भी स्थापित न कर पाए एग्ज़िट को जल्दी हटाएँ। बंद करने पर पूरी 30 सेकंड की कनेक्ट सीमा तक इंतज़ार होता है"
  id: "Buang lebih cepat exit yang belum membangun apa pun saat dua exit saudara sedang menerima. Nonaktif menunggu ambang koneksi penuh 30 dtk"
  it: "Scarta prima un’uscita che non ha stabilito nulla quando due uscite sorelle stanno ricevendo. Disattivato attende l’intera soglia di connessione di 30 s"
  ja: "兄弟出口が 2 つ受信している間に何も確立できていない出口を早めに除外します。オフにすると 30 秒の接続しきい値まで待ちます"
  ko: "형제 출구 두 개가 수신 중일 때 아무것도 연결하지 못한 출구를 더 일찍 제외합니다. 끄면 30초 연결 기준을 끝까지 기다립니다"
  nl: "Verwijder een exit die niets heeft opgezet eerder als twee zuster-exits wel ontvangen. Uit wacht de volledige verbindingsgrens van 30 s"
  pl: "Wcześniej odrzuca wyjście, które niczego nie nawiązało, gdy dwa siostrzane wyjścia odbierają. Wyłączenie czeka pełny 30-sekundowy próg połączenia"
  pt: "Descarta mais cedo uma saída que não estabeleceu nada quando duas saídas irmãs estão a receber. Desativado espera o limiar de ligação completo de 30 s"
  pt-BR: "Descarta mais cedo uma saída que não estabeleceu nada quando duas saídas irmãs estão recebendo. Desativado espera o limite de conexão completo de 30 s"
  pt-PT: "Descarta mais cedo uma saída que não estabeleceu nada quando duas saídas irmãs estão a receber. Desativado espera o limiar de ligação completo de 30 s"
  ru: "Раньше отключает выход, который ничего не установил, когда два соседних выхода получают данные. Если выключено, выжидается полный порог подключения в 30 с"
  sv: "Ta bort en utgång som inte har upprättat något tidigare när två syskonutgångar tar emot. Av väntar hela anslutningsgränsen på 30 s"
  sw: "Ondoa mapema njia ya kutoka ambayo haijaanzisha chochote wakati njia mbili za kutoka za kundi moja zinapokea. Kuzima kunasubiri kizingiti kizima cha muunganisho cha sekunde 30"
  th: "ตัดทิ้งทางออกที่ยังสร้างอะไรไม่ได้เร็วขึ้นเมื่อทางออกพี่น้องสองแห่งกำลังรับข้อมูล ปิดเพื่อรอเกณฑ์การเชื่อมต่อเต็ม 30 วินาที"
  tr: "İki kardeş çıkış veri alırken hiçbir bağlantı kuramamış bir çıkışı daha erken düşürür. Kapalıyken 30 sn'lik bağlantı eşiğinin tamamı beklenir"
  uk: "Раніше відкидає вихід, який нічого не встановив, коли два сусідні виходи отримують трафік. Вимкнення чекає повний 30-секундний поріг з’єднання"
  vi: "Loại sớm hơn điểm thoát chưa thiết lập được gì khi hai điểm thoát cùng nhóm đang nhận dữ liệu. Tắt sẽ chờ hết ngưỡng kết nối 30 giây"
  zh: "当两个同级出口正在接收数据时，更早丢弃尚未建立任何连接的出口。关闭时等待完整的 30 秒连接阈值"
  zh-HK: "當兩個同級出口正在接收數據時，更早捨棄尚未建立任何連線的出口。關閉時等待完整的 30 秒連線門檻"
