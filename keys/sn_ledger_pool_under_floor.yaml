description: "Earnings, the settlement v2 tile and the claim sheet: the status of one pool's account, in its row where Pending or Claimed would be, while its balance is under the transfer floor, the smallest amount the chain lets a claim move (sn_claim_relay_under_floor gives it in TAO). Neither URnetwork's claim nor the device's can claim it until it is worth at least that; it waits in the vault, and this credit never expires. A capture the flag account is often this small. Short: a status. Say nothing about when it becomes claimable."
