description: "Body under client_limit_reached, in the app and in the local notification, for an account on the free plan: it already has as many devices connected at once as the free plan allows, so this device cannot connect. UR Pro allows more; Get Pro is the button beside it. Also shown when a sign-in on a new device is refused for the same limit. Keep UR Pro and URnetwork as they are."
source: "Your free plan connects a limited number of devices at once. Upgrade to UR Pro to connect more, or disconnect URnetwork on another device."
platforms:
  - android
  - apple
localizations:
  ar: "تتيح خطتك المجانية توصيل عدد محدود من الأجهزة في الوقت نفسه. قم بالترقية إلى UR Pro لتوصيل المزيد، أو افصل URnetwork على جهاز آخر."
  cs: "Váš bezplatný tarif umožňuje připojit najednou jen omezený počet zařízení. Přejděte na UR Pro a připojte jich víc, nebo odpojte URnetwork na jiném zařízení."
  de: "Dein kostenloser Tarif verbindet nur eine begrenzte Anzahl von Geräten gleichzeitig. Upgrade auf UR Pro, um mehr zu verbinden, oder trenne URnetwork auf einem anderen Gerät."
  el: "Το δωρεάν πρόγραμμά σας συνδέει περιορισμένο αριθμό συσκευών ταυτόχρονα. Αναβαθμίστε σε UR Pro για να συνδέσετε περισσότερες ή αποσυνδέστε το URnetwork σε άλλη συσκευή."
  en: "Your free plan connects a limited number of devices at once. Upgrade to UR Pro to connect more, or disconnect URnetwork on another device."
  es: "Tu plan gratuito conecta un número limitado de dispositivos a la vez. Pásate a UR Pro para conectar más o desconecta URnetwork en otro dispositivo."
  es-419: "Tu plan gratuito conecta una cantidad limitada de dispositivos a la vez. Mejora a UR Pro para conectar más o desconecta URnetwork en otro dispositivo."
  es-MX: "Tu plan gratuito conecta una cantidad limitada de dispositivos a la vez. Mejora a UR Pro para conectar más o desconecta URnetwork en otro dispositivo."
  fr: "Votre offre gratuite connecte un nombre limité d’appareils à la fois. Passez à UR Pro pour en connecter davantage, ou déconnectez URnetwork sur un autre appareil."
  he: "התוכנית החינמית שלך מחברת מספר מוגבל של מכשירים בו־זמנית. שדרג ל-UR Pro כדי לחבר עוד, או נתק את URnetwork במכשיר אחר."
  hi: "आपका मुफ़्त प्लान एक साथ सीमित संख्या में डिवाइस कनेक्ट करता है। और डिवाइस कनेक्ट करने के लिए UR Pro में अपग्रेड करें, या किसी दूसरे डिवाइस पर URnetwork डिस्कनेक्ट करें।"
  id: "Paket gratis Anda menghubungkan perangkat dalam jumlah terbatas sekaligus. Tingkatkan ke UR Pro untuk menghubungkan lebih banyak, atau putuskan URnetwork di perangkat lain."
  it: "Il tuo piano gratuito collega un numero limitato di dispositivi alla volta. Passa a UR Pro per collegarne di più, oppure disconnetti URnetwork su un altro dispositivo."
  ja: "無料プランで同時に接続できるデバイスの数には上限があります。さらに接続するには UR Pro にアップグレードするか、別のデバイスで URnetwork を切断してください。"
  ko: "무료 요금제는 동시에 연결할 수 있는 기기 수가 제한됩니다. 더 많이 연결하려면 UR Pro로 업그레이드하거나 다른 기기에서 URnetwork 연결을 해제하세요."
  nl: "Je gratis abonnement verbindt een beperkt aantal apparaten tegelijk. Upgrade naar UR Pro om er meer te verbinden, of verbreek URnetwork op een ander apparaat."
  pl: "Twój darmowy plan łączy jednocześnie ograniczoną liczbę urządzeń. Przejdź na UR Pro, aby połączyć więcej, albo rozłącz URnetwork na innym urządzeniu."
  pt: "Seu plano gratuito conecta um número limitado de dispositivos ao mesmo tempo. Faça upgrade para o UR Pro para conectar mais ou desconecte o URnetwork em outro dispositivo."
  pt-BR: "Seu plano gratuito conecta um número limitado de dispositivos ao mesmo tempo. Faça upgrade para o UR Pro para conectar mais ou desconecte o URnetwork em outro dispositivo."
  pt-PT: "O seu plano gratuito liga um número limitado de dispositivos ao mesmo tempo. Faça upgrade para o UR Pro para ligar mais, ou desligue o URnetwork noutro dispositivo."
  ru: "Бесплатный тариф позволяет подключать одновременно ограниченное число устройств. Перейдите на UR Pro, чтобы подключить больше, или отключите URnetwork на другом устройстве."
  sv: "Din kostnadsfria plan ansluter ett begränsat antal enheter samtidigt. Uppgradera till UR Pro för att ansluta fler, eller koppla från URnetwork på en annan enhet."
  sw: "Mpango wako wa bure huunganisha idadi ndogo ya vifaa kwa wakati mmoja. Pandisha hadi UR Pro ili kuunganisha zaidi, au tenganisha URnetwork kwenye kifaa kingine."
  th: "แพ็กเกจฟรีของคุณเชื่อมต่ออุปกรณ์พร้อมกันได้ในจำนวนจำกัด อัปเกรดเป็น UR Pro เพื่อเชื่อมต่อเพิ่ม หรือยกเลิกการเชื่อมต่อ URnetwork บนอุปกรณ์เครื่องอื่น"
  uk: "Безкоштовний тариф дозволяє підключати одночасно обмежену кількість пристроїв. Перейдіть на UR Pro, щоб підключити більше, або від’єднайте URnetwork на іншому пристрої."
  vi: "Gói miễn phí của bạn chỉ kết nối được một số thiết bị nhất định cùng lúc. Nâng cấp lên UR Pro để kết nối thêm, hoặc ngắt kết nối URnetwork trên một thiết bị khác."
  zh: "免费套餐可同时连接的设备数量有限。升级到 UR Pro 以连接更多设备，或在另一台设备上断开 URnetwork。"
  zh-HK: "免費計劃可同時連接的裝置數量有限。升級至 UR Pro 以連接更多裝置，或在另一部裝置上中斷 URnetwork。"
