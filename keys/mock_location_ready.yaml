description: "Mock location guide status when setup is complete and the toggle can be turned on."
source: "Ready. Turn on the toggle to sync your device location with the oldest provider."
platforms:
  - android
localizations:
  ar: "جاهز. فعّل مفتاح التبديل لمزامنة موقع جهازك مع أقدم مزود خدمة متصل."
  cs: "Hotovo. Zapnutím přepínače synchronizujete polohu zařízení s nejdéle připojeným poskytovatelem."
  de: "Bereit. Aktiviere den Schalter, um deinen Gerätestandort mit dem am längsten verbundenen Anbieter zu synchronisieren."
  el: "Έτοιμο. Ενεργοποιήστε τον διακόπτη για να συγχρονίσετε την τοποθεσία της συσκευής σας με τον παλαιότερο συνδεδεμένο πάροχο."
  en: "Ready. Turn on the toggle to sync your device location with the oldest provider."
  es: "Listo. Activa el interruptor para sincronizar la ubicación de tu dispositivo con el proveedor conectado desde hace más tiempo."
  es-419: "Listo. Activa el interruptor para sincronizar la ubicación de tu dispositivo con el proveedor conectado desde hace más tiempo."
  es-MX: "Listo. Activa el interruptor para sincronizar la ubicación de tu dispositivo con el proveedor conectado desde hace más tiempo."
  fr: "Prêt. Activez l'interrupteur pour synchroniser la position de votre appareil avec le fournisseur connecté depuis le plus longtemps."
  he: "מוכן. הפעל את המתג כדי לסנכרן את מיקום המכשיר שלך עם הספק המחובר הוותיק ביותר."
  hi: "तैयार है। अपने डिवाइस का स्थान सबसे लंबे समय से कनेक्ट प्रदाता के साथ सिंक करने के लिए टॉगल चालू करें।"
  id: "Siap. Aktifkan tombol untuk menyinkronkan lokasi perangkat Anda dengan penyedia yang paling lama terhubung."
  it: "Pronto. Attiva l'interruttore per sincronizzare la posizione del tuo dispositivo con il provider connesso da più tempo."
  ja: "準備完了です。スイッチをオンにすると、デバイスの位置情報が最も長く接続しているプロバイダーと同期されます。"
  ko: "준비되었습니다. 토글을 켜면 기기 위치가 가장 오래 연결된 제공업체와 동기화됩니다."
  nl: "Klaar. Zet de schakelaar aan om je apparaatlocatie te synchroniseren met de langst verbonden provider."
  pl: "Gotowe. Włącz przełącznik, aby zsynchronizować lokalizację urządzenia z najdłużej połączonym dostawcą."
  pt: "Pronto. Ative o interruptor para sincronizar a localização do seu dispositivo com o fornecedor ligado há mais tempo."
  pt-BR: "Pronto. Ative o botão para sincronizar a localização do seu dispositivo com o provedor conectado há mais tempo."
  pt-PT: "Pronto. Ative o interruptor para sincronizar a localização do seu dispositivo com o fornecedor conectado há mais tempo."
  ru: "Готово. Включите переключатель, чтобы синхронизировать местоположение устройства с провайдером, подключенным дольше всего."
  sv: "Klart. Slå på reglaget för att synkronisera enhetens plats med den längst anslutna leverantören."
  sw: "Tayari. Washa swichi ili kusawazisha mahali pa kifaa chako na mtoa huduma aliyeunganishwa kwa muda mrefu zaidi."
  th: "พร้อมแล้ว เปิดสวิตช์เพื่อซิงค์ตำแหน่งอุปกรณ์ของคุณกับผู้ให้บริการที่เชื่อมต่อนานที่สุด"
  uk: "Готово. Увімкніть перемикач, щоб синхронізувати місцезнаходження пристрою з провайдером, підключеним найдовше."
  vi: "Sẵn sàng. Bật công tắc để đồng bộ vị trí thiết bị của bạn với nhà cung cấp kết nối lâu nhất."
  zh: "已就绪。开启开关即可将设备位置与连接时间最长的提供商同步。"
  zh-HK: "已就緒。開啟開關即可將裝置位置與連接時間最長的供應商同步。"
