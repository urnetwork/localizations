description: "Points leaderboard: shown under the own-stats card while the network has not opted in."
source: "Only you can see this. Turn it on to appear on the leaderboard."
platforms:
  - android
localizations:
  ar: "أنت وحدك من يرى هذا. فعّل الخيار للظهور في لوحة الصدارة."
  cs: "Vidíte to jen vy. Zapněte, abyste se objevili v žebříčku."
  de: "Nur du siehst das. Schalte es ein, um in der Bestenliste zu erscheinen."
  el: "Μόνο εσείς το βλέπετε. Ενεργοποιήστε το για να εμφανιστείτε στον πίνακα."
  en: "Only you can see this. Turn it on to appear on the leaderboard."
  es: "Solo tú puedes ver esto. Actívalo para aparecer en la clasificación."
  es-MX: "Solo tú puedes ver esto. Actívalo para aparecer en la tabla."
  fr: "Vous seul voyez ceci. Activez-le pour apparaître dans le classement."
  he: "רק אתה רואה זאת. הפעל כדי להופיע בטבלה."
  hi: "यह सिर्फ आप देख सकते हैं। लीडरबोर्ड पर दिखने के लिए इसे चालू करें।"
  id: "Hanya Anda yang bisa melihat ini. Aktifkan untuk tampil di papan peringkat."
  it: "Solo tu puoi vederlo. Attivalo per comparire in classifica."
  ja: "これはあなただけに表示されます。オンにするとリーダーボードに表示されます。"
  ko: "나만 볼 수 있습니다. 켜면 리더보드에 표시됩니다."
  nl: "Alleen jij ziet dit. Zet het aan om op het scorebord te verschijnen."
  pl: "Widzisz to tylko Ty. Włącz, aby pojawić się w rankingu."
  pt: "Só você vê isto. Ative para aparecer na tabela."
  pt-BR: "Só você vê isso. Ative para aparecer no placar."
  pt-PT: "Só você vê isto. Ative para aparecer na tabela."
  ru: "Это видите только вы. Включите, чтобы появиться в таблице лидеров."
  sv: "Bara du ser detta. Slå på för att synas på topplistan."
  sw: "Ni wewe tu unaona hii. Washa ili uonekane kwenye ubao."
  th: "มีเพียงคุณที่เห็นสิ่งนี้ เปิดเพื่อแสดงบนกระดาน"
  uk: "Це бачите лише ви. Увімкніть, щоб з’явитися в таблиці лідерів."
  vi: "Chỉ bạn thấy điều này. Bật để xuất hiện trên bảng xếp hạng."
  zh: "只有你能看到。开启后即可出现在排行榜上。"
  zh-HK: "只有你能看到。開啟後即可出現在排行榜上。"
