  de: "Dein Pro-Plan ist aktiv. Für dieses Konto gibt es kein Store-Abo zu verwalten."
  en: "Your Pro plan is active. There's no store subscription to manage on this account."
  es: "Tu plan Pro está activo. No hay ninguna suscripción de tienda que gestionar en esta cuenta."
  ru: "Ваш тариф Pro активен. В этом аккаунте нет подписки в магазине приложений, которой нужно управлять."
