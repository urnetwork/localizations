description: "Footer of the provider transport mode section."
source: "The transport this device uses while providing for others. Auto tries the enabled transports in preference order and keeps every healthy transport of the same tier connected in parallel."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "بروتوكول النقل الذي يستخدمه هذا الجهاز أثناء التوفير للآخرين. يجرّب الوضع «تلقائي» بروتوكولات النقل المفعّلة حسب ترتيب الأفضلية، ويُبقي كل بروتوكولات النقل السليمة من الفئة نفسها متصلة بالتوازي."
  de: "Der Transport, den dieses Gerät nutzt, während es für andere bereitstellt. „Automatisch“ probiert die aktivierten Transporte in der Reihenfolge der Präferenz aus und hält alle funktionierenden Transporte derselben Stufe parallel verbunden."
  en: "The transport this device uses while providing for others. Auto tries the enabled transports in preference order and keeps every healthy transport of the same tier connected in parallel."
  es: "El transporte que usa este dispositivo mientras proporciona a otros. «Automático» prueba los transportes activados por orden de preferencia y mantiene conectados en paralelo todos los transportes en buen estado del mismo nivel."
  ru: "Транспорт, который это устройство использует, предоставляя доступ другим. Режим «Автоматически» перебирает включённые транспорты в порядке предпочтения и держит все исправные транспорты одного уровня подключёнными параллельно."
  zh: "此设备为他人提供服务时使用的传输方式。“自动”模式会按优先顺序尝试已启用的传输方式，并让同一层级中所有正常的传输方式保持并行连接。"
