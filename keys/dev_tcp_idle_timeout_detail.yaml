  de: "Wie lange eine TCP-Verbindung untätig bleiben darf. Aus: nutzt die UDP-Grenze"
  en: "How long a TCP connection may sit idle. Off uses the UDP bound"
  es: "Cuánto tiempo puede permanecer inactiva una conexión TCP. Si está desactivado, se usa el límite de UDP"
