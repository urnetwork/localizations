description: "Earnings, the settlement v2 tile and the claim sheet: shown in one pool's row in place of its balances, never a zero, when the server lists that pool in unavailable_pools (its ledger could not be read just now). The other pools' rows show as usual. The tile's Unavailable (sn_ledger_unavailable) stays for when no balance can be read at all."
