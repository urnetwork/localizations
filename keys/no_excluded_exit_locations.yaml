description: "Empty state of the Excluded exit locations screen, above its search field."
source: "No excluded locations yet. Search for a country, region or city to exclude it."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "لا توجد مواقع مستبعدة بعد. ابحث عن بلد أو منطقة أو مدينة لاستبعادها."
  cs: "Zatím žádná vyloučená místa. Vyhledejte zemi, region nebo město, které chcete vyloučit."
  de: "Noch keine ausgeschlossenen Orte. Suche nach einem Land, einer Region oder einer Stadt, um sie auszuschließen."
  el: "Δεν υπάρχουν ακόμη εξαιρεμένες τοποθεσίες. Αναζητήστε μια χώρα, περιοχή ή πόλη για να την εξαιρέσετε."
  en: "No excluded locations yet. Search for a country, region or city to exclude it."
  es: "Aún no hay ubicaciones excluidas. Busca un país, región o ciudad para excluirlo."
  es-419: "Aún no hay ubicaciones excluidas. Busca un país, región o ciudad para excluirlo."
  es-MX: "Aún no hay ubicaciones excluidas. Busca un país, región o ciudad para excluirlo."
  fa: "هنوز مکانی مستثنا نشده است. برای مستثنا کردن، یک کشور، منطقه یا شهر را جست‌وجو کنید."
  fr: "Aucun emplacement exclu pour l’instant. Recherchez un pays, une région ou une ville pour l’exclure."
  he: "אין עדיין מיקומים מוחרגים. חפש מדינה, אזור או עיר כדי להחריג אותם."
  hi: "अभी कोई स्थान बाहर नहीं रखा गया है। किसी देश, क्षेत्र या शहर को बाहर रखने के लिए उसे खोजें।"
  id: "Belum ada lokasi yang dikecualikan. Cari negara, wilayah, atau kota untuk mengecualikannya."
  it: "Ancora nessuna località esclusa. Cerca un paese, una regione o una città per escluderla."
  ja: "除外した場所はまだありません。除外する国、地域、都市を検索してください。"
  ko: "아직 제외된 위치가 없습니다. 제외할 국가, 지역 또는 도시를 검색하세요."
  nl: "Nog geen uitgesloten locaties. Zoek een land, regio of stad om die uit te sluiten."
  pl: "Brak wykluczonych lokalizacji. Wyszukaj kraj, region lub miasto, aby je wykluczyć."
  pt: "Nenhum local excluído ainda. Pesquise um país, região ou cidade para excluí-lo."
  pt-BR: "Nenhum local excluído ainda. Pesquise um país, região ou cidade para excluí-lo."
  pt-PT: "Ainda não há locais excluídos. Pesquise um país, região ou cidade para o excluir."
  ru: "Исключённых мест пока нет. Найдите страну, регион или город, чтобы исключить их."
  sv: "Inga uteslutna platser ännu. Sök efter ett land, en region eller en stad för att utesluta den."
  sw: "Bado hakuna maeneo yaliyoondolewa. Tafuta nchi, eneo au jiji ili kuliondoa."
  th: "ยังไม่มีตำแหน่งที่ยกเว้น ค้นหาประเทศ ภูมิภาค หรือเมืองเพื่อยกเว้น"
  tr: "Henüz hariç tutulan konum yok. Hariç tutmak için bir ülke, bölge veya şehir arayın."
  uk: "Виключених місць ще немає. Знайдіть країну, регіон або місто, щоб виключити їх."
  vi: "Chưa có vị trí nào bị loại trừ. Tìm một quốc gia, khu vực hoặc thành phố để loại trừ."
  zh: "还没有排除的位置。搜索国家、地区或城市即可排除。"
  zh-HK: "仍未有排除的位置。搜尋國家、地區或城市即可排除。"
