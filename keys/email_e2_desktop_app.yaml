description: "Onboarding email E2, desktop variant, the Windows and Linux apps' branch: the habit. The quoted setting is the apps' own label (store key launch_urnetwork_on_system_startup) in their Settings page (store key settings); keep both identical to the apps."
source: "The easiest way to keep it up is to let URnetwork start with your computer: in the app's Settings, turn on “Launch URnetwork on system startup”. It is then ready every time you sign in."
platforms:
  - email
localizations:
  en: "The easiest way to keep it up is to let URnetwork start with your computer: in the app's Settings, turn on “Launch URnetwork on system startup”. It is then ready every time you sign in."
  ar: "أسهل طريقة للاستمرار هي أن يبدأ URnetwork مع جهاز الكمبيوتر: في «الإعدادات» داخل التطبيق، فعّل «تشغيل URnetwork عند بدء النظام». بعدها يكون جاهزاً في كل مرة تسجّل فيها الدخول."
  cs: "Nejsnazší způsob, jak u toho zůstat, je nechat URnetwork spouštět spolu s počítačem: v aplikaci otevřete Nastavení a zapněte „Spuštění URnetwork při spuštění systému“. Pak je připravený pokaždé, když se přihlásíte."
  de: "Am einfachsten bleibst du dran, wenn URnetwork mit deinem Computer startet: Schalte in den Einstellungen der App „URnetwork beim Systemstart starten“ ein. Dann ist es nach jeder Anmeldung bereit."
  el: "Ο πιο εύκολος τρόπος να συνεχίσεις είναι να ξεκινά το URnetwork μαζί με τον υπολογιστή σου: στις Ρυθμίσεις της εφαρμογής, ενεργοποίησε το «Εκκίνηση του URnetwork κατά την εκκίνηση του συστήματος». Έτσι είναι έτοιμο κάθε φορά που συνδέεσαι."
  es: "La forma más fácil de mantenerlo es que URnetwork se inicie con tu ordenador: en Ajustes de la app, activa «Iniciar URnetwork al arrancar el sistema». Así estará listo cada vez que inicies sesión."
  es-419: "La forma más fácil de mantenerlo es que URnetwork se inicie con tu computadora: en Configuración de la app, activa «Iniciar URnetwork al arrancar el sistema». Así estará listo cada vez que inicies sesión."
  es-MX: "La forma más fácil de mantenerlo es que URnetwork se inicie con tu computadora: en Ajustes de la app, activa «Iniciar URnetwork al arrancar el sistema». Así estará listo cada vez que inicies sesión."
  fr: "Le plus simple pour continuer, c'est de laisser URnetwork démarrer avec ton ordinateur : dans les Paramètres de l'app, active « Lancer URnetwork au démarrage du système ». Il est alors prêt chaque fois que tu ouvres ta session."
  he: "הדרך הקלה ביותר להמשיך היא לתת ל-URnetwork לעלות יחד עם המחשב: בהגדרות של האפליקציה, הפעילו את \"הפעל את URnetwork בעת הפעלת המערכת\". כך הוא מוכן בכל פעם שאתם נכנסים למחשב."
  hi: "इसे जारी रखने का सबसे आसान तरीका है URnetwork को अपने कंप्यूटर के साथ शुरू होने देना: ऐप की सेटिंग में \"सिस्टम स्टार्टअप पर URnetwork लॉन्च करें\" चालू करें। फिर हर बार साइन इन करने पर यह तैयार रहेगा।"
  id: "Cara termudah untuk terus melakukannya adalah membiarkan URnetwork berjalan bersama komputermu: di Pengaturan aplikasi, nyalakan \"Jalankan URnetwork saat sistem startup\". Setelah itu ia siap setiap kali kamu masuk."
  it: "Il modo più facile per continuare è far partire URnetwork insieme al computer: nelle Impostazioni dell'app, attiva «Avvia URnetwork all'avvio del sistema». Così è pronto ogni volta che accedi."
  ja: "続けるいちばん簡単な方法は、URnetwork をパソコンと一緒に起動させることです。アプリの「設定」で「システム起動時にURnetworkを起動」をオンにしてください。サインインするたびに準備ができています。"
  ko: "계속 쓰는 가장 쉬운 방법은 URnetwork가 컴퓨터와 함께 시작되게 하는 것입니다. 앱의 설정에서 '시스템 시작 시 URnetwork 실행'을 켜 주세요. 그러면 로그인할 때마다 준비되어 있습니다."
  nl: "De makkelijkste manier om het vol te houden is URnetwork met je computer mee te laten starten: zet in de Instellingen van de app ‘Start URnetwork automatisch bij het opstarten van het systeem’ aan. Dan staat het klaar zodra je inlogt."
  pl: "Najłatwiej utrzymać nawyk, gdy URnetwork uruchamia się razem z komputerem: w Ustawieniach aplikacji włącz „Uruchom URnetwork przy starcie systemu”. Wtedy jest gotowy za każdym razem, gdy się zalogujesz."
  pt: "O jeito mais fácil de manter o ritmo é deixar a URnetwork iniciar com o computador: nas Configurações do app, ative “Iniciar URnetwork no arranque do sistema”. Assim ela fica pronta toda vez que você entrar."
  pt-BR: "O jeito mais fácil de manter o ritmo é deixar a URnetwork iniciar com o computador: nas Configurações do app, ative “Iniciar URnetwork na inicialização do sistema”. Assim ela fica pronta toda vez que você entrar."
  pt-PT: "A forma mais fácil de manter o hábito é deixar a URnetwork iniciar com o computador: nas Definições da app, ative “Iniciar URnetwork no arranque do sistema”. Assim, fica pronta sempre que iniciar sessão."
  ru: "Проще всего продолжать, если URnetwork запускается вместе с компьютером: в настройках приложения включите «Запускать URnetwork при запуске системы». Тогда приложение будет готово каждый раз, когда вы входите в систему."
  sv: "Enklaste sättet att hålla igång är att låta URnetwork starta med datorn: slå på ”Starta URnetwork vid systemstart” i appens Inställningar. Då är den redo varje gång du loggar in."
  sw: "Njia rahisi zaidi ya kuendelea ni kuiacha URnetwork ianze pamoja na kompyuta yako: katika Mipangilio ya programu, washa \"Anzisha URnetwork wakati mfumo unapowashwa\". Kisha itakuwa tayari kila unapoingia."
  th: "วิธีที่ง่ายที่สุดในการใช้ต่อคือให้ URnetwork เปิดพร้อมคอมพิวเตอร์: ใน การตั้งค่า ของแอป ให้เปิด \"เปิด URnetwork เมื่อเริ่มต้นระบบ\" จากนั้นแอปจะพร้อมทุกครั้งที่คุณลงชื่อเข้าใช้"
  uk: "Найпростіше продовжувати, якщо URnetwork запускається разом із комп'ютером: у налаштуваннях застосунку увімкніть «Запускати URnetwork під час запуску системи». Тоді застосунок буде готовий щоразу, коли ви входите в систему."
  vi: "Cách dễ nhất để duy trì là để URnetwork khởi động cùng máy tính: trong Cài đặt của ứng dụng, bật \"Khởi chạy URnetwork khi khởi động hệ thống\". Khi đó ứng dụng luôn sẵn sàng mỗi lần bạn đăng nhập."
  zh: "最省事的坚持方式是让 URnetwork 随电脑一起启动：在应用的“设置”中打开“系统启动时启动 URnetwork”。之后每次登录电脑，它都已准备就绪。"
  zh-HK: "最省事的堅持方式是讓 URnetwork 隨電腦一起啟動：在應用程式的「設定」中開啟「系統啟動時啟動 URnetwork」。之後每次登入電腦，它都已準備就緒。"
