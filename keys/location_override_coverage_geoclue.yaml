description: "Setup guide and info popup on linux: what the device location override actually covers. Shown alongside location_override_coverage_gaps, which states the limits."
source: "Apps that ask the system for your location through GeoClue — including GNOME Settings and Maps, Firefox, and sandboxed Flatpak and Snap apps — report the provider's location instead of yours."
platforms:
  - linux
localizations:
  ar: "التطبيقات التي تطلب موقعك من النظام عبر GeoClue — بما في ذلك الإعدادات والخرائط في GNOME، وFirefox، وتطبيقات Flatpak وSnap المعزولة — تُبلّغ عن موقع المزود بدلًا من موقعك."
  cs: "Aplikace, které si o vaši polohu říkají systému přes GeoClue — včetně Nastavení a Map v GNOME, Firefoxu a izolovaných aplikací Flatpak a Snap — hlásí polohu poskytovatele místo té vaší."
  de: "Apps, die das System über GeoClue nach deinem Standort fragen — darunter GNOME-Einstellungen und -Karten, Firefox sowie in Sandboxen ausgeführte Flatpak- und Snap-Apps — melden den Standort des Anbieters statt deines eigenen."
  el: "Οι εφαρμογές που ζητούν την τοποθεσία σας από το σύστημα μέσω του GeoClue — όπως οι Ρυθμίσεις και οι Χάρτες του GNOME, ο Firefox και οι εφαρμογές Flatpak και Snap σε sandbox — αναφέρουν την τοποθεσία του παρόχου αντί για τη δική σας."
  en: "Apps that ask the system for your location through GeoClue — including GNOME Settings and Maps, Firefox, and sandboxed Flatpak and Snap apps — report the provider's location instead of yours."
  es: "Las aplicaciones que piden tu ubicación al sistema a través de GeoClue — incluidas Configuración y Mapas de GNOME, Firefox y las aplicaciones Flatpak y Snap en espacio aislado — informan de la ubicación del proveedor en lugar de la tuya."
  es-419: "Las apps que piden tu ubicación al sistema a través de GeoClue — incluidas Configuración y Mapas de GNOME, Firefox y las apps Flatpak y Snap en espacio aislado — informan la ubicación del proveedor en lugar de la tuya."
  es-MX: "Las apps que piden tu ubicación al sistema a través de GeoClue — incluidas Configuración y Mapas de GNOME, Firefox y las apps Flatpak y Snap en espacio aislado — informan la ubicación del proveedor en lugar de la tuya."
  fr: "Les applications qui demandent votre position au système via GeoClue — dont Paramètres et Cartes de GNOME, Firefox et les applications Flatpak et Snap en bac à sable — signalent la position du fournisseur plutôt que la vôtre."
  he: "אפליקציות שמבקשות מהמערכת את מיקומך דרך GeoClue — כולל הגדרות ומפות של GNOME, Firefox ואפליקציות Flatpak ו-Snap בארגז חול — מדווחות על מיקום הספק במקום על שלך."
  hi: "जो ऐप्लिकेशन GeoClue के ज़रिए सिस्टम से आपका स्थान मांगते हैं — जिनमें GNOME Settings and Maps, Firefox, और सैंडबॉक्स में चलने वाले Flatpak और Snap ऐप्लिकेशन शामिल हैं — वे आपके बजाय प्रदाता का स्थान बताते हैं।"
  id: "Aplikasi yang meminta lokasi Anda kepada sistem melalui GeoClue — termasuk Pengaturan dan Peta GNOME, Firefox, serta aplikasi Flatpak dan Snap yang berjalan dalam sandbox — melaporkan lokasi penyedia, bukan lokasi Anda."
  it: "Le app che chiedono la tua posizione al sistema tramite GeoClue — tra cui Impostazioni e Mappe di GNOME, Firefox e le app Flatpak e Snap in sandbox — segnalano la posizione del provider invece della tua."
  ja: "GeoClue を通じてシステムに位置情報を問い合わせるアプリ — GNOME の「設定」と「地図」、Firefox、サンドボックス化された Flatpak および Snap アプリなど — は、あなたの位置情報ではなくプロバイダーの位置情報を報告します。"
  ko: "GeoClue를 통해 시스템에 위치를 요청하는 앱은 — GNOME 설정 및 지도, Firefox, 샌드박스로 실행되는 Flatpak 및 Snap 앱 등 — 사용자의 위치 대신 제공업체의 위치를 보고합니다."
  nl: "Apps die het systeem via GeoClue om je locatie vragen — waaronder GNOME Instellingen en Kaarten, Firefox en Flatpak- en Snap-apps in een sandbox — melden de locatie van de provider in plaats van die van jou."
  pl: "Aplikacje, które pytają system o Twoją lokalizację przez GeoClue — w tym Ustawienia i Mapy GNOME, Firefox oraz aplikacje Flatpak i Snap działające w piaskownicy — zgłaszają lokalizację dostawcy zamiast Twojej."
  pt: "As aplicações que pedem a sua localização ao sistema através do GeoClue — incluindo as Definições e os Mapas do GNOME, o Firefox e as aplicações Flatpak e Snap em sandbox — comunicam a localização do fornecedor em vez da sua."
  pt-BR: "Os apps que pedem sua localização ao sistema por meio do GeoClue — incluindo Configurações e Mapas do GNOME, o Firefox e os apps Flatpak e Snap em sandbox — informam a localização do provedor em vez da sua."
  pt-PT: "As aplicações que pedem a sua localização ao sistema através do GeoClue — incluindo as Definições e os Mapas do GNOME, o Firefox e as aplicações Flatpak e Snap em sandbox — comunicam a localização do fornecedor em vez da sua."
  ru: "Приложения, которые запрашивают ваше местоположение у системы через GeoClue — включая «Параметры» и «Карты» GNOME, Firefox, а также изолированные приложения Flatpak и Snap — сообщают местоположение провайдера вместо вашего."
  sv: "Appar som frågar systemet om din plats via GeoClue — bland annat GNOME Inställningar och Kartor, Firefox samt sandlådade Flatpak- och Snap-appar — rapporterar leverantörens plats i stället för din."
  sw: "Programu zinazoomba mahali ulipo kutoka kwa mfumo kupitia GeoClue — ikiwa ni pamoja na GNOME Settings and Maps, Firefox, na programu za Flatpak na Snap zinazoendeshwa kwenye sandbox — huripoti mahali pa mtoa huduma badala ya pako."
  th: "แอปที่ขอตำแหน่งของคุณจากระบบผ่าน GeoClue — รวมถึง GNOME Settings and Maps, Firefox และแอป Flatpak และ Snap ที่ทำงานในแซนด์บ็อกซ์ — จะรายงานตำแหน่งของผู้ให้บริการแทนตำแหน่งของคุณ"
  uk: "Застосунки, які запитують ваше місцезнаходження в системи через GeoClue — зокрема «Параметри» та «Карти» GNOME, Firefox, а також ізольовані застосунки Flatpak і Snap — повідомляють місцезнаходження провайдера замість вашого."
  vi: "Các ứng dụng hỏi hệ thống về vị trí của bạn thông qua GeoClue — bao gồm GNOME Settings and Maps, Firefox, và các ứng dụng Flatpak và Snap chạy trong hộp cát — sẽ báo cáo vị trí của nhà cung cấp thay vì vị trí của bạn."
  zh: "通过 GeoClue 向系统请求位置的应用 — 包括 GNOME 的“设置”和“地图”、Firefox，以及沙盒化的 Flatpak 和 Snap 应用 — 会报告提供商的位置，而不是您的位置。"
  zh-HK: "透過 GeoClue 向系統要求位置的應用程式 — 包括 GNOME 的「設定」和「地圖」、Firefox，以及沙盒化的 Flatpak 和 Snap 應用程式 — 會回報供應商的位置，而不是你的位置。"
