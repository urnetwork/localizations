description: "Onboarding offer emails (E4b, E3a, E5b), the card branch of the offer email experiment's crypto arm (surface offer.email; owner, 2026-11-15): checkout also takes the cryptocurrencies listed there, one payment for a year of Pro at the welcome offer's first-year price, with no renewal and no free trial (ur.io's offer and plan steps sell the coins at the offer's price: crypto_fine_print_yearly). Never shown to readers the App Store or Google Play bills. Names no coin: the list is checkout's."
source: "Prefer not to use a card? Checkout also takes a one-time crypto payment for the year, at the same first-year price; it doesn't renew."
platforms:
  - email
localizations:
  en: "Prefer not to use a card? Checkout also takes a one-time crypto payment for the year, at the same first-year price; it doesn't renew."
  ar: "تفضّل ألا تستخدم بطاقة؟ تقبل صفحة الدفع أيضاً دفعة واحدة بالعملات المشفّرة مقابل السنة، بسعر السنة الأولى نفسه؛ ولا تتجدّد."
  cs: "Nechcete platit kartou? Pokladna přijímá i jednorázovou platbu kryptoměnou za celý rok, za stejnou cenu prvního roku; neobnovuje se."
  de: "Lieber ohne Karte? An der Kasse geht auch eine einmalige Zahlung in Krypto für das Jahr, zum selben Preis für das erste Jahr; sie verlängert sich nicht."
  el: "Προτιμάς να μη χρησιμοποιήσεις κάρτα; Στο ταμείο μπορείς επίσης να πληρώσεις εφάπαξ με κρυπτονομίσματα για τη χρονιά, στην ίδια τιμή πρώτου έτους· δεν ανανεώνεται."
  es: "¿Prefieres no usar tarjeta? El pago también acepta un pago único en criptomonedas por el año, al mismo precio del primer año; no se renueva."
  es-419: "¿Prefieres no usar tarjeta? El pago también acepta un pago único en criptomonedas por el año, al mismo precio del primer año; no se renueva."
  es-MX: "¿Prefieres no usar tarjeta? El pago también acepta un pago único en criptomonedas por el año, al mismo precio del primer año; no se renueva."
  fr: "Tu préfères ne pas utiliser de carte ? Le paiement accepte aussi un règlement unique en cryptomonnaie pour l'année, au même prix de première année ; il ne se renouvelle pas."
  he: "מעדיפים לא להשתמש בכרטיס? בקופה אפשר גם לשלם תשלום חד-פעמי במטבע קריפטו על השנה, באותו מחיר של השנה הראשונה; התשלום לא מתחדש."
  hi: "कार्ड इस्तेमाल नहीं करना चाहते? चेकआउट पर साल भर के लिए क्रिप्टो में एक बार का भुगतान भी स्वीकार है, पहले साल की उसी कीमत पर; यह अपने आप नवीनीकृत नहीं होता।"
  id: "Tidak ingin memakai kartu? Checkout juga menerima pembayaran kripto sekali bayar untuk setahun, dengan harga tahun pertama yang sama; pembayaran ini tidak diperpanjang otomatis."
  it: "Preferisci non usare una carta? Il checkout accetta anche un pagamento unico in criptovaluta per l'anno, allo stesso prezzo del primo anno; non si rinnova."
  ja: "カードを使いたくない場合は、チェックアウトで1年分を暗号資産で一括払いすることもできます。初年度と同じ価格で、自動更新はされません。"
  ko: "카드를 쓰고 싶지 않으신가요? 결제 화면에서 1년 치를 암호화폐로 한 번에 결제할 수도 있습니다. 첫해와 같은 가격이며 자동으로 갱신되지 않습니다."
  nl: "Liever geen kaart? Bij het afrekenen kun je ook in één keer met crypto betalen voor het jaar, voor dezelfde prijs voor het eerste jaar; het wordt niet verlengd."
  pl: "Wolisz nie płacić kartą? Przy kasie możesz też zapłacić jednorazowo kryptowalutą za cały rok, w tej samej cenie pierwszego roku; płatność się nie odnawia."
  pt: "Prefere não usar cartão? O checkout também aceita um pagamento único em cripto pelo ano, pelo mesmo preço do primeiro ano; ele não é renovado."
  pt-BR: "Prefere não usar cartão? O checkout também aceita um pagamento único em cripto pelo ano, pelo mesmo preço do primeiro ano; ele não é renovado."
  pt-PT: "Prefere não usar cartão? O pagamento também aceita um pagamento único em criptomoeda pelo ano, pelo mesmo preço do primeiro ano; não é renovado."
  ru: "Не хотите платить картой? На странице оплаты можно также разово оплатить год криптовалютой по той же цене первого года; оплата не продлевается."
  sv: "Vill du hellre inte använda kort? I kassan går det också att betala en gång med krypto för året, till samma pris för första året; det förnyas inte."
  sw: "Hupendi kutumia kadi? Malipo pia yanakubali malipo ya mara moja kwa sarafu za kidijitali kwa mwaka mzima, kwa bei ileile ya mwaka wa kwanza; hayajirudii."
  th: "ไม่อยากใช้บัตรใช่ไหม หน้าชำระเงินรับการชำระด้วยคริปโตครั้งเดียวสำหรับทั้งปีได้ด้วย ในราคาเดียวกับปีแรก และจะไม่ต่ออายุอัตโนมัติ"
  uk: "Не хочете платити карткою? На сторінці оплати можна також разово оплатити рік криптовалютою за тією самою ціною першого року; оплата не поновлюється."
  vi: "Không muốn dùng thẻ? Trang thanh toán cũng nhận thanh toán một lần bằng tiền mã hóa cho cả năm, cùng giá năm đầu; khoản này không tự gia hạn."
  zh: "不想用银行卡？结账时也可以用加密货币一次性支付一年，价格与首年价相同；不会自动续订。"
  zh-HK: "不想用信用卡？結帳時也可以用加密貨幣一次性支付一年，價格與首年價相同；不會自動續訂。"
