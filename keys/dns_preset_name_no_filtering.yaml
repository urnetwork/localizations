description: "DNS settings: the name of an adblock provider's preset in \"No filtering\", which blocks nothing. Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: Cloudflare No Filtering\" and \"Cloudflare No Filtering isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example Cloudflare); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ No Filtering"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
