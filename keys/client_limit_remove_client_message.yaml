description: "Body under client_limit_reached, in the app and in the local notification, for a UR Pro account: it already has as many devices connected at once as its plan allows, the highest plan, so no upgrade helps. Signing out on another device frees its slot; Retry is the button beside it. Also shown when a sign-in on a new device is refused for the same limit. Keep URnetwork as it is."
source: "Your plan's limit of devices connected at once is reached. Sign out of URnetwork on a device you no longer use, then try again."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "بلغت خطتك الحد الأقصى للأجهزة المتصلة في الوقت نفسه. سجّل الخروج من URnetwork على جهاز لم تعد تستخدمه، ثم حاول مرة أخرى."
  cs: "Váš tarif dosáhl limitu zařízení připojených najednou. Odhlaste se z URnetwork na zařízení, které už nepoužíváte, a zkuste to znovu."
  de: "Dein Tarif hat sein Limit für gleichzeitig verbundene Geräte erreicht. Melde dich auf einem Gerät, das du nicht mehr nutzt, von URnetwork ab und versuche es dann erneut."
  el: "Το πρόγραμμά σας έφτασε το όριο συσκευών που συνδέονται ταυτόχρονα. Αποσυνδεθείτε από το URnetwork σε μια συσκευή που δεν χρησιμοποιείτε πια και δοκιμάστε ξανά."
  en: "Your plan's limit of devices connected at once is reached. Sign out of URnetwork on a device you no longer use, then try again."
  es: "Tu plan alcanzó el límite de dispositivos conectados a la vez. Cierra sesión en URnetwork en un dispositivo que ya no uses y vuelve a intentarlo."
  es-419: "Tu plan alcanzó el límite de dispositivos conectados a la vez. Cierra sesión en URnetwork en un dispositivo que ya no uses y vuelve a intentarlo."
  es-MX: "Tu plan alcanzó el límite de dispositivos conectados a la vez. Cierra sesión en URnetwork en un dispositivo que ya no uses y vuelve a intentarlo."
  fr: "Votre offre a atteint sa limite d’appareils connectés simultanément. Déconnectez-vous d’URnetwork sur un appareil que vous n’utilisez plus, puis réessayez."
  he: "התוכנית שלך הגיעה למגבלת המכשירים המחוברים בו־זמנית. התנתק מ-URnetwork במכשיר שאינך משתמש בו עוד, ואז נסה שוב."
  hi: "आपके प्लान में एक साथ कनेक्ट डिवाइस की सीमा पूरी हो गई है। जिस डिवाइस का अब इस्तेमाल नहीं करते, उस पर URnetwork से साइन आउट करें, फिर दोबारा कोशिश करें।"
  id: "Paket Anda sudah mencapai batas perangkat yang terhubung sekaligus. Keluar dari URnetwork di perangkat yang tidak lagi Anda gunakan, lalu coba lagi."
  it: "Il tuo piano ha raggiunto il limite di dispositivi collegati contemporaneamente. Esci da URnetwork su un dispositivo che non usi più, poi riprova."
  ja: "プランで同時に接続できるデバイスの上限に達しました。使っていないデバイスで URnetwork からサインアウトしてから、もう一度お試しください。"
  ko: "요금제의 동시 연결 기기 한도에 도달했습니다. 더 이상 사용하지 않는 기기에서 URnetwork에서 로그아웃한 다음 다시 시도하세요."
  nl: "Je abonnement heeft de limiet voor tegelijk verbonden apparaten bereikt. Meld je af bij URnetwork op een apparaat dat je niet meer gebruikt en probeer het opnieuw."
  pl: "Twój plan osiągnął limit urządzeń połączonych jednocześnie. Wyloguj się z URnetwork na urządzeniu, którego już nie używasz, i spróbuj ponownie."
  pt: "Seu plano atingiu o limite de dispositivos conectados ao mesmo tempo. Saia do URnetwork em um dispositivo que você não usa mais e tente novamente."
  pt-BR: "Seu plano atingiu o limite de dispositivos conectados ao mesmo tempo. Saia do URnetwork em um dispositivo que você não usa mais e tente novamente."
  pt-PT: "O seu plano atingiu o limite de dispositivos ligados ao mesmo tempo. Termine a sessão no URnetwork num dispositivo que já não utiliza e tente novamente."
  ru: "Ваш тариф достиг лимита одновременно подключённых устройств. Выйдите из URnetwork на устройстве, которым больше не пользуетесь, и попробуйте снова."
  sv: "Din plan har nått gränsen för enheter som är anslutna samtidigt. Logga ut från URnetwork på en enhet du inte längre använder och försök igen."
  sw: "Mpango wako umefikia kikomo cha vifaa vilivyounganishwa kwa wakati mmoja. Ondoka kwenye URnetwork kwenye kifaa usichokitumia tena, kisha ujaribu tena."
  th: "แพ็กเกจของคุณถึงขีดจำกัดจำนวนอุปกรณ์ที่เชื่อมต่อพร้อมกันแล้ว ออกจากระบบ URnetwork บนอุปกรณ์ที่คุณไม่ได้ใช้แล้ว แล้วลองอีกครั้ง"
  uk: "Ваш тариф досяг ліміту одночасно підключених пристроїв. Вийдіть з URnetwork на пристрої, яким більше не користуєтеся, і спробуйте ще раз."
  vi: "Gói của bạn đã đạt giới hạn số thiết bị kết nối cùng lúc. Đăng xuất URnetwork trên một thiết bị bạn không còn dùng, rồi thử lại."
  zh: "您的套餐已达到可同时连接的设备数量上限。请在不再使用的设备上退出 URnetwork，然后重试。"
  zh-HK: "你的計劃已達到可同時連接的裝置數量上限。請在不再使用的裝置上登出 URnetwork，然後再試一次。"
