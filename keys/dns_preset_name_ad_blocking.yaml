description: "DNS settings: the name of an adblock provider's preset in \"Block ads and trackers\", which blocks ads and trackers. Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: AdGuard Ad Blocking\" and \"AdGuard Ad Blocking isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example AdGuard); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ Ad Blocking"
platforms:
  - android
  - apple
  - linux
  - windows
