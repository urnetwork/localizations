description: "Shown on the linux home screen when the urnetworkd system service rejected this app for speaking an older control protocol than the service supports. The fix is updating the app, not the service."
source: "This app is older than the installed URnetwork system service. Update the app to connect."
platforms:
  - linux
localizations:
  ar: "هذا التطبيق أقدم من خدمة نظام URnetwork المثبّتة. حدّث التطبيق للاتصال."
  cs: "Tato aplikace je starší než nainstalovaná systémová služba URnetwork. Pro připojení aplikaci aktualizujte."
  de: "Diese App ist älter als der installierte URnetwork-Systemdienst. Aktualisiere die App, um dich zu verbinden."
  el: "Αυτή η εφαρμογή είναι παλαιότερη από την εγκατεστημένη υπηρεσία συστήματος URnetwork. Ενημερώστε την εφαρμογή για να συνδεθείτε."
  en: "This app is older than the installed URnetwork system service. Update the app to connect."
  es: "Esta aplicación es más antigua que el servicio del sistema URnetwork instalado. Actualiza la aplicación para conectarte."
  es-419: "Esta app es más antigua que el servicio del sistema URnetwork instalado. Actualiza la app para conectarte."
  es-MX: "Esta app es más antigua que el servicio del sistema URnetwork instalado. Actualiza la app para conectarte."
  fr: "Cette application est plus ancienne que le service système URnetwork installé. Mettez l'application à jour pour vous connecter."
  he: "האפליקציה הזו ישנה יותר משירות המערכת המותקן של URnetwork. עדכן את האפליקציה כדי להתחבר."
  hi: "यह ऐप्लिकेशन इंस्टॉल की गई URnetwork सिस्टम सेवा से पुराना है। कनेक्ट करने के लिए ऐप्लिकेशन को अपडेट करें।"
  id: "Aplikasi ini lebih lama daripada layanan sistem URnetwork yang terpasang. Perbarui aplikasi untuk terhubung."
  it: "Questa app è più vecchia del servizio di sistema URnetwork installato. Aggiorna l'app per connetterti."
  ja: "このアプリはインストールされている URnetwork システムサービスより古いバージョンです。接続するにはアプリを更新してください。"
  ko: "이 앱이 설치된 URnetwork 시스템 서비스보다 오래된 버전입니다. 연결하려면 앱을 업데이트하세요."
  nl: "Deze app is ouder dan de geïnstalleerde URnetwork-systeemservice. Werk de app bij om verbinding te maken."
  pl: "Ta aplikacja jest starsza niż zainstalowana usługa systemowa URnetwork. Zaktualizuj aplikację, aby się połączyć."
  pt: "Esta aplicação é mais antiga do que o serviço de sistema URnetwork instalado. Atualize a aplicação para ligar."
  pt-BR: "Este app é mais antigo que o serviço de sistema URnetwork instalado. Atualize o app para conectar."
  pt-PT: "Esta aplicação é mais antiga do que o serviço de sistema URnetwork instalado. Atualize a aplicação para ligar."
  ru: "Это приложение старше установленной системной службы URnetwork. Обновите приложение, чтобы подключиться."
  sv: "Den här appen är äldre än den installerade systemtjänsten URnetwork. Uppdatera appen för att ansluta."
  sw: "Programu hii ni ya zamani kuliko huduma ya mfumo ya URnetwork iliyosakinishwa. Sasisha programu ili kuunganisha."
  th: "แอปนี้เก่ากว่าบริการระบบ URnetwork ที่ติดตั้งไว้ อัปเดตแอปเพื่อเชื่อมต่อ"
  uk: "Цей застосунок старіший за встановлену системну службу URnetwork. Оновіть застосунок, щоб підключитися."
  vi: "Ứng dụng này cũ hơn dịch vụ hệ thống URnetwork đã cài đặt. Hãy cập nhật ứng dụng để kết nối."
  zh: "此应用比已安装的 URnetwork 系统服务旧。请更新应用以进行连接。"
  zh-HK: "此應用程式比已安裝的 URnetwork 系統服務舊。請更新應用程式以進行連接。"
