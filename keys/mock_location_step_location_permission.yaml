description: "Optional setup step: the approximate location grant that Google Play services needs to mirror the simulated location to its own location provider. The feature works without it."
source: "Optional: allow approximate location so Chrome and other Google Play apps follow the simulated location too. Everything else works without it."
platforms:
  - android
localizations:
  en: "Optional: allow approximate location so Chrome and other Google Play apps follow the simulated location too. Everything else works without it."
  ar: "اختياري: اسمح بالوصول إلى «الموقع التقريبي» حتى يتبع Chrome وتطبيقات Google Play الأخرى الموقع الوهمي أيضًا. وتعمل جميع الميزات الأخرى بدونه."
  cs: "Volitelné: povolte přístup k přibližné poloze, aby se simulovanou polohou řídil i Chrome a další aplikace z Google Play. Vše ostatní funguje i bez tohoto oprávnění."
  de: "Optional: Erlaube den Zugriff auf den ungefähren Standort, damit auch Chrome und andere Google-Play-Apps den simulierten Standort sehen. Alles andere funktioniert auch ohne diese Berechtigung."
  el: "Προαιρετικό: επιτρέψτε την πρόσβαση στην τοποθεσία κατά προσέγγιση, ώστε το Chrome και άλλες εφαρμογές του Google Play να ακολουθούν κι αυτές την εικονική τοποθεσία. Όλα τα υπόλοιπα λειτουργούν και χωρίς αυτό."
  es: "Opcional: permite el acceso a la ubicación aproximada para que Chrome y otras aplicaciones de Google Play también usen la ubicación simulada. Todo lo demás funciona sin este permiso."
  es-419: "Opcional: permite el acceso a la ubicación aproximada para que Chrome y otras apps de Google Play también sigan la ubicación simulada. Todo lo demás funciona sin este permiso."
  es-MX: "Opcional: permite la ubicación aproximada para que Chrome y otras apps de Google Play también sigan la ubicación simulada. Todo lo demás funciona sin este permiso."
  fr: "Facultatif : autorisez la position approximative pour que Chrome et les autres applications Google Play suivent elles aussi la position fictive. Tout le reste fonctionne sans cette autorisation."
  he: "אופציונלי: אפשר גישה למיקום משוער כדי ש-Chrome ואפליקציות אחרות של Google Play יעקבו גם הם אחרי המיקום המדומה. כל השאר פועל גם בלי זה."
  hi: "वैकल्पिक: “अनुमानित जगह की जानकारी” की अनुमति दें ताकि Chrome और Google Play के दूसरे ऐप्लिकेशन को भी नकली स्थान मिले। बाकी सब कुछ इसके बिना भी काम करता है।"
  id: "Opsional: izinkan akses lokasi perkiraan agar Chrome dan aplikasi Google Play lainnya juga mengikuti lokasi palsu. Semua fitur lainnya tetap berfungsi tanpa izin ini."
  it: "Facoltativo: consenti la posizione approssimativa in modo che anche Chrome e le altre app di Google Play seguano la posizione fittizia. Tutto il resto funziona anche senza."
  ja: "任意：「おおよその位置情報」を許可すると、Chrome やその他の Google Play アプリでも仮の位置情報が使われます。許可しなくても、それ以外の機能はすべて動作します。"
  ko: "선택 사항: Chrome 및 기타 Google Play 앱도 모의 위치를 따르도록 '대략적인 위치' 권한을 허용하세요. 나머지 기능은 이 권한 없이도 작동합니다."
  nl: "Optioneel: sta locatie bij benadering toe zodat ook Chrome en andere Google Play-apps de gesimuleerde locatie volgen. Al het andere werkt ook zonder deze toestemming."
  pl: "Opcjonalnie: zezwól na przybliżoną lokalizację, aby Chrome i inne aplikacje Google Play również widziały symulowaną lokalizację. Wszystkie pozostałe funkcje działają bez tego uprawnienia."
  pt: "Opcional: permita o acesso à localização aproximada para que o Chrome e outras aplicações do Google Play sigam também a localização fictícia. Tudo o resto funciona sem esta permissão."
  pt-BR: "Opcional: permita a localização aproximada para que o Chrome e outros apps do Google Play também sigam a localização fictícia. Todo o resto funciona sem isso."
  pt-PT: "Opcional: permita a localização aproximada para que o Chrome e outras aplicações do Google Play também sigam a localização fictícia. Tudo o resto funciona sem esta permissão."
  ru: "Необязательно: разрешите доступ к приблизительному местоположению, чтобы Chrome и другие приложения Google Play тоже использовали фиктивное местоположение. Всё остальное работает и без этого."
  sv: "Valfritt: tillåt ”ungefärlig plats” så att Chrome och andra Google Play-appar också följer den simulerade platsen. Allt annat fungerar utan den behörigheten."
  sw: "Hiari: ruhusu mahali pa takriban ili Chrome na programu nyingine za Google Play nazo zifuate mahali pa kuigwa. Kila kitu kingine hufanya kazi bila ruhusa hii."
  th: "ไม่บังคับ: อนุญาตให้เข้าถึงตำแหน่งโดยประมาณ เพื่อให้ Chrome และแอปอื่นๆ ที่ใช้ Google Play ใช้ตำแหน่งจำลองด้วย ส่วนอื่นทั้งหมดทำงานได้โดยไม่ต้องใช้สิทธิ์นี้"
  uk: "Необов'язково: надайте дозвіл на приблизне місцезнаходження, щоб Chrome та інші додатки Google Play теж бачили фіктивне місцезнаходження. Усе інше працює й без цього."
  vi: "Không bắt buộc: cho phép quyền vị trí gần đúng để Chrome và các ứng dụng Google Play khác cũng nhận được vị trí mô phỏng. Mọi thứ khác vẫn hoạt động mà không cần quyền này."
  zh: "可选：允许获取大致位置，这样 Chrome 和其他 Google Play 应用也会跟随模拟位置。其他功能无需此权限即可正常使用。"
  zh-HK: "可選：允許存取大概位置，讓 Chrome 和其他 Google Play 應用程式也使用模擬位置。其他功能即使沒有此權限也能正常運作。"
