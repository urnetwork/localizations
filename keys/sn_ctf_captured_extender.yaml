description: "Earnings, with the capture the flag account (sn_ctf_pool): a line saying a capture the flag draw picked this device as one of a country's extenders (GET /sn/ctf/client). The placeholder is the country's name exactly as the app shows it, e.g. Kenya, with no case ending or article added, so keep it where the bare name reads correctly (several languages lead with it: \"{country}: ...\"). Capturing a flag is how capture the flag words a win. Mention no amount."
source: "You captured the %@ extender flag"
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: country
    type: string
