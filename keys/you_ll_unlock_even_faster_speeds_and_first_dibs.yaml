description: "Used in Shared/Views/UpgradeSubscriptionSheet.swift."
source: "You’ll unlock even faster speeds, and first dibs on new features like robust anti-censorship measures and data control."
platforms:
  - apple
localizations:
  ar: "ستحصل على سرعات أعلى، وأولوية الوصول إلى الميزات الجديدة مثل تدابير مكافحة الرقابة القوية والتحكم في البيانات."
  cs: "Odemknete ještě vyšší rychlosti a získáte první právo na nové funkce, jako jsou robustní opatření proti cenzuře a kontrola dat."
  de: "Sie schalten noch schnellere Geschwindigkeiten frei und erhalten als Erste Zugriff auf neue Funktionen wie robuste Zensurschutzmaßnahmen und Datenkontrolle."
  el: "Θα ξεκλειδώσετε ακόμη μεγαλύτερες ταχύτητες και θα έχετε πρώτοι πρόσβαση σε νέες λειτουργίες όπως ισχυρά μέτρα κατά της λογοκρισίας και έλεγχο δεδομένων."
  en: "You'll unlock even faster speeds, and first dibs on new features like robust anti-censorship measures and data control."
  es: "Desbloquearás velocidades aún más rápidas y acceso prioritario a nuevas funciones como medidas sólidas contra la censura y control de datos."
  es-419: "Desbloquearás velocidades aún más rápidas y acceso prioritario a nuevas funciones como medidas sólidas contra la censura y control de datos."
  es-MX: "Desbloquearás velocidades aún más rápidas y acceso prioritario a nuevas funciones como medidas sólidas contra la censura y control de datos."
  fr: "Vous débloquerez des vitesses encore plus rapides et serez les premiers à profiter des nouvelles fonctionnalités comme les mesures anti-censure robustes et le contrôle des données."
  he: "תוכל לפתוח מהירויות גבוהות יותר, ולקבל גישה ראשונה לתכונות חדשות כמו אמצעי הגנה חזקים נגד צנזורה ושליטה בנתונים."
  hi: "आप और भी तेज़ गति को अनलॉक करेंगे, और सेंसरशिप-विरोधी उपायों और डेटा नियंत्रण जैसी नई सुविधाओं तक पहले पहुंच प्राप्त करेंगे।"
  id: "Anda akan membuka kecepatan yang lebih cepat, dan akses pertama ke fitur baru seperti tindakan anti-penyensoran yang kuat dan kontrol data."
  it: "Sbloccherai velocità ancora più elevate e avrai accesso prioritario a nuove funzionalità come robuste misure anti-censura e controllo dei dati."
  ja: "さらに高速な通信速度と、強力な検閲対策やデータ制御などの新機能への優先アクセスが解除されます。"
  ko: "더 빠른 속도를 얻고, 강력한 검열 방지 조치와 데이터 제어와 같은 새로운 기능을 가장 먼저 이용하실 수 있습니다."
  nl: "Jij ontgrendelt nog snellere snelheden en krijgt als eerste toegang tot nieuwe functies zoals robuuste anti-censuurmaatregelen en datacontrole."
  pl: "Odblokujesz jeszcze szybsze prędkości i pierwszy dostęp do nowych funkcji, takich jak skuteczne środki przeciw cenzurze i kontrola danych."
  pt: "Irá desbloquear velocidades ainda mais rápidas e acesso prioritário a novos recursos, como medidas robustas contra censura e controlo de dados."
  pt-BR: "Você desbloqueará velocidades ainda mais rápidas e acesso prioritário a novos recursos, como medidas robustas contra censura e controle de dados."
  pt-PT: "Irá desbloquear velocidades ainda mais rápidas e acesso prioritário a novos recursos, como medidas robustas contra censura e controlo de dados."
  ru: "Вы получите доступ к еще более высоким скоростям и первыми сможете опробовать новые функции, такие как надежные меры против цензуры и контроль данных."
  sv: "Du låser upp ännu snabbare hastigheter och får först tillgång till nya funktioner som robusta åtgärder mot censur och datakontroll."
  sw: "Utafungua kasi za juu zaidi, na kuwa wa kwanza kupata vipengele vipya kama vile hatua imara dhidi ya ukaguzi wa mtandao na udhibiti wa data."
  th: "คุณจะได้รับความเร็วที่เร็วขึ้น และสิทธิ์แรกในการใช้ฟีเจอร์ใหม่ เช่น มาตรการต่อต้านการเซ็นเซอร์ที่แข็งแกร่งและการควบคุมข้อมูล"
  uk: "Ви отримаєте ще вищу швидкість та перший доступ до нових функцій, таких як надійні заходи проти цензури та контроль даних."
  vi: "Bạn sẽ mở khóa tốc độ nhanh hơn và được ưu tiên trải nghiệm các tính năng mới như biện pháp chống kiểm duyệt mạnh mẽ và kiểm soát dữ liệu."
  zh: "您将解锁更快的速度，并优先体验新功能，如强大的反审查措施和数据控制。"
  zh-HK: "您將解鎖更快的速度，並優先體驗新功能，如強大的反審查措施和數據控制。"
