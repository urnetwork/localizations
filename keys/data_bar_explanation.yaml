description: "Call to action"
source: "This bar in the app shows you how much free data you are earning from your provider. You can check in any time and adjust your settings to maximize your earnings."
platforms:
  - android
localizations:
  ar: "يوضح لك هذا الشريط في التطبيق مقدار البيانات المجانية التي تكسبها من مزود الخدمة الخاص بك. يمكنك التحقق في أي وقت وضبط إعداداتك لزيادة أرباحك إلى الحد الأقصى."
  cs: "Tento pruh v aplikaci ukazuje, kolik bezplatných dat získáváte od svého poskytovatele. Můžete se kdykoli podívat a upravit nastavení, abyste maximalizovali své výdělky."
  de: "Dieser Balken in der App zeigt dir, wie viel kostenlose Daten du von deinem Anbieter erhältst. Du kannst jederzeit nachsehen und deine Einstellungen anpassen, um deine Einnahmen zu maximieren."
  el: "Αυτή η γραμμή στην εφαρμογή σας δείχνει πόσα δωρεάν δεδομένα κερδίζετε από τον πάροχό σας. Μπορείτε να ελέγχετε οποιαδήποτε στιγμή και να προσαρμόζετε τις ρυθμίσεις σας για να μεγιστοποιήσετε τα κέρδη σας."
  en: "This bar in the app shows you how much free data you are earning from your provider. You can check in any time and adjust your settings to maximize your earnings."
  es: "Esta barra en la app te muestra cuántos datos gratis estás ganando de tu proveedor. Puedes revisar en cualquier momento y ajustar tus configuraciones para maximizar tus ganancias."
  es-419: "Esta barra en la app te muestra cuántos datos gratis estás ganando de tu proveedor. Puedes revisar en cualquier momento y ajustar tus configuraciones para maximizar tus ganancias."
  es-MX: "Esta barra en la app te muestra cuántos datos gratis estás ganando de tu proveedor. Puedes revisar en cualquier momento y ajustar tus configuraciones para maximizar tus ganancias."
  fr: "Cette barre dans l’application vous montre combien de données gratuites vous gagnez auprès de votre fournisseur. Vous pouvez vérifier à tout moment et ajuster vos paramètres pour maximiser vos gains."
  he: "הפס הזה באפליקציה מראה לך כמה נתונים חינמיים אתה מרוויח מהספק שלך. אתה יכול לבדוק בכל עת ולכוון את ההגדרות כדי למקסם את הרווחים שלך."
  hi: "ऐप में यह बार आपको दिखाता है कि आप अपने प्रदाता से कितने मुफ्त डेटा कमा रहे हैं। आप कभी भी जांच सकते हैं और अपनी सेटिंग्स समायोजित कर सकते हैं ताकि अपनी कमाई अधिकतम कर सकें।"
  id: "Bilah ini di aplikasi menunjukkan berapa banyak data gratis yang Anda peroleh dari penyedia Anda. Anda dapat memeriksanya kapan saja dan menyesuaikan pengaturan untuk memaksimalkan penghasilan Anda."
  it: "Questa barra nell'app ti mostra quanti dati gratuiti stai guadagnando dal tuo provider. Puoi controllare in qualsiasi momento e regolare le impostazioni per massimizzare i tuoi guadagni."
  ja: "アプリ内のこのバーは、プロバイダーからどれだけ無料データを獲得しているかを表示します。いつでも確認でき、設定を調整して獲得量を最大化できます"
  ko: "앱의 이 막대는 제공자로부터 얼마나 많은 무료 데이터를 얻고 있는지 보여줍니다. 언제든지 확인하고 설정을 조정하여 수익을 극대화할 수 있습니다."
  nl: "Deze balk in de app laat zien hoeveel gratis data je van je provider verdient. Je kunt op elk moment kijken en je instellingen aanpassen om je verdiensten te maximaliseren."
  pl: "Ten pasek w aplikacji pokazuje, ile darmowych danych otrzymujesz od swojego dostawcy. Możesz sprawdzać to w dowolnym momencie i dostosować ustawienia, aby zmaksymalizować swoje zarobki."
  pt: "Esta barra na aplicação mostra-lhe quanta informação gratuita está a ganhar do seu fornecedor. Pode verificar a qualquer momento e ajustar as suas definições para maximizar os seus ganhos."
  pt-BR: "Esta barra no aplicativo mostra quanto dado gratuito você está ganhando do seu provedor. Você pode verificar a qualquer momento e ajustar suas configurações para maximizar seus ganhos."
  pt-PT: "Esta barra na aplicação mostra-lhe quanta informação gratuita está a ganhar do seu fornecedor. Pode verificar a qualquer momento e ajustar as suas definições para maximizar os seus ganhos."
  ru: "Эта шкала в приложении показывает, сколько бесплатных данных вы получаете от своего провайдера. Вы можете проверить это в любое время и настроить параметры для максимизации заработка."
  sv: "Den här stapeln i appen visar hur mycket gratis data du tjänar från din leverantör. Du kan kolla in när som helst och justera dina inställningar för att maximera dina intäkter."
  sw: "Upau huu kwenye programu unaonyesha ni kiasi gani cha data ya bure unachopata kutoka kwa mtoa huduma wako. Unaweza kukagua wakati wowote na kurekebisha mipangilio yako ili kuongeza mapato yako."
  th: "แถบนี้ในแอปจะแสดงให้คุณเห็นว่าคุณได้รับข้อมูลฟรีจากผู้ให้บริการมากแค่ไหน คุณสามารถตรวจสอบได้ทุกเมื่อและปรับการตั้งค่าเพื่อเพิ่มรายได้สูงสุด"
  uk: "Ця смуга в застосунку показує, скільки безкоштовних даних ви заробляєте від свого провайдера. Ви можете будь-коли перевірити її та налаштувати параметри, щоб максимізувати свій заробіток."
  vi: "Thanh này trong ứng dụng cho bạn biết bạn đang kiếm được bao nhiêu dữ liệu miễn phí từ nhà cung cấp của mình. Bạn có thể kiểm tra bất cứ lúc nào và điều chỉnh cài đặt để tối đa hóa thu nhập."
  zh: "应用中的此条形图显示您从提供者获得了多少免费数据。您可以随时查看并调整设置以最大化收益。"
  zh-HK: "應用程式中的這條狀態列顯示您從供應商賺取了多少免費數據。您可以隨時查看，並調整設定以最大化您的收益。"
