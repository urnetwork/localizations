description: "ur.io Connect screen, out-of-balance notice for a Pro account whose plan data is used up (title: Data limit reached). Pro's data is granted at 00:00 UTC on the 1st of each month; a data pack (sold on ur.io, the Buy data button beside this line) adds data at once. Keep Pro and UTC as is."
source: "Your Pro data for this month is used up. It renews on the 1st of next month (UTC), and a data pack adds more now."
platforms:
  - site
localizations:
  ar: "نفدت بيانات Pro لهذا الشهر. تتجدد في اليوم الأول من الشهر القادم (UTC)، ويمكنك إضافة المزيد الآن بحزمة بيانات."
  cs: "Data Pro na tento měsíc jsou vyčerpaná. Obnoví se 1. dne příštího měsíce (UTC) a datový balíček přidá další hned teď."
  de: "Deine Pro-Daten für diesen Monat sind aufgebraucht. Sie werden am 1. des nächsten Monats (UTC) erneuert, und ein Datenpaket fügt jetzt mehr hinzu."
  el: "Τα δεδομένα Pro αυτού του μήνα εξαντλήθηκαν. Ανανεώνονται την 1η του επόμενου μήνα (UTC), και ένα πακέτο δεδομένων προσθέτει περισσότερα τώρα."
  en: "Your Pro data for this month is used up. It renews on the 1st of next month (UTC), and a data pack adds more now."
  es: "Se acabaron tus datos de Pro de este mes. Se renuevan el día 1 del mes que viene (UTC), y un paquete de datos añade más ahora."
  es-419: "Se acabaron tus datos de Pro de este mes. Se renuevan el día 1 del mes que viene (UTC), y un paquete de datos añade más ahora."
  es-MX: "Se acabaron tus datos de Pro de este mes. Se renuevan el día 1 del mes que viene (UTC), y un paquete de datos añade más ahora."
  fr: "Vos données Pro de ce mois sont épuisées. Elles se renouvellent le 1er du mois prochain (UTC), et un pack de données en ajoute dès maintenant."
  he: "נתוני ה-Pro שלך לחודש הזה נגמרו. הם יתחדשו ב-1 בחודש הבא (UTC), וחבילת נתונים מוסיפה עוד כבר עכשיו."
  hi: "इस महीने का आपका Pro डेटा खत्म हो गया है। यह अगले महीने की 1 तारीख (UTC) को रीफ़्रेश होगा, और डेटा पैक अभी और डेटा जोड़ता है।"
  id: "Data Pro Anda untuk bulan ini sudah habis. Data diperbarui pada tanggal 1 bulan depan (UTC), dan paket data menambahkan lebih banyak sekarang."
  it: "I tuoi dati Pro di questo mese sono esauriti. Si rinnovano il 1° del mese prossimo (UTC), e un pacchetto dati ne aggiunge altri subito."
  ja: "今月の Pro データを使い切りました。翌月 1 日 (UTC) に更新されます。データパックで今すぐ追加できます。"
  ko: "이번 달 Pro 데이터를 모두 사용했습니다. 다음 달 1일(UTC)에 갱신되며, 데이터 팩으로 지금 더 추가할 수 있습니다."
  nl: "Je Pro-data voor deze maand is op. Die wordt vernieuwd op de 1e van volgende maand (UTC), en een databundel voegt er nu meer aan toe."
  pl: "Dane Pro na ten miesiąc się skończyły. Odnowią się 1. dnia przyszłego miesiąca (UTC), a pakiet danych doda więcej od razu."
  pt: "Seus dados do Pro deste mês acabaram. Eles são renovados no dia 1º do próximo mês (UTC), e um pacote de dados adiciona mais agora."
  pt-BR: "Seus dados do Pro deste mês acabaram. Eles são renovados no dia 1º do próximo mês (UTC), e um pacote de dados adiciona mais agora."
  pt-PT: "Os seus dados Pro deste mês esgotaram-se. São renovados no dia 1 do próximo mês (UTC), e um pacote de dados adiciona mais já."
  ru: "Данные Pro на этот месяц закончились. Они обновятся 1-го числа следующего месяца (UTC), а пакет данных добавит больше прямо сейчас."
  sv: "Din Pro-data för den här månaden är slut. Den förnyas den 1:a nästa månad (UTC), och ett datapaket lägger till mer nu."
  sw: "Data yako ya Pro ya mwezi huu imekwisha. Itasasishwa tarehe 1 ya mwezi ujao (UTC), na kifurushi cha data kinaongeza zaidi sasa."
  th: "ข้อมูล Pro ของเดือนนี้หมดแล้ว จะรีเฟรชในวันที่ 1 ของเดือนหน้า (UTC) และแพ็กข้อมูลช่วยเพิ่มได้ทันที"
  uk: "Дані Pro на цей місяць закінчилися. Вони оновляться 1-го числа наступного місяця (UTC), а пакет даних додасть більше вже зараз."
  vi: "Dữ liệu Pro của bạn trong tháng này đã hết. Dữ liệu sẽ được làm mới vào ngày 1 tháng sau (UTC), và gói dữ liệu giúp thêm ngay bây giờ."
  zh: "您本月的 Pro 数据已用完。将于下月 1 日（UTC）更新，购买数据包可立即增加。"
  zh-HK: "您本月的 Pro 數據已用完。將於下月 1 日（UTC）更新，購買數據包可立即增加。"
