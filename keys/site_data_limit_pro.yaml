description: "ur.io Connect screen and the browser extension popup: out-of-balance notice for a Pro account whose plan data is used up (title: Data limit reached). Pro's 10 TiB is granted at the start of each of the network's own subscription cycles, not on a fixed day of the month. Every account, Pro included, also gets the free daily data at 00:00 UTC, which a Pro account uses once its plan data is used up. A data pack (sold on ur.io, the Buy data button beside this line) adds data at once. Keep Pro and 00:00 UTC as is."
source: "Your Pro data for this cycle is used up. You still get your free daily data each day at 00:00 UTC, your Pro data renews at the start of your next subscription cycle, and a data pack adds more now."
platforms:
  - site
  - web
localizations:
  ar: "نفدت بيانات Pro لهذه الدورة. لا تزال تحصل على بياناتك المجانية اليومية كل يوم عند الساعة 00:00 UTC، وتتجدد بيانات Pro في بداية دورة اشتراكك التالية، ويمكنك إضافة المزيد الآن بحزمة بيانات."
  cs: "Data Pro na tento cyklus jsou vyčerpaná. Denní data zdarma dostáváte dál každý den v 00:00 UTC, data Pro se obnoví na začátku vašeho dalšího cyklu předplatného a datový balíček přidá další hned teď."
  de: "Deine Pro-Daten für diesen Zyklus sind aufgebraucht. Deine kostenlosen Tagesdaten bekommst du weiterhin jeden Tag um 00:00 UTC, deine Pro-Daten werden zu Beginn deines nächsten Abozyklus erneuert, und ein Datenpaket fügt jetzt mehr hinzu."
  el: "Τα δεδομένα Pro αυτού του κύκλου εξαντλήθηκαν. Εξακολουθείτε να λαμβάνετε τα δωρεάν ημερήσια δεδομένα σας κάθε μέρα στις 00:00 UTC, τα δεδομένα Pro ανανεώνονται στην αρχή του επόμενου κύκλου συνδρομής σας, και ένα πακέτο δεδομένων προσθέτει περισσότερα τώρα."
  en: "Your Pro data for this cycle is used up. You still get your free daily data each day at 00:00 UTC, your Pro data renews at the start of your next subscription cycle, and a data pack adds more now."
  es: "Se acabaron tus datos de Pro de este ciclo. Sigues recibiendo tus datos diarios gratis cada día a las 00:00 UTC, tus datos de Pro se renuevan al inicio de tu próximo ciclo de suscripción, y un paquete de datos añade más ahora."
  es-419: "Se acabaron tus datos de Pro de este ciclo. Sigues recibiendo tus datos diarios gratis cada día a las 00:00 UTC, tus datos de Pro se renuevan al inicio de tu próximo ciclo de suscripción, y un paquete de datos añade más ahora."
  es-MX: "Se acabaron tus datos de Pro de este ciclo. Sigues recibiendo tus datos diarios gratis cada día a las 00:00 UTC, tus datos de Pro se renuevan al inicio de tu próximo ciclo de suscripción, y un paquete de datos añade más ahora."
  fr: "Vos données Pro de ce cycle sont épuisées. Vous recevez toujours vos données gratuites quotidiennes chaque jour à 00:00 UTC, vos données Pro se renouvellent au début de votre prochain cycle d’abonnement, et un pack de données en ajoute dès maintenant."
  he: "נתוני ה-Pro שלך למחזור הזה נגמרו. הנתונים היומיים החינמיים ממשיכים להגיע בכל יום ב-00:00 UTC, נתוני ה-Pro מתחדשים בתחילת מחזור המינוי הבא שלך, וחבילת נתונים מוסיפה עוד כבר עכשיו."
  hi: "इस चक्र का आपका Pro डेटा खत्म हो गया है। आपको अपना मुफ़्त दैनिक डेटा हर दिन 00:00 UTC पर मिलता रहेगा, आपका Pro डेटा आपके अगले सदस्यता चक्र की शुरुआत में रीफ़्रेश होगा, और डेटा पैक अभी और डेटा जोड़ता है।"
  id: "Data Pro Anda untuk siklus ini sudah habis. Anda tetap mendapatkan data harian gratis setiap hari pukul 00:00 UTC, data Pro Anda diperbarui di awal siklus langganan berikutnya, dan paket data menambahkan lebih banyak sekarang."
  it: "I tuoi dati Pro di questo ciclo sono esauriti. Continui a ricevere i tuoi dati giornalieri gratuiti ogni giorno alle 00:00 UTC, i tuoi dati Pro si rinnovano all’inizio del tuo prossimo ciclo di abbonamento, e un pacchetto dati ne aggiunge altri subito."
  ja: "今回のサイクルの Pro データを使い切りました。毎日の無料データは引き続き 00:00 UTC に付与され、Pro データは次のサブスクリプションサイクルの開始時に更新されます。データパックで今すぐ追加できます。"
  ko: "이번 주기의 Pro 데이터를 모두 사용했습니다. 무료 일일 데이터는 계속 매일 00:00 UTC에 제공되고, Pro 데이터는 다음 구독 주기가 시작될 때 갱신되며, 데이터 팩으로 지금 더 추가할 수 있습니다."
  nl: "Je Pro-data voor deze cyclus is op. Je krijgt nog steeds elke dag om 00:00 UTC je gratis dagelijkse data, je Pro-data wordt vernieuwd aan het begin van je volgende abonnementscyclus, en een databundel voegt er nu meer aan toe."
  pl: "Dane Pro na ten cykl się skończyły. Nadal codziennie o 00:00 UTC dostajesz darmowe dane dzienne, dane Pro odnowią się na początku następnego cyklu subskrypcji, a pakiet danych doda więcej od razu."
  pt: "Seus dados do Pro deste ciclo acabaram. Você continua recebendo seus dados diários grátis todos os dias às 00:00 UTC, seus dados do Pro são renovados no início do seu próximo ciclo de assinatura, e um pacote de dados adiciona mais agora."
  pt-BR: "Seus dados do Pro deste ciclo acabaram. Você continua recebendo seus dados diários grátis todos os dias às 00:00 UTC, seus dados do Pro são renovados no início do seu próximo ciclo de assinatura, e um pacote de dados adiciona mais agora."
  pt-PT: "Os seus dados Pro deste ciclo esgotaram-se. Continua a receber os seus dados diários gratuitos todos os dias às 00:00 UTC, os seus dados Pro são renovados no início do seu próximo ciclo de subscrição, e um pacote de dados adiciona mais já."
  ru: "Данные Pro на этот цикл закончились. Бесплатные ежедневные данные по-прежнему начисляются каждый день в 00:00 UTC, данные Pro обновятся в начале вашего следующего цикла подписки, а пакет данных добавит больше прямо сейчас."
  sv: "Din Pro-data för den här cykeln är slut. Du får fortfarande din dagliga gratisdata varje dag kl. 00:00 UTC, din Pro-data förnyas i början av din nästa prenumerationscykel, och ett datapaket lägger till mer nu."
  sw: "Data yako ya Pro ya mzunguko huu imekwisha. Bado unapata data yako ya bure ya kila siku saa 00:00 UTC, data yako ya Pro itasasishwa mwanzoni mwa mzunguko wako ujao wa usajili, na kifurushi cha data kinaongeza zaidi sasa."
  th: "ข้อมูล Pro ของรอบนี้หมดแล้ว คุณยังได้รับข้อมูลฟรีรายวันทุกวันเวลา 00:00 UTC ข้อมูล Pro จะรีเฟรชเมื่อเริ่มรอบการสมัครสมาชิกถัดไป และแพ็กข้อมูลช่วยเพิ่มได้ทันที"
  uk: "Дані Pro на цей цикл закінчилися. Безкоштовні щоденні дані й надалі нараховуються щодня о 00:00 UTC, дані Pro оновляться на початку вашого наступного циклу підписки, а пакет даних додасть більше вже зараз."
  vi: "Dữ liệu Pro của bạn trong chu kỳ này đã hết. Bạn vẫn nhận dữ liệu miễn phí hằng ngày lúc 00:00 UTC, dữ liệu Pro sẽ được làm mới khi chu kỳ đăng ký tiếp theo của bạn bắt đầu, và gói dữ liệu giúp thêm ngay bây giờ."
  zh: "您本周期的 Pro 数据已用完。您每天 00:00 UTC 仍会获得免费的每日数据，Pro 数据将在您下一个订阅周期开始时更新，购买数据包可立即增加。"
  zh-HK: "您本週期的 Pro 數據已用完。您每天 00:00 UTC 仍會獲得免費的每日數據，Pro 數據將在您下一個訂閱週期開始時更新，購買數據包可立即增加。"
