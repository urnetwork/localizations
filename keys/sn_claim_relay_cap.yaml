description: "Earnings, the settlement v2 tile and the claim sheet: URnetwork's daily budget for paying claim gas is spent, so the claim waits. The budget renews every day at 00:00 UTC, and a waiting claim goes out once a day's budget reaches it, which can be later than the next day. Say nothing that promises a day, and keep 00:00 and UTC."
source: "Today's claim budget is used up, so this waits. The budget renews each day at 00:00 UTC. Nothing is lost: this credit never expires."
platforms:
  - linux
  - apple
  - android
  - windows
  - site
localizations:
  ar: "نفدت ميزانية المطالبات لهذا اليوم، لذا ينتظر هذا. تتجدد الميزانية كل يوم عند الساعة 00:00 بتوقيت UTC. لا يضيع شيء: هذا الرصيد لا تنتهي صلاحيته أبدًا."
  cs: "Dnešní rozpočet na vyzvedávání je vyčerpaný, takže to počká. Rozpočet se obnovuje každý den v 00:00 UTC. Nic se neztratí: tento kredit nikdy nevyprší."
  de: "Das heutige Einlösebudget ist aufgebraucht, daher wartet das. Das Budget erneuert sich jeden Tag um 00:00 UTC. Nichts geht verloren: Dieses Guthaben verfällt nie."
  el: "Ο σημερινός προϋπολογισμός διεκδικήσεων εξαντλήθηκε, οπότε αυτό περιμένει. Ο προϋπολογισμός ανανεώνεται κάθε μέρα στις 00:00 UTC. Δεν χάνεται τίποτα: αυτή η πίστωση δεν λήγει ποτέ."
  en: "Today's claim budget is used up, so this waits. The budget renews each day at 00:00 UTC. Nothing is lost: this credit never expires."
  es: "El presupuesto de reclamaciones de hoy se ha agotado, así que esto espera. El presupuesto se renueva cada día a las 00:00 UTC. No se pierde nada: este saldo nunca caduca."
  es-419: "El presupuesto de reclamaciones de hoy se agotó, así que esto espera. El presupuesto se renueva cada día a las 00:00 UTC. No se pierde nada: este saldo nunca vence."
  es-MX: "El presupuesto de reclamaciones de hoy se agotó, así que esto espera. El presupuesto se renueva cada día a las 00:00 UTC. No se pierde nada: este saldo nunca vence."
  fr: "Le budget de réclamations du jour est épuisé, donc cela attend. Le budget se renouvelle chaque jour à 00:00 UTC. Rien n’est perdu : ce crédit n’expire jamais."
  he: "תקציב המימושים של היום נוצל במלואו, ולכן זה ממתין. התקציב מתחדש בכל יום בשעה 00:00 UTC. שום דבר לא הולך לאיבוד: תוקף הזיכוי הזה לעולם לא פג."
  hi: "दावों के लिए आज का बजट खत्म हो गया है, इसलिए यह प्रतीक्षा करेगा। बजट हर दिन 00:00 UTC पर नया होता है। कुछ भी खोया नहीं जाता: यह क्रेडिट कभी समाप्त नहीं होता।"
  id: "Anggaran klaim hari ini sudah habis, jadi ini menunggu. Anggaran diperbarui setiap hari pukul 00:00 UTC. Tidak ada yang hilang: saldo ini tidak pernah kedaluwarsa."
  it: "Il budget per i riscatti di oggi è esaurito, quindi questo attende. Il budget si rinnova ogni giorno alle 00:00 UTC. Non si perde nulla: questo credito non scade mai."
  ja: "本日の受け取り予算が尽きたため、待機します。予算は毎日 00:00 UTC に更新されます。失われるものはありません。この残高に有効期限はありません。"
  ko: "오늘의 받기 예산이 소진되어 기다립니다. 예산은 매일 00:00 UTC에 새로 채워집니다. 잃는 것은 없습니다. 이 잔액은 절대 만료되지 않습니다."
  nl: "Het claimbudget van vandaag is op, dus dit wacht. Het budget wordt elke dag om 00:00 UTC vernieuwd. Er gaat niets verloren: dit tegoed verloopt nooit."
  pl: "Dzisiejszy budżet na odbiory się wyczerpał, więc to poczeka. Budżet odnawia się codziennie o 00:00 UTC. Nic nie przepada: te środki nigdy nie wygasają."
  pt: "O orçamento de reivindicações de hoje esgotou-se, por isso isto fica à espera. O orçamento renova-se todos os dias às 00:00 UTC. Nada se perde: este saldo nunca expira."
  pt-BR: "O orçamento de resgates de hoje se esgotou, então isso aguarda. O orçamento se renova todos os dias às 00:00 UTC. Nada se perde: este saldo nunca expira."
  pt-PT: "O orçamento de reivindicações de hoje esgotou-se, por isso isto fica à espera. O orçamento renova-se todos os dias às 00:00 UTC. Nada se perde: este saldo nunca expira."
  ru: "Бюджет на получение на сегодня исчерпан, поэтому это подождёт. Бюджет обновляется каждый день в 00:00 UTC. Ничего не теряется: у этого начисления нет срока действия."
  sv: "Dagens uttagsbudget är förbrukad, så det här väntar. Budgeten förnyas varje dag kl. 00:00 UTC. Inget går förlorat: det här tillgodohavandet löper aldrig ut."
  sw: "Bajeti ya madai ya leo imekwisha, kwa hivyo hili linasubiri. Bajeti hujazwa upya kila siku saa 00:00 UTC. Hakuna kinachopotea: salio hili halitaisha muda kamwe."
  th: "งบประมาณสำหรับการรับของวันนี้หมดแล้ว รายการนี้จึงต้องรอ งบประมาณจะเริ่มใหม่ทุกวันเวลา 00:00 UTC ไม่มีอะไรสูญหาย ยอดนี้ไม่มีวันหมดอายุ"
  uk: "Бюджет на отримання на сьогодні вичерпано, тож це зачекає. Бюджет оновлюється щодня о 00:00 UTC. Нічого не втрачається: це нарахування не має строку дії."
  vi: "Ngân sách cho việc nhận hôm nay đã hết, nên khoản này phải chờ. Ngân sách được làm mới mỗi ngày lúc 00:00 UTC. Không mất gì cả: khoản này không bao giờ hết hạn."
  zh: "今日的领取预算已用完，因此需要等待。预算每天在 UTC 时间 00:00 重置。不会有任何损失：这笔余额永不过期。"
  zh-HK: "今日的領取預算已用完，因此需要等待。預算每日在 UTC 時間 00:00 重置。不會有任何損失：這筆餘額永不過期。"
