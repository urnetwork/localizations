description: "Re-engagement email R3 (keep or go): opening. It no longer says \"before I send anything else\": not answering R3 changes nothing, since there is no sunset after it (owner, 2026-11-15)."
source: "I'd rather not fill your inbox with emails you don't need, so I'm checking with you."
platforms:
  - email
localizations:
  en: "I'd rather not fill your inbox with emails you don't need, so I'm checking with you."
  ar: "أفضّل ألا أملأ صندوق بريدك برسائل لا تحتاج إليها، لذا أسألك."
  cs: "Nerad bych vám zaplňoval schránku e-maily, které nepotřebujete, takže se vás ptám."
  de: "Ich möchte dein Postfach lieber nicht mit E-Mails füllen, die du nicht brauchst, deshalb frage ich dich."
  el: "Προτιμώ να μη γεμίζω τα εισερχόμενά σου με email που δεν χρειάζεσαι, οπότε σε ρωτάω."
  es: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que te lo pregunto."
  es-419: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que te lo pregunto."
  es-MX: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que te lo pregunto."
  fr: "Je préfère ne pas remplir ta boîte de réception d'e-mails dont tu n'as pas besoin, alors je te pose la question."
  he: "אני מעדיף לא למלא לכם את תיבת הדואר במיילים שאתם לא צריכים, אז אני בודק איתכם."
  hi: "मैं आपका इनबॉक्स ऐसे ईमेल से नहीं भरना चाहता जिनकी आपको ज़रूरत नहीं है, इसलिए मैं आपसे पूछ रहा हूँ।"
  id: "Saya tidak ingin memenuhi kotak masukmu dengan email yang tidak kamu perlukan, jadi saya bertanya kepadamu."
  it: "Preferisco non riempirti la casella di posta con email che non ti servono, quindi te lo chiedo."
  ja: "必要のないメールで受信箱をいっぱいにしたくないので、確認させてください。"
  ko: "필요 없는 메일로 받은편지함을 채우고 싶지 않아서 여쭤봅니다."
  nl: "Ik vul je inbox liever niet met e-mails die je niet nodig hebt, dus ik vraag het even aan jou."
  pl: "Wolałbym nie zapychać ci skrzynki e-mailami, których nie potrzebujesz, więc pytam cię o zdanie."
  pt: "Prefiro não encher sua caixa de entrada com e-mails de que você não precisa, então quero confirmar com você."
  pt-BR: "Prefiro não encher sua caixa de entrada com e-mails de que você não precisa, então quero confirmar com você."
  pt-PT: "Prefiro não encher a sua caixa de entrada com e-mails de que não precisa, por isso quero confirmar consigo."
  ru: "Мне не хотелось бы забивать ваш ящик письмами, которые вам не нужны, поэтому я спрашиваю вас."
  sv: "Jag vill helst inte fylla din inkorg med mejl du inte behöver, så jag frågar dig."
  sw: "Ningependa nisijaze kikasha chako barua pepe usizohitaji, kwa hivyo ninakuuliza."
  th: "ผมไม่อยากให้กล่องจดหมายของคุณเต็มไปด้วยอีเมลที่คุณไม่ต้องการ ผมจึงขอถามคุณ"
  uk: "Мені не хотілося б засмічувати вашу скриньку листами, які вам не потрібні, тому я питаю вас."
  vi: "Tôi không muốn làm đầy hộp thư của bạn bằng những email bạn không cần, nên tôi muốn hỏi ý bạn."
  zh: "我不想用你不需要的邮件塞满你的收件箱，所以想问问你。"
  zh-HK: "我不想用你不需要的郵件塞滿你的收件匣，所以想問問你。"
