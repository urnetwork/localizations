description: "Campaign emails that offer Pro (onboarding E4b, win-back W1): what Pro adds over the free plan. Pro keeps the free plan's daily data, so its 10 TiB a month comes on top of {daily_data_gb} a day: \"plus\", not \"instead of\". {daily_data_gb} is preformatted, e.g. \"30 GiB\". TiB is the unit used in the app; keep the numbers. Data only: the free plan's device limit is not enforced (config/all/pro.yml), so a device count is no benefit to claim."
source: "Pro gives you 10 TiB of data a month, plus {daily_data_gb} a day."
platforms:
  - email
placeholders:
  - name: daily_data_gb
    type: string
