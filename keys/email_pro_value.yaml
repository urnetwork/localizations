description: "Campaign emails that offer Pro (onboarding E3a, E4b and E5b; win-back W1): what Pro adds over the free plan. Pro keeps the free plan's daily data, so its 10 TiB a month comes on top of {daily_data_gb} a day: \"plus\", not \"instead of\". {daily_data_gb} is preformatted, e.g. \"30 GiB\". TiB is the unit used in the app; keep the numbers. Hosted proxies: Pro's cap is 1,000 active hosted proxies against 1 on the free plan, enforced on every create since 2026-11-05 (server model/network_client_proxy_limit.go; owner, 2026-11-15; the free cap went from 5 to 1 on 2026-11-24); write the numbers as the language groups digits, and the free plan's 1 as the language's word for one where that word agrees with the noun. The device limit (pro.yml concurrent_clients) is not enforced, so a device count is no benefit to claim."
source: "Pro gives you 10 TiB of data a month, plus {daily_data_gb} a day, and up to 1,000 hosted proxies instead of 1 on the free plan."
platforms:
  - email
