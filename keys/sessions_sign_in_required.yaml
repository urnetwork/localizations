description: "Sessions screen (Account > Sessions): the screen's state when the account's sign-in was rejected and the user must sign in again. Generic: it names no cause. sessions_signed_out_remotely is the line for when the app knows another device signed this session out."
source: "Sign in again to manage sessions."
platforms:
  - apple
  - android
  - windows
  - linux
  - site
