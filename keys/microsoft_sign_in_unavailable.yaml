  th: "การเข้าสู่ระบบด้วย Microsoft ยังไม่พร้อมใช้งาน โปรดลองวิธีอื่น"
  uk: "Вхід через Microsoft поки недоступний. Спробуйте інший спосіб входу."
  vi: "Đăng nhập bằng Microsoft chưa khả dụng. Hãy thử cách đăng nhập khác."
