description: "Sign-in screen and the add sign-in method sheet: the server has no Microsoft sign-in configured yet (not_configured)."
source: "Sign in with Microsoft isn't available yet. Try another way to sign in."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
