  en: "Sign in with Microsoft isn't available yet. Try another way to sign in."
  es: "Iniciar sesión con Microsoft aún no está disponible. Prueba otra forma de iniciar sesión."
  es-419: "Iniciar sesión con Microsoft aún no está disponible. Prueba otra forma de iniciar sesión."
  es-MX: "Iniciar sesión con Microsoft aún no está disponible. Prueba otra forma de iniciar sesión."
  fr: "La connexion avec Microsoft n'est pas encore disponible. Essayez un autre moyen de vous connecter."
