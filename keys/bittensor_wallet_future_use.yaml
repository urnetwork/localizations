localizations:
  ar: "يتم حفظ محافظ Bittensor للاستخدام المستقبلي ولا يمكنها استلام المدفوعات بعد."
  cs: "Peněženky Bittensor se ukládají pro budoucí použití a zatím nemohou přijímat výplaty."
  de: "Bittensor-Wallets werden für die spätere Nutzung gespeichert und können noch keine Auszahlungen empfangen."
  el: "Τα πορτοφόλια Bittensor αποθηκεύονται για μελλοντική χρήση και δεν μπορούν ακόμη να λάβουν πληρωμές."
  en: "Bittensor wallets are stored for future use and can't receive payouts yet."
  es: "Las billeteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  es-419: "Las billeteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  es-MX: "Las billeteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  fr: "Les portefeuilles Bittensor sont enregistrés pour un usage futur et ne peuvent pas encore recevoir de paiements."
  he: "ארנקי Bittensor נשמרים לשימוש עתידי ועדיין לא יכולים לקבל תשלומים."
  hi: "Bittensor वॉलेट भविष्य के उपयोग के लिए सहेजे जाते हैं और अभी भुगतान प्राप्त नहीं कर सकते।"
  id: "Dompet Bittensor disimpan untuk penggunaan mendatang dan belum bisa menerima pembayaran."
  it: "I portafogli Bittensor vengono salvati per un uso futuro e non possono ancora ricevere pagamenti."
  ja: "Bittensorウォレットは将来の利用のために保存されますが、まだ支払いは受け取れません。"
  ko: "Bittensor 지갑은 향후 사용을 위해 저장되며 아직 지급금을 받을 수 없습니다."
  nl: "Bittensor-wallets worden bewaard voor toekomstig gebruik en kunnen nog geen uitbetalingen ontvangen."
  pl: "Portfele Bittensor są zapisywane na przyszłość i nie mogą jeszcze otrzymywać wypłat."
  pt: "As carteiras Bittensor são guardadas para uso futuro e ainda não podem receber pagamentos."
  pt-BR: "As carteiras Bittensor são armazenadas para uso futuro e ainda não podem receber pagamentos."
  pt-PT: "As carteiras Bittensor são guardadas para uso futuro e ainda não podem receber pagamentos."
  ru: "Кошельки Bittensor сохраняются для будущего использования и пока не могут получать выплаты."
  sv: "Bittensor-plånböcker sparas för framtida bruk och kan inte ta emot utbetalningar än."
  sw: "Pochi za Bittensor huhifadhiwa kwa matumizi ya baadaye na haziwezi kupokea malipo bado."
  th: "กระเป๋า Bittensor จะถูกบันทึกไว้ใช้ในอนาคต และยังรับยอดจ่ายไม่ได้"
  uk: "Гаманці Bittensor зберігаються для майбутнього використання і поки не можуть отримувати виплати."
  vi: "Ví Bittensor được lưu để dùng trong tương lai và chưa thể nhận thanh toán."
  zh: "Bittensor 钱包会保存以备将来使用，目前还不能接收支付。"
  zh-HK: "Bittensor 錢包會儲存以備日後使用，暫時未能接收支付。"
