description: "DNS settings: the name of DNS4EU's child protection preset in \"Family\", which blocks malware, adult sites, gambling, drugs and violence and doesn't block ads. Next to it is the same protection with ads blocked (dns_preset_name_child_ads). Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: DNS4EU Child\" and \"DNS4EU Child isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example DNS4EU); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ Child"
platforms:
  - android
  - apple
  - linux
  - windows
