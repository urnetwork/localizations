description: "Earnings, after the payout wallet was disconnected: the confirmation, saying plainly that earnings can't be paid out now."
source: "Wallet disconnected. Your earnings can't be paid out until you connect a payout wallet."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تم فصل المحفظة. لا يمكن صرف أرباحك حتى تربط محفظة دفع."
  cs: "Peněženka byla odpojena. Dokud nepřipojíte peněženku pro výplaty, výdělky vám nelze vyplatit."
  de: "Wallet getrennt. Deine Einnahmen können erst ausgezahlt werden, wenn du eine Auszahlungs-Wallet verbindest."
  el: "Το πορτοφόλι αποσυνδέθηκε. Τα κέρδη σας δεν μπορούν να πληρωθούν μέχρι να συνδέσετε πορτοφόλι πληρωμών."
  en: "Wallet disconnected. Your earnings can't be paid out until you connect a payout wallet."
  es: "Billetera desconectada. Tus ganancias no se pueden pagar hasta que conectes una billetera de pagos."
  es-419: "Billetera desconectada. Tus ganancias no se pueden pagar hasta que conectes una billetera de pagos."
  es-MX: "Cartera desconectada. Tus ganancias no se pueden pagar hasta que conectes una cartera de pagos."
  fr: "Portefeuille déconnecté. Vos gains ne peuvent pas être versés tant que vous n'avez pas connecté de portefeuille de paiement."
  he: "הארנק נותק. לא ניתן לשלם את הרווחים שלכם עד שתחברו ארנק תשלומים."
  hi: "वॉलेट डिस्कनेक्ट हो गया। जब तक आप भुगतान वॉलेट कनेक्ट नहीं करते, आपकी कमाई का भुगतान नहीं हो सकता।"
  id: "Dompet diputuskan. Penghasilan Anda tidak dapat dibayarkan sampai Anda menghubungkan dompet pembayaran."
  it: "Portafoglio scollegato. I tuoi guadagni non possono essere pagati finché non colleghi un portafoglio per i pagamenti."
  ja: "ウォレットの接続を解除しました。支払い用ウォレットを接続するまで、収益は支払われません。"
  ko: "지갑 연결이 해제되었습니다. 지급 지갑을 연결할 때까지 수익을 지급할 수 없습니다."
  nl: "Wallet ontkoppeld. Je inkomsten kunnen pas worden uitbetaald als je een uitbetalingswallet koppelt."
  pl: "Portfel odłączony. Twoje zarobki nie mogą zostać wypłacone, dopóki nie połączysz portfela do wypłat."
  pt: "Carteira desligada. Os seus ganhos não podem ser pagos até ligar uma carteira de pagamentos."
  pt-BR: "Carteira desconectada. Seus ganhos não podem ser pagos até você conectar uma carteira de pagamentos."
  pt-PT: "Carteira desligada. Os seus ganhos não podem ser pagos até ligar uma carteira de pagamentos."
  ru: "Кошелёк отключён. Ваш заработок не может быть выплачен, пока вы не подключите кошелёк для выплат."
  sv: "Plånboken har kopplats från. Dina intäkter kan inte betalas ut förrän du ansluter en utbetalningsplånbok."
  sw: "Pochi imetenganishwa. Mapato yako hayawezi kulipwa hadi uunganishe pochi ya malipo."
  th: "ยกเลิกการเชื่อมต่อวอลเล็ตแล้ว รายได้ของคุณจะจ่ายออกไม่ได้จนกว่าคุณจะเชื่อมต่อวอลเล็ตรับเงิน"
  uk: "Гаманець від'єднано. Ваш заробіток не може бути виплачено, доки ви не під'єднаєте гаманець для виплат."
  vi: "Đã ngắt kết nối ví. Thu nhập của bạn không thể được chi trả cho đến khi bạn kết nối ví nhận thanh toán."
  zh: "已断开钱包。在您连接收款钱包之前，您的收益无法支付。"
  zh-HK: "已中斷錢包連接。在您連接收款錢包之前，您的收益無法支付。"
