description: "Browser extension popup, out-of-balance alert, and the body of the browser notification for it: the account has no data left, and the extension keeps its proxy set whatever the kill switch says, so pages fail rather than load without URnetwork, until the free refresh, an upgrade or a data pack makes data available, or the user presses Disconnect. The ur.io counterpart is site_out_of_data_browser_held, without its kill switch clause."
source: "Pages won't load in this browser until data is available or you disconnect."
platforms:
  - web
