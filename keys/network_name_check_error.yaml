description: "Call to action"
source: "Not available. Must be at least 3 characters different than an existing network. Make it unique or longer."
platforms:
  - android
localizations:
  ar: "غير متوفر. يجب أن يكون 3 أحرف على الأقل مختلفة عن شبكة موجودة. اجعلها فريدة أو أطول."
  cs: "Není k dispozici. Musí se lišit alespoň o 3 znaky od existující sítě. Vytvořte ji jedinečnou nebo delší."
  de: "Nicht verfügbar. Muss mindestens 3 Zeichen von einem bestehenden Netzwerk abweichen. Mach es einzigartig oder länger."
  el: "Μη διαθέσιμο. Πρέπει να είναι τουλάχιστον 3 χαρακτήρες διαφορετικοί από ένα υπάρχον δίκτυο. Κάντε το μοναδικό ή μεγαλύτερο."
  en: "Not available. Must be at least 3 characters different than an existing network. Make it unique or longer."
  es: "No disponible. Debe tener al menos 3 caracteres diferentes de una red existente. Hazlo único o más largo."
  es-419: "No disponible. Debe tener al menos 3 caracteres diferentes de una red existente. Hazlo único o más largo."
  es-MX: "No disponible. Debe tener al menos 3 caracteres diferentes de una red existente. Hazlo único o más largo."
  fr: "Non disponible. Doit comporter au moins 3 caractères différents d'un réseau existant. Rendez-le unique ou plus long."
  he: "לא זמין. חייב להיות שונה בלפחות 3 תווים מרשת קיימת. הפוך אותו לייחודי או ארוך יותר."
  hi: "उपलब्ध नहीं है। किसी मौजूदा नेटवर्क से कम से कम 3 वर्ण अलग होने चाहिए। इसे अद्वितीय या लंबा बनाएं।"
  id: "Tidak tersedia. Harus berbeda setidaknya 3 karakter dari jaringan yang ada. Buat lebih unik atau lebih panjang."
  it: "Non disponibile. Deve differire di almeno 3 caratteri da una rete esistente. Rendilo unico o più lungo."
  ja: "利用できません。既存のネットワークとは少なくとも3文字異なる必要があります。ユニークにするか、長くしてください。"
  ko: "사용할 수 없습니다. 기존 네트워크와 최소 3자 이상 달라야 합니다. 고유하게 만들거나 더 길게 만드세요."
  nl: "Niet beschikbaar. Moet minstens 3 tekens verschillen van een bestaand netwerk. Maak het uniek of langer."
  pl: "Niedostępne. Musi różnić się od istniejącej sieci o co najmniej 3 znaki. Uczyń ją unikalną lub dłuższą."
  pt: "Não disponível. Deve ter pelo menos 3 caracteres diferentes de uma rede existente. Torne-o exclusivo ou mais longo."
  pt-BR: "Não disponível. Deve ter pelo menos 3 caracteres diferentes de uma rede existente. Torne-o exclusivo ou mais longo."
  pt-PT: "Não disponível. Deve ter pelo menos 3 caracteres diferentes de uma rede existente. Torne-o exclusivo ou mais longo."
  ru: "Недоступно. Имя должно отличаться от существующего как минимум на 3 символа. Сделайте его уникальнее или длиннее."
  sv: "Inte tillgängligt. Måste skilja sig med minst 3 tecken från ett befintligt nätverk. Gör det unikt eller längre."
  sw: "Haipatikani. Lazima iwe na angalau herufi 3 tofauti na mtandao uliopo. Ifanye iwe ya kipekee au ndefu zaidi."
  th: "ไม่สามารถใช้ได้ จะต้องมีตัวอักษรอย่างน้อย 3 ตัวที่แตกต่างจากชื่อเน็ตเวิร์กเดิม ลองตั้งใหม่ให้แตกต่างหรือยาวขึ้น"
  uk: "Недоступно. Має відрізнятися щонайменше на 3 символи від наявної мережі. Зробіть її унікальнішою або довшою."
  vi: "Không khả dụng. Phải khác ít nhất 3 ký tự so với mạng hiện có. Hãy đặt tên độc đáo hoặc dài hơn."
  zh: "不可用。必须与现有网络至少有 3 个字符不同。使其独特或更长。"
  zh-HK: "不可用。必須與現有網絡至少有 3 個字元不同。請使其更獨特或更長。"
