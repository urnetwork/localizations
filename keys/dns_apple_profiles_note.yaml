description: "iOS and macOS DNS settings: note that DNS configuration profiles installed on the device don't apply inside the VPN tunnel; the DNS chosen on this screen does."
source: "DNS profiles installed on this device don't apply while connected. The DNS chosen here is used instead."
platforms:
  - apple
localizations:
  ar: "لا تُطبَّق ملفات تعريف DNS المثبتة على هذا الجهاز أثناء الاتصال. يُستخدم DNS المختار هنا بدلًا منها."
  cs: "Profily DNS nainstalované v tomto zařízení se během připojení nepoužijí. Místo nich se použije DNS zvolené zde."
  de: "Auf diesem Gerät installierte DNS-Profile gelten nicht, solange die Verbindung besteht. Stattdessen wird das hier gewählte DNS verwendet."
  el: "Τα προφίλ DNS που είναι εγκατεστημένα σε αυτήν τη συσκευή δεν ισχύουν όσο είστε συνδεδεμένοι. Χρησιμοποιείται το DNS που επιλέγετε εδώ."
  en: "DNS profiles installed on this device don't apply while connected. The DNS chosen here is used instead."
  es: "Los perfiles DNS instalados en este dispositivo no se aplican mientras estás conectado. Se usa el DNS que elijas aquí."
  es-419: "Los perfiles DNS instalados en este dispositivo no se aplican mientras estás conectado. Se usa el DNS que elijas aquí."
  es-MX: "Los perfiles DNS instalados en este dispositivo no se aplican mientras estás conectado. Se usa el DNS que elijas aquí."
  fr: "Les profils DNS installés sur cet appareil ne s'appliquent pas pendant la connexion. C'est le DNS choisi ici qui est utilisé."
  he: "פרופילי DNS שמותקנים במכשיר הזה לא חלים בזמן החיבור. במקומם נעשה שימוש ב-DNS שנבחר כאן."
  hi: "कनेक्ट रहने के दौरान इस डिवाइस पर इंस्टॉल की गई DNS प्रोफ़ाइलें लागू नहीं होतीं। इसके बजाय यहाँ चुना गया DNS इस्तेमाल होता है।"
  id: "Profil DNS yang terpasang di perangkat ini tidak berlaku saat terhubung. DNS yang dipilih di sini yang digunakan."
  it: "I profili DNS installati su questo dispositivo non si applicano mentre sei connesso. Viene usato il DNS scelto qui."
  ja: "接続中は、このデバイスにインストールされたDNSプロファイルは適用されません。代わりにここで選んだDNSが使われます。"
  ko: "연결되어 있는 동안에는 이 기기에 설치된 DNS 프로필이 적용되지 않습니다. 대신 여기서 선택한 DNS가 사용됩니다."
  nl: "DNS-profielen die op dit apparaat zijn geïnstalleerd, gelden niet zolang je verbonden bent. De hier gekozen DNS wordt gebruikt."
  pl: "Profile DNS zainstalowane na tym urządzeniu nie działają podczas połączenia. Używany jest DNS wybrany tutaj."
  pt: "Os perfis DNS instalados neste dispositivo não se aplicam durante a ligação. É usado o DNS escolhido aqui."
  pt-BR: "Os perfis DNS instalados neste dispositivo não se aplicam enquanto você está conectado. É usado o DNS escolhido aqui."
  pt-PT: "Os perfis DNS instalados neste dispositivo não se aplicam durante a ligação. É usado o DNS escolhido aqui."
  ru: "Профили DNS, установленные на этом устройстве, не действуют во время подключения. Вместо них используется DNS, выбранный здесь."
  sv: "DNS-profiler som är installerade på den här enheten gäller inte medan du är ansluten. DNS som väljs här används i stället."
  sw: "Wasifu wa DNS uliosakinishwa kwenye kifaa hiki hautumiki ukiwa umeunganishwa. DNS iliyochaguliwa hapa ndiyo hutumika."
  th: "โปรไฟล์ DNS ที่ติดตั้งบนอุปกรณ์นี้จะไม่มีผลขณะเชื่อมต่อ ระบบจะใช้ DNS ที่เลือกไว้ที่นี่แทน"
  uk: "Профілі DNS, установлені на цьому пристрої, не діють під час підключення. Натомість використовується DNS, вибраний тут."
  vi: "Các hồ sơ DNS cài trên thiết bị này không áp dụng khi đang kết nối. DNS được chọn ở đây sẽ được dùng thay thế."
  zh: "连接期间，此设备上安装的 DNS 描述文件不会生效，而是使用此处选择的 DNS。"
  zh-HK: "連接期間，此裝置上安裝的 DNS 描述檔不會生效，而是使用此處選擇的 DNS。"
