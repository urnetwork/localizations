description: "Shown inline in the upgrade flow, and as the restore result, when the server refuses an App Store sandbox purchase (a TestFlight build) because the account is not one of its internal testers: the purchase report answers invalid with error code sandbox_purchase (sdk IsSandboxPurchaseRefusal). Test purchases are free, so they unlock nothing. Neutral on purpose: it must never name another way to pay (the App Store's anti-steering rule). Owner 2026-11-17: \"Keep buttons, neutral notice\" (Shared/ViewModels/AppStoreSubscriptionManager.swift)."
source: "Test purchases in test builds don't unlock Pro."
