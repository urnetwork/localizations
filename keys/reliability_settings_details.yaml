localizations:
  ar: "التوفير اختياري. عند تشغيله، يمكن للتطبيق مشاركة اتصالك مع الشبكة أثناء عمله في الخلفية على الواي فاي."
  cs: "Poskytování je volitelné. Když ho zapnete, může aplikace na pozadí sdílet vaše připojení se sítí, pokud jste na Wi-Fi."
  de: "Die Bereitstellung ist optional. Wenn du sie aktivierst, kann die App deine Verbindung mit dem Netzwerk teilen, während sie im Hintergrund im WLAN läuft."
  el: "Η παροχή είναι προαιρετική. Όταν την ενεργοποιήσετε, η εφαρμογή μπορεί να μοιράζεται τη σύνδεσή σας με το δίκτυο όσο εκτελείται στο παρασκήνιο σε Wi-Fi."
  en: "Providing is optional. When you turn it on, the app can share your connection with the network while it runs in the background on Wi-Fi."
  es: "La provisión es opcional. Cuando la activas, la app puede compartir tu conexión con la red mientras se ejecuta en segundo plano con Wi-Fi."
  es-419: "La provisión es opcional. Cuando la activas, la app puede compartir tu conexión con la red mientras se ejecuta en segundo plano con Wi-Fi."
  es-MX: "La provisión es opcional. Cuando la activas, la app puede compartir tu conexión con la red mientras se ejecuta en segundo plano con Wi-Fi."
  fr: "La fourniture est facultative. Lorsque vous l'activez, l'application peut partager votre connexion avec le réseau pendant qu'elle fonctionne en arrière-plan en Wi-Fi."
  he: "האספקה היא אופציונלית. כשתפעיל אותה, האפליקציה תוכל לשתף את החיבור שלך עם הרשת בזמן שהיא פועלת ברקע ב-Wi-Fi."
  hi: "प्रदान करना वैकल्पिक है। इसे चालू करने पर, ऐप वाई-फ़ाई पर बैकग्राउंड में चलते हुए आपके कनेक्शन को नेटवर्क के साथ साझा कर सकता है।"
  id: "Penyediaan bersifat opsional. Saat Anda mengaktifkannya, aplikasi dapat berbagi koneksi Anda dengan jaringan selama berjalan di latar belakang dengan Wi-Fi."
  it: "La fornitura è facoltativa. Quando la attivi, l'app può condividere la tua connessione con la rete mentre resta in background su Wi-Fi."
  ja: "提供は任意です。オンにすると、Wi-Fi接続時にバックグラウンドで動作しながら、アプリがあなたの接続をネットワークと共有できます。"
  ko: "제공은 선택 사항입니다. 켜면 Wi-Fi에서 백그라운드로 실행되는 동안 앱이 연결을 네트워크와 공유할 수 있습니다."
  nl: "Leveren is optioneel. Als je het aanzet, kan de app je verbinding met het netwerk delen terwijl hij op de achtergrond draait op Wi-Fi."
  pl: "Udostępnianie jest opcjonalne. Po włączeniu aplikacja może dzielić się Twoim połączeniem z siecią, działając w tle na Wi-Fi."
  pt: "O fornecimento é opcional. Quando o ativa, a aplicação pode partilhar a sua conexão com a rede enquanto funciona em segundo plano em Wi-Fi."
  pt-BR: "O fornecimento é opcional. Quando você ativa, o app pode compartilhar sua conexão com a rede enquanto funciona em segundo plano no Wi-Fi."
  pt-PT: "O fornecimento é opcional. Quando o ativa, a aplicação pode partilhar a sua conexão com a rede enquanto funciona em segundo plano em Wi-Fi."
  ru: "Предоставление необязательно. Если включить его, приложение сможет делиться вашим подключением с сетью, работая в фоновом режиме по Wi-Fi."
  sv: "Tillhandahållande är valfritt. När du slår på det kan appen dela din anslutning med nätverket medan den körs i bakgrunden på Wi-Fi."
  sw: "Kutoa ni hiari. Ukiiwasha, programu inaweza kushiriki muunganisho wako na mtandao inapoendesha chinichini kwenye Wi-Fi."
  th: "การให้บริการเป็นทางเลือก เมื่อคุณเปิดใช้งาน แอปจะแบ่งปันการเชื่อมต่อของคุณกับเครือข่ายได้ขณะทำงานเบื้องหลังบน Wi-Fi"
  uk: "Надання необов'язкове. Якщо ввімкнути його, додаток зможе ділитися вашим підключенням з мережею, працюючи у фоновому режимі через Wi-Fi."
  vi: "Cung cấp là tùy chọn. Khi bạn bật, ứng dụng có thể chia sẻ kết nối của bạn với mạng trong lúc chạy nền trên Wi-Fi."
  zh: "提供功能是可选的。开启后，应用在使用 Wi-Fi 并在后台运行时，可与网络共享你的连接。"
  zh-HK: "提供功能是可選的。開啟後，應用程式在使用 Wi-Fi 並於背景運行時，可與網絡分享你的連接。"
