description: "Browser extension popup, under the Disconnect button while the status line reads Proxy not answering (extension_status_proxy_not_answering): why pages don't load. Translate kill switch as the kill_switch key does."
source: "The proxy is not answering. The kill switch keeps the browser offline until it does."
platforms:
  - web
localizations:
  ar: "الوكيل لا يستجيب. يُبقي مفتاح الإيقاف المتصفح غير متصل حتى يستجيب الوكيل."
  cs: "Proxy neodpovídá. Kill switch drží prohlížeč offline, dokud proxy neodpoví."
  de: "Der Proxy antwortet nicht. Der Kill Switch hält den Browser offline, bis der Proxy wieder antwortet."
  el: "Ο διακομιστής μεσολάβησης δεν αποκρίνεται. Το kill switch κρατά το πρόγραμμα περιήγησης εκτός σύνδεσης μέχρι να αποκριθεί ξανά ο διακομιστής."
  en: "The proxy is not answering. The kill switch keeps the browser offline until it does."
  es: "El proxy no responde. El kill switch mantiene el navegador sin conexión hasta que el proxy responda."
  es-419: "El proxy no responde. El kill switch mantiene el navegador sin conexión hasta que el proxy responda."
  es-MX: "El proxy no responde. El kill switch mantiene el navegador sin conexión hasta que el proxy responda."
  fr: "Le proxy ne répond pas. Le kill switch maintient le navigateur hors ligne jusqu’à ce que le proxy réponde."
  he: "הפרוקסי לא מגיב. הקיל סוויץ' משאיר את הדפדפן במצב לא מקוון עד שהפרוקסי יגיב."
  hi: "प्रॉक्सी जवाब नहीं दे रहा है। जब तक प्रॉक्सी जवाब नहीं देता, किल स्विच ब्राउज़र को ऑफ़लाइन रखता है।"
  id: "Proxy tidak merespons. Kill switch membuat browser tetap offline sampai proxy merespons."
  it: "Il proxy non risponde. Il kill switch mantiene il browser offline finché il proxy non risponde."
  ja: "プロキシが応答していません。プロキシが応答するまで、キルスイッチによりブラウザはオフラインのままになります。"
  ko: "프록시가 응답하지 않습니다. 프록시가 응답할 때까지 킬 스위치가 브라우저를 오프라인 상태로 유지합니다."
  nl: "De proxy reageert niet. De kill switch houdt de browser offline totdat de proxy weer reageert."
  pl: "Serwer proxy nie odpowiada. Kill switch utrzymuje przeglądarkę offline, dopóki serwer proxy nie odpowie."
  pt: "O proxy não está respondendo. O kill switch mantém o navegador offline até que o proxy responda."
  pt-BR: "O proxy não está respondendo. O kill switch mantém o navegador offline até que o proxy responda."
  pt-PT: "O proxy não está a responder. O kill switch mantém o navegador offline até o proxy responder."
  ru: "Прокси не отвечает. Kill switch не пускает браузер в сеть, пока прокси не ответит."
  sv: "Proxyn svarar inte. Kill switch håller webbläsaren offline tills proxyn svarar."
  sw: "Proksi haijibu. Kill switch huweka kivinjari nje ya mtandao hadi proksi ijibu."
  th: "พร็อกซีไม่ตอบสนอง สวิตช์หยุดการเชื่อมต่อจะทำให้เบราว์เซอร์ออฟไลน์จนกว่าพร็อกซีจะตอบสนอง"
  uk: "Проксі не відповідає. Kill switch не пускає браузер у мережу, доки проксі не відповість."
  vi: "Proxy không phản hồi. Kill switch giữ trình duyệt ngoại tuyến cho đến khi proxy phản hồi."
  zh: "代理无响应。在代理恢复响应之前，断网保护会让浏览器保持离线。"
  zh-HK: "代理沒有回應。在代理恢復回應之前，斷線開關 (Kill switch) 會讓瀏覽器保持離線。"
