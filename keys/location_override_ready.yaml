description: "Setup guide state on linux: every prerequisite for the device location override is met."
source: "Ready. Turn on the toggle to report the connected provider's location as this machine's location."
platforms:
  - linux
localizations:
  ar: "جاهز. فعّل المفتاح للإبلاغ عن موقع المزود المتصل كموقع لهذا الجهاز."
  cs: "Připraveno. Zapněte přepínač, aby se poloha připojeného poskytovatele hlásila jako poloha tohoto počítače."
  de: "Bereit. Aktiviere den Schalter, um den Standort des verbundenen Anbieters als Standort dieses Rechners zu melden."
  el: "Έτοιμο. Ενεργοποιήστε τον διακόπτη για να αναφέρεται η τοποθεσία του συνδεδεμένου παρόχου ως τοποθεσία αυτού του μηχανήματος."
  en: "Ready. Turn on the toggle to report the connected provider's location as this machine's location."
  es: "Listo. Activa el interruptor para informar de la ubicación del proveedor conectado como la ubicación de este ordenador."
  es-419: "Listo. Activa el interruptor para informar la ubicación del proveedor conectado como la ubicación de esta computadora."
  es-MX: "Listo. Activa el interruptor para informar la ubicación del proveedor conectado como la ubicación de esta computadora."
  fr: "Prêt. Activez l'interrupteur pour signaler la position du fournisseur connecté comme position de cette machine."
  he: "מוכן. הפעל את המתג כדי לדווח על מיקום הספק המחובר כמיקום של המחשב הזה."
  hi: "तैयार है। कनेक्ट किए गए प्रदाता के स्थान को इस मशीन के स्थान के रूप में बताने के लिए टॉगल चालू करें।"
  id: "Siap. Aktifkan tombol untuk melaporkan lokasi penyedia yang terhubung sebagai lokasi mesin ini."
  it: "Pronto. Attiva l'interruttore per segnalare la posizione del provider connesso come posizione di questa macchina."
  ja: "準備完了。トグルをオンにすると、接続中のプロバイダーの位置情報がこのマシンの位置情報として報告されます。"
  ko: "준비되었습니다. 토글을 켜면 연결된 제공업체의 위치가 이 컴퓨터의 위치로 보고됩니다."
  nl: "Klaar. Zet de schakelaar aan om de locatie van de verbonden provider als de locatie van deze machine te melden."
  pl: "Gotowe. Włącz przełącznik, aby lokalizacja połączonego dostawcy była zgłaszana jako lokalizacja tego komputera."
  pt: "Pronto. Ative o interruptor para comunicar a localização do fornecedor ligado como a localização desta máquina."
  pt-BR: "Pronto. Ative a chave para informar a localização do provedor conectado como a localização desta máquina."
  pt-PT: "Pronto. Ative o interruptor para comunicar a localização do fornecedor ligado como a localização desta máquina."
  ru: "Готово. Включите переключатель, чтобы местоположение подключённого провайдера сообщалось как местоположение этого компьютера."
  sv: "Klart. Slå på reglaget för att rapportera den anslutna leverantörens plats som den här datorns plats."
  sw: "Tayari. Washa kitufe ili kuripoti mahali pa mtoa huduma aliyeunganishwa kama mahali pa mashine hii."
  th: "พร้อมแล้ว เปิดสวิตช์เพื่อรายงานตำแหน่งของผู้ให้บริการที่เชื่อมต่ออยู่เป็นตำแหน่งของเครื่องนี้"
  uk: "Готово. Увімкніть перемикач, щоб місцезнаходження підключеного провайдера повідомлялося як місцезнаходження цього комп'ютера."
  vi: "Đã sẵn sàng. Bật công tắc để báo cáo vị trí của nhà cung cấp đang kết nối làm vị trí của máy này."
  zh: "已就绪。打开开关，即可将已连接提供商的位置报告为本机位置。"
  zh-HK: "已就緒。開啟切換開關，即可將已連接供應商的位置回報為本機位置。"
