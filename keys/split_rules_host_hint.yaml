description: "Split rules on android, which has a host input above the traffic list: how to add to the rule. The apple/linux screens without the input keep split_rules_hint."
source: "Add a host above, or tap traffic below to route it locally, bypassing the tunnel."
platforms:
  - android
localizations:
  ar: "أضف مضيفًا أعلاه، أو انقر على حركة المرور أدناه لتوجيهها محليًا وتجاوز النفق."
  cs: "Přidejte hostitele výše, nebo klepnutím na provoz níže jej nasměrujte lokálně, mimo tunel."
  de: "Füge oben einen Host hinzu oder tippe unten auf Datenverkehr, um ihn lokal zu leiten und den Tunnel zu umgehen."
  el: "Προσθέστε έναν κεντρικό υπολογιστή παραπάνω ή πατήστε την κίνηση παρακάτω για να δρομολογηθεί τοπικά, παρακάμπτοντας το τούνελ."
  en: "Add a host above, or tap traffic below to route it locally, bypassing the tunnel."
  es: "Añade un host arriba o pulsa el tráfico de abajo para enrutarlo localmente, evitando el túnel."
  es-419: "Agrega un host arriba o toca el tráfico de abajo para enrutarlo localmente, evitando el túnel."
  es-MX: "Agrega un host arriba o toca el tráfico de abajo para enrutarlo localmente, evitando el túnel."
  fr: "Ajoutez un hôte ci-dessus, ou appuyez sur le trafic ci-dessous pour le router localement, en contournant le tunnel."
  he: "הוסף מארח למעלה, או הקש על התעבורה שלמטה כדי לנתב אותה מקומית ולעקוף את המנהרה."
  hi: "ऊपर एक होस्ट जोड़ें, या नीचे किसी ट्रैफ़िक पर टैप करें ताकि वह टनल को बायपास कर स्थानीय रूप से रूट हो।"
  id: "Tambahkan host di atas, atau ketuk lalu lintas di bawah untuk merutekannya secara lokal, melewati terowongan."
  it: "Aggiungi un host qui sopra, oppure tocca il traffico qui sotto per instradarlo localmente, bypassando il tunnel."
  ja: "上でホストを追加するか、下のトラフィックをタップすると、トンネルを迂回してローカルにルーティングされます。"
  ko: "위에서 호스트를 추가하거나 아래 트래픽을 탭하면 터널을 우회하여 로컬로 라우팅됩니다."
  nl: "Voeg hierboven een host toe, of tik hieronder op verkeer om het lokaal te routeren, buiten de tunnel om."
  pl: "Dodaj hosta powyżej lub dotknij ruchu poniżej, aby kierować go lokalnie, z pominięciem tunelu."
  pt: "Adicione um host acima ou toque no tráfego abaixo para o encaminhar localmente, contornando o túnel."
  pt-BR: "Adicione um host acima ou toque no tráfego abaixo para roteá-lo localmente, contornando o túnel."
  pt-PT: "Adicione um host acima ou toque no tráfego abaixo para o encaminhar localmente, contornando o túnel."
  ru: "Добавьте хост выше или нажмите на трафик ниже, чтобы направить его локально, в обход туннеля."
  sv: "Lägg till en värd ovan, eller tryck på trafik nedan för att dirigera den lokalt, förbi tunneln."
  sw: "Ongeza mwenyeji hapo juu, au gusa trafiki hapa chini ili ipitishwe ndani, ikiepuka tuneli."
  th: "เพิ่มโฮสต์ด้านบน หรือแตะทราฟฟิกด้านล่างเพื่อส่งผ่านภายในเครื่องโดยไม่ผ่านอุโมงค์"
  uk: "Додайте хост вище або торкніться трафіку нижче, щоб спрямувати його локально, в обхід тунелю."
  vi: "Thêm máy chủ ở trên, hoặc chạm vào lưu lượng bên dưới để định tuyến cục bộ, không qua đường hầm."
  zh: "在上方添加主机，或点击下方流量，将其改走本地路由，绕过隧道。"
  zh-HK: "在上方新增主機，或點擊下方流量，將其改走本地路由，繞過隧道。"
