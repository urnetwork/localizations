description: "ur.io account, Subscription card: the body for Pro from a gift code, which doesn't renew and has nothing to manage or cancel (compare site_sub_active_body)."
source: "Your Pro plan is a gift. It doesn't renew, so there's nothing to manage or cancel."
platforms:
  - site
localizations:
  ar: "خطة Pro الخاصة بك هدية. لا تتجدد، لذا لا يوجد ما يمكن إدارته أو إلغاؤه."
  cs: "Váš plán Pro je dárek. Neobnovuje se, takže není co spravovat ani rušit."
  de: "Dein Pro-Plan ist ein Geschenk. Er verlängert sich nicht, es gibt also nichts zu verwalten oder zu kündigen."
  el: "Το πρόγραμμα Pro σας είναι δώρο. Δεν ανανεώνεται, οπότε δεν υπάρχει τίποτα για διαχείριση ή ακύρωση."
  en: "Your Pro plan is a gift. It doesn't renew, so there's nothing to manage or cancel."
  es: "Tu plan Pro es un regalo. No se renueva, así que no hay nada que gestionar ni cancelar."
  es-419: "Tu plan Pro es un regalo. No se renueva, así que no hay nada que administrar ni cancelar."
  es-MX: "Tu plan Pro es un regalo. No se renueva, así que no hay nada que administrar ni cancelar."
  fr: "Votre plan Pro vous a été offert. Il ne se renouvelle pas, il n'y a donc rien à gérer ni à annuler."
  he: "תוכנית ה-Pro שלך היא מתנה. היא לא מתחדשת, כך שאין מה לנהל או לבטל."
  hi: "आपकी Pro योजना एक उपहार है। यह नवीनीकृत नहीं होती, इसलिए प्रबंधित या रद्द करने के लिए कुछ नहीं है।"
  id: "Paket Pro Anda adalah hadiah. Paket ini tidak diperpanjang, jadi tidak ada yang perlu dikelola atau dibatalkan."
  it: "Il tuo piano Pro è un regalo. Non si rinnova, quindi non c'è niente da gestire o annullare."
  ja: "Pro プランはギフトです。自動更新はされないため、管理や解約の必要はありません。"
  ko: "Pro 플랜은 선물입니다. 자동 갱신되지 않으므로 관리하거나 해지할 것이 없습니다."
  nl: "Je Pro-plan is een cadeau. Het wordt niet verlengd, dus er valt niets te beheren of op te zeggen."
  pl: "Twój plan Pro to podarunek. Nie odnawia się, więc nie ma czym zarządzać ani czego anulować."
  pt: "O seu plano Pro foi-lhe oferecido. Não renova, por isso não há nada para gerir nem cancelar."
  pt-BR: "Seu plano Pro é um presente. Ele não renova, então não há nada para gerenciar nem cancelar."
  pt-PT: "O seu plano Pro foi-lhe oferecido. Não renova, por isso não há nada para gerir nem cancelar."
  ru: "Ваш тариф Pro — подарок. Он не продлевается, поэтому управлять и отменять нечего."
  sv: "Din Pro-plan är en present. Den förnyas inte, så det finns inget att hantera eller avsluta."
  sw: "Mpango wako wa Pro ni zawadi. Hausasishwi, kwa hivyo hakuna cha kudhibiti wala kughairi."
  th: "แพ็กเกจ Pro ของคุณเป็นของขวัญ ไม่ต่ออายุอัตโนมัติ จึงไม่มีอะไรต้องจัดการหรือยกเลิก"
  uk: "Ваш план Pro — подарунок. Він не продовжується, тож керувати й скасовувати нічого не потрібно."
  vi: "Gói Pro của bạn là quà tặng. Gói này không tự gia hạn nên không có gì để quản lý hay hủy."
  zh: "您的 Pro 方案是获赠的，不会自动续订，因此无需管理或取消。"
  zh-HK: "您的 Pro 計劃是獲贈的，不會自動續訂，因此無需管理或取消。"
