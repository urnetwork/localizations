description: "Onboarding email E4a/E3b, engaged variant: what the tap does, and that replies are read."
source: "Your tap opens the feedback screen in the app, where you can add a line if you want to. This address is also a real inbox: reply, and it reaches me."
platforms:
  - email
localizations:
  en: "Your tap opens the feedback screen in the app, where you can add a line if you want to. This address is also a real inbox: reply, and it reaches me."
  ar: "تفتح ضغطتك شاشة الملاحظات في التطبيق، حيث يمكنك إضافة سطر إن أردت. هذا العنوان أيضاً صندوق بريد حقيقي: ردّ، وسيصلني."
  cs: "Klepnutí otevře v aplikaci obrazovku se zpětnou vazbou, kde můžete dopsat řádek, pokud chcete. Tahle adresa je také skutečná schránka: odpovězte, a dorazí to ke mně."
  de: "Dein Tipp öffnet den Feedback-Bildschirm in der App, wo du noch eine Zeile dazuschreiben kannst, wenn du magst. Diese Adresse ist auch ein echtes Postfach: antworte, und es erreicht mich."
  el: "Το πάτημά σου ανοίγει την οθόνη σχολίων στην εφαρμογή, όπου μπορείς να προσθέσεις μια γραμμή αν θέλεις. Αυτή η διεύθυνση είναι και κανονικό γραμματοκιβώτιο: απάντησε, και φτάνει σε μένα."
  es: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. Esta dirección también es un buzón real: responde, y me llega."
  es-419: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. Esta dirección también es un buzón real: responde, y me llega."
  es-MX: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. Esta dirección también es un buzón real: responde, y me llega."
  fr: "Ton geste ouvre l'écran de retours dans l'app, où tu peux ajouter une ligne si tu veux. Cette adresse est aussi une vraie boîte : réponds, et ça m'arrive."
  he: "ההקשה פותחת את מסך המשוב באפליקציה, ושם אפשר להוסיף שורה אם רוצים. הכתובת הזאת היא גם תיבה אמיתית: השיבו, וזה מגיע אליי."
  hi: "आपका टैप ऐप में फ़ीडबैक स्क्रीन खोलता है, जहाँ चाहें तो एक लाइन जोड़ सकते हैं। यह पता भी एक असली इनबॉक्स है: जवाब दें, और वह मुझ तक पहुँचेगा।"
  id: "Ketukanmu membuka layar masukan di aplikasi, tempat kamu bisa menambahkan sebaris jika mau. Alamat ini juga kotak masuk sungguhan: balas, dan sampai ke saya."
  it: "Il tuo tocco apre la schermata dei commenti nell'app, dove puoi aggiungere una riga se vuoi. Questo indirizzo è anche una casella vera: rispondi, e mi arriva."
  ja: "タップするとアプリのフィードバック画面が開き、よければひとこと添えられます。このアドレスは本物の受信箱でもあります。返信すれば私に届きます。"
  ko: "누르면 앱의 피드백 화면이 열리고, 원하시면 한 줄 덧붙일 수 있습니다. 이 주소는 실제 받은편지함이기도 합니다. 답장하시면 제게 닿습니다."
  nl: "Je tik opent het feedbackscherm in de app, waar je een regel kunt toevoegen als je wilt. Dit adres is ook een echte inbox: antwoord, en het komt bij mij aan."
  pl: "Dotknięcie otwiera ekran opinii w aplikacji, gdzie możesz dopisać zdanie, jeśli chcesz. Ten adres to też prawdziwa skrzynka: odpowiedz, a dotrze do mnie."
  pt: "Seu toque abre a tela de feedback no app, onde você pode acrescentar uma linha se quiser. Este endereço também é uma caixa de entrada de verdade: responda, e chega até mim."
  pt-BR: "Seu toque abre a tela de feedback no app, onde você pode acrescentar uma linha se quiser. Este endereço também é uma caixa de entrada de verdade: responda, e chega até mim."
  pt-PT: "O seu toque abre o ecrã de feedback na app, onde pode acrescentar uma linha se quiser. Este endereço é também uma caixa de entrada a sério: responda, e chega até mim."
  ru: "Касание откроет экран отзыва в приложении, где при желании можно добавить пару слов. Этот адрес — тоже настоящий ящик: ответьте, и письмо дойдёт до меня."
  sv: "Ditt tryck öppnar feedbackskärmen i appen, där du kan lägga till en rad om du vill. Den här adressen är också en riktig inkorg: svara, så når det mig."
  sw: "Mguso wako unafungua skrini ya maoni kwenye programu, ambapo unaweza kuongeza mstari ukipenda. Anwani hii pia ni kikasha halisi: jibu, na inanifikia."
  th: "การแตะจะเปิดหน้าจอฟีดแบ็กในแอป ซึ่งคุณเพิ่มข้อความสั้นๆ ได้ถ้าต้องการ ที่อยู่นี้เป็นกล่องจดหมายจริงด้วย: ตอบกลับมา แล้วมันจะถึงผม"
  uk: "Дотик відкриє екран відгуку в застосунку, де за бажання можна додати рядок. Ця адреса — також справжня скринька: дайте відповідь, і лист дійде до мене."
  vi: "Chạm của bạn mở màn hình phản hồi trong ứng dụng, nơi bạn có thể thêm một dòng nếu muốn. Địa chỉ này cũng là một hộp thư thật: trả lời, và nó sẽ đến tay tôi."
  zh: "点一下会打开应用里的反馈页面，想的话可以再加一句。这个地址也是真实的收件箱：回复就能到我这里。"
  zh-HK: "點一下會打開應用程式裡的意見回饋頁面，想的話可以再加一句。這個地址也是真實的收件匣：回覆就能到我這裡。"
