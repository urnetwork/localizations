description: "Onboarding email E4a/E3b, engaged variant: what the tap does, and where replies go. Replies reach the support inbox, so it says so, not \"it reaches me\" (2026-11-15 review; as email_e1_reply and email_re_reply_line since 2026-11-13)."
source: "Your tap opens the feedback screen in the app, where you can add a line if you want to. You can also reply to this email. Every reply reaches our support inbox."
platforms:
  - email
localizations:
  en: "Your tap opens the feedback screen in the app, where you can add a line if you want to. You can also reply to this email. Every reply reaches our support inbox."
  ar: "تفتح ضغطتك شاشة الملاحظات في التطبيق، حيث يمكنك إضافة سطر إن أردت. يمكنك أيضاً الردّ على هذه الرسالة. كل ردّ يصل إلى صندوق بريد الدعم لدينا."
  cs: "Klepnutí otevře v aplikaci obrazovku se zpětnou vazbou, kde můžete dopsat řádek, pokud chcete. Můžete také odpovědět na tento e-mail. Každá odpověď dorazí do naší schránky podpory."
  de: "Dein Tipp öffnet den Feedback-Bildschirm in der App, wo du noch eine Zeile dazuschreiben kannst, wenn du magst. Du kannst auch auf diese E-Mail antworten. Jede Antwort landet in unserem Support-Postfach."
  el: "Το πάτημά σου ανοίγει την οθόνη σχολίων στην εφαρμογή, όπου μπορείς να προσθέσεις μια γραμμή αν θέλεις. Μπορείς επίσης να απαντήσεις σε αυτό το email. Κάθε απάντηση φτάνει στα εισερχόμενα της υποστήριξής μας."
  es: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. También puedes responder a este correo. Cada respuesta llega a nuestra bandeja de soporte."
  es-419: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. También puedes responder a este correo. Cada respuesta llega a nuestra bandeja de soporte."
  es-MX: "Tu toque abre la pantalla de comentarios en la app, donde puedes añadir una línea si quieres. También puedes responder a este correo. Cada respuesta llega a nuestra bandeja de soporte."
  fr: "Ton geste ouvre l'écran de retours dans l'app, où tu peux ajouter une ligne si tu veux. Tu peux aussi répondre à cet e-mail. Chaque réponse arrive dans notre boîte de support."
  he: "ההקשה פותחת את מסך המשוב באפליקציה, ושם אפשר להוסיף שורה אם רוצים. אפשר גם להשיב למייל הזה. כל תשובה מגיעה לתיבת התמיכה שלנו."
  hi: "आपका टैप ऐप में फ़ीडबैक स्क्रीन खोलता है, जहाँ चाहें तो एक लाइन जोड़ सकते हैं। आप इस ईमेल का जवाब भी दे सकते हैं। हर जवाब हमारे सपोर्ट इनबॉक्स में पहुँचता है।"
  id: "Ketukanmu membuka layar masukan di aplikasi, tempat kamu bisa menambahkan sebaris jika mau. Kamu juga bisa membalas email ini. Setiap balasan masuk ke kotak masuk dukungan kami."
  it: "Il tuo tocco apre la schermata dei commenti nell'app, dove puoi aggiungere una riga se vuoi. Puoi anche rispondere a questa email. Ogni risposta arriva nella nostra casella dell'assistenza."
  ja: "タップするとアプリのフィードバック画面が開き、よければひとこと添えられます。このメールに返信していただくこともできます。返信はすべてサポートの受信箱に届きます。"
  ko: "누르면 앱의 피드백 화면이 열리고, 원하시면 한 줄 덧붙일 수 있습니다. 이 메일에 답장하셔도 됩니다. 모든 답장은 저희 지원팀 받은편지함으로 전달됩니다."
  nl: "Je tik opent het feedbackscherm in de app, waar je een regel kunt toevoegen als je wilt. Je kunt ook op deze e-mail antwoorden. Elk antwoord komt binnen in onze supportinbox."
  pl: "Dotknięcie otwiera ekran opinii w aplikacji, gdzie możesz dopisać zdanie, jeśli chcesz. Możesz też odpowiedzieć na ten e-mail. Każda odpowiedź trafia do naszej skrzynki wsparcia."
  pt: "Seu toque abre a tela de feedback no app, onde você pode acrescentar uma linha se quiser. Você também pode responder a este e-mail. Toda resposta chega à nossa caixa de suporte."
  pt-BR: "Seu toque abre a tela de feedback no app, onde você pode acrescentar uma linha se quiser. Você também pode responder a este e-mail. Toda resposta chega à nossa caixa de suporte."
  pt-PT: "O seu toque abre o ecrã de feedback na app, onde pode acrescentar uma linha se quiser. Também pode responder a este e-mail. Todas as respostas chegam à nossa caixa de apoio."
  ru: "Касание откроет экран отзыва в приложении, где при желании можно добавить пару слов. Можно также ответить на это письмо. Каждый ответ попадает в почтовый ящик нашей поддержки."
  sv: "Ditt tryck öppnar feedbackskärmen i appen, där du kan lägga till en rad om du vill. Du kan också svara på det här mejlet. Varje svar hamnar i vår supportinkorg."
  sw: "Mguso wako unafungua skrini ya maoni kwenye programu, ambapo unaweza kuongeza mstari ukipenda. Unaweza pia kujibu barua pepe hii. Kila jibu linafika kwenye kisanduku cha barua cha usaidizi wetu."
  th: "การแตะจะเปิดหน้าจอฟีดแบ็กในแอป ซึ่งคุณเพิ่มข้อความสั้นๆ ได้ถ้าต้องการ คุณตอบกลับอีเมลนี้ก็ได้เช่นกัน ทุกคำตอบจะส่งถึงกล่องจดหมายฝ่ายซัพพอร์ตของเรา"
  uk: "Дотик відкриє екран відгуку в застосунку, де за бажання можна додати рядок. Можна також відповісти на цей лист. Кожна відповідь потрапляє до поштової скриньки нашої підтримки."
  vi: "Chạm của bạn mở màn hình phản hồi trong ứng dụng, nơi bạn có thể thêm một dòng nếu muốn. Bạn cũng có thể trả lời email này. Mọi câu trả lời đều được gửi đến hộp thư hỗ trợ của chúng tôi."
  zh: "点一下会打开应用里的反馈页面，想的话可以再加一句。你也可以直接回复这封邮件。每一封回复都会送达我们的支持邮箱。"
  zh-HK: "點一下會打開應用程式裡的意見回饋頁面，想的話可以再加一句。你也可以直接回覆這封郵件。每一封回覆都會送達我們的支援郵箱。"
