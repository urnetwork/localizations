description: "Onboarding email E2, activated variant (a phone whose app build has the home screen widget): why the widget. No lock screen line: no widget family is on the lock screen (2026-11-13 review)."
source: "The easiest way to keep it up is the widget. It puts Connect, your daily data and your current provider on the home screen."
platforms:
  - email
localizations:
  en: "The easiest way to keep it up is the widget. It puts Connect, your daily data and your current provider on the home screen."
  ar: "أسهل طريقة للاستمرار هي الأداة. تضع «اربط» وبياناتك اليومية ومزوّدك الحالي على الشاشة الرئيسية."
  cs: "Nejsnazší způsob, jak u toho zůstat, je widget. Dá Připojit, vaše denní data a aktuálního poskytovatele na domovskou obrazovku."
  de: "Am einfachsten bleibst du dran mit dem Widget. Es legt „Verbinde“, dein Tagesvolumen und deinen aktuellen Anbieter auf den Startbildschirm."
  el: "Ο πιο εύκολος τρόπος να συνεχίσεις είναι το γραφικό στοιχείο. Βάζει τη Σύνδεση, τα ημερήσια δεδομένα και τον τρέχοντα πάροχό σου στην αρχική οθόνη."
  es: "La forma más fácil de mantenerlo es el widget. Pone Conecta, tus datos diarios y tu proveedor actual en la pantalla de inicio."
  es-419: "La forma más fácil de mantenerlo es el widget. Pone Conecta, tus datos diarios y tu proveedor actual en la pantalla de inicio."
  es-MX: "La forma más fácil de mantenerlo es el widget. Pone Conecta, tus datos diarios y tu proveedor actual en la pantalla de inicio."
  fr: "Le plus simple pour continuer, c'est le widget. Il met Connecte, tes données du jour et ton fournisseur actuel sur l'écran d'accueil."
  he: "הדרך הקלה ביותר להמשיך היא הווידג'ט. הוא שם את התחבר, את הנתונים היומיים ואת הספק הנוכחי שלכם על מסך הבית."
  hi: "इसे जारी रखने का सबसे आसान तरीका विजेट है। यह कनेक्ट करें, आपका दैनिक डेटा और मौजूदा प्रदाता होम स्क्रीन पर रखता है।"
  id: "Cara termudah untuk terus melakukannya adalah widget. Widget menaruh Hubungkan, data harianmu, dan penyedia saat ini di layar utama."
  it: "Il modo più facile per continuare è il widget. Mette Connetti, i tuoi dati giornalieri e il provider attuale nella schermata Home."
  ja: "続けるいちばん簡単な方法はウィジェットです。「接続」と今日のデータ量、いま使っているプロバイダーをホーム画面に置けます。"
  ko: "계속 쓰는 가장 쉬운 방법은 위젯입니다. 연결 버튼과 오늘의 데이터, 현재 제공자를 홈 화면에 둘 수 있습니다."
  nl: "De makkelijkste manier om het vol te houden is de widget. Die zet Verbinden, je dagelijkse data en je huidige provider op het beginscherm."
  pl: "Najłatwiej utrzymać nawyk dzięki widżetowi. Umieszcza Połącz, twoje dzienne dane i obecnego dostawcę na ekranie głównym."
  pt: "O jeito mais fácil de manter o ritmo é o widget. Ele coloca Conecte, seus dados do dia e seu provedor atual na tela inicial."
  pt-BR: "O jeito mais fácil de manter o ritmo é o widget. Ele coloca Conecte, seus dados do dia e seu provedor atual na tela inicial."
  pt-PT: "A forma mais fácil de manter o hábito é o widget. Coloca Ligar, os seus dados diários e o fornecedor atual no ecrã principal."
  ru: "Проще всего продолжать с виджетом. Он выносит «Подключить», ваш дневной трафик и текущего провайдера на главный экран."
  sv: "Enklaste sättet att hålla igång är widgeten. Den lägger Anslut, din dagliga data och din nuvarande leverantör på hemskärmen."
  sw: "Njia rahisi zaidi ya kuendelea ni wijeti. Inaweka Unganisha, data yako ya kila siku na mtoa huduma wako wa sasa kwenye skrini ya kwanza."
  th: "วิธีที่ง่ายที่สุดในการใช้ต่อคือวิดเจ็ต มันวางปุ่ม เชื่อมต่อ ข้อมูลรายวัน และผู้ให้บริการปัจจุบันไว้บนหน้าจอหลัก"
  uk: "Найпростіше продовжувати з віджетом. Він виносить «Підключитися», ваш денний трафік і поточного провайдера на головний екран."
  vi: "Cách dễ nhất để duy trì là widget. Nó đặt Kết nối, dữ liệu hằng ngày và nhà cung cấp hiện tại của bạn lên màn hình chính."
  zh: "最省事的坚持方式是小组件。它把“连接”、今日流量和当前提供者放到主屏幕上。"
  zh-HK: "最省事的堅持方式是小工具。它把「連接」、今日流量和目前提供者放到主畫面上。"
