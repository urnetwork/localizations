description: "Call to action"
source: "Please make sure you have sufficient USDC funds in your wallet. In some instances, payment prompts fail if there are insufficient funds in the wallet."
platforms:
  - android
localizations:
  ar: "يرجى التأكد من أن لديك رصيد كافٍ من USDC في محفظتك. في بعض الحالات، قد تفشل مطالبات الدفع إذا لم تكن هناك أموال كافية في المحفظة."
  cs: "Ujistěte se, že máte v peněžence dostatek prostředků USDC. V některých případech se platba nezdaří, pokud v peněžence není dostatek prostředků."
  de: "Bitte stelle sicher, dass du genügend USDC-Guthaben in deiner Wallet hast. In manchen Fällen schlagen Zahlungsaufforderungen fehl, wenn nicht genügend Guthaben vorhanden ist."
  el: "Βεβαιωθείτε ότι έχετε επαρκή κεφάλαια USDC στο πορτοφόλι σας. Σε ορισμένες περιπτώσεις, οι ειδοποιήσεις πληρωμής αποτυγχάνουν αν δεν υπάρχουν αρκετά χρήματα στο πορτοφόλι."
  en: "Please make sure you have sufficient USDC funds in your wallet. In some instances, payment prompts fail if there are insufficient funds in the wallet."
  es: "Por favor, asegúrate de tener fondos USDC suficientes en tu billetera. En algunos casos, los pagos fallan si no hay fondos suficientes en la billetera."
  es-419: "Por favor, asegúrate de tener fondos USDC suficientes en tu billetera. En algunos casos, los pagos fallan si no hay fondos suficientes en la billetera."
  es-MX: "Por favor, asegúrate de tener fondos USDC suficientes en tu billetera. En algunos casos, los pagos fallan si no hay fondos suficientes en la billetera."
  fr: "Veuillez vous assurer que vous disposez de fonds USDC suffisants dans votre portefeuille. Dans certains cas, les demandes de paiement échouent s’il n’y a pas suffisamment de fonds dans le portefeuille."
  he: "ודא שיש לך מספיק כספי USDC בארנק. במקרים מסוימים, בקשות תשלום נכשלות אם אין מספיק כסף בארנק."
  hi: "कृपया सुनिश्चित करें कि आपके वॉलेट में पर्याप्त USDC फंड्स हैं। कुछ मामलों में, यदि वॉलेट में पर्याप्त फंड्स नहीं हैं तो भुगतान अनुरोध विफल हो सकता है।"
  id: "Pastikan Anda memiliki dana USDC yang cukup di dompet Anda. Dalam beberapa kasus, permintaan pembayaran gagal jika dana di dompet tidak mencukupi."
  it: "Assicurati di avere fondi USDC sufficienti nel tuo portafoglio. In alcuni casi, le richieste di pagamento falliscono se i fondi nel portafoglio sono insufficienti."
  ja: "ウォレットに十分なUSDC資金があることを確認してください。場合によっては、ウォレットの資金が不足していると支払いが失敗することがあります。"
  ko: "지갑에 충분한 USDC 자금이 있는지 확인하세요. 경우에 따라 지갑에 자금이 부족하면 결제 요청이 실패할 수 있습니다."
  nl: "Zorg ervoor dat je voldoende USDC in je wallet hebt. In sommige gevallen mislukt de betalingsprompt als er onvoldoende saldo is."
  pl: "Upewnij się, że masz wystarczające środki USDC w swoim portfelu. W niektórych przypadkach płatność może się nie powieść, jeśli w portfelu brakuje środków."
  pt: "Certifique-se de que tem fundos USDC suficientes na sua carteira. Em alguns casos, os pedidos de pagamento falham se não houver fundos suficientes na carteira."
  pt-BR: "Certifique-se de que há fundos USDC suficientes em sua carteira. Em alguns casos, solicitações de pagamento falham se não houver fundos suficientes na carteira."
  pt-PT: "Certifique-se de que tem fundos USDC suficientes na sua carteira. Em alguns casos, os pedidos de pagamento falham se não houver fundos suficientes na carteira."
  ru: "Пожалуйста, убедитесь, что у вас достаточно средств USDC в вашем кошельке. В некоторых случаях запросы на оплату не проходят, если в кошельке недостаточно средств."
  sv: "Se till att du har tillräckligt med USDC i din plånbok. I vissa fall misslyckas betalningsförfrågningar om det inte finns tillräckliga medel i plånboken."
  sw: "Tafadhali hakikisha una fedha za kutosha za USDC kwenye pochi yako. Katika baadhi ya matukio, maombi ya malipo hushindwa ikiwa hakuna fedha za kutosha kwenye pochi."
  th: "โปรดตรวจสอบให้แน่ใจว่าคุณมีเงิน USDC เพียงพอในกระเป๋าเงินของคุณ ในบางกรณี การแจ้งเตือนการชำระเงินจะล้มเหลวหากมีเงินไม่เพียงพอในกระเป๋าเงิน"
  uk: "Будь ласка, переконайтеся, що у вашому гаманці достатньо коштів USDC. У деяких випадках запити на оплату не проходять, якщо в гаманці недостатньо коштів."
  vi: "Vui lòng đảm bảo bạn có đủ USDC trong ví. Trong một số trường hợp, yêu cầu thanh toán sẽ thất bại nếu ví không đủ tiền."
  zh: "请确保您的钱包中有足够的 USDC 资金。在某些情况下，如果钱包资金不足，付款提示可能会失败。"
  zh-HK: "請確保您的錢包中有足夠的 USDC 資金。在某些情況下，如果錢包資金不足，付款請求可能會失敗。"
