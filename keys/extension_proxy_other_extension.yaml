description: "Browser extension popup, under the button while the status line reads Another extension controls the proxy (extension_status_other_extension). Turning the other extension off is done in the browser's extension settings. Keep URnetwork as is."
source: "Another extension controls this browser's proxy settings, so URnetwork can't connect. Turn that extension off to use URnetwork."
platforms:
  - web
localizations:
  ar: "تتحكم إضافة أخرى في إعدادات الوكيل في هذا المتصفح، لذا يتعذر على URnetwork الاتصال. أوقف تشغيل تلك الإضافة لاستخدام URnetwork."
  cs: "Nastavení proxy v tomto prohlížeči spravuje jiné rozšíření, takže se URnetwork nemůže připojit. Pokud chcete používat URnetwork, vypněte toto rozšíření."
  de: "Eine andere Erweiterung steuert die Proxy-Einstellungen dieses Browsers, daher kann sich URnetwork nicht verbinden. Deaktiviere diese Erweiterung, um URnetwork zu nutzen."
  el: "Μια άλλη επέκταση ελέγχει τις ρυθμίσεις διακομιστή μεσολάβησης αυτού του προγράμματος περιήγησης, οπότε το URnetwork δεν μπορεί να συνδεθεί. Απενεργοποιήστε αυτή την επέκταση για να χρησιμοποιήσετε το URnetwork."
  en: "Another extension controls this browser's proxy settings, so URnetwork can't connect. Turn that extension off to use URnetwork."
  es: "Otra extensión controla los ajustes de proxy de este navegador, así que URnetwork no puede conectarse. Desactiva esa extensión para usar URnetwork."
  es-419: "Otra extensión controla la configuración de proxy de este navegador, así que URnetwork no puede conectarse. Desactiva esa extensión para usar URnetwork."
  es-MX: "Otra extensión controla la configuración de proxy de este navegador, así que URnetwork no puede conectarse. Desactiva esa extensión para usar URnetwork."
  fr: "Une autre extension contrôle les paramètres de proxy de ce navigateur, URnetwork ne peut donc pas se connecter. Désactivez cette extension pour utiliser URnetwork."
  he: "תוסף אחר שולט בהגדרות הפרוקסי של הדפדפן הזה, ולכן URnetwork לא יכול להתחבר. כבה את התוסף הזה כדי להשתמש ב-URnetwork."
  hi: "कोई दूसरा एक्सटेंशन इस ब्राउज़र की प्रॉक्सी सेटिंग कंट्रोल कर रहा है, इसलिए URnetwork कनेक्ट नहीं हो सकता। URnetwork का इस्तेमाल करने के लिए उस एक्सटेंशन को बंद करें।"
  id: "Ekstensi lain mengontrol pengaturan proxy browser ini, jadi URnetwork tidak dapat terhubung. Matikan ekstensi tersebut untuk menggunakan URnetwork."
  it: "Un’altra estensione controlla le impostazioni proxy di questo browser, quindi URnetwork non può connettersi. Disattiva quell’estensione per usare URnetwork."
  ja: "別の拡張機能がこのブラウザのプロキシ設定を制御しているため、URnetwork は接続できません。URnetwork を使うには、その拡張機能をオフにしてください。"
  ko: "다른 확장 프로그램이 이 브라우저의 프록시 설정을 제어하고 있어 URnetwork가 연결할 수 없습니다. URnetwork를 사용하려면 해당 확장 프로그램을 끄세요."
  nl: "Een andere extensie beheert de proxyinstellingen van deze browser, dus URnetwork kan geen verbinding maken. Zet die extensie uit om URnetwork te gebruiken."
  pl: "Inne rozszerzenie kontroluje ustawienia serwera proxy tej przeglądarki, więc URnetwork nie może się połączyć. Wyłącz to rozszerzenie, aby korzystać z URnetwork."
  pt: "Outra extensão controla as configurações de proxy deste navegador, então a URnetwork não consegue se conectar. Desative essa extensão para usar a URnetwork."
  pt-BR: "Outra extensão controla as configurações de proxy deste navegador, então a URnetwork não consegue se conectar. Desative essa extensão para usar a URnetwork."
  pt-PT: "Outra extensão controla as definições de proxy deste navegador, por isso a URnetwork não consegue ligar-se. Desative essa extensão para usar a URnetwork."
  ru: "Другое расширение управляет настройками прокси в этом браузере, поэтому URnetwork не может подключиться. Чтобы пользоваться URnetwork, отключите это расширение."
  sv: "Ett annat tillägg styr proxyinställningarna i den här webbläsaren, så URnetwork kan inte ansluta. Stäng av det tillägget för att använda URnetwork."
  sw: "Kiendelezi kingine kinadhibiti mipangilio ya proksi ya kivinjari hiki, kwa hivyo URnetwork haiwezi kuunganisha. Zima kiendelezi hicho ili kutumia URnetwork."
  th: "ส่วนขยายอื่นกำลังควบคุมการตั้งค่าพร็อกซีของเบราว์เซอร์นี้ URnetwork จึงเชื่อมต่อไม่ได้ ปิดส่วนขยายนั้นเพื่อใช้ URnetwork"
  uk: "Інше розширення керує налаштуваннями проксі в цьому браузері, тож URnetwork не може підключитися. Щоб користуватися URnetwork, вимкніть те розширення."
  vi: "Một tiện ích khác đang kiểm soát cài đặt proxy của trình duyệt này nên URnetwork không thể kết nối. Hãy tắt tiện ích đó để dùng URnetwork."
  zh: "另一个扩展正在控制此浏览器的代理设置，因此 URnetwork 无法连接。请关闭该扩展以使用 URnetwork。"
  zh-HK: "另一個擴充功能正在控制此瀏覽器的代理設定，因此 URnetwork 無法連接。請關閉該擴充功能以使用 URnetwork。"
