description: "Browser extension popup, under the Connect button (status Disconnected): the proxy failed three health checks in a row with the kill switch off, so the extension took its proxy setting off, and the browser went back to its own connection (direct, or the proxy its own settings name). Keep URnetwork as is."
source: "The proxy stopped answering, so the extension turned it off. This browser connects without URnetwork until you connect again."
platforms:
  - web
localizations:
  ar: "توقف الوكيل عن الاستجابة، لذا أوقفت الإضافة تشغيله. يتصل هذا المتصفح بدون URnetwork حتى تتصل مجددًا."
  cs: "Proxy přestala odpovídat, a tak ji rozšíření vypnulo. Tento prohlížeč se připojuje bez URnetwork, dokud se znovu nepřipojíte."
  de: "Der Proxy hat nicht mehr geantwortet, daher hat die Erweiterung ihn ausgeschaltet. Dieser Browser verbindet sich ohne URnetwork, bis du dich wieder verbindest."
  el: "Ο διακομιστής μεσολάβησης σταμάτησε να αποκρίνεται, οπότε η επέκταση τον απενεργοποίησε. Αυτό το πρόγραμμα περιήγησης συνδέεται χωρίς το URnetwork μέχρι να συνδεθείτε ξανά."
  en: "The proxy stopped answering, so the extension turned it off. This browser connects without URnetwork until you connect again."
  es: "El proxy ha dejado de responder, así que la extensión lo ha desactivado. Este navegador se conecta sin URnetwork hasta que vuelvas a conectarte."
  es-419: "El proxy dejó de responder, así que la extensión lo desactivó. Este navegador se conecta sin URnetwork hasta que vuelvas a conectarte."
  es-MX: "El proxy dejó de responder, así que la extensión lo desactivó. Este navegador se conecta sin URnetwork hasta que vuelvas a conectarte."
  fr: "Le proxy ne répondait plus, l’extension l’a donc désactivé. Ce navigateur se connecte sans URnetwork jusqu’à ce que vous vous reconnectiez."
  he: "הפרוקסי הפסיק להגיב, ולכן התוסף כיבה אותו. הדפדפן הזה מתחבר בלי URnetwork עד שתתחבר שוב."
  hi: "प्रॉक्सी जवाब नहीं दे रहा था, इसलिए एक्सटेंशन ने उसे बंद कर दिया। जब तक आप फिर से कनेक्ट नहीं करते, यह ब्राउज़र URnetwork के बिना कनेक्ट होगा।"
  id: "Proxy berhenti merespons, jadi ekstensi mematikannya. Browser ini terhubung tanpa URnetwork sampai Anda terhubung lagi."
  it: "Il proxy ha smesso di rispondere, quindi l’estensione l’ha disattivato. Questo browser si connette senza URnetwork finché non ti riconnetti."
  ja: "プロキシが応答しなくなったため、拡張機能がプロキシをオフにしました。再接続するまで、このブラウザは URnetwork を介さずに接続します。"
  ko: "프록시가 응답하지 않아 확장 프로그램이 프록시를 껐습니다. 다시 연결할 때까지 이 브라우저는 URnetwork 없이 연결됩니다."
  nl: "De proxy reageerde niet meer, dus heeft de extensie hem uitgezet. Deze browser maakt verbinding zonder URnetwork totdat je opnieuw verbinding maakt."
  pl: "Serwer proxy przestał odpowiadać, więc rozszerzenie go wyłączyło. Ta przeglądarka łączy się bez URnetwork, dopóki nie połączysz się ponownie."
  pt: "O proxy parou de responder, então a extensão o desativou. Este navegador se conecta sem a URnetwork até você se conectar de novo."
  pt-BR: "O proxy parou de responder, então a extensão o desativou. Este navegador se conecta sem a URnetwork até você se conectar de novo."
  pt-PT: "O proxy deixou de responder, por isso a extensão desativou-o. Este navegador liga-se sem a URnetwork até voltar a ligar."
  ru: "Прокси перестал отвечать, поэтому расширение его отключило. Этот браузер подключается без URnetwork, пока вы снова не подключитесь."
  sv: "Proxyn slutade svara, så tillägget stängde av den. Den här webbläsaren ansluter utan URnetwork tills du ansluter igen."
  sw: "Proksi iliacha kujibu, kwa hivyo kiendelezi kiliizima. Kivinjari hiki kinaunganishwa bila URnetwork hadi uunganishe tena."
  th: "พร็อกซีหยุดตอบสนอง ส่วนขยายจึงปิดพร็อกซี เบราว์เซอร์นี้จะเชื่อมต่อโดยไม่ผ่าน URnetwork จนกว่าคุณจะเชื่อมต่ออีกครั้ง"
  uk: "Проксі перестав відповідати, тож розширення його вимкнуло. Цей браузер підключається без URnetwork, доки ви знову не підключитеся."
  vi: "Proxy đã ngừng phản hồi nên tiện ích đã tắt proxy. Trình duyệt này kết nối không qua URnetwork cho đến khi bạn kết nối lại."
  zh: "代理已停止响应，因此扩展已将其关闭。在您重新连接之前，此浏览器的连接不经过 URnetwork。"
  zh-HK: "代理已停止回應，因此擴充功能已將其關閉。在您重新連接之前，此瀏覽器的連線不經過 URnetwork。"
