description: "Used in Main/Account/Wallets/ConnectWalletSheet/EnterWalletAddress/EnterWalletAddressView.swift."
source: "Solana USDC addresses and Bittensor (TAO) addresses are supported. Bittensor wallets are stored for future use and can't receive payouts yet."
deprecated:
  - apple
platforms:
  - apple
localizations:
  ar: "عناوين USDC على Solana وعناوين Bittensor (TAO) مدعومة. يتم حفظ محافظ Bittensor للاستخدام المستقبلي ولا يمكنها استلام المدفوعات بعد."
  cs: "Podporovány jsou adresy USDC na síti Solana a adresy Bittensor (TAO). Peněženky Bittensor se ukládají pro budoucí použití a zatím nemohou přijímat výplaty."
  de: "Solana-USDC-Adressen und Bittensor-Adressen (TAO) werden unterstützt. Bittensor-Wallets werden für die spätere Nutzung gespeichert und können noch keine Auszahlungen empfangen."
  el: "Υποστηρίζονται διευθύνσεις USDC στο Solana και διευθύνσεις Bittensor (TAO). Τα πορτοφόλια Bittensor αποθηκεύονται για μελλοντική χρήση και δεν μπορούν ακόμη να λάβουν πληρωμές."
  en: "Solana USDC addresses and Bittensor (TAO) addresses are supported. Bittensor wallets are stored for future use and can't receive payouts yet."
  es: "Se admiten las direcciones USDC en Solana y las direcciones de Bittensor (TAO). Las billeteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  es-419: "Se admiten las direcciones USDC en Solana y las direcciones de Bittensor (TAO). Las billeteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  es-MX: "Se admiten las direcciones USDC en Solana y las direcciones de Bittensor (TAO). Las carteras de Bittensor se guardan para uso futuro y aún no pueden recibir pagos."
  fr: "Les adresses USDC sur Solana et les adresses Bittensor (TAO) sont prises en charge. Les portefeuilles Bittensor sont enregistrés pour un usage futur et ne peuvent pas encore recevoir de paiements."
  he: "כתובות USDC ב-Solana וכתובות Bittensor (TAO) נתמכות. ארנקי Bittensor נשמרים לשימוש עתידי ועדיין לא יכולים לקבל תשלומים."
  hi: "Solana USDC पते और Bittensor (TAO) पते समर्थित हैं। Bittensor वॉलेट भविष्य के उपयोग के लिए सहेजे जाते हैं और अभी भुगतान प्राप्त नहीं कर सकते।"
  id: "Alamat USDC Solana dan alamat Bittensor (TAO) didukung. Dompet Bittensor disimpan untuk penggunaan mendatang dan belum bisa menerima pembayaran."
  it: "Sono supportati gli indirizzi USDC su Solana e gli indirizzi Bittensor (TAO). I portafogli Bittensor vengono salvati per un uso futuro e non possono ancora ricevere pagamenti."
  ja: "Solana USDCアドレスとBittensor（TAO）アドレスに対応しています。Bittensorウォレットは将来の利用のために保存されますが、まだ支払いは受け取れません。"
  ko: "Solana USDC 주소와 Bittensor(TAO) 주소가 지원됩니다. Bittensor 지갑은 향후 사용을 위해 저장되며 아직 지급금을 받을 수 없습니다."
  nl: "Solana USDC-adressen en Bittensor-adressen (TAO) worden ondersteund. Bittensor-wallets worden bewaard voor toekomstig gebruik en kunnen nog geen uitbetalingen ontvangen."
  pl: "Obsługiwane są adresy USDC na Solana oraz adresy Bittensor (TAO). Portfele Bittensor są zapisywane na przyszłość i nie mogą jeszcze otrzymywać wypłat."
  pt: "Endereços USDC em Solana e endereços Bittensor (TAO) são compatíveis. As carteiras Bittensor são guardadas para uso futuro e ainda não podem receber pagamentos."
  pt-BR: "Endereços USDC em Solana e endereços Bittensor (TAO) são compatíveis. As carteiras Bittensor são armazenadas para uso futuro e ainda não podem receber pagamentos."
  pt-PT: "Endereços USDC em Solana e endereços Bittensor (TAO) são compatíveis. As carteiras Bittensor são guardadas para uso futuro e ainda não podem receber pagamentos."
  ru: "Поддерживаются адреса USDC в сети Solana и адреса Bittensor (TAO). Кошельки Bittensor сохраняются для будущего использования и пока не могут получать выплаты."
  sv: "Solana USDC-adresser och Bittensor-adresser (TAO) stöds. Bittensor-plånböcker sparas för framtida bruk och kan inte ta emot utbetalningar än."
  sw: "Anwani za USDC za Solana na anwani za Bittensor (TAO) zinatumika. Pochi za Bittensor huhifadhiwa kwa matumizi ya baadaye na haziwezi kupokea malipo bado."
  th: "รองรับที่อยู่ USDC บน Solana และที่อยู่ Bittensor (TAO) กระเป๋า Bittensor จะถูกบันทึกไว้ใช้ในอนาคต และยังรับยอดจ่ายไม่ได้"
  uk: "Підтримуються адреси USDC у мережі Solana та адреси Bittensor (TAO). Гаманці Bittensor зберігаються для майбутнього використання і поки не можуть отримувати виплати."
  vi: "Hỗ trợ địa chỉ USDC trên Solana và địa chỉ Bittensor (TAO). Ví Bittensor được lưu để dùng trong tương lai và chưa thể nhận thanh toán."
  zh: "支持 Solana USDC 地址和 Bittensor (TAO) 地址。Bittensor 钱包会保存以备将来使用，目前还不能接收支付。"
  zh-HK: "支援 Solana USDC 地址和 Bittensor (TAO) 地址。Bittensor 錢包會儲存以備日後使用，暫時未能接收支付。"
