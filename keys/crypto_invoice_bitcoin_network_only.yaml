description: "Crypto invoice, Bitcoin only: the network to send on, shown with the address. Bitcoin sent on another network is not credited to this payment. The Bitcoin counterpart of usdc_solana_network_only. Bitcoin is a product name."
source: "Send only Bitcoin on the Bitcoin network to this address. Bitcoin sent on any other network won't be credited."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "أرسل Bitcoin على شبكة Bitcoin فقط إلى هذا العنوان. لن تُحتسب عملات Bitcoin المُرسَلة عبر أي شبكة أخرى."
  cs: "Na tuto adresu posílejte pouze Bitcoin v síti Bitcoin. Bitcoin odeslaný v jiné síti nebude připsán."
  de: "Sende an diese Adresse nur Bitcoin über das Bitcoin-Netzwerk. Bitcoin, die über ein anderes Netzwerk gesendet werden, werden nicht gutgeschrieben."
  el: "Στείλτε σε αυτή τη διεύθυνση μόνο Bitcoin στο δίκτυο Bitcoin. Τα Bitcoin που στέλνονται σε άλλο δίκτυο δεν θα πιστωθούν."
  en: "Send only Bitcoin on the Bitcoin network to this address. Bitcoin sent on any other network won't be credited."
  es: "Envía a esta dirección solo Bitcoin por la red Bitcoin. Los Bitcoin enviados por cualquier otra red no se acreditarán."
  es-419: "Envía a esta dirección solo Bitcoin por la red Bitcoin. Los Bitcoin enviados por cualquier otra red no se acreditarán."
  es-MX: "Envía a esta dirección solo Bitcoin por la red Bitcoin. Los Bitcoin enviados por cualquier otra red no se acreditarán."
  fr: "Envoyez uniquement du Bitcoin sur le réseau Bitcoin à cette adresse. Le Bitcoin envoyé sur un autre réseau ne sera pas crédité."
  he: "שלחו לכתובת הזו רק Bitcoin ברשת Bitcoin. Bitcoin שיישלח ברשת אחרת לא ייזקף לתשלום."
  hi: "इस पते पर केवल Bitcoin नेटवर्क पर Bitcoin भेजें। किसी अन्य नेटवर्क पर भेजे गए Bitcoin जमा नहीं होंगे।"
  id: "Kirim hanya Bitcoin di jaringan Bitcoin ke alamat ini. Bitcoin yang dikirim di jaringan lain tidak akan dikreditkan."
  it: "Invia a questo indirizzo solo Bitcoin sulla rete Bitcoin. I Bitcoin inviati su un'altra rete non verranno accreditati."
  ja: "このアドレスには Bitcoin ネットワークの Bitcoin のみを送金してください。他のネットワークで送金した Bitcoin は入金されません。"
  ko: "이 주소로는 Bitcoin 네트워크의 Bitcoin만 보내세요. 다른 네트워크로 보낸 Bitcoin은 입금 처리되지 않습니다."
  nl: "Stuur naar dit adres alleen Bitcoin via het Bitcoin-netwerk. Bitcoin die via een ander netwerk wordt verstuurd, wordt niet bijgeschreven."
  pl: "Na ten adres wysyłaj wyłącznie Bitcoin w sieci Bitcoin. Bitcoin wysłany w innej sieci nie zostanie zaksięgowany."
  pt: "Envie para este endereço apenas Bitcoin na rede Bitcoin. Bitcoin enviado noutra rede não será creditado."
  pt-BR: "Envie para este endereço apenas Bitcoin na rede Bitcoin. Bitcoin enviado em outra rede não será creditado."
  pt-PT: "Envie para este endereço apenas Bitcoin na rede Bitcoin. Bitcoin enviado noutra rede não será creditado."
  ru: "Отправляйте на этот адрес только Bitcoin в сети Bitcoin. Bitcoin, отправленный в другой сети, не будет зачислен."
  sv: "Skicka endast Bitcoin på Bitcoin-nätverket till den här adressen. Bitcoin som skickas på ett annat nätverk krediteras inte."
  sw: "Tuma Bitcoin kwenye mtandao wa Bitcoin pekee kwa anwani hii. Bitcoin zilizotumwa kwenye mtandao mwingine hazitahesabiwa."
  th: "ส่งเฉพาะ Bitcoin บนเครือข่าย Bitcoin มายังที่อยู่นี้ Bitcoin ที่ส่งบนเครือข่ายอื่นจะไม่ถูกนับเป็นยอดชำระ"
  uk: "Надсилайте на цю адресу лише Bitcoin у мережі Bitcoin. Bitcoin, надісланий в іншій мережі, не буде зараховано."
  vi: "Chỉ gửi Bitcoin trên mạng Bitcoin đến địa chỉ này. Bitcoin gửi trên mạng khác sẽ không được ghi nhận."
  zh: "请仅向此地址发送 Bitcoin 网络上的 Bitcoin。通过其他网络发送的 Bitcoin 将不会入账。"
  zh-HK: "請僅向此地址發送 Bitcoin 網絡上的 Bitcoin。透過其他網絡發送的 Bitcoin 將不會入賬。"
