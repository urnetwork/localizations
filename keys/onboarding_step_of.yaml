description: "Accessibility description of the onboarding step bubbles: the current step and the total."
source: "Step %1$d of %2$d"
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: step
    type: int
  - name: total
    type: int
localizations:
  ar: "الخطوة {step} من {total}"
  de: "Schritt {step} von {total}"
  en: "Step {step} of {total}"
  es: "Paso {step} de {total}"
  ru: "Шаг {step} из {total}"
  zh: "第 {step} 步，共 {total} 步"
