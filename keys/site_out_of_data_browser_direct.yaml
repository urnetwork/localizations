description: "ur.io Connect screen, out-of-balance notice: what the browser does meanwhile when the URnetwork extension's kill switch is off (its default). The extension then takes its proxy off after failed health checks (or, in Firefox, sends each request directly), so the browser goes online without URnetwork. Keep URnetwork as is; translate kill switch as the extension and the apps do."
source: "With the kill switch off, the extension soon lets this browser connect directly, without URnetwork."
platforms:
  - site
localizations:
  ar: "عندما يكون مفتاح الإيقاف معطّلًا، ستسمح الإضافة قريبًا لهذا المتصفح بالاتصال مباشرةً، بدون URnetwork."
  cs: "Když je kill switch vypnutý, rozšíření brzy nechá tento prohlížeč připojit se přímo, bez URnetwork."
  de: "Ist der Kill Switch aus, lässt die Erweiterung diesen Browser bald direkt verbinden, ohne URnetwork."
  el: "Με το kill switch απενεργοποιημένο, η επέκταση σύντομα αφήνει αυτό το πρόγραμμα περιήγησης να συνδεθεί απευθείας, χωρίς το URnetwork."
  en: "With the kill switch off, the extension soon lets this browser connect directly, without URnetwork."
  es: "Con el kill switch desactivado, la extensión pronto deja que este navegador se conecte directamente, sin URnetwork."
  es-419: "Con el kill switch desactivado, la extensión pronto deja que este navegador se conecte directamente, sin URnetwork."
  es-MX: "Con el kill switch desactivado, la extensión pronto deja que este navegador se conecte directamente, sin URnetwork."
  fr: "Avec le kill switch désactivé, l’extension laisse bientôt ce navigateur se connecter directement, sans URnetwork."
  he: "כשהקיל סוויץ' כבוי, התוסף יאפשר בקרוב לדפדפן הזה להתחבר ישירות, בלי URnetwork."
  hi: "किल स्विच बंद होने पर, एक्सटेंशन जल्द ही इस ब्राउज़र को URnetwork के बिना सीधे कनेक्ट होने देता है।"
  id: "Dengan kill switch nonaktif, ekstensi akan segera membiarkan browser ini terhubung langsung, tanpa URnetwork."
  it: "Con il kill switch disattivato, l’estensione lascia presto che questo browser si connetta direttamente, senza URnetwork."
  ja: "キルスイッチがオフの場合、拡張機能はまもなくこのブラウザを URnetwork を介さずに直接接続させます。"
  ko: "킬 스위치가 꺼져 있으면 확장 프로그램이 곧 이 브라우저를 URnetwork 없이 직접 연결되게 합니다."
  nl: "Met de kill switch uit laat de extensie deze browser binnenkort rechtstreeks verbinden, zonder URnetwork."
  pl: "Gdy kill switch jest wyłączony, rozszerzenie wkrótce pozwoli tej przeglądarce łączyć się bezpośrednio, bez URnetwork."
  pt: "Com o kill switch desligado, a extensão em breve deixa este navegador se conectar diretamente, sem o URnetwork."
  pt-BR: "Com o kill switch desligado, a extensão em breve deixa este navegador se conectar diretamente, sem o URnetwork."
  pt-PT: "Com o kill switch desligado, a extensão em breve deixa este navegador ligar-se diretamente, sem o URnetwork."
  ru: "Если kill switch выключен, расширение вскоре позволит этому браузеру подключаться напрямую, без URnetwork."
  sv: "Med kill switch avstängd låter tillägget snart den här webbläsaren ansluta direkt, utan URnetwork."
  sw: "Kill switch ikiwa imezimwa, kiendelezi hivi karibuni kitaruhusu kivinjari hiki kuunganishwa moja kwa moja, bila URnetwork."
  th: "เมื่อปิดสวิตช์หยุดการเชื่อมต่อ ส่วนขยายจะให้เบราว์เซอร์นี้เชื่อมต่อโดยตรงโดยไม่ผ่าน URnetwork ในอีกไม่ช้า"
  uk: "Якщо kill switch вимкнено, розширення незабаром дозволить цьому браузеру під'єднуватися напряму, без URnetwork."
  vi: "Khi tắt kill switch, tiện ích sẽ sớm cho trình duyệt này kết nối trực tiếp, không qua URnetwork."
  zh: "断网保护关闭时，扩展很快会让此浏览器直接连接，不经过 URnetwork。"
  zh-HK: "斷線開關 (Kill switch) 關閉時，擴充功能很快會讓此瀏覽器直接連線，不經過 URnetwork。"
