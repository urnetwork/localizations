description: "Call to action"
source: "No Solana wallets were found installed on this device. Please install a wallet and try again."
platforms:
  - android
localizations:
  ar: "لم يتم العثور على أي محافظ Solana مثبتة على هذا الجهاز. يرجى تثبيت محفظة والمحاولة مرة أخرى."
  cs: "V tomto zařízení nebyly nalezeny žádné peněženky Solana. Nainstalujte prosím peněženku a zkuste to znovu."
  de: "Es wurden keine Solana Wallets auf diesem Gerät gefunden. Bitte installieren Sie eine Wallet und versuchen Sie es erneut."
  el: "Δεν βρέθηκαν πορτοφόλια Solana εγκατεστημένα σε αυτήν τη συσκευή. Εγκαταστήστε ένα πορτοφόλι και δοκιμάστε ξανά."
  en: "No Solana wallets were found installed on this device. Please install a wallet and try again."
  es: "No se encontraron billeteras de Solana instaladas en este dispositivo. Instale una billetera e intente nuevamente."
  es-419: "No se encontraron billeteras de Solana instaladas en este dispositivo. Instale una billetera e intente nuevamente."
  es-MX: "No se encontraron billeteras de Solana instaladas en este dispositivo. Instale una billetera e intente nuevamente."
  fr: "Aucun portefeuille Solana n'a été trouvé installé sur cet appareil. Veuillez installer un portefeuille et réessayer."
  he: "לא נמצאו ארנקי Solana מותקנים במכשיר זה. התקן ארנק ונסה שוב."
  hi: "इस डिवाइस पर कोई Solana वॉलेट इंस्टॉल नहीं मिला. कृपया एक वॉलेट इंस्टॉल करें और फिर से प्रयास करें."
  id: "Tidak ada dompet Solana yang terpasang di perangkat ini. Silakan pasang dompet dan coba lagi."
  it: "Nessun portafoglio Solana installato è stato trovato su questo dispositivo. Installa un portafoglio e riprova."
  ja: "このデバイスにSolanaウォレットがインストールされていません。ウォレットをインストールして、もう一度お試しください。"
  ko: "이 장치에 설치된 Solana 지갑이 없습니다. 지갑을 설치하고 다시 시도하십시오."
  nl: "Er zijn geen Solana wallets geïnstalleerd op dit apparaat. Installeer een portemonnee en probeer het opnieuw."
  pl: "Nie znaleziono żadnych portfeli Solana zainstalowanych na tym urządzeniu. Zainstaluj portfel i spróbuj ponownie."
  pt: "Não foram encontradas carteiras Solana instaladas neste dispositivo. Instale uma carteira e tente novamente."
  pt-BR: "Nenhuma carteira Solana foi encontrada instalada neste dispositivo. Instale uma carteira e tente novamente."
  pt-PT: "Não foram encontradas carteiras Solana instaladas neste dispositivo. Instale uma carteira e tente novamente."
  ru: "На этом устройстве не найдено установленных кошельков Solana. Пожалуйста, установите кошелек и попробуйте снова."
  sv: "Inga installerade Solana-plånböcker hittades på den här enheten. Installera en plånbok och försök igen."
  sw: "Hakuna pochi za Solana zilizopatikana zimewekwa kwenye kifaa hiki. Tafadhali sakinisha pochi na ujaribu tena."
  th: "ไม่พบการติดตั้งแอพกระเป๋า Solana บนเครื่องนี้ โปรดติดตั้ง"
  uk: "На цьому пристрої не знайдено встановлених гаманців Solana. Будь ласка, встановіть гаманець і спробуйте ще раз."
  vi: "Không tìm thấy ví Solana nào được cài đặt trên thiết bị này. Vui lòng cài đặt ví và thử lại."
  zh: "在此设备上未找到已安装的 Solana 钱包。请安装一个钱包，然后重试。"
  zh-HK: "在此裝置上找不到已安裝的 Solana 錢包。請安裝錢包後再試一次。"
