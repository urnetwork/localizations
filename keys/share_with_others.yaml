description: "Setup wallet"
source: "You share with others, we share with you. Earn a share of revenue when you provide data to others in the network."
platforms:
  - android
  - apple
localizations:
  ar: "أنت تشارك مع الآخرين، ونحن نشارك معك. اكسب حصة من الإيرادات عندما تقدم بيانات للآخرين على الشبكة."
  cs: "Sdílíte s ostatními, my sdílíme s vámi. Získejte podíl na výnosech, když poskytujete data ostatním v síti."
  de: "Du teilst mit anderen, wir teilen mit dir. Verdiene einen Teil der Einnahmen, wenn du Daten an andere im Netzwerk weitergibst."
  el: "Μοιράζεστε με άλλους, μοιραζόμαστε μαζί σας. Κερδίστε ένα μερίδιο εσόδων όταν παρέχετε δεδομένα σε άλλους στο δίκτυο."
  en: "You share with others, we share with you. Earn a share of revenue when you provide data to others in the network."
  es: "Tú compartes con otros, nosotros compartimos contigo. Gana una parte de los ingresos cuando proporcionas datos a otros en la red."
  es-419: "Tú compartes con otros, nosotros compartimos contigo. Gana una parte de los ingresos cuando proporcionas datos a otros en la red."
  es-MX: "Tú compartes con otros, nosotros compartimos contigo. Gana una parte de los ingresos cuando proporcionas datos a otros en la red."
  fr: "Vous partagez avec les autres, nous partageons avec vous. Gagnez une part des revenus lorsque vous fournissez des données à d'autres personnes du réseau."
  he: "אתה משתף עם אחרים, אנחנו משתפים איתך. הרווח חלק מההכנסות כשאתה מספק נתונים לאחרים ברשת."
  hi: "आप दूसरों के साथ साझा करते हैं, हम आपके साथ साझा करते हैं। जब आप नेटवर्क में दूसरों को डेटा प्रदान करते हैं तो राजस्व का एक हिस्सा अर्जित करें।"
  id: "Anda berbagi dengan orang lain, kami berbagi dengan Anda. Dapatkan bagian pendapatan saat Anda menyediakan data untuk orang lain di jaringan."
  it: "Tu condividi con gli altri, noi condividiamo con te. Guadagna una parte dei ricavi quando fornisci dati ad altri nella rete."
  ja: "あなたが他の人と共有すれば、私たちもあなたと共有します。ネットワーク内の他の人にデータを提供すると、収益の一部を獲得できます。"
  ko: "당신이 다른 사람과 공유하면, 우리도 당신과 공유합니다. 네트워크의 다른 사람들에게 데이터를 제공하면 수익의 일부를 얻을 수 있습니다."
  nl: "Jij deelt met anderen, wij delen met jou. Verdien een deel van de opbrengsten wanneer je gegevens deelt met anderen in het netwerk."
  pl: "Ty dzielisz się z innymi, my dzielimy się z tobą. Zarabiaj część przychodów, gdy udostępniasz dane innym w sieci."
  pt: "Você compartilha com outras pessoas, nós compartilhamos com você. Ganhe uma parte da receita quando fornecer dados para outras pessoas na rede."
  pt-BR: "Você compartilha com outras pessoas, nós compartilhamos com você. Ganhe uma parte da receita quando fornecer dados para outras pessoas na rede."
  pt-PT: "Você partilha com outros, nós partilhamos consigo. Ganhe uma parte da receita ao fornecer dados a outros na rede."
  ru: "Вы делитесь с другими, мы делимся с вами. Получайте долю дохода, предоставляя данные другим участникам сети."
  sv: "Du delar med andra, vi delar med dig. Tjäna en del av intäkterna när du tillhandahåller data till andra i nätverket."
  sw: "Unashiriki na wengine, tunashiriki nawe. Pata sehemu ya mapato unapompa data wengine kwenye mtandao."
  th: "คุณแบ่งปันให้กับผู้อื่น เราก็แบ่งปันกลับให้คุณ แชร์ข้อมูลกับเครือข่ายแล้วรับส่วนแบ่งรายได้ตอบแทน"
  uk: "Ви ділитесь з іншими, ми ділимось з вами. Отримуйте частку доходу, коли надаєте дані іншим у мережі."
  vi: "Bạn chia sẻ với người khác, chúng tôi chia sẻ với bạn. Kiếm được phần doanh thu khi bạn cung cấp dữ liệu cho người khác trong mạng."
  zh: "您与他人分享，我们与您分享。当您向网络中的其他人提供数据时，即可获得收入分成。"
  zh-HK: "你與他人分享，我們與你分享。當你為網絡中的其他人提供數據時，即可賺取收益分成。"
