description: "Earnings, with the capture the flag account (sn_ctf_pool): a line saying a capture the flag draw gave this device one of a country's five provider slots (GET /sn/ctf/client). Up to five devices win a role's slots, and a flag counts as held only once all ten of a country's slots are won, so say the device won a slot, never that it captured or holds the flag. The placeholder is the country's name exactly as the app shows it, e.g. Kenya, with no case ending or article added, so keep it where the bare name reads correctly (several languages lead with it: \"{country}: ...\"). Mention no amount."
source: "You won one of the %@ provider slots"
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: country
    type: string
