description: "Extender status when the last activation failed and no family is active. The argument is the error."
source: "Activation failed: %@"
platforms:
  - apple
  - linux
  - windows
placeholders:
  - name: error
    type: string
localizations:
  ar: "فشل التفعيل: {error}"
  de: "Aktivierung fehlgeschlagen: {error}"
  en: "Activation failed: {error}"
  es: "Error de activación: {error}"
  ru: "Не удалось активировать: {error}"
  zh: "激活失败：{error}"
