description: "Muted text under the switch on the Hotspot proxy screen: who can use the proxy, how, and that their traffic only goes through the tunnel."
source: "Devices on your Wi-Fi hotspot or USB tethering can use URnetwork through an HTTP or SOCKS5 proxy on this phone. Their traffic goes only through URnetwork, so nothing is shared while you are disconnected."
platforms:
  - android
localizations:
  ar: "يمكن للأجهزة المتصلة بنقطة اتصال Wi-Fi أو بالربط عبر USB استخدام URnetwork من خلال وكيل HTTP أو SOCKS5 على هذا الهاتف. تمر حركة بياناتها عبر URnetwork فقط، لذلك لا تتم مشاركة أي شيء أثناء قطع الاتصال."
  cs: "Zařízení na vašem Wi-Fi hotspotu nebo připojená přes USB tethering mohou používat URnetwork přes proxy HTTP nebo SOCKS5 v tomto telefonu. Jejich provoz jde pouze přes URnetwork, takže když jste odpojeni, nic se nesdílí."
  de: "Geräte in deinem WLAN-Hotspot oder per USB-Tethering können URnetwork über einen HTTP- oder SOCKS5-Proxy auf diesem Telefon nutzen. Ihr Datenverkehr läuft nur über URnetwork, daher wird nichts geteilt, solange du nicht verbunden bist."
  el: "Οι συσκευές στο hotspot Wi-Fi ή στη σύνδεση USB μπορούν να χρησιμοποιούν το URnetwork μέσω ενός διακομιστή μεσολάβησης HTTP ή SOCKS5 σε αυτό το τηλέφωνο. Η κίνησή τους περνά μόνο μέσω του URnetwork, οπότε τίποτα δεν μοιράζεται όσο είστε αποσυνδεδεμένοι."
  en: "Devices on your Wi-Fi hotspot or USB tethering can use URnetwork through an HTTP or SOCKS5 proxy on this phone. Their traffic goes only through URnetwork, so nothing is shared while you are disconnected."
  es: "Los dispositivos de tu punto de acceso Wi-Fi o conectados por USB pueden usar URnetwork a través de un proxy HTTP o SOCKS5 en este teléfono. Su tráfico solo pasa por URnetwork, así que no se comparte nada mientras estés desconectado."
  es-419: "Los dispositivos de tu punto de acceso Wi-Fi o conectados por USB pueden usar URnetwork a través de un proxy HTTP o SOCKS5 en este teléfono. Su tráfico solo pasa por URnetwork, así que no se comparte nada mientras estés desconectado."
  es-MX: "Los dispositivos de tu punto de acceso Wi-Fi o conectados por USB pueden usar URnetwork a través de un proxy HTTP o SOCKS5 en este teléfono. Su tráfico solo pasa por URnetwork, así que no se comparte nada mientras estés desconectado."
  fa: "دستگاه‌های متصل به نقطه اتصال Wi-Fi یا اشتراک‌گذاری اینترنت از طریق USB می‌توانند از راه یک پروکسی HTTP یا SOCKS5 روی این تلفن از URnetwork استفاده کنند. ترافیک آن‌ها فقط از URnetwork عبور می‌کند، بنابراین وقتی اتصال شما قطع است چیزی به اشتراک گذاشته نمی‌شود."
  fr: "Les appareils connectés à votre point d'accès Wi-Fi ou en partage de connexion USB peuvent utiliser URnetwork via un proxy HTTP ou SOCKS5 sur ce téléphone. Leur trafic passe uniquement par URnetwork : rien n'est partagé tant que vous êtes déconnecté."
  he: "מכשירים בנקודה החמה של ה-Wi-Fi או בשיתוף אינטרנט דרך USB יכולים להשתמש ב-URnetwork דרך פרוקסי HTTP או SOCKS5 בטלפון הזה. התעבורה שלהם עוברת רק דרך URnetwork, כך ששום דבר לא משותף כשאתם מנותקים."
  hi: "आपके Wi-Fi हॉटस्पॉट या USB टेदरिंग से जुड़े डिवाइस इस फ़ोन पर HTTP या SOCKS5 प्रॉक्सी के ज़रिए URnetwork का उपयोग कर सकते हैं। उनका ट्रैफ़िक सिर्फ़ URnetwork से होकर जाता है, इसलिए डिस्कनेक्ट रहने पर कुछ भी शेयर नहीं होता।"
  id: "Perangkat di hotspot Wi-Fi atau tethering USB Anda dapat menggunakan URnetwork melalui proxy HTTP atau SOCKS5 di ponsel ini. Lalu lintasnya hanya melewati URnetwork, jadi tidak ada yang dibagikan saat Anda terputus."
  it: "I dispositivi collegati al tuo hotspot Wi-Fi o tramite tethering USB possono usare URnetwork tramite un proxy HTTP o SOCKS5 su questo telefono. Il loro traffico passa solo attraverso URnetwork, quindi non viene condiviso nulla mentre sei disconnesso."
  ja: "Wi-Fi テザリングや USB テザリングでつないだデバイスは、このスマートフォンの HTTP または SOCKS5 プロキシを通じて URnetwork を使えます。通信は URnetwork だけを通るため、接続していない間は何も共有されません。"
  ko: "Wi-Fi 핫스팟이나 USB 테더링에 연결된 기기는 이 휴대폰의 HTTP 또는 SOCKS5 프록시를 통해 URnetwork를 사용할 수 있습니다. 트래픽은 URnetwork로만 전달되므로 연결이 끊긴 동안에는 아무것도 공유되지 않습니다."
  nl: "Apparaten op je wifi-hotspot of via USB-tethering kunnen URnetwork gebruiken via een HTTP- of SOCKS5-proxy op deze telefoon. Hun verkeer gaat alleen via URnetwork, dus er wordt niets gedeeld zolang je niet verbonden bent."
  pl: "Urządzenia w Twoim hotspocie Wi-Fi lub podłączone przez USB mogą korzystać z URnetwork przez serwer proxy HTTP lub SOCKS5 w tym telefonie. Ich ruch przechodzi wyłącznie przez URnetwork, więc gdy nie masz połączenia, nic nie jest udostępniane."
  pt: "Os dispositivos ligados ao seu ponto de acesso Wi-Fi ou por USB podem usar a URnetwork através de um proxy HTTP ou SOCKS5 neste telefone. O tráfego deles passa apenas pela URnetwork, por isso nada é partilhado enquanto estiver desligado."
  pt-BR: "Os dispositivos conectados ao seu ponto de acesso Wi-Fi ou por USB podem usar a URnetwork por meio de um proxy HTTP ou SOCKS5 neste celular. O tráfego deles passa apenas pela URnetwork, então nada é compartilhado enquanto você estiver desconectado."
  pt-PT: "Os dispositivos ligados ao seu ponto de acesso Wi-Fi ou por USB podem usar a URnetwork através de um proxy HTTP ou SOCKS5 neste telefone. O tráfego deles passa apenas pela URnetwork, por isso nada é partilhado enquanto estiver desligado."
  ru: "Устройства, подключённые к вашей точке доступа Wi-Fi или через USB-модем, могут пользоваться URnetwork через прокси HTTP или SOCKS5 на этом телефоне. Их трафик идёт только через URnetwork, поэтому, пока вы не подключены, ничего не передаётся."
  sv: "Enheter i din wifi-surfzon eller via USB-internetdelning kan använda URnetwork via en HTTP- eller SOCKS5-proxy på den här telefonen. Deras trafik går bara via URnetwork, så inget delas när du inte är ansluten."
  sw: "Vifaa vilivyo kwenye hotspot yako ya Wi-Fi au vilivyounganishwa kwa USB vinaweza kutumia URnetwork kupitia proksi ya HTTP au SOCKS5 kwenye simu hii. Trafiki yao hupita kwenye URnetwork pekee, kwa hivyo hakuna kinachoshirikiwa ukiwa hujaunganishwa."
  th: "อุปกรณ์ที่เชื่อมต่อฮอตสปอต Wi-Fi หรือการปล่อยสัญญาณผ่าน USB ของคุณสามารถใช้ URnetwork ผ่านพร็อกซี HTTP หรือ SOCKS5 บนโทรศัพท์เครื่องนี้ได้ การรับส่งข้อมูลของอุปกรณ์เหล่านั้นผ่าน URnetwork เท่านั้น จึงไม่มีการแชร์ใดๆ ขณะที่คุณไม่ได้เชื่อมต่อ"
  tr: "Wi-Fi hotspot'unuza veya USB internet paylaşımına bağlı cihazlar, bu telefondaki bir HTTP veya SOCKS5 proxy'si üzerinden URnetwork'ü kullanabilir. Trafikleri yalnızca URnetwork üzerinden geçer; bu nedenle bağlantınız kesikken hiçbir şey paylaşılmaz."
  uk: "Пристрої у вашій точці доступу Wi-Fi або підключені через USB-модем можуть користуватися URnetwork через проксі HTTP або SOCKS5 на цьому телефоні. Їхній трафік іде лише через URnetwork, тож поки ви не підключені, нічого не передається."
  vi: "Các thiết bị trong điểm phát sóng Wi-Fi hoặc kết nối qua USB của bạn có thể dùng URnetwork thông qua proxy HTTP hoặc SOCKS5 trên điện thoại này. Lưu lượng của chúng chỉ đi qua URnetwork, nên không có gì được chia sẻ khi bạn ngắt kết nối."
  zh: "连接到你的 Wi-Fi 热点或 USB 网络共享的设备，可以通过这部手机上的 HTTP 或 SOCKS5 代理使用 URnetwork。它们的流量只经过 URnetwork，因此在你断开连接时不会共享任何内容。"
  zh-HK: "連接到你的 Wi-Fi 熱點或 USB 網絡共享的裝置，可以透過這部手機上的 HTTP 或 SOCKS5 代理使用 URnetwork。它們的流量只經過 URnetwork，因此在你中斷連線時不會共享任何內容。"
