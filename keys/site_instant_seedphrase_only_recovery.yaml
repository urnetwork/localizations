description: "Instant account creation: hint that the seedphrase is the only way to recover the account."
source: "No email or password is needed. A 24-word seedphrase is the only way to recover the account."
platforms:
  - site
localizations:
  en: "No email or password is needed. A 24-word seedphrase is the only way to recover the account."
  ar: "لا حاجة إلى بريد إلكتروني أو كلمة مرور. عبارة الاسترداد المكونة من 24 كلمة هي الطريقة الوحيدة لاستعادة الحساب."
  cs: "Není potřeba e-mail ani heslo. 24slovná seedphrase je jediný způsob, jak účet obnovit."
  de: "Keine E-Mail und kein Passwort nötig. Eine 24 Wörter lange Seedphrase ist der einzige Weg, das Konto wiederherzustellen."
  el: "Δεν χρειάζεται email ή κωδικός. Μια seedphrase 24 λέξεων είναι ο μόνος τρόπος ανάκτησης του λογαριασμού."
  es: "No hace falta correo ni contraseña. Una frase semilla de 24 palabras es la única forma de recuperar la cuenta."
  es-419: "No se necesita correo ni contraseña. Una frase semilla de 24 palabras es la única forma de recuperar la cuenta."
  es-MX: "No se necesita correo ni contraseña. Una frase semilla de 24 palabras es la única forma de recuperar la cuenta."
  fr: "Aucun e-mail ni mot de passe n'est nécessaire. Une phrase de récupération de 24 mots est le seul moyen de récupérer le compte."
  he: "אין צורך באימייל או בסיסמה. ביטוי סיד בן 24 מילים הוא הדרך היחידה לשחזר את החשבון."
  hi: "ईमेल या पासवर्ड की ज़रूरत नहीं है। 24-शब्दों का सीडफ़्रेज़ ही खाता पुनर्प्राप्त करने का एकमात्र तरीका है।"
  id: "Tidak perlu email atau kata sandi. Seedphrase 24 kata adalah satu-satunya cara memulihkan akun."
  it: "Non servono email o password. Una seedphrase di 24 parole è l'unico modo per recuperare l'account."
  ja: "メールアドレスもパスワードも不要です。24語のシードフレーズがアカウントを復元する唯一の方法です。"
  ko: "이메일이나 비밀번호가 필요 없습니다. 24단어 시드 문구가 계정을 복구하는 유일한 방법입니다."
  nl: "Geen e-mail of wachtwoord nodig. Een seedphrase van 24 woorden is de enige manier om het account te herstellen."
  pl: "Nie potrzeba e-maila ani hasła. 24-wyrazowa seedphrase to jedyny sposób odzyskania konta."
  pt: "Não é necessário e-mail nem palavra-passe. Uma frase-semente de 24 palavras é a única forma de recuperar a conta."
  pt-BR: "Não é preciso e-mail nem senha. Uma frase-semente de 24 palavras é a única forma de recuperar a conta."
  pt-PT: "Não é necessário e-mail nem palavra-passe. Uma frase-semente de 24 palavras é a única forma de recuperar a conta."
  ru: "Email и пароль не нужны. Сид-фраза из 24 слов — единственный способ восстановить аккаунт."
  sv: "Ingen e-post eller lösenord behövs. En 24-ordig seedfras är det enda sättet att återställa kontot."
  sw: "Hakuna barua pepe au nenosiri linalohitajika. Seedphrase ya maneno 24 ndiyo njia pekee ya kurejesha akaunti."
  th: "ไม่ต้องใช้อีเมลหรือรหัสผ่าน ซีดเฟรส 24 คำเป็นวิธีเดียวในการกู้คืนบัญชี"
  uk: "Електронна пошта чи пароль не потрібні. Сід-фраза з 24 слів — єдиний спосіб відновити акаунт."
  vi: "Không cần email hay mật khẩu. Seedphrase 24 từ là cách duy nhất để khôi phục tài khoản."
  zh: "无需邮箱或密码。24 个单词的助记词是恢复账户的唯一方式。"
  zh-HK: "無需電郵或密碼。24 個單詞的助記詞是復原帳戶的唯一方式。"
