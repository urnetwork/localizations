description: "Mock location setup step: enable Android developer options by tapping the build number in About phone."
source: "Turn on developer options: open About phone and tap Build number seven times."
platforms:
  - android
localizations:
  ar: "فعّل خيارات المطوّرين: افتح «لمحة عن الهاتف» وانقر على «رقم الإصدار» سبع مرات."
  cs: "Zapněte možnosti pro vývojáře: otevřete „Informace o telefonu“ a sedmkrát klepněte na „Číslo sestavení“."
  de: "Aktiviere die Entwickleroptionen: Öffne „Über das Telefon“ und tippe siebenmal auf „Build-Nummer“."
  el: "Ενεργοποιήστε τις επιλογές προγραμματιστή: ανοίξτε τις «Πληροφορίες τηλεφώνου» και πατήστε επτά φορές τον «Αριθμό έκδοσης»."
  en: "Turn on developer options: open About phone and tap Build number seven times."
  es: "Activa las opciones para desarrolladores: abre «Información del teléfono» y toca siete veces «Número de compilación»."
  es-419: "Activa las opciones para desarrolladores: abre “Acerca del teléfono” y toca siete veces “Número de compilación”."
  es-MX: "Activa las opciones para desarrolladores: abre “Acerca del teléfono” y toca siete veces “Número de compilación”."
  fr: "Activez les options pour les développeurs : ouvrez « À propos du téléphone » et appuyez sept fois sur « Numéro de build »."
  he: "הפעל את אפשרויות המפתחים: פתח את ״מידע על הטלפון״ והקש שבע פעמים על ״מספר Build״."
  hi: "डेवलपर विकल्प चालू करें: “फ़ोन के बारे में जानकारी” खोलें और “बिल्ड नंबर” पर सात बार टैप करें।"
  id: "Aktifkan opsi developer: buka “Tentang ponsel”, lalu ketuk “Nomor build” tujuh kali."
  it: "Attiva le opzioni sviluppatore: apri “Informazioni sul telefono” e tocca sette volte “Numero build”."
  ja: "開発者向けオプションをオンにします。「デバイス情報」を開き、「ビルド番号」を7回タップします。"
  ko: "개발자 옵션을 켭니다. '휴대전화 정보'를 열고 '빌드 번호'를 일곱 번 탭하세요."
  nl: "Zet de opties voor ontwikkelaars aan: open “Over de telefoon” en tik zeven keer op “Build-nummer”."
  pl: "Włącz opcje programisty: otwórz „Informacje o telefonie” i kliknij siedem razy „Numer kompilacji”."
  pt: "Ative as opções de programador: abra «Acerca do telemóvel» e toque sete vezes em «Número da compilação»."
  pt-BR: "Ative as opções do desenvolvedor: abra “Sobre o dispositivo” e toque sete vezes em “Número da versão”."
  pt-PT: "Ative as opções de programador: abra «Acerca do telemóvel» e toque sete vezes em «Número da compilação»."
  ru: "Включите параметры разработчика: откройте «О телефоне» и семь раз нажмите на «Номер сборки»."
  sv: "Aktivera utvecklaralternativen: öppna ”Om telefonen” och tryck sju gånger på ”Byggnummer”."
  sw: "Washa chaguo za wasanidi programu: fungua “Kuhusu simu” kisha uguse “Nambari ya muundo” mara saba."
  th: "เปิดตัวเลือกสำหรับนักพัฒนาแอป: เปิด “เกี่ยวกับโทรศัพท์” แล้วแตะ “หมายเลขบิลด์” เจ็ดครั้ง"
  uk: "Увімкніть параметри розробника: відкрийте «Про телефон» і сім разів торкніться «Номер збірки»."
  vi: "Bật tùy chọn cho nhà phát triển: mở “Giới thiệu về điện thoại” rồi nhấn bảy lần vào “Số bản dựng”."
  zh: "开启开发者选项：打开“关于手机”，然后连续点按“版本号”七次。"
  zh-HK: "開啟開發人員選項：打開「關於手機」，然後連續輕按「版本號碼」七次。"
