description: "Onboarding email E1: invitation to reply. {platform} is the device name the server knows, e.g. \"iPhone\" or \"Android phone\". Replies reach the support inbox, so it says where they go and \"tell us\", not \"I read every reply\" (2026-11-13 review)."
source: "If Connect didn't work on your {platform}, reply to this email and tell us what you saw. Every reply reaches our support inbox."
platforms:
  - email
placeholders:
  - name: platform
    type: string
localizations:
  en: "If Connect didn't work on your {platform}, reply to this email and tell us what you saw. Every reply reaches our support inbox."
  ar: "إذا لم يعمل «اربط» على {platform} لديك، فردّ على هذه الرسالة وأخبرنا بما رأيته. كل ردّ يصل إلى صندوق بريد الدعم لدينا."
  cs: "Pokud Připojit na vašem {platform} nefungovalo, odpovězte na tento e-mail a napište nám, co jste viděli. Každá odpověď dorazí do naší schránky podpory."
  de: "Wenn „Verbinde“ auf deinem {platform} nicht funktioniert hat, antworte auf diese E-Mail und sag uns, was du gesehen hast. Jede Antwort landet in unserem Support-Postfach."
  el: "Αν η Σύνδεση δεν δούλεψε στο {platform} σου, απάντησε σε αυτό το email και πες μας τι είδες. Κάθε απάντηση φτάνει στα εισερχόμενα της υποστήριξής μας."
  es: "Si Conecta no funcionó en tu {platform}, responde a este correo y cuéntanos qué viste. Cada respuesta llega a nuestra bandeja de soporte."
  es-419: "Si Conecta no funcionó en tu {platform}, responde a este correo y cuéntanos qué viste. Cada respuesta llega a nuestra bandeja de soporte."
  es-MX: "Si Conecta no funcionó en tu {platform}, responde a este correo y cuéntanos qué viste. Cada respuesta llega a nuestra bandeja de soporte."
  fr: "Si Connecte n'a pas marché sur ton {platform}, réponds à cet e-mail et dis-nous ce que tu as vu. Chaque réponse arrive dans notre boîte de support."
  he: "אם התחבר לא עבד ב{platform} שלך, השיבו למייל הזה וספרו לנו מה ראיתם. כל תשובה מגיעה לתיבת התמיכה שלנו."
  hi: "अगर आपके {platform} पर कनेक्ट करें काम नहीं किया, तो इस ईमेल का जवाब दें और हमें बताएं कि आपने क्या देखा। हर जवाब हमारे सपोर्ट इनबॉक्स में पहुँचता है।"
  id: "Kalau Hubungkan tidak berhasil di {platform} kamu, balas email ini dan ceritakan kepada kami apa yang kamu lihat. Setiap balasan masuk ke kotak masuk dukungan kami."
  it: "Se Connetti non ha funzionato sul tuo {platform}, rispondi a questa email e dicci cosa hai visto. Ogni risposta arriva nella nostra casella dell'assistenza."
  ja: "お使いの {platform} で「接続」がうまくいかなかったら、このメールに返信して、何が表示されたか私たちに教えてください。返信はすべてサポートの受信箱に届きます。"
  ko: "{platform}에서 연결이 안 됐다면 이 메일에 답장해서 어떤 화면이 나왔는지 저희에게 알려 주세요. 모든 답장은 저희 지원팀 받은편지함으로 전달됩니다."
  nl: "Als Verbinden niet werkte op je {platform}, beantwoord dan deze e-mail en vertel ons wat je zag. Elk antwoord komt binnen in onze supportinbox."
  pl: "Jeśli Połącz nie zadziałało na twoim {platform}, odpowiedz na ten e-mail i napisz nam, co widziałeś. Każda odpowiedź trafia do naszej skrzynki wsparcia."
  pt: "Se Conecte não funcionou no seu {platform}, responda a este e-mail e nos conte o que você viu. Toda resposta chega à nossa caixa de suporte."
  pt-BR: "Se Conecte não funcionou no seu {platform}, responda a este e-mail e nos conte o que você viu. Toda resposta chega à nossa caixa de suporte."
  pt-PT: "Se Ligar não funcionou no seu {platform}, responda a este e-mail e diga-nos o que viu. Todas as respostas chegam à nossa caixa de apoio."
  ru: "Если «Подключить» не сработало на вашем {platform}, ответьте на это письмо и расскажите нам, что вы увидели. Каждый ответ попадает в почтовый ящик нашей поддержки."
  sv: "Om Anslut inte fungerade på din {platform}, svara på det här mejlet och berätta för oss vad du såg. Varje svar hamnar i vår supportinkorg."
  sw: "Ikiwa Unganisha haikufanya kazi kwenye {platform} yako, jibu barua pepe hii na utuambie ulichoona. Kila jibu linafika kwenye kisanduku cha barua cha usaidizi wetu."
  th: "ถ้า เชื่อมต่อ ไม่ทำงานบน {platform} ของคุณ ตอบกลับอีเมลนี้แล้วบอกเราว่าคุณเห็นอะไร ทุกคำตอบจะส่งถึงกล่องจดหมายฝ่ายซัพพอร์ตของเรา"
  uk: "Якщо «Підключитися» не спрацювало на вашому {platform}, дайте відповідь на цей лист і розкажіть нам, що ви побачили. Кожна відповідь потрапляє до поштової скриньки нашої підтримки."
  vi: "Nếu Kết nối không hoạt động trên {platform} của bạn, hãy trả lời email này và cho chúng tôi biết bạn thấy gì. Mọi câu trả lời đều được gửi đến hộp thư hỗ trợ của chúng tôi."
  zh: "如果“连接”在你的 {platform} 上不起作用，请回复这封邮件，告诉我们你看到了什么。每一封回复都会送达我们的支持邮箱。"
  zh-HK: "如果「連接」在你的 {platform} 上不起作用，請回覆這封郵件，告訴我們你看到了什麼。每一封回覆都會送達我們的支援郵箱。"
