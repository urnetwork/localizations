description: "Status line of one column of the IP version status row in the connect drawer: how many providers of that family (dualstack, IPv4 or IPv6) are connected. Shown under the family label only when the count is not zero. Lowercase."
source: "%lld connected"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: count
    type: int
plurals:
  select: count
localizations:
  ar:
    zero: "{count} متصل"
    one: "متصل واحد"
    two: "متصلان"
    few: "{count} متصلين"
    many: "{count} متصلًا"
    other: "{count} متصل"
  de:
    one: "{count} verbunden"
    other: "{count} verbunden"
  en:
    one: "{count} connected"
    other: "{count} connected"
  es:
    one: "{count} conectado"
    other: "{count} conectados"
  ru:
    one: "{count} подключён"
    few: "{count} подключено"
    many: "{count} подключено"
    other: "{count} подключено"
  zh:
    other: "已连接 {count} 个"
