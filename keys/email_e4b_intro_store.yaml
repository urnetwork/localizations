description: "Onboarding email E4b, for networks billed by the App Store or Google Play: the opening paragraph that introduces the welcome bonus WITHOUT a price (the store shows its own local price; App Store guideline 2.3.1(a)). Same text as email_e4b_intro minus its price sentence."
source: "It's been a week since you joined URnetwork, so here is the welcome bonus we give new members: a year of Pro with 3 months free."
platforms:
  - email
localizations:
  en: "It's been a week since you joined URnetwork, so here is the welcome bonus we give new members: a year of Pro with 3 months free."
  ar: "مضى أسبوع على انضمامك إلى URnetwork، فإليك مكافأة الترحيب التي نقدمها للأعضاء الجدد: سنة من Pro مع 3 أشهر مجانية."
  cs: "Je to týden, co jste se přidali k URnetwork, tak tady je uvítací bonus, který dáváme novým členům: rok Pro se 3 měsíci zdarma."
  de: "Vor einer Woche hast du dich bei URnetwork angemeldet, deshalb hier der Willkommensbonus, den wir neuen Mitgliedern geben: ein Jahr Pro mit 3 Gratis-Monaten."
  el: "Πέρασε μια εβδομάδα από τότε που μπήκες στο URnetwork, οπότε να το μπόνους καλωσορίσματος που δίνουμε στα νέα μέλη: ένας χρόνος Pro με 3 μήνες δωρεάν."
  es: "Hace una semana que te uniste a URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  es-419: "Hace una semana que te uniste a URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  es-MX: "Hace una semana que te uniste a URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  fr: "Ça fait une semaine que tu as rejoint URnetwork, alors voici le bonus de bienvenue qu'on offre aux nouveaux membres : un an de Pro avec 3 mois offerts."
  he: "עבר שבוע מאז שהצטרפתם ל-URnetwork, אז הנה בונוס הברוכים הבאים שאנחנו נותנים לחברים חדשים: שנה של Pro עם 3 חודשים בחינם."
  hi: "URnetwork से जुड़े आपको एक हफ़्ता हो गया, तो यह रहा वह स्वागत बोनस जो हम नए सदस्यों को देते हैं: Pro का एक साल, 3 महीने मुफ़्त।"
  id: "Sudah seminggu sejak kamu bergabung dengan URnetwork, jadi ini bonus sambutan yang kami berikan untuk anggota baru: setahun Pro dengan 3 bulan gratis."
  it: "È passata una settimana da quando ti sei unito a URnetwork, quindi ecco il bonus di benvenuto che diamo ai nuovi membri: un anno di Pro con 3 mesi gratis."
  ja: "URnetwork に登録して1週間になりますね。新しいメンバーへのウェルカムボーナスをどうぞ。Pro 1年分、3か月無料つき。"
  ko: "URnetwork에 가입하신 지 일주일이 됐네요. 새 회원에게 드리는 환영 보너스입니다. Pro 1년에 3개월 무료."
  nl: "Een week geleden ben je lid geworden van URnetwork, dus hier is de welkomstbonus die we nieuwe leden geven: een jaar Pro met 3 maanden gratis."
  pl: "Minął tydzień, odkąd dołączyłeś do URnetwork, więc oto bonus powitalny, który dajemy nowym członkom: rok Pro z 3 miesiącami za darmo."
  pt: "Faz uma semana que você entrou na URnetwork, então aqui vai o bônus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  pt-BR: "Faz uma semana que você entrou na URnetwork, então aqui vai o bônus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  pt-PT: "Passou uma semana desde que aderiu à URnetwork, por isso aqui fica o bónus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  ru: "Прошла неделя с тех пор, как вы присоединились к URnetwork, так что вот приветственный бонус, который мы даём новым участникам: год Pro с 3 бесплатными месяцами."
  sv: "Det har gått en vecka sedan du gick med i URnetwork, så här är välkomstbonusen vi ger nya medlemmar: ett år Pro med 3 månader gratis."
  sw: "Imepita wiki moja tangu ujiunge na URnetwork, kwa hivyo hii ndiyo bonasi ya kukaribisha tunayowapa wanachama wapya: mwaka mmoja wa Pro na miezi 3 bila malipo."
  th: "คุณสมัคร URnetwork มาครบหนึ่งสัปดาห์แล้ว นี่คือโบนัสต้อนรับที่เรามอบให้สมาชิกใหม่: Pro หนึ่งปี ฟรี 3 เดือน"
  uk: "Минув тиждень відтоді, як ви приєдналися до URnetwork, тож ось вітальний бонус, який ми даємо новим учасникам: рік Pro з 3 безкоштовними місяцями."
  vi: "Đã một tuần kể từ khi bạn tham gia URnetwork, nên đây là phần thưởng chào mừng chúng tôi dành cho thành viên mới: một năm Pro với 3 tháng miễn phí."
  zh: "你加入 URnetwork 已经一周了，所以这是我们给新成员的欢迎奖励：一年 Pro，免费 3 个月。"
  zh-HK: "你加入 URnetwork 已經一週了，所以這是我們給新成員的歡迎獎勵：一年 Pro，免費 3 個月。"
