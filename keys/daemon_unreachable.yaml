description: "Shown on the linux home screen when the privileged urnetworkd system service cannot be reached over its control socket (not installed, not running, or the user lacks access). Distinct from daemon_too_old by contract."
source: "The URnetwork system service is not running. Install or start it, then try again."
platforms:
  - linux
localizations:
  ar: "خدمة نظام URnetwork غير قيد التشغيل. ثبّتها أو شغّلها، ثم أعد المحاولة."
  cs: "Systémová služba URnetwork neběží. Nainstalujte ji nebo spusťte a zkuste to znovu."
  de: "Der URnetwork-Systemdienst läuft nicht. Installiere oder starte ihn und versuche es erneut."
  el: "Η υπηρεσία συστήματος URnetwork δεν εκτελείται. Εγκαταστήστε ή εκκινήστε την και δοκιμάστε ξανά."
  en: "The URnetwork system service is not running. Install or start it, then try again."
  es: "El servicio del sistema URnetwork no está en ejecución. Instálalo o inícialo y vuelve a intentarlo."
  es-419: "El servicio del sistema URnetwork no está en ejecución. Instálalo o inícialo y vuelve a intentarlo."
  es-MX: "El servicio del sistema URnetwork no está en ejecución. Instálalo o inícialo y vuelve a intentarlo."
  fr: "Le service système URnetwork n'est pas en cours d'exécution. Installez-le ou démarrez-le, puis réessayez."
  he: "שירות המערכת של URnetwork אינו פועל. התקן או הפעל אותו ונסה שוב."
  hi: "URnetwork सिस्टम सेवा नहीं चल रही है। इसे इंस्टॉल या शुरू करें, फिर दोबारा कोशिश करें।"
  id: "Layanan sistem URnetwork tidak berjalan. Pasang atau jalankan layanan tersebut, lalu coba lagi."
  it: "Il servizio di sistema URnetwork non è in esecuzione. Installalo o avvialo, poi riprova."
  ja: "URnetwork システムサービスが実行されていません。インストールまたは起動してから、もう一度お試しください。"
  ko: "URnetwork 시스템 서비스가 실행되고 있지 않습니다. 설치하거나 시작한 후 다시 시도하세요."
  nl: "De URnetwork-systeemservice draait niet. Installeer of start deze en probeer het opnieuw."
  pl: "Usługa systemowa URnetwork nie jest uruchomiona. Zainstaluj ją lub uruchom, a następnie spróbuj ponownie."
  pt: "O serviço de sistema URnetwork não está em execução. Instale-o ou inicie-o e tente novamente."
  pt-BR: "O serviço de sistema URnetwork não está em execução. Instale-o ou inicie-o e tente novamente."
  pt-PT: "O serviço de sistema URnetwork não está em execução. Instale-o ou inicie-o e tente novamente."
  ru: "Системная служба URnetwork не запущена. Установите или запустите её, затем повторите попытку."
  sv: "Systemtjänsten URnetwork körs inte. Installera eller starta den och försök igen."
  sw: "Huduma ya mfumo ya URnetwork haifanyi kazi. Isakinishe au ianzishe, kisha ujaribu tena."
