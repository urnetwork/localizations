description: "App top200 limits: at most 7 devices per fleet draw ahead into the validator's measured cohort (cohort 1,500 over 200 seats), direct devices only since a proxy slot shows no head score; a bound device outside it has left the pool and earns nothing"
source: "Bind at most 7 devices, direct ones only, unless the others are already measured. At most 7 devices per fleet draw ahead of the rest to be measured by the validator. A bound device that isn't measured earns no head score and has left the pool, so it earns nothing, and a proxy slot shows no head score at all."
platforms:
  - site
localizations:
  ar: "اربط 7 أجهزة على الأكثر، من الأجهزة المباشرة فقط، إلا إذا كانت الأجهزة الأخرى تخضع للقياس بالفعل. يحظى 7 أجهزة على الأكثر في كل أسطول بأولوية القياس لدى المدقِّق. الجهاز المربوط الذي لا يخضع للقياس لا يحصل على نتيجة في الفئة الرئيسية وقد غادر المجمّع، فلا يكسب شيئًا، ولا تحصل خانة البروكسي على أي نتيجة في الفئة الرئيسية."
  de: "Binde höchstens 7 Geräte, nur direkte, es sei denn, die übrigen werden bereits gemessen. Pro Flotte werden höchstens 7 Geräte vorrangig vom Validator gemessen. Ein gebundenes Gerät, das nicht gemessen wird, erhält keinen Head-Score und hat den Pool verlassen, verdient also nichts, und ein Proxy-Slot erhält überhaupt keinen Head-Score."
  en: "Bind at most 7 devices, direct ones only, unless the others are already measured. At most 7 devices per fleet draw ahead of the rest to be measured by the validator. A bound device that isn't measured earns no head score and has left the pool, so it earns nothing, and a proxy slot shows no head score at all."
  es: "Vincula 7 dispositivos como máximo, solo directos, salvo que los demás ya se estén midiendo. Por flota, como máximo 7 dispositivos tienen prioridad para que el validador los mida. Un dispositivo vinculado que no se mide no obtiene puntuación principal y ya ha salido del pool, así que no gana nada, y un slot de proxy no obtiene ninguna puntuación principal."
  ru: "Привязывайте не больше 7 устройств, только прямые, если только остальные уже не измеряются. В каждом парке приоритет на измерение валидатором получают не больше 7 устройств. Привязанное устройство, которое не измеряется, не получает балла ведущего майнера и уже вышло из пула, поэтому ничего не зарабатывает, а прокси-слот вообще не получает балла ведущего майнера."
  zh: "最多绑定 7 台设备，且只绑定直连设备，除非其他设备已在接受测量。每个设备群最多 7 台设备可优先接受验证者测量。已绑定但未被测量的设备没有头部分数，也已离开资金池，因此没有任何收益；代理槽位则完全没有头部分数。"
