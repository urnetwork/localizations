description: "App top200 limits: at most 7 devices per fleet draw ahead into the validator's measured cohort (cohort 1,500 over 200 seats); a bound device outside it has left the pool and earns nothing"
source: "Bind at most 7 devices, unless the others are already measured. At most 7 devices per fleet draw ahead of the rest to be measured by the validator. A bound device that isn't measured earns no head score and has left the pool, so it earns nothing."
platforms:
  - site
localizations:
  ar: "اربط 7 أجهزة على الأكثر، إلا إذا كانت الأجهزة الأخرى تخضع للقياس بالفعل. يحظى 7 أجهزة على الأكثر في كل أسطول بأولوية القياس لدى المدقِّق. الجهاز المربوط الذي لا يخضع للقياس لا يحصل على نتيجة في الفئة الرئيسية وقد غادر المجمّع، فلا يكسب شيئًا."
  de: "Binde höchstens 7 Geräte, es sei denn, die übrigen werden bereits gemessen. Pro Flotte werden höchstens 7 Geräte vorrangig vom Validator gemessen. Ein gebundenes Gerät, das nicht gemessen wird, erhält keinen Head-Score und hat den Pool verlassen, verdient also nichts."
  en: "Bind at most 7 devices, unless the others are already measured. At most 7 devices per fleet draw ahead of the rest to be measured by the validator. A bound device that isn't measured earns no head score and has left the pool, so it earns nothing."
  es: "Vincula 7 dispositivos como máximo, salvo que los demás ya se estén midiendo. Por flota, como máximo 7 dispositivos tienen prioridad para que el validador los mida. Un dispositivo vinculado que no se mide no obtiene puntuación principal y ya ha salido del pool, así que no gana nada."
  ru: "Привязывайте не больше 7 устройств, если только остальные уже не измеряются. В каждом парке приоритет на измерение валидатором получают не больше 7 устройств. Привязанное устройство, которое не измеряется, не получает балла ведущего майнера и уже вышло из пула, поэтому ничего не зарабатывает."
  zh: "最多绑定 7 台设备，除非其他设备已在接受测量。每个设备群最多 7 台设备可优先接受验证者测量。已绑定但未被测量的设备没有头部分数，也已离开资金池，因此没有任何收益。"
