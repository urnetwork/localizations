description: "ur.io Connect screen, out-of-balance notice: what the browser does meanwhile when the URnetwork extension's kill switch is on. The extension keeps its proxy set, so pages fail until data is available again or the user disconnects. Translate kill switch as the extension and the apps do."
source: "With the kill switch on, pages won't load in this browser until data is available or you disconnect."
platforms:
  - site
localizations:
  ar: "عندما يكون مفتاح الإيقاف مفعّلًا، لن تُحمَّل الصفحات في هذا المتصفح حتى تتوفر بيانات أو تقطع الاتصال."
  cs: "Když je kill switch zapnutý, stránky se v tomto prohlížeči nenačtou, dokud nebudou k dispozici data nebo se neodpojíte."
  de: "Ist der Kill Switch an, laden Seiten in diesem Browser nicht, bis wieder Daten verfügbar sind oder du die Verbindung trennst."
  el: "Με το kill switch ενεργό, οι σελίδες δεν θα φορτώνουν σε αυτό το πρόγραμμα περιήγησης μέχρι να υπάρξουν διαθέσιμα δεδομένα ή να αποσυνδεθείτε."
  en: "With the kill switch on, pages won't load in this browser until data is available or you disconnect."
  es: "Con el kill switch activado, las páginas no cargarán en este navegador hasta que haya datos disponibles o te desconectes."
  es-419: "Con el kill switch activado, las páginas no cargarán en este navegador hasta que haya datos disponibles o te desconectes."
  es-MX: "Con el kill switch activado, las páginas no cargarán en este navegador hasta que haya datos disponibles o te desconectes."
  fr: "Avec le kill switch activé, les pages ne se chargeront pas dans ce navigateur tant que des données ne sont pas disponibles ou que vous ne vous déconnectez pas."
  he: "כשהקיל סוויץ' פועל, דפים לא ייטענו בדפדפן הזה עד שיהיו נתונים זמינים או עד שתתנתק."
  hi: "किल स्विच चालू होने पर, जब तक डेटा उपलब्ध न हो या आप डिस्कनेक्ट न करें, इस ब्राउज़र में पेज लोड नहीं होंगे।"
  id: "Dengan kill switch aktif, halaman tidak akan dimuat di browser ini sampai data tersedia atau Anda memutuskan koneksi."
  it: "Con il kill switch attivo, le pagine non si caricano in questo browser finché non ci sono dati disponibili o finché non ti disconnetti."
  ja: "キルスイッチがオンの場合、データが利用可能になるか接続を解除するまで、このブラウザではページが読み込まれません。"
  ko: "킬 스위치가 켜져 있으면 데이터를 사용할 수 있게 되거나 연결을 해제할 때까지 이 브라우저에서 페이지가 로드되지 않습니다."
  nl: "Met de kill switch aan laden pagina's in deze browser niet totdat er weer data beschikbaar is of je de verbinding verbreekt."
  pl: "Gdy kill switch jest włączony, strony w tej przeglądarce nie będą się ładować, dopóki dane nie będą dostępne lub się nie rozłączysz."
  pt: "Com o kill switch ligado, as páginas não carregam neste navegador até haver dados disponíveis ou você desconectar."
  pt-BR: "Com o kill switch ligado, as páginas não carregam neste navegador até haver dados disponíveis ou você desconectar."
  pt-PT: "Com o kill switch ligado, as páginas não carregam neste navegador até haver dados disponíveis ou até se desligar."
  ru: "Если kill switch включён, страницы в этом браузере не будут загружаться, пока не появятся данные или пока вы не отключитесь."
  sv: "Med kill switch på laddas inga sidor i den här webbläsaren förrän data finns tillgänglig eller du kopplar från."
  sw: "Kill switch ikiwa imewashwa, kurasa hazitapakia katika kivinjari hiki hadi data ipatikane au utenganishe."
  th: "เมื่อเปิดสวิตช์หยุดการเชื่อมต่อ หน้าเว็บจะไม่โหลดในเบราว์เซอร์นี้จนกว่าจะมีข้อมูลหรือคุณยกเลิกการเชื่อมต่อ"
  uk: "Якщо kill switch увімкнено, сторінки в цьому браузері не завантажуватимуться, доки не з'являться дані або доки ви не від'єднаєтеся."
  vi: "Khi bật kill switch, các trang sẽ không tải trong trình duyệt này cho đến khi có dữ liệu hoặc bạn ngắt kết nối."
  zh: "断网保护开启时，在有可用数据或您断开连接之前，此浏览器中的页面不会加载。"
  zh-HK: "斷線開關 (Kill switch) 開啟時，在有可用數據或您中斷連線之前，此瀏覽器中的頁面不會載入。"
