description: "Onboarding email E1: preview text shown next to the subject."
source: "Open the app, tap Connect, and you're on a private connection."
platforms:
  - email
localizations:
  en: "Open the app, tap Connect, and you're on a private connection."
  ar: "افتح التطبيق، واضغط على «اربط»، وستكون على اتصال خاص."
  cs: "Otevřete aplikaci, klepněte na Připojit a jste na soukromém připojení."
  de: "App öffnen, auf „Verbinde“ tippen, und du bist privat verbunden."
  el: "Άνοιξε την εφαρμογή, πάτησε Σύνδεση και είσαι σε ιδιωτική σύνδεση."
  es: "Abre la app, toca Conecta y ya estás en una conexión privada."
  es-419: "Abre la app, toca Conecta y ya estás en una conexión privada."
  es-MX: "Abre la app, toca Conecta y ya estás en una conexión privada."
  fr: "Ouvre l'app, appuie sur Connecte, et te voilà sur une connexion privée."
  he: "פותחים את האפליקציה, מקישים על התחבר, ומחוברים בחיבור פרטי."
  hi: "ऐप खोलें, कनेक्ट करें पर टैप करें, और आप निजी कनेक्शन पर हैं।"
  id: "Buka aplikasi, ketuk Hubungkan, dan kamu langsung berada di koneksi privat."
  it: "Apri l'app, tocca Connetti e sei su una connessione privata."
  ja: "アプリを開いて「接続」をタップすれば、プライベートな接続が始まります。"
  ko: "앱을 열고 연결을 누르면 바로 비공개 연결이 시작됩니다."
  nl: "Open de app, tik op Verbinden en je zit op een privéverbinding."
  pl: "Otwórz aplikację, dotknij Połącz i jesteś na prywatnym połączeniu."
  pt: "Abra o app, toque em Conecte e pronto: conexão privada."
  pt-BR: "Abra o app, toque em Conecte e pronto: conexão privada."
  pt-PT: "Abra a app, toque em Ligar e fica numa ligação privada."
  ru: "Откройте приложение, нажмите «Подключить» — и вы на приватном подключении."
  sv: "Öppna appen, tryck på Anslut, så är du på en privat anslutning."
  sw: "Fungua programu, gusa Unganisha, na uko kwenye muunganisho wa faragha."
  th: "เปิดแอป แตะ เชื่อมต่อ แล้วคุณก็อยู่บนการเชื่อมต่อส่วนตัว"
  uk: "Відкрийте застосунок, натисніть «Підключитися» — і ви на приватному з'єднанні."
  vi: "Mở ứng dụng, chạm Kết nối, và bạn đã ở trên một kết nối riêng tư."
  zh: "打开应用，点按“连接”，你就已经在私密连接上了。"
  zh-HK: "打開應用程式，點按「連接」，你就已經在私密連接上了。"
