description: "Intro of the mock location guide explaining that apps see the longest-connected provider's location instead of the real one."
source: "When enabled, apps on this device see the location of the provider you have been connected to the longest, instead of your real location."
platforms:
  - android
  - linux
localizations:
  ar: "عند التفعيل، ترى التطبيقات على هذا الجهاز موقع مزود الخدمة الذي كنت متصلاً به لأطول مدة بدلاً من موقعك الحقيقي."
  cs: "Když je tato funkce zapnutá, aplikace v tomto zařízení vidí místo vaší skutečné polohy polohu poskytovatele, ke kterému jste připojeni nejdéle."
  de: "Wenn aktiviert, sehen Apps auf diesem Gerät statt deines echten Standorts den Standort des Anbieters, mit dem du am längsten verbunden bist."
  el: "Όταν είναι ενεργοποιημένο, οι εφαρμογές σε αυτήν τη συσκευή βλέπουν την τοποθεσία του παρόχου με τον οποίο είστε συνδεδεμένοι το περισσότερο διάστημα, αντί για την πραγματική σας τοποθεσία."
  en: "When enabled, apps on this device see the location of the provider you have been connected to the longest, instead of your real location."
  es: "Cuando está activado, las aplicaciones de este dispositivo ven la ubicación del proveedor al que llevas más tiempo conectado, en lugar de tu ubicación real."
  es-419: "Cuando está activado, las apps de este dispositivo ven la ubicación del proveedor al que llevas más tiempo conectado, en lugar de tu ubicación real."
  es-MX: "Cuando está activado, las apps de este dispositivo ven la ubicación del proveedor al que llevas más tiempo conectado, en lugar de tu ubicación real."
  fr: "Lorsque cette option est activée, les applications de cet appareil voient la position du fournisseur auquel vous êtes connecté depuis le plus longtemps, au lieu de votre position réelle."
  he: "כשהאפשרות מופעלת, אפליקציות במכשיר זה רואות את המיקום של הספק שאליו אתה מחובר הכי הרבה זמן, במקום את המיקום האמיתי שלך."
  hi: "चालू होने पर, इस डिवाइस के ऐप्लिकेशन आपके असली स्थान के बजाय उस प्रदाता का स्थान देखते हैं जिससे आप सबसे लंबे समय से कनेक्ट हैं।"
  id: "Saat diaktifkan, aplikasi di perangkat ini akan melihat lokasi penyedia yang paling lama terhubung dengan Anda, bukan lokasi Anda yang sebenarnya."
  it: "Quando è attiva, le app su questo dispositivo vedono la posizione del provider a cui sei connesso da più tempo, invece della tua posizione reale."
  ja: "有効にすると、このデバイスのアプリには実際の位置情報の代わりに、最も長く接続しているプロバイダーの場所が表示されます。"
  ko: "사용 설정하면 이 기기의 앱에 실제 위치 대신 가장 오래 연결된 제공업체의 위치가 표시됩니다."
  nl: "Als dit is ingeschakeld, zien apps op dit apparaat de locatie van de provider waarmee je het langst verbonden bent, in plaats van je echte locatie."
  pl: "Gdy ta opcja jest włączona, aplikacje na tym urządzeniu zamiast Twojej rzeczywistej lokalizacji widzą lokalizację dostawcy, z którym połączenie trwa najdłużej."
  pt: "Quando ativada, as aplicações neste dispositivo veem a localização do fornecedor ao qual está ligado há mais tempo, em vez da sua localização real."
  pt-BR: "Quando ativado, os apps neste dispositivo veem a localização do provedor ao qual você está conectado há mais tempo, em vez da sua localização real."
  pt-PT: "Quando ativada, as aplicações neste dispositivo veem a localização do fornecedor ao qual está conectado há mais tempo, em vez da sua localização real."
  ru: "Когда эта функция включена, приложения на этом устройстве видят вместо вашего реального местоположения локацию провайдера, к которому вы подключены дольше всего."
  sv: "När detta är aktiverat ser appar på den här enheten platsen för den leverantör du har varit ansluten till längst, i stället för din verkliga plats."
  sw: "Ikiwashwa, programu kwenye kifaa hiki zitaona mahali pa mtoa huduma ambaye umeunganishwa naye kwa muda mrefu zaidi, badala ya mahali pako halisi."
  th: "เมื่อเปิดใช้ แอปในอุปกรณ์นี้จะเห็นตำแหน่งของผู้ให้บริการที่คุณเชื่อมต่อนานที่สุดแทนตำแหน่งจริงของคุณ"
  uk: "Коли цю функцію ввімкнено, додатки на цьому пристрої бачать замість вашого реального місцезнаходження локацію провайдера, до якого ви підключені найдовше."
  vi: "Khi bật, các ứng dụng trên thiết bị này sẽ thấy vị trí của nhà cung cấp mà bạn đã kết nối lâu nhất, thay vì vị trí thực của bạn."
  zh: "启用后，此设备上的应用看到的将是您连接时间最长的提供商的位置，而不是您的真实位置。"
  zh-HK: "啟用後，此裝置上的應用程式看到的將是你連接時間最長的供應商的位置，而不是你的真實位置。"
