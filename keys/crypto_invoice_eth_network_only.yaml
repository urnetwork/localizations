description: "Crypto invoice, ETH only: the network to send on, shown with the address. The same address exists on other networks that carry ETH, such as Base and Arbitrum (network names, never translated), and ETH sent there, like any token sent to the address, is not credited to this payment. Use the same words for mainnet as crypto_network_eth. Ethereum and ETH are product names."
source: "Send only ETH on Ethereum mainnet to this address. Tokens and ETH on other networks, such as Base or Arbitrum, won't be credited."
platforms:
  - android
  - apple
  - site
localizations:
  ar: "أرسل ETH على شبكة Ethereum الرئيسية فقط إلى هذا العنوان. لن تُحتسب الرموز المميزة ولا عملات ETH على الشبكات الأخرى مثل Base أو Arbitrum."
  cs: "Na tuto adresu posílejte pouze ETH v hlavní síti Ethereum. Tokeny ani ETH v jiných sítích, například Base nebo Arbitrum, nebudou připsány."
  de: "Sende an diese Adresse nur ETH über das Ethereum-Mainnet. Token und ETH in anderen Netzwerken wie Base oder Arbitrum werden nicht gutgeschrieben."
  el: "Στείλτε σε αυτή τη διεύθυνση μόνο ETH στο κύριο δίκτυο Ethereum. Τα tokens και τα ETH σε άλλα δίκτυα, όπως το Base ή το Arbitrum, δεν θα πιστωθούν."
  en: "Send only ETH on Ethereum mainnet to this address. Tokens and ETH on other networks, such as Base or Arbitrum, won't be credited."
  es: "Envía a esta dirección solo ETH por la red principal de Ethereum. Los tokens y los ETH de otras redes, como Base o Arbitrum, no se acreditarán."
  es-419: "Envía a esta dirección solo ETH por la red principal de Ethereum. Los tokens y los ETH de otras redes, como Base o Arbitrum, no se acreditarán."
  es-MX: "Envía a esta dirección solo ETH por la red principal de Ethereum. Los tokens y los ETH de otras redes, como Base o Arbitrum, no se acreditarán."
  fr: "Envoyez uniquement de l’ETH sur le réseau principal Ethereum à cette adresse. Les jetons et l’ETH d’autres réseaux, comme Base ou Arbitrum, ne seront pas crédités."
  he: "שלחו לכתובת הזו רק ETH ברשת הראשית של Ethereum. אסימונים ו-ETH מרשתות אחרות, כמו Base או Arbitrum, לא ייזקפו לתשלום."
  hi: "इस पते पर केवल Ethereum मेननेट पर ETH भेजें। टोकन, और Base या Arbitrum जैसे दूसरे नेटवर्क पर भेजे गए ETH जमा नहीं होंगे।"
  id: "Kirim hanya ETH di Mainnet Ethereum ke alamat ini. Token dan ETH di jaringan lain, seperti Base atau Arbitrum, tidak akan dikreditkan."
  it: "Invia a questo indirizzo solo ETH sulla mainnet di Ethereum. I token e gli ETH su altre reti, come Base o Arbitrum, non verranno accreditati."
  ja: "このアドレスには Ethereum メインネットの ETH のみを送金してください。トークンや、Base、Arbitrum など他のネットワークの ETH は入金されません。"
  ko: "이 주소로는 Ethereum 메인넷의 ETH만 보내세요. 토큰이나 Base, Arbitrum 등 다른 네트워크의 ETH는 입금 처리되지 않습니다."
  nl: "Stuur naar dit adres alleen ETH via het Ethereum-mainnet. Tokens en ETH op andere netwerken, zoals Base of Arbitrum, worden niet bijgeschreven."
  pl: "Na ten adres wysyłaj wyłącznie ETH w sieci głównej Ethereum. Tokeny i ETH z innych sieci, takich jak Base czy Arbitrum, nie zostaną zaksięgowane."
  pt: "Envie para este endereço apenas ETH na rede principal Ethereum. Tokens e ETH noutras redes, como Base ou Arbitrum, não serão creditados."
  pt-BR: "Envie para este endereço apenas ETH na rede principal Ethereum. Tokens e ETH em outras redes, como Base ou Arbitrum, não serão creditados."
  pt-PT: "Envie para este endereço apenas ETH na rede principal Ethereum. Tokens e ETH noutras redes, como Base ou Arbitrum, não serão creditados."
  ru: "Отправляйте на этот адрес только ETH в основной сети Ethereum. Токены и ETH в других сетях, например Base или Arbitrum, не будут зачислены."
  sv: "Skicka endast ETH på Ethereum-huvudnätet till den här adressen. Tokens och ETH på andra nätverk, som Base eller Arbitrum, krediteras inte."
  sw: "Tuma ETH kwenye mtandao mkuu wa Ethereum pekee kwa anwani hii. Tokeni na ETH kwenye mitandao mingine, kama Base au Arbitrum, hazitahesabiwa."
  th: "ส่งเฉพาะ ETH บนเครือข่ายหลักของ Ethereum มายังที่อยู่นี้ โทเค็นและ ETH บนเครือข่ายอื่น เช่น Base หรือ Arbitrum จะไม่ถูกนับเป็นยอดชำระ"
  uk: "Надсилайте на цю адресу лише ETH в основній мережі Ethereum. Токени й ETH в інших мережах, як-от Base чи Arbitrum, не буде зараховано."
  vi: "Chỉ gửi ETH trên mạng chính Ethereum đến địa chỉ này. Token và ETH trên các mạng khác, như Base hoặc Arbitrum, sẽ không được ghi nhận."
  zh: "请仅向此地址发送 Ethereum 主网上的 ETH。代币以及 Base、Arbitrum 等其他网络上的 ETH 将不会入账。"
  zh-HK: "請僅向此地址發送 Ethereum 主網上的 ETH。代幣以及 Base、Arbitrum 等其他網絡上的 ETH 將不會入賬。"
