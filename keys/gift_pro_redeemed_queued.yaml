description: "Confirmation shown after a Pro gift code is redeemed by someone who already has Pro: the gift's year of Pro is queued after the current Pro period. {date} is the day it starts, formatted by the app for the reader's locale."
source: "Your gift year of Pro starts on %@, after your current Pro period."
platforms:
  - android
  - apple
  - windows
  - linux
placeholders:
  - name: date
    type: string
localizations:
