description: "Body of the low-data warning (title: \"Running low on data\") when the available data falls to a fixed amount (1 GiB). {amount} is the available data as a size, e.g. 980 MB. Shown once per balance period in an in-app alert and a local notification."
source: "Only %@ of data is left."
platforms:
  - android
  - apple
  - windows
  - linux
placeholders:
  - name: amount
    type: string
