description: "Error state on linux: URnetwork wrote the system location file and can no longer remove it, so the machine may still be reporting a provider's location. Gives the user the recovery steps."
source: "URnetwork could not remove the system location file, so this machine may still report a provider's location. Start the URnetwork system service and turn this off, or remove /etc/geolocation as an administrator."
platforms:
  - linux
localizations:
  ar: "تعذّر على URnetwork إزالة ملف موقع النظام، لذا قد يستمر هذا الجهاز في الإبلاغ عن موقع أحد المزودين. شغّل خدمة نظام URnetwork وأوقف هذا الخيار، أو احذف /etc/geolocation كمسؤول."
  cs: "URnetwork nemohl odstranit systémový soubor polohy, takže tento počítač může stále hlásit polohu poskytovatele. Spusťte systémovou službu URnetwork a tuto funkci vypněte, nebo soubor /etc/geolocation odstraňte jako správce."
  de: "URnetwork konnte die Systemdatei für den Standort nicht entfernen, daher meldet dieser Rechner möglicherweise weiterhin den Standort eines Anbieters. Starte den URnetwork-Systemdienst und schalte dies aus, oder entferne /etc/geolocation als Administrator."
  el: "Το URnetwork δεν μπόρεσε να αφαιρέσει το αρχείο τοποθεσίας του συστήματος, οπότε αυτό το μηχάνημα ενδέχεται να εξακολουθεί να αναφέρει την τοποθεσία ενός παρόχου. Εκκινήστε την υπηρεσία συστήματος URnetwork και απενεργοποιήστε το, ή αφαιρέστε το /etc/geolocation ως διαχειριστής."
  en: "URnetwork could not remove the system location file, so this machine may still report a provider's location. Start the URnetwork system service and turn this off, or remove /etc/geolocation as an administrator."
  es: "URnetwork no ha podido eliminar el archivo de ubicación del sistema, así que este ordenador puede seguir informando de la ubicación de un proveedor. Inicia el servicio del sistema URnetwork y desactiva esta opción, o elimina /etc/geolocation como administrador."
  es-419: "URnetwork no pudo eliminar el archivo de ubicación del sistema, así que esta computadora puede seguir informando la ubicación de un proveedor. Inicia el servicio del sistema URnetwork y desactiva esta opción, o elimina /etc/geolocation como administrador."
  es-MX: "URnetwork no pudo eliminar el archivo de ubicación del sistema, así que esta computadora puede seguir informando la ubicación de un proveedor. Inicia el servicio del sistema URnetwork y desactiva esta opción, o elimina /etc/geolocation como administrador."
  fr: "URnetwork n'a pas pu supprimer le fichier de localisation du système ; cette machine peut donc continuer à signaler la position d'un fournisseur. Démarrez le service système URnetwork et désactivez cette option, ou supprimez /etc/geolocation en tant qu'administrateur."
  he: "URnetwork לא הצליח להסיר את קובץ המיקום של המערכת, ולכן ייתכן שהמחשב הזה עדיין מדווח על מיקום של ספק. הפעל את שירות המערכת של URnetwork וכבה את האפשרות הזו, או הסר את /etc/geolocation כמנהל מערכת."
  hi: "URnetwork सिस्टम लोकेशन फ़ाइल नहीं हटा सका, इसलिए यह मशीन अब भी किसी प्रदाता का स्थान बता सकती है। URnetwork सिस्टम सेवा शुरू करें और इसे बंद करें, या व्यवस्थापक के रूप में /etc/geolocation हटाएं।"
  id: "URnetwork tidak dapat menghapus berkas lokasi sistem, sehingga mesin ini mungkin masih melaporkan lokasi penyedia. Jalankan layanan sistem URnetwork lalu matikan opsi ini, atau hapus /etc/geolocation sebagai administrator."
  it: "URnetwork non è riuscito a rimuovere il file di posizione di sistema, quindi questa macchina potrebbe continuare a segnalare la posizione di un provider. Avvia il servizio di sistema URnetwork e disattiva questa opzione, oppure rimuovi /etc/geolocation come amministratore."
  ja: "URnetwork はシステムの位置情報ファイルを削除できませんでした。そのため、このマシンはプロバイダーの位置情報を報告し続けている可能性があります。URnetwork システムサービスを起動してこの機能をオフにするか、管理者として /etc/geolocation を削除してください。"
  ko: "URnetwork에서 시스템 위치 파일을 삭제하지 못했습니다. 따라서 이 컴퓨터가 여전히 제공업체의 위치를 보고할 수 있습니다. URnetwork 시스템 서비스를 시작한 뒤 이 기능을 끄거나, 관리자 권한으로 /etc/geolocation을 삭제하세요."
  nl: "URnetwork kon het systeemlocatiebestand niet verwijderen, dus deze machine meldt mogelijk nog steeds de locatie van een provider. Start de URnetwork-systeemservice en schakel dit uit, of verwijder /etc/geolocation als beheerder."
  pl: "URnetwork nie mógł usunąć systemowego pliku lokalizacji, więc ten komputer może nadal zgłaszać lokalizację dostawcy. Uruchom usługę systemową URnetwork i wyłącz tę opcję albo usuń plik /etc/geolocation jako administrator."
  pt: "O URnetwork não conseguiu remover o ficheiro de localização do sistema, pelo que esta máquina pode continuar a comunicar a localização de um fornecedor. Inicie o serviço de sistema URnetwork e desative esta opção, ou remova /etc/geolocation como administrador."
  pt-BR: "O URnetwork não conseguiu remover o arquivo de localização do sistema, então esta máquina pode continuar informando a localização de um provedor. Inicie o serviço de sistema URnetwork e desative esta opção, ou remova /etc/geolocation como administrador."
  pt-PT: "O URnetwork não conseguiu remover o ficheiro de localização do sistema, pelo que esta máquina pode continuar a comunicar a localização de um fornecedor. Inicie o serviço de sistema URnetwork e desative esta opção, ou remova /etc/geolocation como administrador."
  ru: "URnetwork не удалось удалить системный файл местоположения, поэтому этот компьютер может по-прежнему сообщать местоположение провайдера. Запустите системную службу URnetwork и отключите эту функцию либо удалите /etc/geolocation с правами администратора."
  sv: "URnetwork kunde inte ta bort systemets platsfil, så den här datorn kan fortfarande rapportera en leverantörs plats. Starta systemtjänsten URnetwork och stäng av detta, eller ta bort /etc/geolocation som administratör."
  sw: "URnetwork haikuweza kuondoa faili ya mahali ya mfumo, hivyo mashine hii inaweza bado kuripoti mahali pa mtoa huduma. Anzisha huduma ya mfumo ya URnetwork kisha uzime chaguo hili, au ondoa /etc/geolocation ukiwa msimamizi."
  th: "URnetwork ไม่สามารถลบไฟล์ตำแหน่งของระบบได้ เครื่องนี้จึงอาจยังรายงานตำแหน่งของผู้ให้บริการอยู่ ให้เริ่มบริการระบบ URnetwork แล้วปิดตัวเลือกนี้ หรือลบ /etc/geolocation ในฐานะผู้ดูแลระบบ"
  uk: "URnetwork не вдалося видалити системний файл місцезнаходження, тому цей комп'ютер може й далі повідомляти місцезнаходження провайдера. Запустіть системну службу URnetwork і вимкніть цю функцію або видаліть /etc/geolocation з правами адміністратора."
  vi: "URnetwork không thể xóa tệp vị trí của hệ thống, nên máy này có thể vẫn đang báo cáo vị trí của một nhà cung cấp. Hãy khởi động dịch vụ hệ thống URnetwork rồi tắt tùy chọn này, hoặc xóa /etc/geolocation với quyền quản trị."
  zh: "URnetwork 无法删除系统位置文件，因此本机可能仍在报告某个提供商的位置。请启动 URnetwork 系统服务并关闭此功能，或以管理员身份删除 /etc/geolocation。"
  zh-HK: "URnetwork 無法刪除系統位置檔案，因此本機可能仍在回報某個供應商的位置。請啟動 URnetwork 系統服務並關閉此功能，或以管理員身分刪除 /etc/geolocation。"
