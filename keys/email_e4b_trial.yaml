description: "Onboarding emails E4b, E3a and E5b, for readers billed through Stripe: the trial, who gets it, how to pay nothing and what is charged otherwise, in relative terms. No calendar date: a date computed at the send was false for anyone who starts later or is not eligible (2026-11-13 review). {offer_price} and {regular_price} are localized amounts."
source: "Pro starts with a 14-day free trial for new subscribers. Cancel before the trial ends and you pay nothing; otherwise you're charged {offer_price} for your first year, then {regular_price} a year until you cancel."
platforms:
  - email
placeholders:
  - name: offer_price
    type: string
  - name: regular_price
    type: string
localizations:
  en: "Pro starts with a 14-day free trial for new subscribers. Cancel before the trial ends and you pay nothing; otherwise you're charged {offer_price} for your first year, then {regular_price} a year until you cancel."
  ar: "يبدأ Pro بتجربة مجانية لمدة 14 يوماً للمشتركين الجدد. ألغِ قبل انتهاء التجربة ولن تدفع شيئاً؛ وإلا فسيُخصم منك {offer_price} لسنتك الأولى، ثم {regular_price} سنوياً حتى تلغي."
  cs: "Pro začíná 14denní zkušební verzí zdarma pro nové předplatitele. Zrušte ji před koncem zkušební doby a nic nezaplatíte; jinak vám bude účtováno {offer_price} za první rok a poté {regular_price} ročně, dokud předplatné nezrušíte."
  de: "Pro beginnt für neue Abonnenten mit einer 14-tägigen kostenlosen Testphase. Kündigst du vor ihrem Ende, zahlst du nichts; sonst werden dir {offer_price} für dein erstes Jahr berechnet, danach {regular_price} pro Jahr, bis du kündigst."
  el: "Το Pro ξεκινά με δωρεάν δοκιμή 14 ημερών για νέους συνδρομητές. Ακύρωσε πριν τελειώσει η δοκιμή και δεν πληρώνεις τίποτα· αλλιώς χρεώνεσαι {offer_price} για τον πρώτο σου χρόνο και μετά {regular_price} τον χρόνο μέχρι να ακυρώσεις."
  es: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela antes de que termine la prueba y no pagas nada; si no, se te cobran {offer_price} por tu primer año y después {regular_price} al año hasta que canceles."
  es-419: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela antes de que termine la prueba y no pagas nada; si no, se te cobran {offer_price} por tu primer año y después {regular_price} al año hasta que canceles."
  es-MX: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela antes de que termine la prueba y no pagas nada; si no, se te cobran {offer_price} por tu primer año y después {regular_price} al año hasta que canceles."
  fr: "Pro commence par un essai gratuit de 14 jours pour les nouveaux abonnés. Annule avant la fin de l'essai et tu ne paies rien ; sinon, tu es débité de {offer_price} pour ta première année, puis de {regular_price} par an jusqu'à ce que tu annules."
  he: "Pro מתחיל בתקופת ניסיון חינם של 14 יום למנויים חדשים. בטלו לפני שתקופת הניסיון מסתיימת ולא תשלמו כלום; אחרת תחויבו ב-{offer_price} על השנה הראשונה, ולאחר מכן ב-{regular_price} לשנה עד שתבטלו."
  hi: "Pro नए सदस्यों के लिए 14 दिन के मुफ़्त ट्रायल से शुरू होता है। ट्रायल खत्म होने से पहले रद्द करें तो आपको कुछ नहीं देना होगा; वरना आपसे पहले साल के लिए {offer_price} और उसके बाद रद्द करने तक हर साल {regular_price} लिए जाएंगे।"
  id: "Pro dimulai dengan uji coba gratis 14 hari untuk pelanggan baru. Batalkan sebelum uji coba berakhir dan kamu tidak membayar apa pun; jika tidak, kamu ditagih {offer_price} untuk tahun pertama, lalu {regular_price} per tahun sampai kamu membatalkan."
  it: "Pro inizia con una prova gratuita di 14 giorni per i nuovi abbonati. Annulla prima che la prova finisca e non paghi nulla; altrimenti ti vengono addebitati {offer_price} per il primo anno, poi {regular_price} all'anno finché non annulli."
  ja: "Pro は新規登録の方向けの14日間の無料トライアルから始まります。トライアル終了前にキャンセルすれば料金はかかりません。キャンセルしない場合は、初年度に {offer_price}、その後はキャンセルするまで毎年 {regular_price} が請求されます。"
  ko: "Pro는 신규 구독자를 위한 14일 무료 체험으로 시작합니다. 체험이 끝나기 전에 취소하면 아무것도 결제되지 않으며, 그렇지 않으면 첫해에 {offer_price}, 이후 취소할 때까지 매년 {regular_price}가 청구됩니다."
  nl: "Pro begint met een gratis proefperiode van 14 dagen voor nieuwe abonnees. Zeg op voordat de proefperiode eindigt en je betaalt niets; anders betaal je {offer_price} voor je eerste jaar en daarna {regular_price} per jaar tot je opzegt."
  pl: "Pro zaczyna się od 14-dniowego bezpłatnego okresu próbnego dla nowych subskrybentów. Anuluj przed końcem okresu próbnego, a nic nie zapłacisz; w przeciwnym razie zapłacisz {offer_price} za pierwszy rok, a potem {regular_price} rocznie, dopóki nie anulujesz."
  pt: "O Pro começa com um teste grátis de 14 dias para novos assinantes. Cancele antes do fim do teste e você não paga nada; caso contrário, você será cobrado {offer_price} pelo primeiro ano e depois {regular_price} por ano até cancelar."
  pt-BR: "O Pro começa com um teste grátis de 14 dias para novos assinantes. Cancele antes do fim do teste e você não paga nada; caso contrário, você será cobrado {offer_price} pelo primeiro ano e depois {regular_price} por ano até cancelar."
  pt-PT: "O Pro começa com um período experimental gratuito de 14 dias para novos subscritores. Cancele antes do fim do período experimental e não paga nada; caso contrário, é-lhe cobrado {offer_price} pelo primeiro ano e depois {regular_price} por ano até cancelar."
  ru: "Pro начинается с бесплатного 14-дневного пробного периода для новых подписчиков. Отмените подписку до его окончания — и вы ничего не заплатите; иначе с вас спишут {offer_price} за первый год, а затем {regular_price} в год, пока вы не отмените подписку."
  sv: "Pro börjar med en gratis provperiod på 14 dagar för nya prenumeranter. Avsluta innan provperioden tar slut så betalar du ingenting; annars debiteras du {offer_price} för ditt första år och sedan {regular_price} per år tills du avslutar."
  sw: "Pro inaanza na kipindi cha majaribio cha bure cha siku 14 kwa wanaojisajili wapya. Ghairi kabla ya majaribio kuisha na hutalipa chochote; vinginevyo utatozwa {offer_price} kwa mwaka wako wa kwanza, kisha {regular_price} kwa mwaka hadi utakapoghairi."
  th: "Pro เริ่มต้นด้วยการทดลองใช้ฟรี 14 วันสำหรับสมาชิกใหม่ ยกเลิกก่อนสิ้นสุดการทดลองใช้แล้วคุณจะไม่ต้องจ่ายอะไรเลย มิฉะนั้นคุณจะถูกเรียกเก็บ {offer_price} สำหรับปีแรก จากนั้น {regular_price} ต่อปีจนกว่าคุณจะยกเลิก"
  uk: "Pro починається з безкоштовного 14-денного пробного періоду для нових підписників. Скасуйте до його завершення — і нічого не заплатите; інакше з вас спишуть {offer_price} за перший рік, а потім {regular_price} на рік, доки ви не скасуєте підписку."
  vi: "Pro bắt đầu với 14 ngày dùng thử miễn phí cho người đăng ký mới. Hủy trước khi thời gian dùng thử kết thúc thì bạn không phải trả gì; nếu không, bạn sẽ bị tính {offer_price} cho năm đầu tiên, sau đó {regular_price} mỗi năm cho đến khi bạn hủy."
  zh: "Pro 为新订阅用户提供 14 天免费试用。在试用结束前取消，你不需要支付任何费用；否则将按首年 {offer_price} 收费，之后每年 {regular_price}，直到你取消为止。"
  zh-HK: "Pro 為新訂閱用戶提供 14 天免費試用。在試用結束前取消，你不需要支付任何費用；否則將按首年 {offer_price} 收費，之後每年 {regular_price}，直至你取消為止。"
