description: "Onboarding email E2, desktop variant, the web's branch: the habit. The reader connects through the URnetwork browser extension; Connect is the button's name in the web app. The extensions menu's icon is a puzzle piece in Chrome, Edge and Brave."
source: "The easiest way to keep it up is to pin the URnetwork extension to your browser's toolbar: open the extensions menu (the puzzle piece) and pin URnetwork. Connect is then one click away."
platforms:
  - email
localizations:
  en: "The easiest way to keep it up is to pin the URnetwork extension to your browser's toolbar: open the extensions menu (the puzzle piece) and pin URnetwork. Connect is then one click away."
  ar: "أسهل طريقة للاستمرار هي تثبيت إضافة URnetwork في شريط أدوات المتصفح: افتح قائمة الإضافات (قطعة الأحجية) وثبّت URnetwork. بعدها يصبح «اربط» على بُعد نقرة واحدة."
  cs: "Nejsnazší způsob, jak u toho zůstat, je připnout si rozšíření URnetwork na panel nástrojů prohlížeče: otevřete nabídku rozšíření (dílek skládačky) a připněte URnetwork. Připojit pak máte na jedno kliknutí."
  de: "Am einfachsten bleibst du dran, wenn du die URnetwork-Erweiterung an die Symbolleiste deines Browsers anheftest: Öffne das Erweiterungsmenü (das Puzzleteil) und hefte URnetwork an. Dann ist „Verbinde“ nur einen Klick entfernt."
  el: "Ο πιο εύκολος τρόπος να συνεχίσεις είναι να καρφιτσώσεις την επέκταση URnetwork στη γραμμή εργαλείων του προγράμματος περιήγησης: άνοιξε το μενού επεκτάσεων (το κομμάτι παζλ) και καρφίτσωσε το URnetwork. Έτσι η Σύνδεση είναι ένα κλικ μακριά."
  es: "La forma más fácil de mantenerlo es fijar la extensión de URnetwork en la barra de herramientas de tu navegador: abre el menú de extensiones (la pieza de rompecabezas) y fija URnetwork. Así Conecta queda a un clic."
  es-419: "La forma más fácil de mantenerlo es fijar la extensión de URnetwork en la barra de herramientas de tu navegador: abre el menú de extensiones (la pieza de rompecabezas) y fija URnetwork. Así Conecta queda a un clic."
  es-MX: "La forma más fácil de mantenerlo es fijar la extensión de URnetwork en la barra de herramientas de tu navegador: abre el menú de extensiones (la pieza de rompecabezas) y fija URnetwork. Así Conecta queda a un clic."
  fr: "Le plus simple pour continuer, c'est d'épingler l'extension URnetwork dans la barre d'outils de ton navigateur : ouvre le menu des extensions (la pièce de puzzle) et épingle URnetwork. Connecte est alors à un clic."
  he: "הדרך הקלה ביותר להמשיך היא להצמיד את התוסף של URnetwork לסרגל הכלים של הדפדפן: פתחו את תפריט התוספים (חלק הפאזל) והצמידו את URnetwork. מעכשיו התחבר במרחק לחיצה אחת."
  hi: "इसे जारी रखने का सबसे आसान तरीका है URnetwork एक्सटेंशन को अपने ब्राउज़र के टूलबार पर पिन करना: एक्सटेंशन मेनू (पहेली का टुकड़ा) खोलें और URnetwork पिन करें। फिर कनेक्ट करें बस एक क्लिक दूर रहेगा।"
  id: "Cara termudah untuk terus melakukannya adalah menyematkan ekstensi URnetwork di bilah alat browsermu: buka menu ekstensi (ikon kepingan puzzle) lalu sematkan URnetwork. Setelah itu Hubungkan hanya sejauh satu klik."
  it: "Il modo più facile per continuare è fissare l'estensione di URnetwork alla barra degli strumenti del browser: apri il menu delle estensioni (il pezzo di puzzle) e fissa URnetwork. Così Connetti è a un clic."
  ja: "続けるいちばん簡単な方法は、URnetwork の拡張機能をブラウザのツールバーに固定することです。拡張機能メニュー（パズルのピースのアイコン）を開き、URnetwork を固定してください。これで「接続」がワンクリックです。"
  ko: "계속 쓰는 가장 쉬운 방법은 URnetwork 확장 프로그램을 브라우저 도구 모음에 고정하는 것입니다. 확장 프로그램 메뉴(퍼즐 조각 아이콘)를 열고 URnetwork를 고정하세요. 그러면 클릭 한 번으로 연결할 수 있습니다."
  nl: "De makkelijkste manier om het vol te houden is de URnetwork-extensie vast te zetten in de werkbalk van je browser: open het extensiemenu (het puzzelstukje) en zet URnetwork vast. Dan is Verbinden één klik weg."
  pl: "Najłatwiej utrzymać nawyk, przypinając rozszerzenie URnetwork do paska narzędzi przeglądarki: otwórz menu rozszerzeń (ikona puzzla) i przypnij URnetwork. Wtedy Połącz jest o jedno kliknięcie."
  pt: "O jeito mais fácil de manter o ritmo é fixar a extensão da URnetwork na barra de ferramentas do navegador: abra o menu de extensões (a peça de quebra-cabeça) e fixe a URnetwork. Assim o Conecte fica a um clique."
  pt-BR: "O jeito mais fácil de manter o ritmo é fixar a extensão da URnetwork na barra de ferramentas do navegador: abra o menu de extensões (a peça de quebra-cabeça) e fixe a URnetwork. Assim o Conecte fica a um clique."
  pt-PT: "A forma mais fácil de manter o hábito é fixar a extensão da URnetwork na barra de ferramentas do navegador: abra o menu de extensões (a peça de puzzle) e fixe a URnetwork. Assim, o Ligar fica a um clique."
  ru: "Проще всего продолжать, если закрепить расширение URnetwork на панели инструментов браузера: откройте меню расширений (значок пазла) и закрепите URnetwork. Тогда «Подключить» будет в одном клике."
  sv: "Enklaste sättet att hålla igång är att fästa URnetwork-tillägget i webbläsarens verktygsfält: öppna tilläggsmenyn (pusselbiten) och fäst URnetwork. Då är Anslut ett klick bort."
  sw: "Njia rahisi zaidi ya kuendelea ni kubandika kiendelezi cha URnetwork kwenye upau wa zana wa kivinjari chako: fungua menyu ya viendelezi (kipande cha fumbo) na ubandike URnetwork. Kisha Unganisha iko umbali wa mbofyo mmoja."
  th: "วิธีที่ง่ายที่สุดในการใช้ต่อคือปักหมุดส่วนขยาย URnetwork ไว้บนแถบเครื่องมือของเบราว์เซอร์: เปิดเมนูส่วนขยาย (ไอคอนจิ๊กซอว์) แล้วปักหมุด URnetwork จากนั้นปุ่ม เชื่อมต่อ ก็อยู่ห่างแค่คลิกเดียว"
  uk: "Найпростіше продовжувати, якщо закріпити розширення URnetwork на панелі інструментів браузера: відкрийте меню розширень (значок пазла) і закріпіть URnetwork. Тоді «Підключитися» буде за один клік."
  vi: "Cách dễ nhất để duy trì là ghim tiện ích URnetwork lên thanh công cụ của trình duyệt: mở menu tiện ích (biểu tượng mảnh ghép) và ghim URnetwork. Khi đó Kết nối chỉ cách một cú nhấp."
  zh: "最省事的坚持方式是把 URnetwork 扩展程序固定到浏览器工具栏：打开扩展程序菜单（拼图图标），固定 URnetwork。之后“连接”一点即达。"
  zh-HK: "最省事的堅持方式是把 URnetwork 擴充功能固定到瀏覽器工具列：打開擴充功能選單（拼圖圖示），固定 URnetwork。之後「連接」一按即達。"
