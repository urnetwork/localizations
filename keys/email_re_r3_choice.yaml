description: "Re-engagement email R3: the choice. The button keeps the address on the list (it renews the permission for 12 months); it promises no particular email, since nothing sends kept readers a note of their own. Account and security emails are not affected, which is why it says 'these emails'."
source: "If you'd like to stay on my list for the occasional email, tap the button. If not, there's nothing to do: this is the last of these emails."
platforms:
  - email
localizations:
  en: "If you'd like to stay on my list for the occasional email, tap the button. If not, there's nothing to do: this is the last of these emails."
  ar: "إذا أردت البقاء على قائمتي لتصلك رسالة من حين لآخر، فاضغط على الزر. وإن لم ترغب في ذلك، فلا شيء عليك فعله: هذه آخر هذه الرسائل."
  cs: "Pokud chcete zůstat na mém seznamu a občas dostat e-mail, klepněte na tlačítko. Pokud ne, nemusíte nic dělat: tohle je poslední z těchto e-mailů."
  de: "Wenn du für die gelegentliche E-Mail auf meiner Liste bleiben möchtest, tippe auf den Button. Wenn nicht, musst du nichts tun: Das ist die letzte dieser E-Mails."
  el: "Αν θέλεις να μείνεις στη λίστα μου για κάποιο email πού και πού, πάτησε το κουμπί. Αν όχι, δεν χρειάζεται να κάνεις τίποτα: αυτό είναι το τελευταίο από αυτά τα email."
  es: "Si quieres seguir en mi lista para recibir algún correo de vez en cuando, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  es-419: "Si quieres seguir en mi lista para recibir algún correo de vez en cuando, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  es-MX: "Si quieres seguir en mi lista para recibir algún correo de vez en cuando, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  fr: "Si tu veux rester sur ma liste pour recevoir un e-mail de temps en temps, appuie sur le bouton. Sinon, tu n'as rien à faire : c'est le dernier de ces e-mails."
  he: "אם תרצו להישאר ברשימה שלי ולקבל מייל מדי פעם, הקישו על הכפתור. אם לא, אין צורך לעשות כלום: זה האחרון מבין המיילים האלה."
  hi: "अगर आप कभी-कभार ईमेल पाने के लिए मेरी सूची में बने रहना चाहते हैं, तो बटन पर टैप करें। अगर नहीं, तो कुछ करने की ज़रूरत नहीं: यह इन ईमेल में से आख़िरी है।"
  id: "Kalau kamu ingin tetap ada di daftarku untuk sesekali menerima email, ketuk tombolnya. Kalau tidak, kamu tidak perlu melakukan apa-apa: ini email terakhir dari rangkaian ini."
  it: "Se vuoi restare nella mia lista per ricevere qualche email ogni tanto, tocca il pulsante. Altrimenti non devi fare nulla: questa è l'ultima di queste email."
  ja: "このままリストに残って、ときどきメールを受け取りたい場合は、ボタンをタップしてください。そうでなければ、何もする必要はありません。この種のメールはこれが最後です。"
  ko: "목록에 남아 가끔 메일을 받고 싶으시면 버튼을 눌러 주세요. 아니라면 아무것도 하지 않으셔도 됩니다. 이런 메일은 이번이 마지막입니다."
  nl: "Wil je op mijn lijst blijven voor zo nu en dan een e-mail, tik dan op de knop. Zo niet, dan hoef je niets te doen: dit is de laatste van deze e-mails."
  pl: "Jeśli chcesz zostać na mojej liście i od czasu do czasu dostać e-mail, dotknij przycisku. Jeśli nie, nic nie musisz robić: to ostatni z tych e-maili."
  pt: "Se quiser continuar na minha lista para receber um e-mail de vez em quando, toque no botão. Se não, não precisa fazer nada: este é o último desses e-mails."
  pt-BR: "Se quiser continuar na minha lista para receber um e-mail de vez em quando, toque no botão. Se não, não precisa fazer nada: este é o último desses e-mails."
  pt-PT: "Se quiser continuar na minha lista para receber um e-mail de vez em quando, toque no botão. Caso contrário, não precisa de fazer nada: este é o último destes e-mails."
  ru: "Если хотите остаться в моём списке и иногда получать письма, нажмите кнопку. Если нет, ничего делать не нужно: это последнее из этих писем."
  sv: "Om du vill stå kvar på min lista för ett mejl då och då, tryck på knappen. Om inte behöver du inte göra något: det här är det sista av de här mejlen."
  sw: "Ikiwa ungependa kubaki kwenye orodha yangu ili upokee barua pepe mara kwa mara, gusa kitufe. Usipotaka, hakuna cha kufanya: hii ndiyo ya mwisho kati ya barua pepe hizi."
  th: "ถ้าคุณอยากอยู่ในรายชื่อต่อเพื่อรับอีเมลเป็นครั้งคราว ให้แตะปุ่ม ถ้าไม่ ก็ไม่ต้องทำอะไร: นี่คืออีเมลฉบับสุดท้ายในชุดนี้"
  uk: "Якщо хочете залишитися в моєму списку й часом отримувати листи, натисніть кнопку. Якщо ні, нічого робити не треба: це останній із цих листів."
  vi: "Nếu bạn muốn ở lại trong danh sách của tôi để thỉnh thoảng nhận email, hãy chạm vào nút. Nếu không, bạn không cần làm gì cả: đây là email cuối cùng trong loạt email này."
  zh: "如果你想留在我的名单上，偶尔收到邮件，请点按这个按钮。如果不需要，什么都不用做：这是这类邮件的最后一封。"
  zh-HK: "如果你想留在我的名單上，偶爾收到郵件，請點按這個按鈕。如果不需要，就什麼都不用做：這是這類郵件的最後一封。"
