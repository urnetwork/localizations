description: "Re-engagement email R3 (keep or go): the choice. The button records a yes; the footer's unsubscribe link is the way out. It promises nothing about silence: nobody is removed from marketing for not tapping (owner, 2026-11-15), so it no longer says \"this is the last of these emails\"."
source: "If you'd like the occasional email from me, tap the button to let me know. If you'd rather not get these emails, the unsubscribe link at the bottom turns them off."
platforms:
  - email
localizations:
  en: "If you'd like the occasional email from me, tap the button to let me know. If you'd rather not get these emails, the unsubscribe link at the bottom turns them off."
  ar: "إذا أردت أن تصلك رسالة مني من حين لآخر، فاضغط على الزر لتخبرني. وإن كنت تفضّل ألا تصلك هذه الرسائل، فرابط إلغاء الاشتراك في الأسفل يوقفها."
  cs: "Pokud ode mě chcete občas dostat e-mail, klepněte na tlačítko a dejte mi vědět. Pokud tyto e-maily dostávat nechcete, odkaz pro odhlášení odběru dole je vypne."
  de: "Wenn du ab und zu eine E-Mail von mir bekommen möchtest, tippe auf den Button, damit ich es weiß. Wenn du diese E-Mails lieber nicht bekommen möchtest, schaltet der Abmeldelink unten sie aus."
  el: "Αν θέλεις να σου στέλνω κάποιο email πού και πού, πάτησε το κουμπί για να μου το πεις. Αν προτιμάς να μη λαμβάνεις αυτά τα email, ο σύνδεσμος διαγραφής στο κάτω μέρος τα απενεργοποιεί."
  es: "Si quieres recibir algún correo mío de vez en cuando, toca el botón para decírmelo. Si prefieres no recibir estos correos, el enlace de abajo para cancelar la suscripción los desactiva."
  es-419: "Si quieres recibir algún correo mío de vez en cuando, toca el botón para decírmelo. Si prefieres no recibir estos correos, el enlace de abajo para cancelar la suscripción los desactiva."
  es-MX: "Si quieres recibir algún correo mío de vez en cuando, toca el botón para decírmelo. Si prefieres no recibir estos correos, el enlace de abajo para cancelar la suscripción los desactiva."
  fa: "اگر دوست دارید گاه‌به‌گاه از من ایمیل دریافت کنید، روی دکمه بزنید تا خبردار شوم. اگر ترجیح می‌دهید این ایمیل‌ها را دریافت نکنید، پیوند لغو دریافت ایمیل‌ها در پایین آن‌ها را خاموش می‌کند."
  fr: "Si tu veux recevoir un e-mail de ma part de temps en temps, appuie sur le bouton pour me le dire. Si tu préfères ne pas recevoir ces e-mails, le lien de désabonnement en bas les désactive."
  he: "אם תרצו לקבל ממני מייל מדי פעם, הקישו על הכפתור כדי לספר לי. אם אתם מעדיפים לא לקבל את המיילים האלה, הקישור להסרה מרשימת התפוצה שבתחתית מכבה אותם."
  hi: "अगर आप मुझसे कभी-कभार ईमेल पाना चाहते हैं, तो मुझे बताने के लिए बटन पर टैप करें। अगर आप ये ईमेल नहीं पाना चाहते, तो नीचे दिया गया सदस्यता छोड़ने का लिंक इन्हें बंद कर देता है।"
  id: "Kalau kamu ingin sesekali menerima email dari saya, ketuk tombolnya untuk memberi tahu saya. Kalau kamu lebih suka tidak menerima email ini, tautan berhenti berlangganan di bagian bawah akan menonaktifkannya."
  it: "Se vuoi ricevere qualche email da me ogni tanto, tocca il pulsante per farmelo sapere. Se preferisci non ricevere queste email, il link in fondo per annullare l'iscrizione le disattiva."
  ja: "ときどき私からのメールを受け取りたい場合は、ボタンをタップしてお知らせください。これらのメールが不要な場合は、下部の「配信停止」リンクからオフにできます。"
  ko: "가끔 제 메일을 받고 싶으시면 버튼을 눌러 알려 주세요. 이런 메일을 받고 싶지 않으시면 아래의 수신 거부 링크로 끌 수 있습니다."
  nl: "Wil je zo nu en dan een e-mail van me krijgen, tik dan op de knop om het me te laten weten. Wil je deze e-mails liever niet ontvangen, dan zet de afmeldlink onderaan ze uit."
  pl: "Jeśli chcesz od czasu do czasu dostać ode mnie e-mail, dotknij przycisku, żeby dać mi znać. Jeśli wolisz nie dostawać tych e-maili, link do wypisania się na dole je wyłącza."
  pt: "Se quiser receber um e-mail meu de vez em quando, toque no botão para me avisar. Se preferir não receber estes e-mails, o link no rodapé para cancelar a inscrição os desativa."
  pt-BR: "Se quiser receber um e-mail meu de vez em quando, toque no botão para me avisar. Se preferir não receber estes e-mails, o link no rodapé para cancelar a inscrição os desativa."
  pt-PT: "Se quiser receber um e-mail meu de vez em quando, toque no botão para me avisar. Se preferir não receber estes e-mails, o link no fundo para cancelar a subscrição desativa-os."
  ru: "Если хотите иногда получать от меня письма, нажмите кнопку, чтобы я знал. Если вы не хотите получать эти письма, ссылка для отписки внизу их отключит."
  sv: "Om du vill få ett mejl från mig då och då, tryck på knappen så att jag vet. Om du hellre inte vill få de här mejlen stänger avregistreringslänken längst ned av dem."
  sw: "Ikiwa ungependa kupokea barua pepe kutoka kwangu mara kwa mara, gusa kitufe ili unijulishe. Ikiwa hungependa kupokea barua pepe hizi, kiungo cha kujiondoa kilicho chini huzizima."
  th: "ถ้าคุณอยากรับอีเมลจากผมเป็นครั้งคราว ให้แตะปุ่มเพื่อบอกผม ถ้าไม่อยากรับอีเมลเหล่านี้ ลิงก์ยกเลิกการรับอีเมลด้านล่างจะปิดการรับอีเมลเหล่านี้"
  tr: "Ara sıra benden e-posta almak isterseniz, bana bildirmek için düğmeye dokunun. Bu e-postaları almak istemiyorsanız, en alttaki abonelikten çıkma bağlantısı bunları kapatır."
  uk: "Якщо хочете часом отримувати від мене листи, натисніть кнопку, щоб я знав. Якщо ви не хочете отримувати ці листи, посилання для відписки внизу їх вимкне."
  vi: "Nếu bạn muốn thỉnh thoảng nhận email từ tôi, hãy chạm vào nút để cho tôi biết. Nếu bạn không muốn nhận những email này, liên kết hủy đăng ký ở cuối thư sẽ tắt chúng."
  zh: "如果你想偶尔收到我的邮件，请点按这个按钮告诉我。如果你不想收到这类邮件，底部的“退订”链接可以将其关闭。"
  zh-HK: "如果你想偶爾收到我的郵件，請點按這個按鈕告訴我。如果你不想收到這類郵件，底部的「取消訂閱」連結可以將其關閉。"
