description: "Subscription: other-platform body ({platform})"
source: "Your Pro subscription is billed through {platform}. To change or cancel it, manage your subscriptions in {platform}."
platforms:
  - site
localizations:
  ar: "يتم تحصيل اشتراك Pro الخاص بك عبر {platform}. لتغييره أو إلغائه، أدر اشتراكاتك عبر {platform}."
  cs: "Vaše předplatné Pro je účtováno přes {platform}. Chcete-li ho změnit nebo zrušit, spravujte svá předplatná přes {platform}."
  de: "Dein Pro-Abo wird über {platform} abgerechnet. Zum Ändern oder Kündigen verwalte deine Abos über {platform}."
  el: "Η συνδρομή σας Pro χρεώνεται μέσω {platform}. Για να την αλλάξετε ή να την ακυρώσετε, διαχειριστείτε τις συνδρομές σας μέσω {platform}."
  en: "Your Pro subscription is billed through {platform}. To change or cancel it, manage your subscriptions in {platform}."
  es: "Tu suscripción Pro se factura a través de {platform}. Para cambiarla o cancelarla, gestiona tus suscripciones a través de {platform}."
  es-419: "Tu suscripción Pro se factura a través de {platform}. Para cambiarla o cancelarla, administra tus suscripciones a través de {platform}."
  es-MX: "Tu suscripción Pro se factura a través de {platform}. Para cambiarla o cancelarla, administra tus suscripciones a través de {platform}."
  fr: "Votre abonnement Pro est facturé via {platform}. Pour le modifier ou l'annuler, gérez vos abonnements via {platform}."
  he: "המנוי Pro שלך מחויב דרך {platform}. כדי לשנות או לבטל אותו, נהל את המנויים שלך דרך {platform}."
  hi: "आपकी Pro सदस्यता {platform} के माध्यम से बिल की जाती है। इसे बदलने या रद्द करने के लिए, अपनी सदस्यताएँ {platform} के माध्यम से प्रबंधित करें।"
  id: "Langganan Pro Anda ditagih melalui {platform}. Untuk mengubah atau membatalkannya, kelola langganan Anda melalui {platform}."
  it: "Il tuo abbonamento Pro viene fatturato tramite {platform}. Per modificarlo o annullarlo, gestisci i tuoi abbonamenti tramite {platform}."
  ja: "Pro サブスクリプションは {platform} 経由で請求されています。変更または解約するには、{platform} 経由でサブスクリプションを管理してください。"
  ko: "Pro 구독은 {platform}에서 청구됩니다. 변경하거나 취소하려면 {platform}에서 구독을 관리하세요."
  nl: "Je Pro-abonnement wordt gefactureerd via {platform}. Om het te wijzigen of op te zeggen, beheer je je abonnementen via {platform}."
  pl: "Twoja subskrypcja Pro jest rozliczana przez {platform}. Aby ją zmienić lub anulować, zarządzaj subskrypcjami przez {platform}."
  pt: "A sua assinatura Pro é faturada através de {platform}. Para a alterar ou cancelar, faça a gestão das suas assinaturas através de {platform}."
  pt-BR: "Sua assinatura Pro é cobrada através de {platform}. Para alterá-la ou cancelá-la, gerencie suas assinaturas através de {platform}."
  pt-PT: "A sua assinatura Pro é faturada através de {platform}. Para a alterar ou cancelar, faça a gestão das suas assinaturas através de {platform}."
  ru: "Ваша подписка Pro оплачивается через {platform}. Чтобы изменить или отменить её, управляйте подписками через {platform}."
  sv: "Din Pro-prenumeration faktureras via {platform}. Ändra eller avsluta den genom att hantera dina prenumerationer via {platform}."
  sw: "Usajili wako wa Pro unatozwa kupitia {platform}. Ili kuubadilisha au kuughairi, dhibiti usajili wako kupitia {platform}."
  th: "ระบบเรียกเก็บเงินการสมัคร Pro ของคุณผ่าน {platform} หากต้องการเปลี่ยนหรือยกเลิก ให้จัดการการสมัครของคุณผ่าน {platform}"
  uk: "Ваша підписка Pro оплачується через {platform}. Щоб змінити або скасувати її, керуйте підписками через {platform}."
  vi: "Gói đăng ký Pro của bạn được thanh toán qua {platform}. Để thay đổi hoặc hủy, hãy quản lý các gói đăng ký của bạn qua {platform}."
  zh: "您的 Pro 订阅通过 {platform} 计费。如需更改或取消，请通过 {platform} 管理您的订阅。"
  zh-HK: "您的 Pro 訂閱透過 {platform} 計費。如需更改或取消，請透過 {platform} 管理您的訂閱。"
