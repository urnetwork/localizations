description: "Subscription: billing explanation, Apple. Full sentence so each language can inflect around the store name naturally."
source: "Your Pro subscription is billed through the App Store. To change or cancel it, manage your subscriptions in the App Store."
platforms:
  - site
localizations:
  ar: "يتم تحصيل اشتراك Pro الخاص بك عبر App Store. لتغييره أو إلغائه، أدر اشتراكاتك في App Store."
  cs: "Vaše předplatné Pro je účtováno přes App Store. Chcete-li ho změnit nebo zrušit, spravujte svá předplatná v App Store."
  de: "Dein Pro-Abo wird über den App Store abgerechnet. Zum Ändern oder Kündigen verwalte deine Abos im App Store."
  el: "Η συνδρομή σας Pro χρεώνεται μέσω του App Store. Για να την αλλάξετε ή να την ακυρώσετε, διαχειριστείτε τις συνδρομές σας στο App Store."
  en: "Your Pro subscription is billed through the App Store. To change or cancel it, manage your subscriptions in the App Store."
  es: "Tu suscripción Pro se factura a través del App Store. Para cambiarla o cancelarla, gestiona tus suscripciones en el App Store."
  es-419: "Tu suscripción Pro se factura a través del App Store. Para cambiarla o cancelarla, administra tus suscripciones en el App Store."
  es-MX: "Tu suscripción Pro se factura a través del App Store. Para cambiarla o cancelarla, administra tus suscripciones en el App Store."
  fr: "Votre abonnement Pro est facturé via l'App Store. Pour le modifier ou l'annuler, gérez vos abonnements dans l'App Store."
  he: "המנוי Pro שלך מחויב דרך App Store. כדי לשנות או לבטל אותו, נהל את המנויים שלך ב-App Store."
  hi: "आपकी Pro सदस्यता App Store के माध्यम से बिल की जाती है। इसे बदलने या रद्द करने के लिए, अपनी सदस्यताएँ App Store में प्रबंधित करें।"
  id: "Langganan Pro Anda ditagih melalui App Store. Untuk mengubah atau membatalkannya, kelola langganan Anda di App Store."
  it: "Il tuo abbonamento Pro viene fatturato tramite l'App Store. Per modificarlo o annullarlo, gestisci i tuoi abbonamenti nell'App Store."
  ja: "Pro サブスクリプションは App Store 経由で請求されています。変更または解約するには、App Store でサブスクリプションを管理してください。"
  ko: "Pro 구독은 App Store에서 청구됩니다. 변경하거나 취소하려면 App Store에서 구독을 관리하세요."
  nl: "Je Pro-abonnement wordt gefactureerd via de App Store. Om het te wijzigen of op te zeggen, beheer je je abonnementen in de App Store."
  pl: "Twoja subskrypcja Pro jest rozliczana przez App Store. Aby ją zmienić lub anulować, zarządzaj subskrypcjami w App Store."
  pt: "A sua assinatura Pro é faturada através da App Store. Para a alterar ou cancelar, faça a gestão das suas assinaturas na App Store."
  pt-BR: "Sua assinatura Pro é cobrada através da App Store. Para alterá-la ou cancelá-la, gerencie suas assinaturas na App Store."
  pt-PT: "A sua assinatura Pro é faturada através da App Store. Para a alterar ou cancelar, faça a gestão das suas assinaturas na App Store."
  ru: "Ваша подписка Pro оплачивается через App Store. Чтобы изменить или отменить её, управляйте подписками в App Store."
  sv: "Din Pro-prenumeration faktureras via App Store. Ändra eller avsluta den genom att hantera dina prenumerationer i App Store."
  sw: "Usajili wako wa Pro unatozwa kupitia App Store. Ili kuubadilisha au kuughairi, dhibiti usajili wako katika App Store."
  th: "ระบบเรียกเก็บเงินการสมัคร Pro ของคุณผ่าน App Store หากต้องการเปลี่ยนหรือยกเลิก ให้จัดการการสมัครของคุณใน App Store"
  uk: "Ваша підписка Pro оплачується через App Store. Щоб змінити або скасувати її, керуйте підписками в App Store."
  vi: "Gói đăng ký Pro của bạn được thanh toán qua App Store. Để thay đổi hoặc hủy, hãy quản lý các gói đăng ký của bạn trong App Store."
  zh: "您的 Pro 订阅通过 App Store 计费。如需更改或取消，请在 App Store 中管理您的订阅。"
  zh-HK: "您的 Pro 訂閱透過 App Store 計費。如需更改或取消，請在 App Store 中管理您的訂閱。"
