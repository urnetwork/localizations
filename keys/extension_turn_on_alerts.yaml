description: "Browser extension popup: a small button, shown while the browser has not let the extension show notifications, that asks the browser for that permission. With it, the extension shows one browser notification when the account runs out of data; without it, the popup's alert and a ! on the toolbar icon show it. It sits under the settings toggles beside extension_out_of_data_alerts_note, and in the out-of-data alert beside Get Pro and Buy data. Short."
