description: "Android app string: pin app description."
source: "Keeps all of this app's connections on a single provider, so its API and images share one IP address. Use for apps whose content fails to load through the VPN"
platforms:
  - android
localizations:
  ar: "يُبقي جميع اتصالات هذا التطبيق على مزود واحد، بحيث تشترك واجهة API والصور في عنوان IP واحد. استخدمه للتطبيقات التي يفشل تحميل محتواها عبر VPN"
  cs: "Udrží všechna připojení této aplikace u jednoho poskytovatele, takže její API a obrázky sdílejí jednu IP adresu. Použijte u aplikací, jejichž obsah se přes VPN nenačte"
  de: "Hält alle Verbindungen dieser App bei einem einzigen Anbieter, sodass ihre API und ihre Bilder dieselbe IP-Adresse nutzen. Für Apps, deren Inhalte über das VPN nicht laden"
  el: "Διατηρεί όλες τις συνδέσεις αυτής της εφαρμογής σε έναν πάροχο, ώστε το API και οι εικόνες της να μοιράζονται μία διεύθυνση IP. Χρησιμοποιήστε το για εφαρμογές των οποίων το περιεχόμενο δεν φορτώνει μέσω του VPN"
  en: "Keeps all of this app's connections on a single provider, so its API and images share one IP address. Use for apps whose content fails to load through the VPN"
  es: "Mantiene todas las conexiones de esta app en un solo proveedor, de modo que su API y sus imágenes compartan una misma dirección IP. Úsalo para apps cuyo contenido no carga a través de la VPN"
  es-419: "Mantiene todas las conexiones de esta app en un solo proveedor, para que su API y sus imágenes compartan una misma dirección IP. Usar para apps cuyo contenido no carga a través de la VPN"
  es-MX: "Mantiene todas las conexiones de esta app en un solo proveedor, para que su API y sus imágenes compartan una misma dirección IP. Úsalo para apps cuyo contenido no carga a través de la VPN"
  fr: "Maintient toutes les connexions de cette application sur un seul fournisseur, afin que son API et ses images partagent une même adresse IP. À utiliser pour les applications dont le contenu ne se charge pas via le VPN"
  he: "שומר את כל החיבורים של האפליקציה הזו על ספק אחד, כך שה-API והתמונות שלה חולקים כתובת IP אחת. השתמש באפליקציות שהתוכן שלהן לא נטען דרך ה-VPN"
  hi: "इस ऐप के सभी कनेक्शन एक ही प्रदाता पर रखता है, ताकि इसका API और इमेज एक ही IP पता साझा करें। उन ऐप्स के लिए उपयोग करें जिनकी सामग्री VPN के ज़रिए लोड नहीं होती"
  id: "Menjaga semua koneksi aplikasi ini pada satu penyedia, sehingga API dan gambarnya memakai satu alamat IP yang sama. Gunakan untuk aplikasi yang kontennya gagal dimuat melalui VPN"
  it: "Mantiene tutte le connessioni di questa app su un solo provider, così la sua API e le sue immagini condividono un unico indirizzo IP. Usalo per le app i cui contenuti non si caricano tramite la VPN"
  ja: "このアプリのすべての接続を1つのプロバイダーにまとめ、APIと画像が同じIPアドレスを使うようにします。VPN経由でコンテンツが読み込めないアプリに使用してください"
  ko: "이 앱의 모든 연결을 하나의 제공업체로 유지하여 API와 이미지가 같은 IP 주소를 사용하도록 합니다. VPN을 통해 콘텐츠가 로드되지 않는 앱에 사용하세요"
  nl: "Houdt alle verbindingen van deze app bij één provider, zodat de API en de afbeeldingen hetzelfde IP-adres delen. Gebruik dit voor apps waarvan de inhoud niet laadt via de VPN"
  pl: "Utrzymuje wszystkie połączenia tej aplikacji u jednego dostawcy, dzięki czemu jej API i obrazy korzystają z jednego adresu IP. Użyj w przypadku aplikacji, których treść nie ładuje się przez VPN"
  pt: "Mantém todas as ligações desta aplicação num único fornecedor, para que a sua API e as imagens partilhem o mesmo endereço IP. Use em aplicações cujo conteúdo não carrega através da VPN"
  pt-BR: "Mantém todas as conexões deste app em um único provedor, para que a API e as imagens compartilhem o mesmo endereço IP. Use em apps cujo conteúdo não carrega pela VPN"
  pt-PT: "Mantém todas as ligações desta aplicação num único fornecedor, para que a sua API e as imagens partilhem o mesmo endereço IP. Use em aplicações cujo conteúdo não carrega através da VPN"
  ru: "Удерживает все соединения этого приложения на одном провайдере, чтобы его API и изображения использовали один IP-адрес. Подходит для приложений, содержимое которых не загружается через VPN"
  sv: "Håller alla den här appens anslutningar hos en enda leverantör, så att dess API och bilder delar samma IP-adress. Använd för appar vars innehåll inte laddas via VPN"
  sw: "Huweka miunganisho yote ya programu hii kwa mtoa huduma mmoja, ili API na picha zake zitumie anwani moja ya IP. Tumia kwa programu ambazo maudhui yake hayapakii kupitia VPN"
  th: "เก็บการเชื่อมต่อทั้งหมดของแอปนี้ไว้กับผู้ให้บริการรายเดียว เพื่อให้ API และรูปภาพใช้ที่อยู่ IP เดียวกัน ใช้กับแอปที่เนื้อหาโหลดไม่ขึ้นเมื่อผ่าน VPN"
  uk: "Утримує всі з'єднання цього застосунку на одному провайдері, щоб його API та зображення використовували одну IP-адресу. Використовуйте для застосунків, вміст яких не завантажується через VPN"
  vi: "Giữ tất cả kết nối của ứng dụng này trên một nhà cung cấp duy nhất, để API và hình ảnh của nó dùng chung một địa chỉ IP. Dùng cho các ứng dụng có nội dung không tải được qua VPN"
  zh: "将此应用的所有连接保持在同一个提供商上，使其 API 和图片共用同一个 IP 地址。适用于内容无法通过 VPN 加载的应用"
  zh-HK: "將此應用程式的所有連接保持在同一個供應商上，使其 API 和圖片共用同一個 IP 地址。適用於內容無法透過 VPN 載入的應用程式"
