description: "Onboarding emails E3a, E4b, E5b: the terms line under the button. {offer_price} and {regular_price} are localized amounts."
source: "14 days free, then {offer_price} for your first year, then {regular_price}/year. Cancel anytime."
platforms:
  - email
placeholders:
