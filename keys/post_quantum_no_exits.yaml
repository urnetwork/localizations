description: "Connect screen notice, shown in place of the connecting state while post-quantum encryption is on and the selected location has no post-quantum exits right now (the sdk's ConnectViewController.GetPostQuantumUnavailable), so the reader can choose instead of waiting on a connection that cannot complete. {location} is the location's name as the location list shows it, inserted as is, so no case ending or preposition can attach to it. Two actions follow: post_quantum_no_exits_pick_location and post_quantum_no_exits_turn_off."
source: "No post-quantum exits in %@ right now"
