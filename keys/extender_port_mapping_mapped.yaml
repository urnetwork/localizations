description: "Status line under the Open a port on my router switch once the router forwards the extender's ports. The first argument is the ports, such as TCP 443, UDP 443, UDP 4053 (an arrow joins a router port to the device's, as TCP 40443→443); the second is how the router was asked: PCP, NAT-PMP or UPnP. Neither is translated."
source: "Your router forwards %@ (%@)."
platforms:
