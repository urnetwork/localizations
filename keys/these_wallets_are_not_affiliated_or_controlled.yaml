description: "Used in Main/Account/Wallets/ConnectWalletSheet/ConnectWalletSheetView.swift."
source: "These wallets are not affiliated or controlled by URnetwork. We will send earnings into the connected wallet."
deprecated:
  - apple
platforms:
  - apple
localizations:
  ar: "هذه المحافظ غير مرتبطة أو متحكم بها من قبل URnetwork. سنقوم بإرسال الأرباح إلى المحفظة المتصلة."
  cs: "Tyto peněženky nejsou přidružené ani kontrolované společností URnetwork. Výdělky budeme posílat do připojené peněženky."
  de: "Diese Wallets sind nicht mit URnetwork verbunden oder werden von URnetwork kontrolliert. Wir senden Einnahmen an die verbundene Wallet."
  el: "Αυτά τα πορτοφόλια δεν συνδέονται ούτε ελέγχονται από το URnetwork. Θα στείλουμε τα κέρδη στο συνδεδεμένο πορτοφόλι."
  en: "These wallets are not affiliated or controlled by URnetwork. We will send earnings into the connected wallet."
  es: "Estas carteras no están afiliadas ni controladas por URnetwork. Enviaremos las ganancias a la cartera conectada."
  es-419: "Estas billeteras no están afiliadas ni controladas por URnetwork. Enviaremos las ganancias a la billetera conectada."
  es-MX: "Estas billeteras no están afiliadas ni controladas por URnetwork. Enviaremos las ganancias a la billetera conectada."
  fr: "Ces portefeuilles ne sont pas affiliés ni contrôlés par URnetwork. Nous enverrons les gains dans le portefeuille connecté."
  he: "ארנקים אלה אינם מסונפים או נשלטים על ידי URnetwork. נשלח את הרווחים לארנק המחובר."
  hi: "ये वॉलेट URnetwork से संबद्ध या नियंत्रित नहीं हैं। हम कनेक्टेड वॉलेट में कमाई भेजेंगे।"
  id: "Dompet-dompet ini tidak berafiliasi dengan atau dikendalikan oleh URnetwork. Kami akan mengirim pendapatan ke dompet yang terhubung."
  it: "Questi portafogli non sono affiliati né controllati da URnetwork. Invieremo i guadagni nel portafoglio collegato."
  ja: "これらのウォレットはURnetworkと提携しておらず、URnetworkによって管理されていません。収益は接続されたウォレットに送金されます。"
  ko: "이 지갑들은 URnetwork와 제휴되거나 통제되지 않습니다. 수익금은 연결된 지갑으로 보내드립니다."
  nl: "Deze wallets zijn niet gelieerd aan of gecontroleerd door URnetwork. We zullen verdiensten naar de verbonden wallet sturen."
  pl: "Te portfele nie są powiązane ani kontrolowane przez URnetwork. Wyślemy zarobki do połączonego portfela."
  pt: "Estas carteiras não são afiliadas nem controladas pela URnetwork. Enviaremos os ganhos para a carteira conectada."
  pt-BR: "Estas carteiras não são afiliadas nem controladas pela URnetwork. Enviaremos os ganhos para a carteira conectada."
  pt-PT: "Estas carteiras não são afiliadas nem controladas pela URnetwork. Enviaremos os ganhos para a carteira ligada."
  ru: "Эти кошельки не связаны и не контролируются URnetwork. Мы отправим заработок в подключенный кошелек."
  sv: "Dessa plånböcker är inte anslutna till eller kontrollerade av URnetwork. Vi kommer att skicka intäkter till den anslutna plånboken."
  sw: "Pochi hizi hazihusiani na URnetwork wala kudhibitiwa nayo. Tutatuma mapato kwenye pochi iliyounganishwa."
  th: "กระเป๋าเงินเหล่านี้ไม่ได้เป็นพันธมิตรหรือควบคุมโดย URnetwork เราจะส่งรายได้ไปยังกระเป๋าเงินที่เชื่อมต่อ"
  uk: "Ці гаманці не пов'язані та не контролюються URnetwork. Ми надішлемо заробіток на підключений гаманець."
  vi: "Các ví này không liên kết hoặc được kiểm soát bởi URnetwork. Chúng tôi sẽ gửi thu nhập vào ví đã kết nối."
  zh: "这些钱包与URnetwork无关，也不受URnetwork控制。我们将收益发送到连接的钱包中。"
  zh-HK: "這些錢包與URnetwork無關，也不受URnetwork控制。我們將收益發送到已連接的錢包中。"
