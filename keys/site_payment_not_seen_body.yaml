description: "Upgrade sheet: give-up state body — the payment may still be processing and will appear under Account"
source: "We haven't seen your payment yet. If you completed it in your wallet, it may still be processing — your plan will update automatically under Account once it lands."
platforms:
  - site
localizations:
  ar: "لم نرَ دفعتك بعد. إذا كنت قد أكملتها في محفظتك، فربما لا تزال قيد المعالجة — سيتم تحديث خطتك تلقائيًا ضمن «الحساب» بمجرد وصولها."
  de: "Wir haben deine Zahlung noch nicht gesehen. Wenn du sie in deiner Wallet abgeschlossen hast, wird sie möglicherweise noch verarbeitet — dein Plan wird unter „Konto“ automatisch aktualisiert, sobald sie eingeht."
  en: "We haven't seen your payment yet. If you completed it in your wallet, it may still be processing — your plan will update automatically under Account once it lands."
  es: "Aún no hemos visto tu pago. Si lo completaste en tu billetera, puede que todavía se esté procesando — tu plan se actualizará automáticamente en «Cuenta» en cuanto llegue."
  ru: "Мы пока не видим вашего платежа. Если вы завершили его в кошельке, он, возможно, ещё обрабатывается — ваш тариф обновится автоматически в разделе «Аккаунт», как только платёж поступит."
  zh: "我们尚未看到您的付款。如果您已在钱包中完成付款，它可能仍在处理中；付款到账后，您的方案会在“帐户”中自动更新。"
