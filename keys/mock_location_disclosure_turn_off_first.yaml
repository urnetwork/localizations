description: "Disclosure shown with the mock location toggle: turn the feature off in URnetwork before removing it as the mock location app, or the device location can stay frozen."
source: "Turn this off in URnetwork before you turn off developer options, deselect URnetwork, or uninstall the app — otherwise your device location can stay frozen until you restart."
platforms:
  - android
localizations:
  ar: "أوقف هذه الميزة في URnetwork قبل إيقاف خيارات المطوّرين أو إلغاء اختيار URnetwork أو إلغاء تثبيت التطبيق، وإلا فقد يظل موقع جهازك ثابتًا حتى تعيد تشغيله."
  cs: "Vypněte tuto funkci v aplikaci URnetwork dříve, než vypnete možnosti pro vývojáře, zrušíte výběr aplikace URnetwork nebo aplikaci odinstalujete — jinak může poloha zařízení zůstat zamrzlá až do restartu."
  de: "Schalte dies in URnetwork aus, bevor du die Entwickleroptionen deaktivierst, URnetwork abwählst oder die App deinstallierst — sonst kann dein Gerätestandort bis zum Neustart eingefroren bleiben."
  el: "Απενεργοποιήστε το στο URnetwork πριν απενεργοποιήσετε τις επιλογές προγραμματιστή, καταργήσετε την επιλογή του URnetwork ή απεγκαταστήσετε την εφαρμογή — διαφορετικά η τοποθεσία της συσκευής σας μπορεί να μείνει παγωμένη μέχρι την επανεκκίνηση."
  en: "Turn this off in URnetwork before you turn off developer options, deselect URnetwork, or uninstall the app — otherwise your device location can stay frozen until you restart."
  es: "Desactívalo en URnetwork antes de desactivar las opciones para desarrolladores, quitar la selección de URnetwork o desinstalar la aplicación; de lo contrario, la ubicación de tu dispositivo puede quedar congelada hasta que lo reinicies."
  es-419: "Desactívalo en URnetwork antes de desactivar las opciones para desarrolladores, quitar la selección de URnetwork o desinstalar la app; de lo contrario, la ubicación de tu dispositivo puede quedar congelada hasta que lo reinicies."
  es-MX: "Desactívalo en URnetwork antes de desactivar las opciones para desarrolladores, quitar la selección de URnetwork o desinstalar la app; de lo contrario, la ubicación de tu dispositivo puede quedar congelada hasta que lo reinicies."
  fr: "Désactivez cette option dans URnetwork avant de désactiver les options pour les développeurs, de désélectionner URnetwork ou de désinstaller l'application — sinon la position de votre appareil peut rester figée jusqu'au redémarrage."
  he: "כבה זאת ב-URnetwork לפני שתכבה את אפשרויות המפתחים, תבטל את בחירת URnetwork או תסיר את האפליקציה — אחרת מיקום המכשיר שלך עלול להישאר קפוא עד להפעלה מחדש."
  hi: "डेवलपर विकल्प बंद करने, URnetwork का चयन हटाने या ऐप्लिकेशन अनइंस्टॉल करने से पहले इसे URnetwork में बंद करें — वरना आपके डिवाइस का स्थान रीस्टार्ट करने तक अटका रह सकता है।"
  id: "Nonaktifkan ini di URnetwork sebelum Anda menonaktifkan opsi developer, membatalkan pilihan URnetwork, atau meng-uninstal aplikasi — jika tidak, lokasi perangkat Anda bisa tetap membeku sampai dimulai ulang."
  it: "Disattivalo in URnetwork prima di disattivare le opzioni sviluppatore, deselezionare URnetwork o disinstallare l'app — altrimenti la posizione del dispositivo può restare bloccata fino al riavvio."
  ja: "開発者向けオプションをオフにする、URnetwork の選択を解除する、またはアプリをアンインストールする前に、URnetwork でこの機能をオフにしてください。そうしないと、再起動するまでデバイスの位置情報が固定されたままになることがあります。"
  ko: "개발자 옵션을 끄거나 URnetwork 선택을 해제하거나 앱을 제거하기 전에 URnetwork에서 이 기능을 먼저 끄세요. 그러지 않으면 기기를 다시 시작할 때까지 기기 위치가 고정된 상태로 남을 수 있습니다."
  nl: "Zet dit uit in URnetwork voordat je de opties voor ontwikkelaars uitschakelt, URnetwork deselecteert of de app verwijdert — anders kan je apparaatlocatie bevroren blijven totdat je opnieuw opstart."
  pl: "Wyłącz tę funkcję w URnetwork, zanim wyłączysz opcje programisty, cofniesz wybór URnetwork lub odinstalujesz aplikację — w przeciwnym razie lokalizacja urządzenia może pozostać zamrożona do ponownego uruchomienia."
  pt: "Desative isto na URnetwork antes de desativar as opções de programador, desmarcar a URnetwork ou desinstalar a aplicação — caso contrário, a localização do seu dispositivo pode ficar congelada até reiniciar."
  pt-BR: "Desative isso no URnetwork antes de desativar as opções do desenvolvedor, desmarcar o URnetwork ou desinstalar o app — caso contrário, a localização do seu dispositivo pode ficar congelada até você reiniciar."
  pt-PT: "Desative isto na URnetwork antes de desativar as opções de programador, desmarcar a URnetwork ou desinstalar a aplicação — caso contrário, a localização do seu dispositivo pode ficar congelada até reiniciar."
  ru: "Отключите эту функцию в URnetwork, прежде чем выключать параметры разработчика, снимать выбор URnetwork или удалять приложение — иначе местоположение устройства может остаться замороженным до перезагрузки."
  sv: "Stäng av detta i URnetwork innan du stänger av utvecklaralternativen, avmarkerar URnetwork eller avinstallerar appen — annars kan enhetens plats förbli frusen tills du startar om."
  sw: "Zima kipengele hiki katika URnetwork kabla ya kuzima chaguo za wasanidi programu, kuondoa uteuzi wa URnetwork au kuondoa programu — vinginevyo mahali pa kifaa chako panaweza kubaki pamegandishwa hadi uwashe upya."
  th: "ปิดฟีเจอร์นี้ใน URnetwork ก่อนที่จะปิดตัวเลือกสำหรับนักพัฒนาแอป ยกเลิกการเลือก URnetwork หรือถอนการติดตั้งแอป มิฉะนั้นตำแหน่งอุปกรณ์ของคุณอาจค้างอยู่จนกว่าจะรีสตาร์ท"
  uk: "Вимкніть цю функцію в URnetwork, перш ніж вимикати параметри розробника, скасовувати вибір URnetwork або видаляти додаток — інакше місцезнаходження пристрою може залишитися замороженим до перезавантаження."
  vi: "Hãy tắt tính năng này trong URnetwork trước khi bạn tắt tùy chọn cho nhà phát triển, bỏ chọn URnetwork hoặc gỡ cài đặt ứng dụng — nếu không, vị trí thiết bị của bạn có thể bị giữ nguyên cho đến khi khởi động lại."
  zh: "在关闭开发者选项、取消选择 URnetwork 或卸载应用之前，请先在 URnetwork 中关闭此功能——否则设备位置可能会一直停留在模拟位置，直到重启。"
  zh-HK: "在關閉開發人員選項、取消選取 URnetwork 或解除安裝應用程式之前，請先在 URnetwork 中關閉此功能——否則裝置位置可能會一直停留在模擬位置，直到重新啟動。"
