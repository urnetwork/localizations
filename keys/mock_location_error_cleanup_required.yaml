description: "Error shown when the app could not remove the simulated location; the user must re-select URnetwork as the mock location app and turn the feature off, or restart."
source: "URnetwork could not remove the simulated location. Re-select URnetwork under developer options and turn this off, or restart your device."
platforms:
  - android
localizations:
  ar: "تعذّر على URnetwork إزالة الموقع الوهمي. أعد اختيار URnetwork في خيارات المطوّرين ثم أوقف هذه الميزة، أو أعد تشغيل جهازك."
  cs: "Aplikaci URnetwork se nepodařilo odstranit simulovanou polohu. Znovu vyberte URnetwork v možnostech pro vývojáře a funkci vypněte, nebo restartujte zařízení."
  de: "URnetwork konnte den simulierten Standort nicht entfernen. Wähle URnetwork in den Entwickleroptionen erneut aus und schalte diese Funktion aus, oder starte dein Gerät neu."
  el: "Το URnetwork δεν μπόρεσε να καταργήσει την εικονική τοποθεσία. Επιλέξτε ξανά το URnetwork στις επιλογές προγραμματιστή και απενεργοποιήστε το, ή επανεκκινήστε τη συσκευή σας."
  en: "URnetwork could not remove the simulated location. Re-select URnetwork under developer options and turn this off, or restart your device."
  es: "URnetwork no pudo eliminar la ubicación simulada. Vuelve a seleccionar URnetwork en las opciones para desarrolladores y desactívalo, o reinicia tu dispositivo."
  es-419: "URnetwork no pudo eliminar la ubicación simulada. Vuelve a seleccionar URnetwork en las opciones para desarrolladores y desactívalo, o reinicia tu dispositivo."
  es-MX: "URnetwork no pudo eliminar la ubicación simulada. Vuelve a seleccionar URnetwork en las opciones para desarrolladores y desactívalo, o reinicia tu dispositivo."
  fr: "URnetwork n'a pas pu supprimer la position fictive. Resélectionnez URnetwork dans les options pour les développeurs et désactivez cette option, ou redémarrez votre appareil."
  he: "URnetwork לא הצליח להסיר את המיקום המדומה. בחר שוב את URnetwork באפשרויות המפתחים וכבה זאת, או הפעל מחדש את המכשיר."
  hi: "URnetwork नकली स्थान नहीं हटा सका। डेवलपर विकल्प में URnetwork को फिर से चुनें और इसे बंद करें, या अपना डिवाइस रीस्टार्ट करें।"
  id: "URnetwork tidak dapat menghapus lokasi palsu. Pilih kembali URnetwork di opsi developer lalu nonaktifkan ini, atau mulai ulang perangkat Anda."
  it: "URnetwork non ha potuto rimuovere la posizione fittizia. Seleziona di nuovo URnetwork nelle opzioni sviluppatore e disattiva questa funzione, oppure riavvia il dispositivo."
  ja: "URnetwork は仮の位置情報を削除できませんでした。開発者向けオプションで URnetwork をもう一度選択してからこの機能をオフにするか、デバイスを再起動してください。"
  ko: "URnetwork가 모의 위치를 제거하지 못했습니다. 개발자 옵션에서 URnetwork를 다시 선택한 후 이 기능을 끄거나 기기를 다시 시작하세요."
  nl: "URnetwork kon de gesimuleerde locatie niet verwijderen. Selecteer URnetwork opnieuw in de opties voor ontwikkelaars en zet dit uit, of start je apparaat opnieuw op."
  pl: "Aplikacji URnetwork nie udało się usunąć symulowanej lokalizacji. Ponownie wybierz URnetwork w opcjach programisty i wyłącz tę funkcję albo uruchom urządzenie ponownie."
  pt: "A URnetwork não conseguiu remover a localização fictícia. Volte a selecionar a URnetwork nas opções de programador e desative isto, ou reinicie o dispositivo."
  pt-BR: "O URnetwork não conseguiu remover a localização fictícia. Selecione o URnetwork novamente nas opções do desenvolvedor e desative isso, ou reinicie o dispositivo."
  pt-PT: "A URnetwork não conseguiu remover a localização fictícia. Volte a selecionar a URnetwork nas opções de programador e desative isto, ou reinicie o dispositivo."
  ru: "URnetwork не удалось убрать фиктивное местоположение. Снова выберите URnetwork в параметрах разработчика и отключите эту функцию или перезагрузите устройство."
  sv: "URnetwork kunde inte ta bort den simulerade platsen. Välj URnetwork igen under utvecklaralternativen och stäng av detta, eller starta om enheten."
  sw: "URnetwork imeshindwa kuondoa mahali pa kuigwa. Chagua tena URnetwork katika chaguo za wasanidi programu kisha uzime kipengele hiki, au uwashe upya kifaa chako."
  th: "URnetwork ไม่สามารถลบตำแหน่งจำลองได้ เลือก URnetwork อีกครั้งในตัวเลือกสำหรับนักพัฒนาแอปแล้วปิดฟีเจอร์นี้ หรือรีสตาร์ทอุปกรณ์ของคุณ"
  uk: "URnetwork не вдалося прибрати фіктивне місцезнаходження. Знову виберіть URnetwork у параметрах розробника й вимкніть цю функцію або перезавантажте пристрій."
  vi: "URnetwork không thể gỡ vị trí mô phỏng. Hãy chọn lại URnetwork trong tùy chọn cho nhà phát triển rồi tắt tính năng này, hoặc khởi động lại thiết bị."
  zh: "URnetwork 无法移除模拟位置。请在开发者选项中重新选择 URnetwork 并关闭此功能，或重启设备。"
  zh-HK: "URnetwork 無法移除模擬位置。請在開發人員選項中重新選取 URnetwork 並關閉此功能，或重新啟動裝置。"
