description: "Onboarding email E2, not-activated variant: social proof and an invitation to reply. {providers_online} is a count formatted by the server."
source: "{providers_online} providers are online right now. If something is in the way, a work device, anything, reply and tell us."
platforms:
  - email
placeholders:
  - name: providers_online
    type: string
localizations:
  en: "{providers_online} providers are online right now. If something is in the way, a work device, anything, reply and tell us."
  ar: "{providers_online} مزوّد متصلون الآن. إذا كان هناك ما يعيقك، جهاز عمل، أي شيء، فردّ وأخبرنا."
  cs: "Právě teď je online {providers_online} poskytovatelů. Pokud vám něco brání, pracovní zařízení, cokoli, odpovězte a napište nám to."
  de: "{providers_online} Anbieter sind gerade online. Wenn dir etwas im Weg steht, ein Dienstgerät, was auch immer, antworte und sag es uns."
  el: "{providers_online} πάροχοι είναι online αυτή τη στιγμή. Αν κάτι σε εμποδίζει, μια εταιρική συσκευή, οτιδήποτε, απάντησε και πες μας."
  es: "{providers_online} proveedores están en línea ahora mismo. Si algo se interpone, un dispositivo del trabajo, lo que sea, responde y cuéntanos."
  es-419: "{providers_online} proveedores están en línea ahora mismo. Si algo se interpone, un dispositivo del trabajo, lo que sea, responde y cuéntanos."
  es-MX: "{providers_online} proveedores están en línea ahora mismo. Si algo se interpone, un dispositivo del trabajo, lo que sea, responde y cuéntanos."
  fr: "{providers_online} fournisseurs sont en ligne en ce moment. Si quelque chose bloque, un appareil pro, n'importe quoi, réponds et dis-le-nous."
  he: "{providers_online} ספקים מחוברים כרגע. אם משהו מפריע, מכשיר של העבודה, כל דבר, השיבו וספרו לנו."
  hi: "अभी {providers_online} प्रदाता ऑनलाइन हैं। अगर कुछ रास्ते में है, ऑफ़िस का डिवाइस, कुछ भी, तो जवाब देकर हमें बताएं।"
  id: "{providers_online} penyedia sedang online sekarang. Kalau ada yang menghalangi, perangkat kantor, apa pun, balas dan ceritakan kepada kami."
  it: "{providers_online} provider sono online in questo momento. Se qualcosa ti blocca, un dispositivo di lavoro, qualsiasi cosa, rispondi e diccelo."
  ja: "いま {providers_online} のプロバイダーがオンラインです。何かが引っかかっているなら、会社の端末でも、何でも、返信して私たちに教えてください。"
  ko: "지금 {providers_online}명의 제공자가 온라인입니다. 회사 기기든, 무엇이든 걸리는 게 있다면 답장으로 저희에게 알려 주세요."
  nl: "{providers_online} providers zijn nu online. Als iets in de weg zit, een werkapparaat, wat dan ook, antwoord dan en vertel het ons."
  pl: "{providers_online} dostawców jest teraz online. Jeśli coś stoi na przeszkodzie, służbowe urządzenie, cokolwiek, odpowiedz i napisz nam."
  pt: "{providers_online} provedores estão online agora. Se algo está atrapalhando, um aparelho do trabalho, qualquer coisa, responda e nos conte."
  pt-BR: "{providers_online} provedores estão online agora. Se algo está atrapalhando, um aparelho do trabalho, qualquer coisa, responda e nos conte."
  pt-PT: "{providers_online} fornecedores estão online neste momento. Se algo está a atrapalhar, um dispositivo do trabalho, o que for, responda e diga-nos."
  ru: "Прямо сейчас онлайн {providers_online} провайдеров. Если что-то мешает: рабочее устройство, что угодно, ответьте и расскажите нам."
  sv: "{providers_online} leverantörer är online just nu. Om något är i vägen, en jobbenhet, vad som helst, svara och berätta för oss."
  sw: "Watoa huduma {providers_online} wako mtandaoni sasa hivi. Ikiwa kuna kitu kinakuzuia, kifaa cha kazini, chochote, jibu na utuambie."
  th: "ตอนนี้มีผู้ให้บริการ {providers_online} รายออนไลน์ ถ้ามีอะไรติดขัด อุปกรณ์ที่ทำงาน อะไรก็ตาม ตอบกลับมาบอกเราได้เลย"
  uk: "Просто зараз онлайн {providers_online} провайдерів. Якщо щось заважає: робочий пристрій, будь-що, дайте відповідь і розкажіть нам."
  vi: "{providers_online} nhà cung cấp đang trực tuyến ngay lúc này. Nếu có gì cản trở, thiết bị công ty, bất cứ điều gì, hãy trả lời và cho chúng tôi biết."
  zh: "此刻有 {providers_online} 个提供者在线。如果有什么卡住了，比如公司设备，什么都行，回复告诉我们。"
  zh-HK: "此刻有 {providers_online} 個提供者在線。如果有什麼卡住了，比如公司裝置，什麼都行，回覆告訴我們。"
