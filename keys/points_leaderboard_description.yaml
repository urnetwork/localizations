description: "Points leaderboard: the explanation under the list header."
source: "All-time points. A block is one week; the streak counts consecutive blocks with points, and a week whose points couldn't be awarded, or are still being awarded, doesn't break it."
platforms:
  - android
  - apple
  - site
  - windows
  - linux
localizations:
  ar: "النقاط منذ البداية. الكتلة هي أسبوع واحد؛ وتحسب السلسلة الكتل المتتالية ذات النقاط، ولا يقطعها أسبوع تعذّر منح نقاطه أو ما زال منحها جاريًا."
  cs: "Body za celou dobu. Blok je jeden týden; série počítá po sobě jdoucí bloky s body a týden, za který se body nepodařilo přidělit nebo se ještě přidělují, ji nepřeruší."
  de: "Punkte seit Beginn. Ein Block ist eine Woche; die Serie zählt aufeinanderfolgende Blöcke mit Punkten, und eine Woche, deren Punkte nicht vergeben werden konnten oder noch vergeben werden, unterbricht sie nicht."
  el: "Πόντοι όλων των εποχών. Ένα μπλοκ είναι μία εβδομάδα· το σερί μετρά διαδοχικά μπλοκ με πόντους, και μια εβδομάδα της οποίας οι πόντοι δεν μπόρεσαν να απονεμηθούν ή απονέμονται ακόμη δεν το διακόπτει."
  en: "All-time points. A block is one week; the streak counts consecutive blocks with points, and a week whose points couldn't be awarded, or are still being awarded, doesn't break it."
  es: "Puntos históricos. Un bloque es una semana; la racha cuenta bloques consecutivos con puntos, y una semana cuyos puntos no se pudieron otorgar, o aún se están otorgando, no la interrumpe."
  es-419: "Puntos históricos. Un bloque es una semana; la racha cuenta bloques consecutivos con puntos, y una semana cuyos puntos no se pudieron otorgar, o aún se están otorgando, no la interrumpe."
  es-MX: "Puntos históricos. Un bloque es una semana; la racha cuenta bloques consecutivos con puntos, y una semana cuyos puntos no se pudieron otorgar, o aún se están otorgando, no la interrumpe."
  fa: "مجموع امتیازها از ابتدا تاکنون. هر بلوک یک هفته است؛ زنجیره تعداد بلوک‌های پیاپی دارای امتیاز را می‌شمارد، و هفته‌ای که اعطای امتیازهایش ممکن نشد یا هنوز در جریان است، زنجیره را قطع نمی‌کند."
  fr: "Points cumulés. Un bloc correspond à une semaine ; la série compte les blocs consécutifs avec des points, et une semaine dont les points n'ont pas pu être attribués, ou sont encore en cours d'attribution, ne l'interrompt pas."
  he: "נקודות מאז ומעולם. בלוק הוא שבוע אחד; הרצף סופר בלוקים רצופים עם נקודות, ושבוע שאת נקודותיו לא ניתן היה להעניק, או שהן עדיין מוענקות, אינו שובר אותו."
  hi: "अब तक के कुल पॉइंट। एक ब्लॉक एक सप्ताह है; स्ट्रीक पॉइंट वाले लगातार ब्लॉक गिनती है, और जिस सप्ताह के पॉइंट नहीं दिए जा सके या अभी दिए जा रहे हैं, उससे स्ट्रीक नहीं टूटती।"
  id: "Poin sepanjang waktu. Satu blok adalah satu minggu; runtutan menghitung blok berturut-turut dengan poin, dan minggu yang poinnya tidak dapat diberikan, atau masih sedang diberikan, tidak memutusnya."
  it: "Punti complessivi. Un blocco è una settimana; la serie conta i blocchi consecutivi con punti, e una settimana per cui non è stato possibile assegnare i punti, o per cui l'assegnazione è ancora in corso, non la interrompe."
  ja: "累計ポイント。ブロックは1週間です。連続はポイントを獲得した連続ブロック数で、ポイントを付与できなかった週や、まだ付与中の週があっても途切れません。"
  ko: "누적 포인트입니다. 블록은 한 주이며, 연속은 포인트를 얻은 연속 블록 수로, 포인트를 지급하지 못했거나 아직 지급 중인 주가 있어도 끊기지 않습니다."
  nl: "Punten aller tijden. Een blok is één week; de reeks telt opeenvolgende blokken met punten, en een week waarvan de punten niet konden worden toegekend, of nog worden toegekend, onderbreekt de reeks niet."
  pl: "Punkty od początku. Blok to jeden tydzień; seria liczy kolejne bloki z punktami, a tydzień, za który nie udało się przyznać punktów lub są one jeszcze przyznawane, jej nie przerywa."
  pt: "Pontos de sempre. Um bloco é uma semana; a sequência conta blocos consecutivos com pontos, e uma semana cujos pontos não puderam ser atribuídos, ou ainda estão a ser atribuídos, não a interrompe."
  pt-BR: "Pontos de todos os tempos. Um bloco é uma semana; a sequência conta blocos consecutivos com pontos, e uma semana cujos pontos não puderam ser concedidos, ou ainda estão sendo concedidos, não a interrompe."
  pt-PT: "Pontos de sempre. Um bloco é uma semana; a sequência conta blocos consecutivos com pontos, e uma semana cujos pontos não puderam ser atribuídos, ou ainda estão a ser atribuídos, não a interrompe."
  ru: "Очки за всё время. Блок — одна неделя; серия считает подряд идущие блоки с очками, и неделя, очки за которую не удалось начислить или ещё начисляются, её не прерывает."
  sv: "Poäng genom tiderna. Ett block är en vecka; sviten räknar på varandra följande block med poäng, och en vecka vars poäng inte kunde delas ut, eller fortfarande delas ut, bryter den inte."
  sw: "Pointi za wakati wote. Kitalu ni wiki moja; mfululizo huhesabu vitalu mfululizo vyenye pointi, na wiki ambayo pointi zake hazikuweza kutolewa, au bado zinatolewa, haiuvunji."
  th: "คะแนนสะสมทั้งหมด บล็อกคือหนึ่งสัปดาห์ ต่อเนื่องนับบล็อกที่มีคะแนนติดต่อกัน และสัปดาห์ที่มอบคะแนนไม่ได้หรือยังอยู่ระหว่างการมอบคะแนนจะไม่ทำให้ต่อเนื่องขาดช่วง"
  tr: "Tüm zamanlar boyunca kazanılan puanlar. Bir blok bir haftadır; seri, puan kazanılan ardışık blokları sayar. Puanları verilemeyen veya hâlâ verilmekte olan bir hafta seriyi bozmaz."
  uk: "Бали за весь час. Блок — один тиждень; серія рахує послідовні блоки з балами, і тиждень, бали за який не вдалося нарахувати або ще нараховуються, її не перериває."
  vi: "Điểm tích lũy. Một khối là một tuần; chuỗi đếm các khối liên tiếp có điểm, và tuần không thể trao điểm hoặc vẫn đang trao điểm sẽ không làm đứt chuỗi."
  zh: "历史累计积分。一个区块为一周；连续统计连续得分的区块数，积分未能发放或仍在发放中的一周不会中断连续。"
  zh-HK: "歷史累計積分。一個區塊為一週；連續統計連續得分的區塊數，積分未能發放或仍在發放中的一週不會中斷連續。"
