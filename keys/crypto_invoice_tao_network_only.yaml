description: "Crypto invoice, TAO only: the network to send on, shown with the address. TAO sent on another network is not credited to this payment. The TAO counterpart of usdc_solana_network_only. Bittensor and TAO are product names."
source: "Send only TAO on the Bittensor network to this address. TAO sent on any other network won't be credited."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "أرسل TAO على شبكة Bittensor فقط إلى هذا العنوان. لن تُحتسب عملات TAO المُرسَلة عبر أي شبكة أخرى."
  cs: "Na tuto adresu posílejte pouze TAO v síti Bittensor. TAO odeslané v jiné síti nebudou připsány."
  de: "Sende an diese Adresse nur TAO über das Bittensor-Netzwerk. TAO, die über ein anderes Netzwerk gesendet werden, werden nicht gutgeschrieben."
  el: "Στείλτε σε αυτή τη διεύθυνση μόνο TAO στο δίκτυο Bittensor. Τα TAO που στέλνονται σε άλλο δίκτυο δεν θα πιστωθούν."
  en: "Send only TAO on the Bittensor network to this address. TAO sent on any other network won't be credited."
  es: "Envía a esta dirección solo TAO por la red Bittensor. Los TAO enviados por cualquier otra red no se acreditarán."
  es-419: "Envía a esta dirección solo TAO por la red Bittensor. Los TAO enviados por cualquier otra red no se acreditarán."
  es-MX: "Envía a esta dirección solo TAO por la red Bittensor. Los TAO enviados por cualquier otra red no se acreditarán."
  fr: "Envoyez uniquement des TAO sur le réseau Bittensor à cette adresse. Les TAO envoyés sur un autre réseau ne seront pas crédités."
  he: "שלחו לכתובת הזו רק TAO ברשת Bittensor. TAO שיישלחו ברשת אחרת לא ייזקפו לתשלום."
  hi: "इस पते पर केवल Bittensor नेटवर्क पर TAO भेजें। किसी अन्य नेटवर्क पर भेजे गए TAO जमा नहीं होंगे।"
  id: "Kirim hanya TAO di jaringan Bittensor ke alamat ini. TAO yang dikirim di jaringan lain tidak akan dikreditkan."
  it: "Invia a questo indirizzo solo TAO sulla rete Bittensor. I TAO inviati su un'altra rete non verranno accreditati."
  ja: "このアドレスには Bittensor ネットワークの TAO のみを送金してください。他のネットワークで送金した TAO は入金されません。"
  ko: "이 주소로는 Bittensor 네트워크의 TAO만 보내세요. 다른 네트워크로 보낸 TAO는 입금 처리되지 않습니다."
  nl: "Stuur naar dit adres alleen TAO via het Bittensor-netwerk. TAO die via een ander netwerk wordt verstuurd, wordt niet bijgeschreven."
  pl: "Na ten adres wysyłaj wyłącznie TAO w sieci Bittensor. TAO wysłane w innej sieci nie zostaną zaksięgowane."
  pt: "Envie para este endereço apenas TAO na rede Bittensor. TAO enviados noutra rede não serão creditados."
  pt-BR: "Envie para este endereço apenas TAO na rede Bittensor. TAO enviados em outra rede não serão creditados."
  pt-PT: "Envie para este endereço apenas TAO na rede Bittensor. TAO enviados noutra rede não serão creditados."
  ru: "Отправляйте на этот адрес только TAO в сети Bittensor. TAO, отправленные в другой сети, не будут зачислены."
  sv: "Skicka endast TAO på Bittensor-nätverket till den här adressen. TAO som skickas på ett annat nätverk krediteras inte."
  sw: "Tuma TAO kwenye mtandao wa Bittensor pekee kwa anwani hii. TAO zilizotumwa kwenye mtandao mwingine hazitahesabiwa."
  th: "ส่งเฉพาะ TAO บนเครือข่าย Bittensor มายังที่อยู่นี้ TAO ที่ส่งบนเครือข่ายอื่นจะไม่ถูกนับเป็นยอดชำระ"
  uk: "Надсилайте на цю адресу лише TAO в мережі Bittensor. TAO, надіслані в іншій мережі, не буде зараховано."
  vi: "Chỉ gửi TAO trên mạng Bittensor đến địa chỉ này. TAO gửi trên mạng khác sẽ không được ghi nhận."
  zh: "请仅向此地址发送 Bittensor 网络上的 TAO。通过其他网络发送的 TAO 将不会入账。"
  zh-HK: "請僅向此地址發送 Bittensor 網絡上的 TAO。透過其他網絡發送的 TAO 將不會入賬。"
