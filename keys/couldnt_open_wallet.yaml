description: "Snackbar shown when the external wallet app could not be opened. Used in Shared/Views/SolanaSignMessageSheet.swift and Main/Account/Wallets/ConnectWalletSheet/ConnectWalletSheetView.swift."
source: "Couldn't open wallet. Please install it and try again."
platforms:
  - apple
localizations:
  ar: "تعذّر فتح المحفظة. يرجى تثبيتها والمحاولة مرة أخرى."
  cs: "Peněženku se nepodařilo otevřít. Nainstalujte ji prosím a zkuste to znovu."
  de: "Wallet konnte nicht geöffnet werden. Bitte installiere sie und versuche es erneut."
  el: "Δεν ήταν δυνατό το άνοιγμα του πορτοφολιού. Εγκαταστήστε το και δοκιμάστε ξανά."
  en: "Couldn't open wallet. Please install it and try again."
  es: "No se ha podido abrir la billetera. Instálala e inténtalo de nuevo."
  es-419: "No se pudo abrir la billetera. Instálala e inténtalo de nuevo."
  es-MX: "No se pudo abrir la cartera. Instálala e inténtalo de nuevo."
  fr: "Impossible d'ouvrir le portefeuille. Veuillez l'installer et réessayer."
  he: "לא ניתן היה לפתוח את הארנק. אנא התקן אותו ונסה שוב."
  hi: "वॉलेट खोला नहीं जा सका। कृपया इसे इंस्टॉल करें और पुनः प्रयास करें।"
  id: "Tidak dapat membuka dompet. Silakan instal dan coba lagi."
  it: "Impossibile aprire il portafoglio. Installalo e riprova."
  ja: "ウォレットを開けませんでした。インストールしてからもう一度お試しください。"
  ko: "지갑을 열 수 없습니다. 설치 후 다시 시도해 주세요."
  nl: "Kon de wallet niet openen. Installeer deze en probeer het opnieuw."
  pl: "Nie udało się otworzyć portfela. Zainstaluj go i spróbuj ponownie."
  pt: "Não foi possível abrir a carteira. Instale-a e tente novamente."
  pt-BR: "Não foi possível abrir a carteira. Instale-a e tente novamente."
  pt-PT: "Não foi possível abrir a carteira. Instale-a e tente novamente."
  ru: "Не удалось открыть кошелек. Установите его и попробуйте снова."
  sv: "Kunde inte öppna plånboken. Installera den och försök igen."
  sw: "Imeshindwa kufungua pochi. Tafadhali isakinishe kisha ujaribu tena."
  th: "ไม่สามารถเปิดกระเป๋าเงินได้ กรุณาติดตั้งแล้วลองใหม่อีกครั้ง"
  uk: "Не вдалося відкрити гаманець. Установіть його та спробуйте ще раз."
  vi: "Không thể mở ví. Vui lòng cài đặt và thử lại."
  zh: "无法打开钱包。请安装后再试。"
  zh-HK: "無法開啟錢包。請安裝後再試。"
