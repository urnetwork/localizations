description: "Disclosure shown with the mock location toggle: apps can detect a simulated location and may refuse to work."
source: "Apps can tell the location is simulated. Banking, ride-hailing, delivery and some game apps may refuse to work while this is on."
platforms:
  - android
localizations:
  ar: "يمكن للتطبيقات معرفة أن الموقع وهمي. قد ترفض تطبيقات البنوك وطلب سيارات الأجرة والتوصيل وبعض الألعاب العمل أثناء تفعيل هذه الميزة."
  cs: "Aplikace dokážou poznat, že jde o simulovanou polohu. Bankovní aplikace, aplikace pro objednávání jízd a rozvoz i některé hry mohou při zapnutí této funkce odmítnout fungovat."
  de: "Apps können erkennen, dass der Standort simuliert ist. Banking-, Fahrdienst-, Liefer- und manche Spiele-Apps funktionieren möglicherweise nicht, solange dies aktiviert ist."
  el: "Οι εφαρμογές μπορούν να αντιληφθούν ότι η τοποθεσία είναι εικονική. Εφαρμογές τραπεζών, μεταφορών, παράδοσης και ορισμένα παιχνίδια ενδέχεται να αρνηθούν να λειτουργήσουν όσο αυτό είναι ενεργό."
  en: "Apps can tell the location is simulated. Banking, ride-hailing, delivery and some game apps may refuse to work while this is on."
  es: "Las aplicaciones pueden detectar que la ubicación es simulada. Las aplicaciones de banca, transporte, reparto y algunos juegos pueden negarse a funcionar mientras esté activado."
  es-419: "Las apps pueden detectar que la ubicación es simulada. Las apps de banca, transporte, reparto y algunos juegos pueden negarse a funcionar mientras esté activado."
  es-MX: "Las apps pueden detectar que la ubicación es simulada. Las apps de banca, transporte, reparto y algunos juegos pueden negarse a funcionar mientras esté activado."
  fr: "Les applications peuvent détecter que la position est fictive. Les applications bancaires, de VTC, de livraison et certains jeux peuvent refuser de fonctionner tant que cette option est activée."
  he: "אפליקציות יכולות לזהות שהמיקום מדומה. אפליקציות בנקאות, נסיעות, משלוחים וחלק מהמשחקים עשויות לסרב לפעול כשהאפשרות פועלת."
  hi: "ऐप्लिकेशन पहचान सकते हैं कि स्थान नकली है। बैंकिंग, राइड-हेलिंग, डिलीवरी और कुछ गेम ऐप्लिकेशन इसके चालू रहने पर काम करने से मना कर सकते हैं।"
  id: "Aplikasi dapat mengetahui bahwa lokasi tersebut palsu. Aplikasi perbankan, transportasi online, pengiriman, dan beberapa game mungkin menolak berfungsi saat fitur ini aktif."
  it: "Le app possono rilevare che la posizione è fittizia. Le app bancarie, di trasporto, di consegna e alcuni giochi potrebbero rifiutarsi di funzionare finché è attivo."
  ja: "アプリは位置情報が仮のものであることを検出できます。銀行、配車、配達、一部のゲームアプリは、この機能がオンの間は動作しない場合があります。"
  ko: "앱은 위치가 모의 위치임을 감지할 수 있습니다. 은행, 차량 호출, 배달 및 일부 게임 앱은 이 기능이 켜져 있는 동안 작동을 거부할 수 있습니다."
  nl: "Apps kunnen merken dat de locatie gesimuleerd is. Bank-, taxi-, bezorg- en sommige game-apps werken mogelijk niet zolang dit aanstaat."
  pl: "Aplikacje mogą wykryć, że lokalizacja jest symulowana. Aplikacje bankowe, przewozowe, dostawcze i niektóre gry mogą odmówić działania, gdy ta opcja jest włączona."
  pt: "As aplicações conseguem perceber que a localização é fictícia. Aplicações de bancos, transporte, entregas e alguns jogos podem recusar-se a funcionar enquanto isto estiver ativo."
  pt-BR: "Os apps conseguem perceber que a localização é fictícia. Apps de banco, transporte, entrega e alguns jogos podem se recusar a funcionar enquanto isso estiver ativado."
  pt-PT: "As aplicações conseguem perceber que a localização é fictícia. Aplicações de bancos, transporte, entregas e alguns jogos podem recusar-se a funcionar enquanto isto estiver ativo."
  ru: "Приложения могут определить, что местоположение фиктивное. Банковские приложения, сервисы такси и доставки, а также некоторые игры могут отказаться работать, пока эта функция включена."
  sv: "Appar kan upptäcka att platsen är simulerad. Bank-, taxi-, leverans- och vissa spelappar kan vägra att fungera medan detta är på."
  sw: "Programu zinaweza kutambua kuwa mahali ni pa kuigwa. Programu za benki, usafiri, uwasilishaji na baadhi ya michezo zinaweza kukataa kufanya kazi wakati kipengele hiki kimewashwa."
  th: "แอปสามารถรู้ได้ว่าตำแหน่งเป็นตำแหน่งจำลอง แอปธนาคาร เรียกรถ ส่งของ และเกมบางแอปอาจไม่ยอมทำงานขณะที่เปิดใช้อยู่"
  uk: "Додатки можуть визначити, що місцезнаходження фіктивне. Банківські додатки, сервіси таксі й доставки та деякі ігри можуть відмовитися працювати, поки цю функцію ввімкнено."
  vi: "Các ứng dụng có thể phát hiện vị trí là mô phỏng. Ứng dụng ngân hàng, gọi xe, giao hàng và một số trò chơi có thể từ chối hoạt động khi tính năng này đang bật."
  zh: "应用能够识别出位置是模拟的。银行、打车、外卖和部分游戏应用在此功能开启期间可能拒绝运行。"
  zh-HK: "應用程式能夠識別出位置是模擬的。銀行、召車、外賣和部分遊戲應用程式在此功能開啟期間可能拒絕運作。"
