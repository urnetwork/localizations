description: "DNS settings, Use my account: error id the sdk returns when the pasted DNS address or hostname belongs to another adblock provider in the list. \"Adblock provider\" is what the app calls these DNS companies (AdGuard, Control D, Quad9, Cloudflare, DNS4EU, NextDNS): say it in full both times, never with the word the app uses for URnetwork's providers, which are the bandwidth providers."
source: "This address belongs to another adblock provider. Choose that adblock provider instead."
platforms:
  - android
  - apple
  - linux
  - windows
