description: "Setup guide step on linux: the privileged helper needed to write the system location file. Reassures the user that the app itself never needs root."
source: "Install the URnetwork system service. The system location file lives under /etc, so a privileged helper has to write it — URnetwork never asks you to run the app itself as an administrator."
platforms:
  - linux
localizations:
  ar: "ثبّت خدمة نظام URnetwork. ملف موقع النظام موجود ضمن /etc، لذا يجب أن يكتبه مساعد يملك صلاحيات مرتفعة — ولا يطلب منك URnetwork مطلقًا تشغيل التطبيق نفسه كمسؤول."
  cs: "Nainstalujte systémovou službu URnetwork. Systémový soubor polohy leží v /etc, takže jej musí zapsat pomocník s oprávněními — URnetwork po vás nikdy nechce, abyste samotnou aplikaci spouštěli jako správce."
  de: "Installiere den URnetwork-Systemdienst. Die Systemdatei für den Standort liegt unter /etc, daher muss ein privilegierter Helfer sie schreiben — URnetwork verlangt nie, dass du die App selbst als Administrator ausführst."
  el: "Εγκαταστήστε την υπηρεσία συστήματος URnetwork. Το αρχείο τοποθεσίας του συστήματος βρίσκεται στο /etc, οπότε πρέπει να το γράψει ένας βοηθός με προνόμια — το URnetwork δεν σας ζητά ποτέ να εκτελέσετε την ίδια την εφαρμογή ως διαχειριστής."
  en: "Install the URnetwork system service. The system location file lives under /etc, so a privileged helper has to write it — URnetwork never asks you to run the app itself as an administrator."
  es: "Instala el servicio del sistema URnetwork. El archivo de ubicación del sistema está en /etc, así que tiene que escribirlo un asistente con privilegios — URnetwork nunca te pide que ejecutes la propia aplicación como administrador."
  es-419: "Instala el servicio del sistema URnetwork. El archivo de ubicación del sistema está en /etc, así que tiene que escribirlo un asistente con privilegios — URnetwork nunca te pide que ejecutes la app en sí como administrador."
  es-MX: "Instala el servicio del sistema URnetwork. El archivo de ubicación del sistema está en /etc, así que tiene que escribirlo un asistente con privilegios — URnetwork nunca te pide que ejecutes la app en sí como administrador."
  fr: "Installez le service système URnetwork. Le fichier de localisation du système se trouve dans /etc, un assistant privilégié doit donc l'écrire — URnetwork ne vous demande jamais d'exécuter l'application elle-même en tant qu'administrateur."
  he: "התקן את שירות המערכת של URnetwork. קובץ המיקום של המערכת נמצא תחת /etc, ולכן נדרש עוזר בעל הרשאות כדי לכתוב אותו — URnetwork לעולם לא מבקש ממך להריץ את האפליקציה עצמה כמנהל מערכת."
  hi: "URnetwork सिस्टम सेवा इंस्टॉल करें। सिस्टम लोकेशन फ़ाइल /etc के अंदर होती है, इसलिए उसे लिखने के लिए विशेषाधिकार वाले हेल्पर की ज़रूरत होती है — URnetwork आपसे कभी ऐप्लिकेशन को व्यवस्थापक के रूप में चलाने के लिए नहीं कहता।"
  id: "Pasang layanan sistem URnetwork. Berkas lokasi sistem berada di bawah /etc, jadi penulisannya harus dilakukan oleh helper berhak istimewa — URnetwork tidak pernah meminta Anda menjalankan aplikasinya sendiri sebagai administrator."
  it: "Installa il servizio di sistema URnetwork. Il file di posizione di sistema si trova in /etc, quindi deve scriverlo un helper con privilegi — URnetwork non ti chiede mai di eseguire l'app stessa come amministratore."
  ja: "URnetwork システムサービスをインストールしてください。システムの位置情報ファイルは /etc 以下にあるため、書き込みには特権ヘルパーが必要です — URnetwork がアプリ自体を管理者として実行するよう求めることはありません。"
  ko: "URnetwork 시스템 서비스를 설치하세요. 시스템 위치 파일은 /etc 아래에 있어 권한 있는 도우미가 작성해야 합니다 — URnetwork는 앱 자체를 관리자 권한으로 실행하도록 요구하지 않습니다."
  nl: "Installeer de URnetwork-systeemservice. Het systeemlocatiebestand staat onder /etc, dus een helper met verhoogde rechten moet het schrijven — URnetwork vraagt je nooit om de app zelf als beheerder uit te voeren."
  pl: "Zainstaluj usługę systemową URnetwork. Systemowy plik lokalizacji znajduje się w /etc, więc musi go zapisać pomocnik z uprawnieniami — URnetwork nigdy nie wymaga uruchamiania samej aplikacji jako administrator."
  pt: "Instale o serviço de sistema URnetwork. O ficheiro de localização do sistema fica em /etc, pelo que tem de ser escrito por um auxiliar com privilégios — o URnetwork nunca lhe pede para executar a própria aplicação como administrador."
  pt-BR: "Instale o serviço de sistema URnetwork. O arquivo de localização do sistema fica em /etc, então ele precisa ser escrito por um auxiliar com privilégios — o URnetwork nunca pede que você execute o próprio app como administrador."
  pt-PT: "Instale o serviço de sistema URnetwork. O ficheiro de localização do sistema fica em /etc, pelo que tem de ser escrito por um auxiliar com privilégios — o URnetwork nunca lhe pede para executar a própria aplicação como administrador."
  ru: "Установите системную службу URnetwork. Системный файл местоположения находится в /etc, поэтому записывать его должен привилегированный помощник — URnetwork никогда не требует запускать само приложение с правами администратора."
  sv: "Installera systemtjänsten URnetwork. Systemets platsfil ligger under /etc, så en privilegierad hjälpprocess måste skriva den — URnetwork ber dig aldrig köra själva appen som administratör."
  sw: "Sakinisha huduma ya mfumo ya URnetwork. Faili ya mahali ya mfumo iko chini ya /etc, hivyo msaidizi mwenye ruhusa za juu ndiye anayepaswa kuiandika — URnetwork haikuombi kamwe uendeshe programu yenyewe ukiwa msimamizi."
  th: "ติดตั้งบริการระบบ URnetwork ไฟล์ตำแหน่งของระบบอยู่ภายใต้ /etc จึงต้องให้ตัวช่วยที่มีสิทธิ์สูงเป็นผู้เขียน — URnetwork ไม่เคยขอให้คุณเรียกใช้ตัวแอปเองในฐานะผู้ดูแลระบบ"
  uk: "Установіть системну службу URnetwork. Системний файл місцезнаходження розташований у /etc, тому записувати його має привілейований помічник — URnetwork ніколи не вимагає запускати сам застосунок з правами адміністратора."
  vi: "Cài đặt dịch vụ hệ thống URnetwork. Tệp vị trí của hệ thống nằm trong /etc nên phải có một trình trợ giúp đặc quyền ghi tệp đó — URnetwork không bao giờ yêu cầu bạn chạy chính ứng dụng với quyền quản trị."
  zh: "安装 URnetwork 系统服务。系统位置文件位于 /etc 下，因此需要由特权助手写入 — URnetwork 绝不会要求您以管理员身份运行应用本身。"
  zh-HK: "安裝 URnetwork 系統服務。系統位置檔案位於 /etc 下，因此必須由特權輔助程式寫入 — URnetwork 絕不會要求你以管理員身分執行應用程式本身。"
