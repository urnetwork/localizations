description: "Call to action"
source: "You can also allow the provider to use cell network data, which works great if you have an unlimited plan."
deprecated:
  - android
platforms:
  - apple
localizations:
  ar: "يمكنك أيضًا السماح للمزود باستخدام بيانات شبكة الجوال، وهذا يعمل بشكل رائع إذا كان لديك خطة غير محدودة."
  cs: "Poskytovateli můžete také povolit využívat data z mobilní sítě, což je skvělé, pokud máte neomezený tarif."
  de: "Du kannst dem Anbieter auch erlauben, Mobilfunkdaten zu verwenden – das funktioniert super, wenn du eine unbegrenzte Datenflat hast."
  el: "Μπορείτε επίσης να επιτρέψετε στον πάροχο να χρησιμοποιεί δεδομένα κινητού δικτύου, κάτι που λειτουργεί τέλεια αν έχετε απεριόριστο πρόγραμμα."
  en: "You can also allow the provider to use cell network data, which works great if you have an unlimited plan."
  es: "También puedes permitir que el proveedor use datos de red celular, lo cual funciona muy bien si tienes un plan ilimitado."
  es-419: "También puedes permitir que el proveedor use datos de la red celular, lo cual funciona muy bien si tienes un plan ilimitado."
  es-MX: "También puedes permitir que el proveedor use datos de red celular, lo cual funciona muy bien si tienes un plan ilimitado."
  fr: "Vous pouvez également autoriser le fournisseur à utiliser les données du réseau cellulaire, ce qui fonctionne très bien si vous avez un forfait illimité."
  he: "אתה יכול גם לאפשר לספק להשתמש בנתוני רשת סלולרית, וזה עובד מצוין אם יש לך תוכנית ללא הגבלה."
  hi: "आप प्रदाता को सेल नेटवर्क डेटा का उपयोग करने की अनुमति भी दे सकते हैं, जो अनलिमिटेड प्लान होने पर बहुत अच्छा काम करता है।"
  id: "Anda juga dapat mengizinkan penyedia menggunakan data jaringan seluler, yang sangat cocok jika Anda memiliki paket tanpa batas."
  it: "Puoi anche consentire al provider di usare i dati della rete cellulare, il che funziona benissimo se hai un piano illimitato."
  ja: "プロバイダーに携帯ネットワークデータの使用を許可することもできます。無制限プランならとても便利です。"
  ko: "제공자가 셀 네트워크 데이터를 사용하도록 허용할 수도 있습니다. 무제한 요금제를 사용한다면 아주 좋습니다."
  nl: "Je kunt de provider ook toestaan om mobiele data te gebruiken, wat ideaal is als je een onbeperkt abonnement hebt."
  pl: "Możesz także pozwolić dostawcy na korzystanie z danych sieci komórkowej, co świetnie działa, jeśli masz nielimitowany plan."
  pt: "Também pode permitir que o fornecedor utilize dados da rede móvel, o que funciona muito bem se tiver um plano ilimitado."
  pt-BR: "Você também pode permitir que o provedor use dados da rede celular, o que funciona muito bem se você tiver um plano ilimitado."
  pt-PT: "Também pode permitir que o fornecedor utilize dados da rede móvel, o que funciona muito bem se tiver um plano ilimitado."
  ru: "Вы также можете разрешить провайдеру использовать данные сотовой сети, что отлично работает, если у вас безлимитный тариф."
  sv: "Du kan också tillåta leverantören att använda mobildata, vilket fungerar utmärkt om du har ett obegränsat abonnemang."
  sw: "Unaweza pia kuruhusu mtoa huduma kutumia data ya mtandao wa simu, ambayo inafanya kazi vizuri ikiwa una mpango usio na kikomo."
  th: "คุณยังสามารถอนุญาตให้ผู้ให้บริการใช้ข้อมูลเครือข่ายมือถือ ซึ่งเหมาะมากหากคุณมีแพ็กเกจแบบไม่จำกัด"
  uk: "Ви також можете дозволити провайдеру використовувати дані мобільної мережі, що чудово працює, якщо у вас безлімітний тариф."
  vi: "Bạn cũng có thể cho phép nhà cung cấp sử dụng dữ liệu mạng di động, rất phù hợp nếu bạn có gói không giới hạn."
  zh: "您还可以允许提供者使用蜂窝网络数据，如果您有无限流量套餐，这非常适用。"
  zh-HK: "你亦可允許供應商使用流動網絡數據，如你有無限數據計劃則非常適合。"
