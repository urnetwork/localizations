description: "Explanation at the top of the Excluded exit locations screen: best available, collections and larger places skip exits in these places; picking one of the places itself still connects there."
source: "Connections won't use exits in these places, unless you pick one of them directly."
platforms:
  - android
  - apple
  - windows
localizations:
  ar: "لن تستخدم الاتصالات مخارج في هذه الأماكن، إلا إذا اخترت أحدها مباشرة."
  cs: "Připojení nebudou používat výstupy v těchto místech, pokud některé z nich nevyberete přímo."
  de: "Verbindungen nutzen keine Exits an diesen Orten, außer du wählst einen davon direkt."
  el: "Οι συνδέσεις δεν θα χρησιμοποιούν εξόδους σε αυτά τα μέρη, εκτός αν επιλέξετε κάποιο από αυτά απευθείας."
  en: "Connections won't use exits in these places, unless you pick one of them directly."
  es: "Las conexiones no usarán salidas en estos lugares, salvo que elijas uno de ellos directamente."
  es-419: "Las conexiones no usarán salidas en estos lugares, a menos que elijas uno de ellos directamente."
  es-MX: "Las conexiones no usarán salidas en estos lugares, a menos que elijas uno de ellos directamente."
  fa: "اتصال‌ها از خروجی‌های این مکان‌ها استفاده نمی‌کنند، مگر اینکه یکی از آن‌ها را مستقیماً انتخاب کنید."
  fr: "Les connexions n’utiliseront pas de sorties dans ces lieux, sauf si vous choisissez directement l’un d’eux."
  he: "החיבורים לא ישתמשו ביציאות במקומות האלה, אלא אם תבחר באחד מהם ישירות."
  hi: "कनेक्शन इन जगहों के एग्ज़िट का उपयोग नहीं करेंगे, जब तक आप इनमें से किसी को सीधे न चुनें।"
  id: "Koneksi tidak akan menggunakan titik keluar di tempat-tempat ini, kecuali Anda memilih salah satunya secara langsung."
  it: "Le connessioni non useranno uscite in questi luoghi, a meno che tu non ne scelga uno direttamente."
  ja: "これらの場所にある出口は、直接選んだ場合を除き、接続に使われません。"
  ko: "직접 선택하지 않는 한 이 위치의 출구는 연결에 사용되지 않습니다."
  nl: "Verbindingen gebruiken geen exits op deze plaatsen, tenzij je er een rechtstreeks kiest."
  pl: "Połączenia nie będą korzystać z wyjść w tych miejscach, chyba że wybierzesz jedno z nich bezpośrednio."
  pt: "As conexões não usarão saídas nesses lugares, a menos que você escolha um deles diretamente."
  pt-BR: "As conexões não usarão saídas nesses lugares, a menos que você escolha um deles diretamente."
  pt-PT: "As ligações não usarão saídas nestes locais, a menos que escolha um deles diretamente."
  ru: "Подключения не будут использовать выходы в этих местах, если вы не выберете одно из них напрямую."
  sv: "Anslutningar använder inte utgångar på de här platserna, om du inte väljer en av dem direkt."
  sw: "Miunganisho haitatumia njia za kutoka katika maeneo haya, isipokuwa uchague mojawapo moja kwa moja."
  th: "การเชื่อมต่อจะไม่ใช้ทางออกในสถานที่เหล่านี้ เว้นแต่คุณเลือกที่ใดที่หนึ่งโดยตรง"
  tr: "Bağlantılar, birini doğrudan seçmediğiniz sürece bu yerlerdeki çıkışları kullanmaz."
  uk: "Підключення не використовуватимуть виходи в цих місцях, якщо ви не виберете одне з них напряму."
  vi: "Các kết nối sẽ không dùng điểm thoát ở những nơi này, trừ khi bạn chọn trực tiếp một trong số đó."
  zh: "连接不会使用这些地方的出口，除非你直接选择其中之一。"
  zh-HK: "連線不會使用這些地方的出口，除非你直接選擇其中之一。"
