description: "The extender panel count: extenders carrying a live connection now, of every usable extender the app knows."
source: "%lld of %lld"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: active
    type: int
  - name: reserve
    type: int
localizations:
  ar: "{active} من {reserve}"
  de: "{active} von {reserve}"
  en: "{active} of {reserve}"
  es: "{active} de {reserve}"
  ru: "{active} из {reserve}"
  zh: "{active} / {reserve}"
