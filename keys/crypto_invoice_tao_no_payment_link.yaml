  pt-BR: "TAO não tem link de pagamento, então este código QR contém só o endereço. Digite o valor exato na sua carteira."
  pt-PT: "TAO não tem ligação de pagamento, por isso este código QR contém apenas o endereço. Introduza o montante exato na sua carteira."
  ru: "Для TAO нет платёжной ссылки, поэтому этот QR-код содержит только адрес. Введите точную сумму в кошельке."
