description: "Crypto invoice, TAO only: why it has no Open in wallet button, and what its QR code holds. TAO has no payment link (a link or QR code that fills in both the address and the amount, as other coins have), so the QR code carries the address alone and the payer enters the exact amount by hand. TAO is a product name."
source: "TAO has no payment link, so this QR code holds only the address. Enter the exact amount in your wallet."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "لا يوجد رابط دفع لعملة TAO، لذا يحتوي رمز QR هذا على العنوان فقط. أدخل المبلغ بالضبط في محفظتك."
  cs: "Pro TAO neexistuje platební odkaz, takže tento QR kód obsahuje jen adresu. Přesnou částku zadejte v peněžence."
  de: "Für TAO gibt es keinen Zahlungslink, daher enthält dieser QR-Code nur die Adresse. Gib den genauen Betrag in deiner Wallet ein."
  el: "Για το TAO δεν υπάρχει σύνδεσμος πληρωμής, οπότε αυτός ο κωδικός QR περιέχει μόνο τη διεύθυνση. Εισαγάγετε το ακριβές ποσό στο πορτοφόλι σας."
  en: "TAO has no payment link, so this QR code holds only the address. Enter the exact amount in your wallet."
  es: "TAO no tiene enlace de pago, así que este código QR solo contiene la dirección. Introduce el importe exacto en tu billetera."
  es-419: "TAO no tiene enlace de pago, así que este código QR solo contiene la dirección. Ingresa el monto exacto en tu billetera."
  es-MX: "TAO no tiene enlace de pago, así que este código QR solo contiene la dirección. Ingresa el monto exacto en tu billetera."
  fr: "Le TAO n’a pas de lien de paiement : ce code QR ne contient donc que l’adresse. Saisissez le montant exact dans votre portefeuille."
  he: "ל-TAO אין קישור תשלום, ולכן קוד ה-QR הזה מכיל רק את הכתובת. הזינו בארנק את הסכום המדויק."
  hi: "TAO के लिए कोई पेमेंट लिंक नहीं है, इसलिए इस QR कोड में सिर्फ़ पता है। अपने वॉलेट में ठीक-ठीक राशि डालें।"
  id: "TAO tidak punya tautan pembayaran, jadi kode QR ini hanya berisi alamat. Masukkan jumlah yang tepat di dompet Anda."
  it: "Per TAO non esiste un link di pagamento, quindi questo codice QR contiene solo l'indirizzo. Inserisci l'importo esatto nel tuo portafoglio."
