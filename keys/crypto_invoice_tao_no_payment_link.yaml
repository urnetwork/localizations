  nl: "Voor TAO bestaat geen betaallink, dus deze QR-code bevat alleen het adres. Voer het exacte bedrag in je wallet in."
  pl: "Dla TAO nie ma linku do płatności, więc ten kod QR zawiera tylko adres. Wpisz dokładną kwotę w portfelu."
