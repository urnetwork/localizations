description: "Subscription: billing explanation, Google. Full sentence so each language can inflect around the store name naturally."
source: "Your Pro subscription is billed through Google Play. To change or cancel it, manage your subscriptions in Google Play."
platforms:
  - site
localizations:
  ar: "يتم تحصيل اشتراك Pro الخاص بك عبر Google Play. لتغييره أو إلغائه، أدر اشتراكاتك في Google Play."
  cs: "Vaše předplatné Pro je účtováno přes Google Play. Chcete-li ho změnit nebo zrušit, spravujte svá předplatná v Google Play."
  de: "Dein Pro-Abo wird über Google Play abgerechnet. Zum Ändern oder Kündigen verwalte deine Abos in Google Play."
  el: "Η συνδρομή σας Pro χρεώνεται μέσω του Google Play. Για να την αλλάξετε ή να την ακυρώσετε, διαχειριστείτε τις συνδρομές σας στο Google Play."
  en: "Your Pro subscription is billed through Google Play. To change or cancel it, manage your subscriptions in Google Play."
  es: "Tu suscripción Pro se factura a través de Google Play. Para cambiarla o cancelarla, gestiona tus suscripciones en Google Play."
  es-419: "Tu suscripción Pro se factura a través de Google Play. Para cambiarla o cancelarla, administra tus suscripciones en Google Play."
  es-MX: "Tu suscripción Pro se factura a través de Google Play. Para cambiarla o cancelarla, administra tus suscripciones en Google Play."
  fr: "Votre abonnement Pro est facturé via Google Play. Pour le modifier ou l'annuler, gérez vos abonnements dans Google Play."
  he: "המנוי Pro שלך מחויב דרך Google Play. כדי לשנות או לבטל אותו, נהל את המנויים שלך ב-Google Play."
  hi: "आपकी Pro सदस्यता Google Play के माध्यम से बिल की जाती है। इसे बदलने या रद्द करने के लिए, अपनी सदस्यताएँ Google Play में प्रबंधित करें।"
  id: "Langganan Pro Anda ditagih melalui Google Play. Untuk mengubah atau membatalkannya, kelola langganan Anda di Google Play."
  it: "Il tuo abbonamento Pro viene fatturato tramite Google Play. Per modificarlo o annullarlo, gestisci i tuoi abbonamenti su Google Play."
  ja: "Pro サブスクリプションは Google Play 経由で請求されています。変更または解約するには、Google Play でサブスクリプションを管理してください。"
  ko: "Pro 구독은 Google Play에서 청구됩니다. 변경하거나 취소하려면 Google Play에서 구독을 관리하세요."
  nl: "Je Pro-abonnement wordt gefactureerd via Google Play. Om het te wijzigen of op te zeggen, beheer je je abonnementen in Google Play."
  pl: "Twoja subskrypcja Pro jest rozliczana przez Google Play. Aby ją zmienić lub anulować, zarządzaj subskrypcjami w Google Play."
  pt: "A sua assinatura Pro é faturada através do Google Play. Para a alterar ou cancelar, faça a gestão das suas assinaturas no Google Play."
  pt-BR: "Sua assinatura Pro é cobrada através do Google Play. Para alterá-la ou cancelá-la, gerencie suas assinaturas no Google Play."
  pt-PT: "A sua assinatura Pro é faturada através do Google Play. Para a alterar ou cancelar, faça a gestão das suas assinaturas no Google Play."
  ru: "Ваша подписка Pro оплачивается через Google Play. Чтобы изменить или отменить её, управляйте подписками в Google Play."
  sv: "Din Pro-prenumeration faktureras via Google Play. Ändra eller avsluta den genom att hantera dina prenumerationer i Google Play."
  sw: "Usajili wako wa Pro unatozwa kupitia Google Play. Ili kuubadilisha au kuughairi, dhibiti usajili wako katika Google Play."
  th: "ระบบเรียกเก็บเงินการสมัคร Pro ของคุณผ่าน Google Play หากต้องการเปลี่ยนหรือยกเลิก ให้จัดการการสมัครของคุณใน Google Play"
  uk: "Ваша підписка Pro оплачується через Google Play. Щоб змінити або скасувати її, керуйте підписками в Google Play."
  vi: "Gói đăng ký Pro của bạn được thanh toán qua Google Play. Để thay đổi hoặc hủy, hãy quản lý các gói đăng ký của bạn trong Google Play."
  zh: "您的 Pro 订阅通过 Google Play 计费。如需更改或取消，请在 Google Play 中管理您的订阅。"
  zh-HK: "您的 Pro 訂閱透過 Google Play 計費。如需更改或取消，請在 Google Play 中管理您的訂閱。"
