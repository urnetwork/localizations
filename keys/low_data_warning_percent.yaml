description: "Body of the low-data warning (title: \"Running low on data\") when the available data falls to a part of the period's data. {percent} is a whole number from 1 to 100 (the % sign follows it in the text); {amount} is the available data as a size, e.g. 2.9 GB. Shown once per balance period in an in-app alert and a local notification."
source: "Only %lld%% of your data is left (%@)."
platforms:
  - android
  - apple
  - windows
  - linux
placeholders:
  - name: percent
    type: int
  - name: amount
    type: string
