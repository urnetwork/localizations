description: "Mock location setup step: turn on the system Location setting so apps receive the simulated location."
source: "Turn on Location in system settings so apps can receive the location."
platforms:
  - android
localizations:
  ar: "فعّل «الموقع الجغرافي» في إعدادات النظام حتى تتمكن التطبيقات من استقبال الموقع."
  cs: "V nastavení systému zapněte funkci „Poloha“, aby aplikace mohly polohu přijímat."
  de: "Aktiviere „Standort“ in den Systemeinstellungen, damit Apps den Standort empfangen können."
  el: "Ενεργοποιήστε την «Τοποθεσία» στις ρυθμίσεις συστήματος, ώστε οι εφαρμογές να λαμβάνουν την τοποθεσία."
  en: "Turn on Location in system settings so apps can receive the location."
  es: "Activa la «Ubicación» en los ajustes del sistema para que las aplicaciones puedan recibir la ubicación."
  es-419: "Activa la “Ubicación” en la configuración del sistema para que las apps puedan recibir la ubicación."
  es-MX: "Activa la “Ubicación” en la configuración del sistema para que las apps puedan recibir la ubicación."
  fr: "Activez la « Localisation » dans les paramètres système pour que les applications puissent recevoir la position."
  he: "הפעל את ״מיקום״ בהגדרות המערכת כדי שאפליקציות יוכלו לקבל את המיקום."
  hi: "सिस्टम सेटिंग में “जगह की जानकारी” चालू करें ताकि ऐप्लिकेशन को स्थान मिल सके।"
  id: "Aktifkan “Lokasi” di setelan sistem agar aplikasi dapat menerima lokasi."
  it: "Attiva la “Geolocalizzazione” nelle impostazioni di sistema in modo che le app possano ricevere la posizione."
  ja: "アプリが位置情報を受け取れるように、システム設定で「位置情報」をオンにします。"
  ko: "앱이 위치를 수신할 수 있도록 시스템 설정에서 '위치'를 켜세요."
  nl: "Zet “Locatie” aan in de systeeminstellingen zodat apps de locatie kunnen ontvangen."
  pl: "Włącz w ustawieniach systemu funkcję „Lokalizacja”, aby aplikacje mogły odbierać lokalizację."
  pt: "Ative a «Localização» nas definições do sistema para que as aplicações possam receber a localização."
  pt-BR: "Ative a “Localização” nas configurações do sistema para que os apps possam receber a localização."
  pt-PT: "Ative a «Localização» nas definições do sistema para que as aplicações possam receber a localização."
  ru: "Включите «Местоположение» в настройках системы, чтобы приложения могли получать местоположение."
  sv: "Aktivera ”Plats” i systeminställningarna så att appar kan ta emot platsen."
  sw: "Washa “Mahali” katika mipangilio ya mfumo ili programu ziweze kupokea mahali."
  th: "เปิด “ตำแหน่ง” ในการตั้งค่าระบบเพื่อให้แอปรับตำแหน่งได้"
  uk: "Увімкніть «Місцезнаходження» в налаштуваннях системи, щоб додатки могли отримувати місцезнаходження."
  vi: "Bật “Vị trí” trong cài đặt hệ thống để các ứng dụng có thể nhận vị trí."
  zh: "在系统设置中开启“位置信息”，以便应用能够接收位置。"
  zh-HK: "在系統設定中開啟「位置」，以便應用程式能夠接收位置。"
