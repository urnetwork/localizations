description: "Compact duration a provider has been connected, as hours and minutes (e.g. 3h 24m). {hours} is the whole hours, {minutes} the remaining minutes."
source: "%1$lldh %2$lldm"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: hours
    type: int
  - name: minutes
    type: int
