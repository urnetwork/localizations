description: "Crypto invoice, SOL only: the coin to send, shown with the address. Only SOL itself counts: tokens sent to the address, USDC among them, are not credited to this payment (USDC is paid on its own tab, USDC on Solana). Solana, SOL and USDC are product names."
source: "Send only SOL on the Solana network to this address. Tokens, including USDC, won't be credited."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
