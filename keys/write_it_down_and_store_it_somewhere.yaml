description: "A warning message that instructs the user to write down their seedphrase and store it in a secure location."
description_auto: true
source: "Write it down and store it somewhere safe. If you lose it, you'll lose access to your account."
platforms:
  - apple
localizations:
  ar: "اكتبها واحفظها في مكان آمن. إذا فقدتها، ستفقد إمكانية الوصول إلى حسابك."
  cs: "Zapište si ji a uložte na bezpečné místo. Pokud ji ztratíte, přijdete o přístup ke svému účtu."
  de: "Schreibe sie auf und bewahre sie an einem sicheren Ort auf. Wenn du sie verlierst, verlierst du den Zugriff auf dein Konto."
  el: "Γράψτε την και φυλάξτε την σε ασφαλές μέρος. Αν τη χάσετε, θα χάσετε την πρόσβαση στον λογαριασμό σας."
  en: "Write it down and store it somewhere safe. If you lose it, you'll lose access to your account."
  es: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  es-419: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  es-MX: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  fr: "Notez-la et conservez-la en lieu sûr. Si vous la perdez, vous perdrez l’accès à votre compte."
  he: "רשום אותו ושמור אותו במקום בטוח. אם תאבד אותו, תאבד את הגישה לחשבון שלך."
  hi: "इसे लिखकर किसी सुरक्षित जगह पर रखें। अगर यह खो गया, तो आप अपने खाते तक पहुंच खो देंगे।"
  id: "Tulis dan simpan di tempat yang aman. Jika hilang, Anda akan kehilangan akses ke akun Anda."
  it: "Annotala e conservala in un luogo sicuro. Se la perdi, perderai l’accesso al tuo account."
  ja: "書き留めて安全な場所に保管してください。紛失すると、アカウントにアクセスできなくなります。"
  ko: "적어서 안전한 곳에 보관하세요. 잃어버리면 계정에 접근할 수 없게 됩니다."
  nl: "Schrijf hem op en bewaar hem op een veilige plek. Als je hem kwijtraakt, verlies je de toegang tot je account."
  pl: "Zapisz ją i przechowuj w bezpiecznym miejscu. Jeśli ją zgubisz, stracisz dostęp do swojego konta."
  pt: "Escreva-a e guarde-a num local seguro. Se a perder, perde o acesso à sua conta."
  pt-BR: "Anote-a e guarde-a em um local seguro. Se você perdê-la, perderá o acesso à sua conta."
  pt-PT: "Escreva-a e guarde-a num local seguro. Se a perder, perde o acesso à sua conta."
  ru: "Запишите её и храните в надёжном месте. Если вы её потеряете, то потеряете доступ к аккаунту."
  sv: "Skriv ner den och förvara den på ett säkert ställe. Om du tappar bort den förlorar du åtkomsten till ditt konto."
  sw: "Kiandike na ukihifadhi mahali salama. Ukikipoteza, utapoteza ufikiaji wa akaunti yako."
  th: "จดไว้และเก็บในที่ปลอดภัย หากทำหาย คุณจะเข้าถึงบัญชีของคุณไม่ได้อีก"
  uk: "Запишіть її та зберігайте в надійному місці. Якщо ви її втратите, то втратите доступ до свого облікового запису."
  vi: "Hãy ghi lại và cất giữ ở nơi an toàn. Nếu làm mất, bạn sẽ mất quyền truy cập vào tài khoản."
  zh: "请抄写下来并存放在安全的地方。一旦丢失，你将无法再访问你的帐户。"
  zh-HK: "請抄寫下來並存放在安全的地方。一旦遺失，你將無法再存取你的帳戶。"
