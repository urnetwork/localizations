description: "DNS settings: the name of an adblock provider's preset in \"Use my account\", which uses the filters the person set up in their own account there. It never includes the account's ID. Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: NextDNS Personal\" and \"NextDNS Personal isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example NextDNS); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ Personal"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: provider
    type: string
