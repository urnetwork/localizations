description: "Used in Shared/Views/ReferralShareLink/ReferralShareLink.swift."
source: "Join me on URnetwork! Get the app and enter my referral code when you sign up."
platforms:
  - apple
localizations:
  ar: "انضم إليّ على URnetwork! حمّل التطبيق وأدخل رمز الإحالة الخاص بي عند التسجيل."
  cs: "Přidejte se ke mně na URnetwork! Stáhněte si aplikaci a při registraci zadejte můj doporučující kód."
  de: "Komm zu mir auf URnetwork! Hol dir die App und gib bei der Anmeldung meinen Empfehlungscode ein."
  el: "Έλα μαζί μου στο URnetwork! Κατέβασε την εφαρμογή και βάλε τον κωδικό παραπομπής μου στην εγγραφή σου."
  en: "Join me on URnetwork! Get the app and enter my referral code when you sign up."
  es: "¡Únete a URnetwork conmigo! Descarga la app e introduce mi código de referencia al registrarte."
  es-419: "¡Únete a URnetwork conmigo! Descarga la app e ingresa mi código de referencia al registrarte."
  es-MX: "¡Únete a URnetwork conmigo! Descarga la app e ingresa mi código de referencia al registrarte."
  fr: "Rejoins-moi sur URnetwork ! Télécharge l'application et entre mon code de parrainage lors de ton inscription."
  he: "הצטרף אליי ב-URnetwork! הורד את האפליקציה והזן את קוד ההפניה שלי בהרשמה."
  hi: "URnetwork पर मेरे साथ जुड़ें! ऐप डाउनलोड करें और साइन अप करते समय मेरा रेफ़रल कोड डालें।"
  id: "Gabung URnetwork bersama saya! Unduh aplikasinya dan masukkan kode referensi saya saat mendaftar."
  it: "Unisciti a me su URnetwork! Scarica l'app e inserisci il mio codice di riferimento quando ti registri."
  ja: "一緒にURnetworkを使いましょう！アプリをインストールして、登録時に私の紹介コードを入力してください。"
  ko: "URnetwork에서 함께해요! 앱을 설치하고 가입할 때 제 추천 코드를 입력하세요."
  nl: "Doe met me mee op URnetwork! Download de app en voer bij het aanmelden mijn referentiecode in."
  pl: "Dołącz do mnie w URnetwork! Pobierz aplikację i wpisz mój kod polecający przy rejestracji."
  pt: "Junte-se a mim na URnetwork! Instale a aplicação e introduza o meu código de referência ao registar-se."
  pt-BR: "Junte-se a mim na URnetwork! Baixe o app e insira meu código de indicação ao se cadastrar."
  pt-PT: "Junte-se a mim na URnetwork! Instale a aplicação e introduza o meu código de referência ao registar-se."
  ru: "Присоединяйтесь ко мне в URnetwork! Установите приложение и введите мой реферальный код при регистрации."
  sv: "Gå med mig på URnetwork! Skaffa appen och ange min referenskod när du registrerar dig."
  sw: "Jiunge nami kwenye URnetwork! Pata programu na uweke msimbo wangu wa rufaa unapojisajili."
  th: "มาร่วม URnetwork กับฉันสิ! ดาวน์โหลดแอปแล้วกรอกรหัสแนะนำของฉันตอนสมัคร"
  uk: "Приєднуйтесь до мене в URnetwork! Встановіть додаток і введіть мій реферальний код під час реєстрації."
  vi: "Tham gia URnetwork cùng mình nhé! Tải ứng dụng và nhập mã giới thiệu của mình khi đăng ký."
  zh: "快来 URnetwork 和我一起！下载应用，注册时输入我的推荐码。"
  zh-HK: "快來 URnetwork 與我一起！下載應用程式，註冊時輸入我的推薦碼。"
