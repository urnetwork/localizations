description: "App top200: intro"
source: "Head miners are the top {cutoff} networks by routable egress IP breadth. A head spot is paid natively by the subnet every tempo, straight to your coldkey."
platforms:
  - site
localizations:
  ar: "كبار المعدِّنين هم أفضل {cutoff} شبكة من حيث تنوّع عناوين IP الخروج القابلة للتوجيه. تدفع الشبكة الفرعية مقابل المقعد الرئيسي بشكل أصلي في كل tempo، مباشرةً إلى coldkey الخاص بك."
  de: "Head-Miner sind die Top-{cutoff}-Netzwerke nach der Vielfalt routbarer Egress-IPs. Ein Head-Platz wird in jedem Tempo nativ vom Subnetz bezahlt, direkt an deinen Coldkey."
