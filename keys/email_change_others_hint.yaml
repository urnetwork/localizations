  nl: "Open ‘Sessies’ om je andere apparaten af te melden."
  pl: "Aby wylogować pozostałe urządzenia, otwórz „Sesje”."
  pt: "Para terminar a sessão nos seus outros dispositivos, abra “Sessões”."
  pt-BR: "Para desconectar seus outros dispositivos, abra “Sessões”."
  pt-PT: "Para terminar a sessão nos seus outros dispositivos, abra “Sessões”."
  ru: "Чтобы выйти на других устройствах, откройте «Сеансы»."
