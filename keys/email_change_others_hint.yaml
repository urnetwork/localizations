  sw: "Ili kutoa vifaa vyako vingine kwenye akaunti, fungua “Vipindi”."
  th: "หากต้องการให้อุปกรณ์อื่นออกจากระบบ ให้เปิด “เซสชัน”"
  uk: "Щоб вийти на інших пристроях, відкрийте «Сеанси»."
  vi: "Để đăng xuất các thiết bị khác, hãy mở “Phiên đăng nhập”."
  zh: "如需让其他设备退出登录，请打开“登录会话”。"
  zh-HK: "如需讓其他裝置登出，請開啟「登入工作階段」。"
