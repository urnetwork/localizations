description: "The email change sheet, once complete, when the server could not sign out the other sessions (the current sign-in has none to keep). Names the Sessions screen (sessions_title) exactly."
source: "To sign out your other devices, open Sessions."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "لتسجيل خروج أجهزتك الأخرى، افتح «الجلسات»."
  cs: "Ostatní zařízení odhlásíte v části Relace."
  de: "Um deine anderen Geräte abzumelden, öffne „Sitzungen“."
  el: "Για να αποσυνδέσετε τις άλλες συσκευές σας, ανοίξτε τις «Συνεδρίες»."
  en: "To sign out your other devices, open Sessions."
  es: "Para cerrar la sesión en tus otros dispositivos, abre «Sesiones»."
  es-419: "Para cerrar la sesión en tus otros dispositivos, abre «Sesiones»."
  es-MX: "Para cerrar la sesión en tus otros dispositivos, abre «Sesiones»."
  fr: "Pour déconnecter vos autres appareils, ouvrez « Sessions »."
  he: "כדי לנתק את המכשירים האחרים שלכם, פתחו את „הפעלות”."
  hi: "अपने दूसरे डिवाइस साइन आउट करने के लिए “सत्र” खोलें।"
