  cs: "Aplikace a systémová služba URnetwork jsou různá sestavení. Aktualizujte obojí na stejnou verzi."
  de: "Die App und der URnetwork-Systemdienst sind unterschiedliche Builds. Aktualisiere beide auf dieselbe Version."
