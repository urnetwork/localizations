description: "Provider status 'Why?' list: a line under the network checks when the checks took IPv6 away (FP2-PROTOCOL.md §5.5, the sdk's ProviderStatusReasonLineIpv4). The argument is how many of the checks failed only over IPv6; the device is still offered to clients, but for IPv4 traffic only."
source: "%lld of these checks failed only over IPv6, so this device is offered for IPv4 traffic only."
platforms:
  - android
  - apple
  - windows
  - linux
placeholders:
  - name: count
    type: int
plurals:
  select: count
