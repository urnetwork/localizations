description: "Setup guide step on linux: the GeoClue version requirement for the device location override."
source: "Install GeoClue 2.7 or newer. It is not on every system, and Ubuntu 22.04 and Debian 12 ship an older version that cannot do this."
platforms:
  - linux
localizations:
  ar: "ثبّت GeoClue 2.7 أو أحدث. فهو غير متوفر على كل الأنظمة، كما أن Ubuntu 22.04 وDebian 12 يأتيان بإصدار أقدم لا يدعم ذلك."
  cs: "Nainstalujte GeoClue 2.7 nebo novější. Není v každém systému a Ubuntu 22.04 a Debian 12 dodávají starší verzi, která to neumí."
  de: "Installiere GeoClue 2.7 oder neuer. Es ist nicht auf jedem System vorhanden, und Ubuntu 22.04 sowie Debian 12 liefern eine ältere Version aus, die das nicht kann."
  el: "Εγκαταστήστε το GeoClue 2.7 ή νεότερο. Δεν υπάρχει σε κάθε σύστημα, ενώ το Ubuntu 22.04 και το Debian 12 περιλαμβάνουν παλαιότερη έκδοση που δεν το υποστηρίζει."
  en: "Install GeoClue 2.7 or newer. It is not on every system, and Ubuntu 22.04 and Debian 12 ship an older version that cannot do this."
  es: "Instala GeoClue 2.7 o una versión posterior. No está en todos los sistemas, y Ubuntu 22.04 y Debian 12 incluyen una versión anterior que no puede hacerlo."
  es-419: "Instala GeoClue 2.7 o una versión posterior. No está en todos los sistemas, y Ubuntu 22.04 y Debian 12 incluyen una versión anterior que no puede hacerlo."
  es-MX: "Instala GeoClue 2.7 o una versión posterior. No está en todos los sistemas, y Ubuntu 22.04 y Debian 12 incluyen una versión anterior que no puede hacerlo."
  fr: "Installez GeoClue 2.7 ou une version plus récente. Il n'est pas présent sur tous les systèmes, et Ubuntu 22.04 et Debian 12 fournissent une version plus ancienne qui n'en est pas capable."
  he: "התקן את GeoClue 2.7 או גרסה חדשה יותר. הוא לא קיים בכל מערכת, ו-Ubuntu 22.04 ו-Debian 12 מגיעים עם גרסה ישנה יותר שאינה תומכת בכך."
  hi: "GeoClue 2.7 या नया वर्शन इंस्टॉल करें। यह हर सिस्टम पर नहीं होता, और Ubuntu 22.04 तथा Debian 12 में जो पुराना वर्शन आता है वह यह नहीं कर सकता।"
  id: "Pasang GeoClue 2.7 atau yang lebih baru. Ini tidak ada di setiap sistem, dan Ubuntu 22.04 serta Debian 12 menyertakan versi lama yang tidak dapat melakukannya."
  it: "Installa GeoClue 2.7 o versioni successive. Non è presente su tutti i sistemi e Ubuntu 22.04 e Debian 12 includono una versione precedente che non è in grado di farlo."
  ja: "GeoClue 2.7 以降をインストールしてください。すべてのシステムに入っているわけではなく、Ubuntu 22.04 と Debian 12 に付属するのはこれに対応していない古いバージョンです。"
  ko: "GeoClue 2.7 이상을 설치하세요. 모든 시스템에 있는 것은 아니며, Ubuntu 22.04와 Debian 12에는 이 기능을 지원하지 않는 이전 버전이 포함되어 있습니다."
  nl: "Installeer GeoClue 2.7 of nieuwer. Het staat niet op elk systeem, en Ubuntu 22.04 en Debian 12 leveren een oudere versie die dit niet kan."
  pl: "Zainstaluj GeoClue 2.7 lub nowszy. Nie ma go w każdym systemie, a Ubuntu 22.04 i Debian 12 dostarczają starszą wersję, która tego nie potrafi."
  pt: "Instale o GeoClue 2.7 ou mais recente. Não existe em todos os sistemas e o Ubuntu 22.04 e o Debian 12 incluem uma versão mais antiga que não consegue fazer isto."
  pt-BR: "Instale o GeoClue 2.7 ou mais recente. Ele não existe em todos os sistemas, e o Ubuntu 22.04 e o Debian 12 trazem uma versão mais antiga que não consegue fazer isso."
  pt-PT: "Instale o GeoClue 2.7 ou mais recente. Não existe em todos os sistemas e o Ubuntu 22.04 e o Debian 12 incluem uma versão mais antiga que não consegue fazer isto."
  ru: "Установите GeoClue 2.7 или новее. Он есть не в каждой системе, а в Ubuntu 22.04 и Debian 12 поставляется более старая версия, которая этого не умеет."
  sv: "Installera GeoClue 2.7 eller senare. Det finns inte på alla system, och Ubuntu 22.04 och Debian 12 levererar en äldre version som inte klarar detta."
  sw: "Sakinisha GeoClue 2.7 au toleo jipya zaidi. Haipatikani kwenye kila mfumo, na Ubuntu 22.04 na Debian 12 huja na toleo la zamani lisiloweza kufanya hivi."
  th: "ติดตั้ง GeoClue 2.7 หรือใหม่กว่า ไม่ใช่ทุกระบบจะมี และ Ubuntu 22.04 กับ Debian 12 มาพร้อมเวอร์ชันเก่าที่ทำสิ่งนี้ไม่ได้"
  uk: "Установіть GeoClue 2.7 або новішої версії. Він є не в кожній системі, а Ubuntu 22.04 і Debian 12 постачаються зі старішою версією, яка цього не вміє."
  vi: "Cài đặt GeoClue 2.7 trở lên. Không phải hệ thống nào cũng có, và Ubuntu 22.04 cùng Debian 12 đi kèm phiên bản cũ hơn không làm được việc này."
  zh: "安装 GeoClue 2.7 或更高版本。并非所有系统都自带它，而且 Ubuntu 22.04 和 Debian 12 附带的是无法实现此功能的旧版本。"
  zh-HK: "安裝 GeoClue 2.7 或更新版本。並非所有系統都內建它，而且 Ubuntu 22.04 和 Debian 12 隨附的是無法實現此功能的舊版本。"
