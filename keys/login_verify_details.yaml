description: "Login verify"
source: "Tell us who you really are. Enter the code we\nsent you to verify your identity."
platforms:
  - android
localizations:
  ar: "أخبرنا من أنت حقًا. أدخل الرمز الذي أرسلناه إليك للتحقق من هويتك."
  cs: "Řekněte nám, kdo doopravdy jste.\n Zadejte kód, který jsme vám zaslali, abyste ověřili svou totožnost."
  de: "Sag uns, wer du wirklich bist. Gib den Code ein, den wir dir\ngesendet haben, um deine Identität zu überprüfen."
  el: "Πες μας ποιος είσαι πραγματικά. Εισαγάγετε τον κωδικό που σας\nστείλαμε για να επαληθεύσετε την ταυτότητά σας."
  en: "Tell us who you really are. Enter the code we\nsent you to verify your identity."
  es: "Dinos quién eres realmente. Introduce el código que te\nenviamos para verificar tu identidad."
  es-419: "Dinos quién eres en realidad. Introduce el código que te\nenviamos para verificar tu identidad."
  es-MX: "Dinos quién eres en realidad. Introduce el código que te\nenviamos para verificar tu identidad."
  fr: "Dites-nous qui vous êtes vraiment. Entrez le code que nous\nvous avons envoyé pour vérifier votre identité."
  he: "ספר לנו מי אתה באמת. הזן את הקוד\nששלחנו לך כדי לאמת את זהותך."
  hi: "हमें बताएं कि आप वास्तव में कौन हैं। अपनी पहचान सत्यापित करने के लिए हमने आपको जो कोड भेजा है उसे दर्ज करें।"
  id: "Beri tahu kami siapa Anda sebenarnya. Masukkan kode yang\nkami kirimkan untuk memverifikasi identitas Anda."
  it: "Dicci chi sei veramente. Inserisci il codice che\nti abbiamo inviato per verificare la tua identità."
  ja: "本人確認のために、送信したコードを入力してください。"
  ko: "본인 확인을 위해 보내드린 코드를\n입력해주세요."
  nl: "Vertel ons wie je echt bent. Voer de code in die we\nnaar je hebben gestuurd om je identiteit te verifiëren."
  pl: "Powiedz nam, kim naprawdę jesteś. Wprowadź kod,\nktóry wysłaliśmy, aby zweryfikować twoją tożsamość."
  pt: "Diga-nos quem você realmente é. Digite o código que\nenviamos para você verificar sua identidade."
  pt-BR: "Diga-nos quem você realmente é. Digite o código que\nenviamos para você verificar sua identidade."
  pt-PT: "Diga-nos quem realmente é. Introduza o código que\nlhe enviámos para verificar a sua identidade."
  ru: "Подтвердите, что это вы. Введите код,\nкоторый мы отправили, для проверки вашей личности."
  sv: "Berätta vem du verkligen är. Ange koden vi\nskickade till dig för att verifiera din identitet."
  sw: "Tuambie wewe ni nani hasa. Weka msimbo ambao tume\nkutumia ili kuthibitisha utambulisho wako."
  th: "บอกเราหน่อยสิว่านี้คือคุณจริงๆ กรอกโค้ดทางเรา\nส่งให้เพื่อยืนยันตัวตน"
  uk: "Розкажіть, хто ви насправді. Введіть код, який ми\nнадіслали вам для підтвердження особи."
  vi: "Hãy cho chúng tôi biết bạn thực sự là ai. Nhập mã chúng tôi\nđã gửi để xác minh danh tính của bạn."
  zh: "告诉我们您是谁。输入我们\n发送给您的代码以验证您的身份。"
  zh-HK: "告訴我們您的真實身份。輸入我們\n發送給您的代碼以驗證您的身份。"
