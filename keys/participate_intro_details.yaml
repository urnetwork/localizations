description: "Call to action"
source: "URnetwork is powered by the world's largest, safest,\nand most decentralized ingress and egress protocol."
platforms:
  - android
  - apple
localizations:
  ar: "تعمل URnetwork ببروتوكول الدخول والخروج الأكبر\nوالأكثر أمانًا ولامركزية في العالم."
  cs: "URnetwork stojí na největším, nejbezpečnějším a nejvíce\ndecentralizovaném protokolu na světě pro příchozí a odchozí provoz."
  de: "URnetwork basiert auf dem weltweit größten, sichersten\nund am stärksten dezentralisierten Ingress- und Egress-Protokoll."
  el: "Το URnetwork τροφοδοτείται από το μεγαλύτερο, ασφαλέστερο\nκαι πιο αποκεντρωμένο πρωτόκολλο εισόδου και εξόδου στον κόσμο."
  en: "URnetwork is powered by the world's largest, safest,\nand most decentralized ingress and egress protocol."
  es: "URnetwork funciona con el protocolo de entrada y salida\nmás grande, seguro y descentralizado del mundo."
  es-419: "URnetwork funciona con el protocolo de entrada y salida\nmás grande, seguro y descentralizado del mundo."
  es-MX: "URnetwork funciona con el protocolo de entrada y salida\nmás grande, seguro y descentralizado del mundo."
  fr: "URnetwork repose sur le protocole d'entrée et de sortie\nle plus vaste, le plus sûr et le plus décentralisé au monde."
  he: "URnetwork מבוססת על פרוטוקול הכניסה והיציאה\nהגדול, הבטוח והמבוזר ביותר בעולם."
  hi: "URnetwork दुनिया के सबसे बड़े, सबसे सुरक्षित\nऔर सबसे विकेंद्रीकृत प्रवेश-निकास प्रोटोकॉल पर चलता है।"
  id: "URnetwork didukung oleh protokol ingress dan egress\nterbesar, teraman, dan paling terdesentralisasi di dunia."
  it: "URnetwork si basa sul protocollo di ingresso e uscita\npiù grande, sicuro e decentralizzato al mondo."
  ja: "URnetworkは、世界最大で最も安全、最も分散化された\nイングレス・エグレスプロトコルを基盤としています。"
  ko: "URnetwork는 세계에서 가장 크고 안전하며 가장 분산화된\n인그레스·이그레스 프로토콜로 구동됩니다."
  nl: "URnetwork draait op het grootste, veiligste en meest\ngedecentraliseerde ingress- en egress-protocol ter wereld."
  pl: "URnetwork opiera się na największym, najbezpieczniejszym i najbardziej\nzdecentralizowanym na świecie protokole wejścia i wyjścia."
  pt: "A URnetwork é alimentada pelo maior, mais seguro\ne mais descentralizado protocolo de entrada e saída do mundo."
  pt-BR: "A URnetwork é alimentada pelo maior, mais seguro\ne mais descentralizado protocolo de entrada e saída do mundo."
  pt-PT: "A URnetwork é alimentada pelo maior, mais seguro\ne mais descentralizado protocolo de entrada e saída do mundo."
  ru: "В основе URnetwork — самый крупный, безопасный\nи децентрализованный в мире протокол входа и выхода трафика."
  sv: "URnetwork drivs av världens största, säkraste\noch mest decentraliserade in- och utgångsprotokoll."
  sw: "URnetwork inaendeshwa na itifaki ya kuingia na kutoka\niliyo kubwa, salama na iliyogatuliwa zaidi duniani."
  th: "URnetwork ขับเคลื่อนด้วยโปรโตคอลทางเข้าออกที่ใหญ่ที่สุด\nปลอดภัยที่สุด และกระจายศูนย์มากที่สุดในโลก"
  uk: "В основі URnetwork — найбільший, найбезпечніший\nі найдецентралізованіший у світі протокол входу й виходу трафіку."
  vi: "URnetwork được vận hành bởi giao thức ra vào lớn nhất,\nan toàn nhất và phi tập trung nhất thế giới."
  zh: "URnetwork 由全球最大、最安全、\n最去中心化的出入口协议驱动。"
  zh-HK: "URnetwork 由全球最大、最安全、\n最去中心化的出入口協議驅動。"
