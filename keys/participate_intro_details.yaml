description: "Call to action"
source: "URnetwork is powered by a decentralized ingress and egress protocol,\nrun on community devices in a large selection of countries."
deprecated:
  - android
platforms:
  - apple
localizations:
  ar: "تعمل URnetwork ببروتوكول دخول وخروج لامركزي\nيعمل على أجهزة المجتمع في مجموعة كبيرة من البلدان."
  cs: "URnetwork stojí na decentralizovaném protokolu pro příchozí a odchozí provoz,\nkterý běží na zařízeních komunity ve velkém výběru zemí."
  de: "URnetwork basiert auf einem dezentralen Ingress- und Egress-Protokoll,\ndas auf Community-Geräten in einer großen Auswahl an Ländern läuft."
  el: "Το URnetwork τροφοδοτείται από ένα αποκεντρωμένο πρωτόκολλο εισόδου και εξόδου\nπου τρέχει σε συσκευές της κοινότητας σε μεγάλη επιλογή χωρών."
  en: "URnetwork is powered by a decentralized ingress and egress protocol,\nrun on community devices in a large selection of countries."
  es: "URnetwork funciona con un protocolo descentralizado de entrada y salida,\nque se ejecuta en dispositivos de la comunidad en una amplia selección de países."
  es-419: "URnetwork funciona con el protocolo de entrada y salida\nmás grande, seguro y descentralizado del mundo."
  es-MX: "URnetwork funciona con un protocolo descentralizado de entrada y salida,\nque se ejecuta en dispositivos de la comunidad en una amplia selección de países."
  fr: "URnetwork repose sur un protocole d'entrée et de sortie décentralisé,\nexécuté sur les appareils de la communauté dans un large choix de pays."
  he: "URnetwork מבוססת על פרוטוקול כניסה ויציאה מבוזר\nשפועל על מכשירי הקהילה במבחר גדול של מדינות."
  hi: "URnetwork एक विकेंद्रीकृत प्रवेश-निकास प्रोटोकॉल पर चलता है,\nजो कई देशों में समुदाय के उपकरणों पर चलता है।"
  id: "URnetwork didukung oleh protokol ingress dan egress terdesentralisasi\nyang berjalan di perangkat komunitas di banyak pilihan negara."
  it: "URnetwork si basa su un protocollo di ingresso e uscita decentralizzato,\neseguito sui dispositivi della community in un'ampia scelta di paesi."
  ja: "URnetworkは、分散型のイングレス・エグレスプロトコルを基盤とし、\n多くの国のコミュニティのデバイス上で動作しています。"
  ko: "URnetwork는 분산형 인그레스·이그레스 프로토콜로 구동되며,\n다양한 국가의 커뮤니티 기기에서 실행됩니다."
  nl: "URnetwork draait op een gedecentraliseerd ingress- en egress-protocol\ndat op apparaten van de community in een grote selectie landen draait."
  pl: "URnetwork opiera się na zdecentralizowanym protokole wejścia i wyjścia,\ndziałającym na urządzeniach społeczności w wielu krajach."
  pt: "A URnetwork é alimentada por um protocolo descentralizado de entrada e saída,\nexecutado em dispositivos da comunidade numa grande seleção de países."
  pt-BR: "A URnetwork é alimentada por um protocolo descentralizado de entrada e saída,\nexecutado em dispositivos da comunidade em uma grande seleção de países."
  pt-PT: "A URnetwork é alimentada por um protocolo descentralizado de entrada e saída,\nexecutado em dispositivos da comunidade numa grande seleção de países."
  ru: "В основе URnetwork — децентрализованный протокол входа и выхода трафика,\nработающий на устройствах сообщества в большом выборе стран."
  sv: "URnetwork drivs av ett decentraliserat in- och utgångsprotokoll\nsom körs på communityns enheter i ett stort urval av länder."
  sw: "URnetwork inaendeshwa na itifaki ya kuingia na kutoka iliyogatuliwa,\ninayoendeshwa kwenye vifaa vya jamii katika nchi nyingi."
  th: "URnetwork ขับเคลื่อนด้วยโปรโตคอลทางเข้าออกแบบกระจายศูนย์\nที่ทำงานบนอุปกรณ์ของชุมชนในหลายประเทศ"
  uk: "В основі URnetwork — децентралізований протокол входу й виходу трафіку,\nщо працює на пристроях спільноти у великому виборі країн."
  vi: "URnetwork được vận hành bởi giao thức ra vào phi tập trung,\nchạy trên thiết bị của cộng đồng tại nhiều quốc gia."
  zh: "URnetwork 由去中心化的出入口协议驱动，\n运行在众多国家的社区设备上。"
  zh-HK: "URnetwork 由去中心化的出入口協議驅動，\n運行在眾多國家的社區設備上。"
