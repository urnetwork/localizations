description: "Shown on the create-network step after a wallet sign-in when the wallet isn't linked to any network yet. The user picks a network name and accepts the terms to create one; the wallet signature carries over."
source: "This wallet isn't linked to a network yet. Pick a network name to create one."
platforms:
  - windows
localizations:
  ar: "هذه المحفظة غير مرتبطة بشبكة بعد. اختر اسمًا للشبكة لإنشاء واحدة."
  cs: "Tato peněženka zatím není propojena s žádnou sítí. Zvolte název sítě a vytvořte ji."
  de: "Dieses Wallet ist noch mit keinem Netzwerk verknüpft. Wähle einen Netzwerknamen, um eines zu erstellen."
  el: "Αυτό το πορτοφόλι δεν είναι ακόμη συνδεδεμένο με κάποιο δίκτυο. Επιλέξτε ένα όνομα δικτύου για να δημιουργήσετε ένα."
  en: "This wallet isn't linked to a network yet. Pick a network name to create one."
  es: "Esta billetera aún no está vinculada a una red. Elige un nombre de red para crear una."
  es-419: "Esta billetera aún no está vinculada a una red. Elige un nombre de red para crear una."
  es-MX: "Esta cartera aún no está vinculada a una red. Elige un nombre de red para crear una."
  fr: "Ce portefeuille n'est pas encore lié à un réseau. Choisissez un nom de réseau pour en créer un."
  he: "הארנק הזה עדיין לא מקושר לרשת. בחרו שם רשת כדי ליצור אחת."
  hi: "यह वॉलेट अभी किसी नेटवर्क से जुड़ा नहीं है। नेटवर्क बनाने के लिए एक नेटवर्क नाम चुनें।"
  id: "Dompet ini belum tertaut ke jaringan mana pun. Pilih nama jaringan untuk membuatnya."
  it: "Questo portafoglio non è ancora collegato a una rete. Scegli un nome di rete per crearne una."
  ja: "このウォレットはまだネットワークにリンクされていません。ネットワーク名を選んで作成してください。"
  ko: "이 지갑은 아직 네트워크에 연결되어 있지 않습니다. 네트워크 이름을 정해 새로 만드세요."
  nl: "Deze wallet is nog niet aan een netwerk gekoppeld. Kies een netwerknaam om er een te maken."
  pl: "Ten portfel nie jest jeszcze powiązany z żadną siecią. Wybierz nazwę sieci, aby ją utworzyć."
  pt: "Esta carteira ainda não está associada a uma rede. Escolha um nome de rede para criar uma."
  pt-BR: "Esta carteira ainda não está vinculada a uma rede. Escolha um nome de rede para criar uma."
  pt-PT: "Esta carteira ainda não está associada a uma rede. Escolha um nome de rede para criar uma."
  ru: "Этот кошелек пока не привязан к сети. Выберите имя сети, чтобы создать ее."
  sv: "Den här plånboken är inte kopplad till något nätverk ännu. Välj ett nätverksnamn för att skapa ett."
  sw: "Pochi hii bado haijaunganishwa na mtandao wowote. Chagua jina la mtandao ili kuunda mmoja."
  th: "กระเป๋าเงินนี้ยังไม่ได้เชื่อมโยงกับเครือข่ายใด เลือกชื่อเครือข่ายเพื่อสร้างใหม่"
  uk: "Цей гаманець ще не пов'язаний із мережею. Виберіть назву мережі, щоб створити її."
  vi: "Ví này chưa được liên kết với mạng nào. Hãy chọn tên mạng để tạo một mạng mới."
  zh: "此钱包尚未关联任何网络。请选择一个网络名称来创建。"
  zh-HK: "此錢包尚未連結任何網絡。請選擇一個網絡名稱來建立。"
