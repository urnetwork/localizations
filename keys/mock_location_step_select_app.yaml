description: "Mock location setup step: choose URnetwork as the mock location app in Android developer options."
source: "In developer options, tap Select mock location app and choose URnetwork."
platforms:
  - android
localizations:
  ar: "في خيارات المطوّرين، انقر على «اختيار تطبيق الموقع الوهمي» ثم اختر URnetwork."
  cs: "V možnostech pro vývojáře klepněte na „Vybrat aplikaci pro simulovanou polohu“ a zvolte URnetwork."
  de: "Tippe in den Entwickleroptionen auf „App für simulierte Standorte auswählen“ und wähle URnetwork."
  el: "Στις επιλογές προγραμματιστή, πατήστε «Επιλογή εφαρμογής εικονικής τοποθεσίας» και επιλέξτε URnetwork."
  en: "In developer options, tap Select mock location app and choose URnetwork."
  es: "En las opciones para desarrolladores, toca «Seleccionar aplicación de ubicación simulada» y elige URnetwork."
  es-419: "En las opciones para desarrolladores, toca “Seleccionar app de ubicación simulada” y elige URnetwork."
  es-MX: "En las opciones para desarrolladores, toca “Seleccionar app de ubicación simulada” y elige URnetwork."
  fr: "Dans les options pour les développeurs, appuyez sur « Sélectionner l'application de position fictive » et choisissez URnetwork."
  he: "באפשרויות המפתחים, הקש על ״בחירת אפליקציה למיקום מדומה״ ובחר URnetwork."
  hi: "डेवलपर विकल्प में, “मॉक लोकेशन ऐप चुनें” पर टैप करें और URnetwork चुनें।"
  id: "Di opsi developer, ketuk “Pilih aplikasi lokasi palsu”, lalu pilih URnetwork."
  it: "Nelle opzioni sviluppatore, tocca “Seleziona app posizione fittizia” e scegli URnetwork."
  ja: "開発者向けオプションで「仮の現在地情報アプリを選択」をタップし、URnetwork を選択します。"
  ko: "개발자 옵션에서 '모의 위치 앱 선택'을 탭한 다음 URnetwork를 선택하세요."
  nl: "Tik in de opties voor ontwikkelaars op “App voor neplocaties selecteren” en kies URnetwork."
  pl: "W opcjach programisty kliknij „Wybierz aplikację do symulowania lokalizacji” i wybierz URnetwork."
  pt: "Nas opções de programador, toque em «Selecionar aplicação de localização fictícia» e escolha URnetwork."
  pt-BR: "Nas opções do desenvolvedor, toque em “Selecionar app de local fictício” e escolha URnetwork."
  pt-PT: "Nas opções de programador, toque em «Selecionar aplicação de localização fictícia» e escolha URnetwork."
  ru: "В параметрах разработчика нажмите «Выбрать приложение для фиктивных местоположений» и выберите URnetwork."
  sv: "I utvecklaralternativen trycker du på ”Välj app för skenplatser” och väljer URnetwork."
  sw: "Katika chaguo za wasanidi programu, gusa “Chagua programu ya kuiga mahali” kisha uchague URnetwork."
  th: "ในตัวเลือกสำหรับนักพัฒนาแอป ให้แตะ “เลือกแอปจำลองตำแหน่ง” แล้วเลือก URnetwork"
  uk: "У параметрах розробника торкніться «Вибрати програму для фіктивних місцезнаходжень» і виберіть URnetwork."
  vi: "Trong tùy chọn cho nhà phát triển, nhấn vào “Chọn ứng dụng vị trí mô phỏng” rồi chọn URnetwork."
  zh: "在开发者选项中，点按“选择模拟位置信息应用”，然后选择 URnetwork。"
  zh-HK: "在開發人員選項中，輕按「選取模擬位置應用程式」，然後選擇 URnetwork。"
