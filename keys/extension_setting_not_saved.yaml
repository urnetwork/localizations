description: "Browser extension popup, under the Kill switch or the location sync toggle when saving a change failed: the toggle went back to its previous state."
source: "The setting couldn't be saved, so it didn't change. Try again."
platforms:
  - web
localizations:
  ar: "تعذّر حفظ الإعداد، لذا لم يتغيّر. حاول مرة أخرى."
  cs: "Nastavení se nepodařilo uložit, a tak se nezměnilo. Zkuste to znovu."
  de: "Die Einstellung konnte nicht gespeichert werden und wurde daher nicht geändert. Versuche es erneut."
  el: "Δεν ήταν δυνατή η αποθήκευση της ρύθμισης, οπότε δεν άλλαξε. Δοκιμάστε ξανά."
  en: "The setting couldn't be saved, so it didn't change. Try again."
  es: "No se ha podido guardar el ajuste, así que no ha cambiado. Inténtalo de nuevo."
  es-419: "No se pudo guardar la configuración, así que no cambió. Inténtalo de nuevo."
  es-MX: "No se pudo guardar la configuración, así que no cambió. Inténtalo de nuevo."
  fr: "Le paramètre n’a pas pu être enregistré, il n’a donc pas été modifié. Réessayez."
  he: "לא ניתן היה לשמור את ההגדרה, ולכן היא לא השתנתה. נסה שוב."
  hi: "सेटिंग सहेजी नहीं जा सकी, इसलिए वह नहीं बदली। दोबारा कोशिश करें।"
  id: "Pengaturan tidak dapat disimpan, jadi tidak berubah. Coba lagi."
  it: "Impossibile salvare l’impostazione, quindi non è stata modificata. Riprova."
  ja: "設定を保存できなかったため、変更されていません。もう一度お試しください。"
  ko: "설정을 저장하지 못해 변경되지 않았습니다. 다시 시도하세요."
  nl: "De instelling kon niet worden opgeslagen en is dus niet gewijzigd. Probeer het opnieuw."
  pl: "Nie udało się zapisać ustawienia, więc nie zostało zmienione. Spróbuj ponownie."
  pt: "Não foi possível salvar a configuração, então ela não foi alterada. Tente novamente."
  pt-BR: "Não foi possível salvar a configuração, então ela não foi alterada. Tente novamente."
  pt-PT: "Não foi possível guardar a definição, por isso não foi alterada. Tente novamente."
  ru: "Не удалось сохранить настройку, поэтому она не изменилась. Повторите попытку."
  sv: "Det gick inte att spara inställningen, så den ändrades inte. Försök igen."
  sw: "Imeshindwa kuhifadhi mpangilio, kwa hivyo haukubadilika. Jaribu tena."
  th: "ไม่สามารถบันทึกการตั้งค่าได้ จึงไม่มีการเปลี่ยนแปลง ลองอีกครั้ง"
  uk: "Не вдалося зберегти налаштування, тож воно не змінилося. Спробуйте ще раз."
  vi: "Không thể lưu cài đặt nên cài đặt không thay đổi. Hãy thử lại."
  zh: "无法保存该设置，因此设置未更改。请重试。"
  zh-HK: "無法儲存該設定，因此設定未有更改。請再試一次。"
