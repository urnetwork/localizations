description: "Error on the Hotspot proxy screen when the proxy could not listen on the hotspot, usually because another app holds its ports."
source: "The proxy could not start on your hotspot. Another app may be using its ports."
platforms:
  - android
localizations:
  ar: "تعذّر تشغيل الوكيل على نقطة الاتصال. ربما يستخدم تطبيق آخر منافذه."
  cs: "Proxy se na vašem hotspotu nepodařilo spustit. Jeho porty možná používá jiná aplikace."
  de: "Der Proxy konnte auf deinem Hotspot nicht starten. Möglicherweise verwendet eine andere App seine Ports."
  el: "Δεν ήταν δυνατή η εκκίνηση του διακομιστή μεσολάβησης στο hotspot σας. Ίσως κάποια άλλη εφαρμογή χρησιμοποιεί τις θύρες του."
  en: "The proxy could not start on your hotspot. Another app may be using its ports."
  es: "No se pudo iniciar el proxy en tu punto de acceso. Es posible que otra aplicación esté usando sus puertos."
  es-419: "No se pudo iniciar el proxy en tu punto de acceso. Es posible que otra app esté usando sus puertos."
  es-MX: "No se pudo iniciar el proxy en tu punto de acceso. Es posible que otra app esté usando sus puertos."
  fr: "Le proxy n'a pas pu démarrer sur votre point d'accès. Une autre application utilise peut-être ses ports."
  he: "לא ניתן היה להפעיל את הפרוקסי בנקודה החמה שלכם. ייתכן שאפליקציה אחרת משתמשת ביציאות שלו."
  hi: "आपके हॉटस्पॉट पर प्रॉक्सी शुरू नहीं हो सका। हो सकता है कोई दूसरा ऐप इसके पोर्ट इस्तेमाल कर रहा हो।"
  id: "Proxy tidak dapat dimulai di hotspot Anda. Mungkin aplikasi lain sedang menggunakan port-nya."
  it: "Impossibile avviare il proxy sul tuo hotspot. Un'altra app potrebbe usare le sue porte."
  ja: "テザリングでプロキシを開始できませんでした。別のアプリがそのポートを使用している可能性があります。"
  ko: "핫스팟에서 프록시를 시작할 수 없습니다. 다른 앱이 해당 포트를 사용 중일 수 있습니다."
  nl: "De proxy kon niet starten op je hotspot. Misschien gebruikt een andere app de poorten."
  pl: "Nie udało się uruchomić serwera proxy w hotspocie. Być może inna aplikacja używa jego portów."
  pt: "Não foi possível iniciar o proxy no seu ponto de acesso. Outra aplicação pode estar a usar as portas dele."
  pt-BR: "Não foi possível iniciar o proxy no seu ponto de acesso. Outro app pode estar usando as portas dele."
  pt-PT: "Não foi possível iniciar o proxy no seu ponto de acesso. Outra aplicação pode estar a usar as portas dele."
  ru: "Не удалось запустить прокси на точке доступа. Возможно, его порты занимает другое приложение."
  sv: "Proxyn kunde inte starta i din surfzon. En annan app kanske använder dess portar."
  sw: "Proksi haikuweza kuanza kwenye hotspot yako. Huenda programu nyingine inatumia milango yake."
  th: "ไม่สามารถเริ่มพร็อกซีบนฮอตสปอตของคุณได้ แอปอื่นอาจกำลังใช้พอร์ตของพร็อกซีอยู่"
  uk: "Не вдалося запустити проксі на вашій точці доступу. Можливо, його порти використовує інша програма."
  vi: "Không thể khởi động proxy trên điểm phát sóng của bạn. Có thể một ứng dụng khác đang dùng các cổng của nó."
  zh: "无法在你的热点上启动代理。可能有其他应用正在使用它的端口。"
  zh-HK: "無法在你的熱點上啟動代理。可能有其他應用程式正在使用它的連接埠。"
