description: "Earnings, the settlement v2 tile and the claim sheet, after the user tapped Claim now: the claim is in line. URnetwork sends tapped claims before its automatic ones, the oldest request first, as far as each day's gas budget reaches, so it can go out today or on a later day. Say nothing that promises a day. Claim now is the button's label; keep it recognizable as that label."
source: "Claim now is queued. It goes out ahead of automatic claims, in the order requests came in, as each day's budget allows."
platforms:
  - linux
  - apple
  - android
  - windows
  - site
localizations:
  ar: "«المطالبة الآن» في قائمة الانتظار. تُرسَل قبل المطالبات التلقائية، حسب ترتيب وصول الطلبات، ضمن ميزانية كل يوم."
  cs: "„Vyzvednout hned“ je ve frontě. Odešle se před automatickým vyzvedáváním, v pořadí, v jakém žádosti přišly, v rámci rozpočtu každého dne."
  de: "„Jetzt einlösen“ ist in der Warteschlange. Es wird vor den automatischen Einlösungen gesendet, in der Reihenfolge der Anfragen, soweit das Budget des jeweiligen Tages reicht."
  el: "Το «Διεκδίκηση τώρα» είναι στην ουρά. Θα σταλεί πριν από τις αυτόματες διεκδικήσεις, με τη σειρά που ήρθαν τα αιτήματα, εντός του προϋπολογισμού κάθε ημέρας."
  en: "Claim now is queued. It goes out ahead of automatic claims, in the order requests came in, as each day's budget allows."
  es: "«Reclamar ahora» está en cola. Se envía antes que las reclamaciones automáticas, en el orden en que llegaron las solicitudes, según lo permita el presupuesto de cada día."
  es-419: "“Reclamar ahora” está en cola. Se envía antes que las reclamaciones automáticas, en el orden en que llegaron las solicitudes, según lo permita el presupuesto de cada día."
  es-MX: "“Reclamar ahora” está en cola. Se envía antes que las reclamaciones automáticas, en el orden en que llegaron las solicitudes, según lo permita el presupuesto de cada día."
  fr: "« Réclamer maintenant » est en file d’attente. La réclamation part avant les réclamations automatiques, dans l’ordre d’arrivée des demandes, dans la limite du budget de chaque jour."
  he: "«מימוש עכשיו» נמצא בתור. הוא יישלח לפני המימושים האוטומטיים, לפי סדר הגעת הבקשות, במסגרת התקציב של כל יום."
  hi: "“अभी दावा करें” कतार में है। इसे स्वचालित दावों से पहले, अनुरोध आने के क्रम में, हर दिन के बजट के भीतर भेजा जाता है।"
  id: "“Klaim sekarang” sudah masuk antrean. Klaim ini dikirim sebelum klaim otomatis, sesuai urutan masuknya permintaan, dalam batas anggaran setiap hari."
  it: "«Riscatta ora» è in coda. Parte prima dei riscatti automatici, nell’ordine in cui sono arrivate le richieste, nei limiti del budget di ogni giorno."
  ja: "「今すぐ受け取る」は順番待ちです。自動受け取りより先に、リクエストを受け付けた順に、各日の予算の範囲内で送信されます。"
  ko: "“지금 받기”가 대기열에 있습니다. 자동 받기보다 먼저, 요청이 들어온 순서대로, 날마다 예산이 허용하는 만큼 보내집니다."
  nl: "‘Nu opeisen’ staat in de wachtrij. Het wordt vóór de automatische claims verstuurd, in de volgorde waarin de verzoeken binnenkwamen, voor zover het budget van elke dag het toelaat."
  pl: "„Odbierz teraz” jest w kolejce. Zostanie wysłane przed automatycznymi odbiorami, w kolejności zgłoszeń, w ramach budżetu każdego dnia."
  pt: "«Reivindicar agora» está na fila. É enviado antes das reivindicações automáticas, pela ordem de chegada dos pedidos, dentro do orçamento de cada dia."
  pt-BR: "“Resgatar agora” está na fila. Ele é enviado antes dos resgates automáticos, na ordem em que os pedidos chegaram, dentro do orçamento de cada dia."
  pt-PT: "«Reivindicar agora» está na fila. É enviado antes das reivindicações automáticas, pela ordem de chegada dos pedidos, dentro do orçamento de cada dia."
  ru: "«Получить сейчас» в очереди. Этот запрос будет отправлен раньше автоматических, в порядке поступления запросов, в пределах бюджета каждого дня."
  sv: "”Hämta ut nu” står i kö. Det skickas före de automatiska uttagen, i den ordning förfrågningarna kom in, så långt varje dags budget räcker."
  sw: "“Dai sasa” liko kwenye foleni. Litatumwa kabla ya madai ya kiotomatiki, kwa mpangilio ambao maombi yalifika, ndani ya bajeti ya kila siku."
  th: "“รับตอนนี้” อยู่ในคิวแล้ว รายการนี้จะถูกส่งก่อนการรับอัตโนมัติ ตามลำดับคำขอที่เข้ามา ภายในงบประมาณของแต่ละวัน"
  uk: "«Отримати зараз» у черзі. Цей запит буде надіслано раніше за автоматичні, у порядку надходження запитів, у межах бюджету кожного дня."
  vi: "“Nhận ngay” đã vào hàng chờ. Yêu cầu này được gửi trước các lần nhận tự động, theo thứ tự yêu cầu đến, trong phạm vi ngân sách của mỗi ngày."
  zh: "“立即领取”已排队。它排在自动领取之前，按请求到达的先后顺序，在每天的预算允许时发送。"
  zh-HK: "「立即領取」已排隊。它排在自動領取之前，按請求到達的先後次序，在每日的預算容許時傳送。"
