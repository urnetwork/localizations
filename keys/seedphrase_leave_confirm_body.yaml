description: "Instant account creation: body of the confirmation shown when the user tries to leave the seedphrase screen without saving."
source: "Are you sure? This is the ONLY time you'll see your seedphrase. Make sure you've saved it before going back."
platforms:
  - android
localizations:
  en: "Are you sure? This is the ONLY time you'll see your seedphrase. Make sure you've saved it before going back."
  ar: "هل أنت متأكد؟ هذه هي المرة الوحيدة التي سترى فيها عبارة الاسترداد. تأكد من حفظها قبل الرجوع."
  cs: "Opravdu? Toto je JEDINÁ chvíle, kdy svou seedphrase uvidíte. Než se vrátíte, ujistěte se, že jste si ji uložili."
  de: "Bist du sicher? Das ist das EINZIGE Mal, dass du deine Seedphrase siehst. Speichere sie, bevor du zurückgehst."
  el: "Είσαι σίγουρος; Αυτή είναι η ΜΟΝΗ φορά που θα δεις το seedphrase σου. Βεβαιώσου ότι το αποθήκευσες πριν επιστρέψεις."
  es: "¿Seguro? Esta es la ÚNICA vez que verás tu frase semilla. Asegúrate de haberla guardado antes de volver."
  es-419: "¿Seguro? Esta es la ÚNICA vez que verás tu frase semilla. Asegúrate de haberla guardado antes de volver."
  es-MX: "¿Seguro? Esta es la ÚNICA vez que verás tu frase semilla. Asegúrate de haberla guardado antes de volver."
  fr: "Vraiment ? C'est la SEULE fois où vous verrez votre phrase de récupération. Enregistrez-la avant de revenir en arrière."
  he: "בטוח? זו הפעם היחידה שבה תראו את ביטוי הסיד. ודאו ששמרתם אותו לפני שחוזרים אחורה."
  hi: "क्या आप निश्चित हैं? यह एकमात्र समय है जब आप अपना सीडफ़्रेज़ देखेंगे। वापस जाने से पहले उसे सहेज लें।"
  id: "Yakin? Ini SATU-SATUNYA kesempatan melihat seedphrase Anda. Pastikan sudah disimpan sebelum kembali."
  it: "Sei sicuro? Questa è l'UNICA volta in cui vedrai la tua seedphrase. Assicurati di averla salvata prima di tornare indietro."
  ja: "本当によろしいですか？シードフレーズを確認できるのはこの一度だけです。戻る前に必ず保存してください。"
  ko: "정말인가요? 시드 문구는 지금 한 번만 볼 수 있습니다. 돌아가기 전에 저장했는지 확인하세요."
  nl: "Weet je het zeker? Dit is de ENIGE keer dat je je seedphrase ziet. Sla hem op voordat je teruggaat."
  pl: "Na pewno? To JEDYNY moment, w którym zobaczysz swoją seedphrase. Zapisz ją, zanim wrócisz."
  pt: "Tem a certeza? Esta é a ÚNICA vez que verá a sua frase-semente. Guarde-a antes de voltar atrás."
  pt-BR: "Tem certeza? Esta é a ÚNICA vez que você verá sua frase-semente. Salve-a antes de voltar."
  pt-PT: "Tem a certeza? Esta é a ÚNICA vez que verá a sua frase-semente. Guarde-a antes de voltar atrás."
  ru: "Вы уверены? Это ЕДИНСТВЕННЫЙ раз, когда вы увидите свою сид-фразу. Сохраните её, прежде чем вернуться."
  sv: "Är du säker? Det här är den ENDA gången du ser din seedfras. Spara den innan du går tillbaka."
  sw: "Una uhakika? Hii ndiyo mara PEKEE utakayoona seedphrase yako. Hakikisha umeihifadhi kabla ya kurudi."
  th: "แน่ใจหรือไม่ นี่เป็นครั้งเดียวที่คุณจะเห็นซีดเฟรส โปรดบันทึกให้เรียบร้อยก่อนย้อนกลับ"
  uk: "Ви впевнені? Це ЄДИНИЙ раз, коли ви побачите свою сід-фразу. Збережіть її, перш ніж повертатися."
  vi: "Bạn chắc chứ? Đây là lần DUY NHẤT bạn thấy seedphrase của mình. Hãy lưu lại trước khi quay lại."
  zh: "确定吗？这是您唯一一次看到助记词的机会。返回前请务必保存。"
  zh-HK: "確定嗎？這是您唯一一次看到助記詞的機會。返回前請務必儲存。"
