description: "Re-engagement email N1 (trust): openness and the audit. Approved wording (support policy, 2026-10-29); must be updated when the audit is published. Cure53 is a company name. 'The apps you install': the native apps and the browser extension are open source, the ur.io web app is not (2026-11-13 review)."
source: "The apps you install and our servers are open source, and an independent security audit by Cure53 is scheduled for November and December. We'll publish the results."
platforms:
  - email
localizations:
  en: "The apps you install and our servers are open source, and an independent security audit by Cure53 is scheduled for November and December. We'll publish the results."
  ar: "التطبيقات التي تثبّتها وخوادمنا مفتوحة المصدر، ومن المقرر إجراء تدقيق أمني مستقل تتولاه Cure53 في نوفمبر وديسمبر. وسننشر النتائج."
  cs: "Aplikace, které si instalujete, i naše servery jsou open source a na listopad a prosinec je naplánovaný nezávislý bezpečnostní audit od Cure53. Výsledky zveřejníme."
  de: "Die Apps, die du installierst, und unsere Server sind Open Source, und ein unabhängiges Sicherheitsaudit durch Cure53 ist für November und Dezember angesetzt. Wir werden die Ergebnisse veröffentlichen."
  el: "Οι εφαρμογές που εγκαθιστάς και οι διακομιστές μας είναι ανοιχτού κώδικα, και ένας ανεξάρτητος έλεγχος ασφαλείας από την Cure53 έχει προγραμματιστεί για τον Νοέμβριο και τον Δεκέμβριο. Θα δημοσιεύσουμε τα αποτελέσματα."
  es: "Las apps que instalas y nuestros servidores son de código abierto, y una auditoría de seguridad independiente a cargo de Cure53 está programada para noviembre y diciembre. Publicaremos los resultados."
  es-419: "Las apps que instalas y nuestros servidores son de código abierto, y una auditoría de seguridad independiente a cargo de Cure53 está programada para noviembre y diciembre. Publicaremos los resultados."
  es-MX: "Las apps que instalas y nuestros servidores son de código abierto, y una auditoría de seguridad independiente a cargo de Cure53 está programada para noviembre y diciembre. Publicaremos los resultados."
  fr: "Les apps que tu installes et nos serveurs sont open source, et un audit de sécurité indépendant mené par Cure53 est prévu pour novembre et décembre. Nous publierons les résultats."
  he: "האפליקציות שאתם מתקינים והשרתים שלנו הם קוד פתוח, וביקורת אבטחה בלתי תלויה של Cure53 מתוכננת לנובמבר ולדצמבר. נפרסם את התוצאות."
  hi: "आप जो ऐप इंस्टॉल करते हैं और हमारे सर्वर ओपन सोर्स हैं, और Cure53 द्वारा एक स्वतंत्र सुरक्षा ऑडिट नवंबर और दिसंबर के लिए तय है। हम इसके नतीजे प्रकाशित करेंगे।"
  id: "Aplikasi yang kamu pasang dan server kami open source, dan audit keamanan independen oleh Cure53 dijadwalkan pada November dan Desember. Kami akan memublikasikan hasilnya."
  it: "Le app che installi e i nostri server sono open source, e un audit di sicurezza indipendente condotto da Cure53 è previsto per novembre e dicembre. Pubblicheremo i risultati."
  ja: "インストールして使うアプリと私たちのサーバーはオープンソースです。また、Cure53 による独立したセキュリティ監査が11月と12月に予定されています。結果は公開します。"
  ko: "설치해서 쓰시는 앱과 저희 서버는 오픈 소스이며, Cure53의 독립적인 보안 감사가 11월과 12월에 예정되어 있습니다. 결과는 공개하겠습니다."
  nl: "De apps die je installeert en onze servers zijn open source, en een onafhankelijke beveiligingsaudit door Cure53 staat gepland voor november en december. We publiceren de resultaten."
  pl: "Aplikacje, które instalujesz, i nasze serwery są open source, a na listopad i grudzień zaplanowano niezależny audyt bezpieczeństwa, który przeprowadzi Cure53. Opublikujemy wyniki."
  pt: "Os apps que você instala e nossos servidores são de código aberto, e uma auditoria de segurança independente feita pela Cure53 está marcada para novembro e dezembro. Vamos publicar os resultados."
  pt-BR: "Os apps que você instala e nossos servidores são de código aberto, e uma auditoria de segurança independente feita pela Cure53 está marcada para novembro e dezembro. Vamos publicar os resultados."
  pt-PT: "As apps que instala e os nossos servidores são de código aberto, e uma auditoria de segurança independente realizada pela Cure53 está agendada para novembro e dezembro. Vamos publicar os resultados."
  ru: "Приложения, которые вы устанавливаете, и наши серверы имеют открытый исходный код, а на ноябрь и декабрь запланирован независимый аудит безопасности, который проведёт Cure53. Мы опубликуем результаты."
  sv: "Apparna du installerar och våra servrar har öppen källkod, och en oberoende säkerhetsgranskning av Cure53 är inplanerad till november och december. Vi kommer att publicera resultaten."
  sw: "Programu unazosakinisha na seva zetu ni za chanzo wazi, na ukaguzi huru wa usalama utakaofanywa na Cure53 umepangwa kufanyika Novemba na Desemba. Tutachapisha matokeo."
  th: "แอปที่คุณติดตั้งและเซิร์ฟเวอร์ของเราเป็นโอเพ่นซอร์ส และมีกำหนดการตรวจสอบความปลอดภัยอย่างอิสระโดย Cure53 ในเดือนพฤศจิกายนและธันวาคม เราจะเผยแพร่ผลการตรวจสอบ"
  uk: "Застосунки, які ви встановлюєте, і наші сервери мають відкритий код, а на листопад і грудень заплановано незалежний аудит безпеки, який проведе Cure53. Ми опублікуємо результати."
  vi: "Các ứng dụng bạn cài đặt và máy chủ của chúng tôi là mã nguồn mở, và một cuộc kiểm toán bảo mật độc lập do Cure53 thực hiện đã được lên lịch vào tháng 11 và tháng 12. Chúng tôi sẽ công bố kết quả."
  zh: "你安装的应用和我们的服务器都是开源的，由 Cure53 进行的独立安全审计已安排在 11 月和 12 月。我们会公布结果。"
  zh-HK: "你安裝的應用程式和我們的伺服器都是開源的，由 Cure53 進行的獨立安全審計已安排在 11 月和 12 月。我們會公佈結果。"
