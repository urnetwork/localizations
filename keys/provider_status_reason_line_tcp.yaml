    few: "فشلت {count} من هذه الفحوصات عبر HTTP/3 (UDP) فقط، لذا يُعرض هذا الجهاز لحركة مرور TCP فقط. بعض إصدارات التطبيق وبعض الشبكات لا توجّه UDP."
