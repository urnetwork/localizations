description: "Onboarding emails E3a, E4b and E5b, for readers the App Store or Google Play bills: the trial, who gets it, where to cancel, what is charged otherwise and that it renews, in relative terms and without a price (the store shows its own). No calendar date (2026-11-13 review)."
source: "Pro starts with a 14-day free trial for new subscribers. Cancel in your App Store or Google Play subscriptions before the trial ends and you pay nothing; otherwise you're charged the price your store shows before you subscribe, and Pro renews every year until you cancel."
platforms:
  - email
localizations:
  en: "Pro starts with a 14-day free trial for new subscribers. Cancel in your App Store or Google Play subscriptions before the trial ends and you pay nothing; otherwise you're charged the price your store shows before you subscribe, and Pro renews every year until you cancel."
  ar: "يبدأ Pro بتجربة مجانية لمدة 14 يوماً للمشتركين الجدد. ألغِ من اشتراكاتك في App Store أو Google Play قبل انتهاء التجربة ولن تدفع شيئاً؛ وإلا فسيُخصم منك السعر الذي يعرضه متجرك قبل أن تشترك، ويتجدد Pro كل عام حتى تلغي."
  cs: "Pro začíná 14denní zkušební verzí zdarma pro nové předplatitele. Zrušte ji v předplatném App Store nebo Google Play před koncem zkušební doby a nic nezaplatíte; jinak vám bude účtována cena, kterou vám obchod ukáže před předplacením, a Pro se každý rok obnovuje, dokud ho nezrušíte."
  de: "Pro beginnt für neue Abonnenten mit einer 14-tägigen kostenlosen Testphase. Kündigst du vor ihrem Ende in deinen App-Store- oder Google-Play-Abos, zahlst du nichts; sonst wird dir der Preis berechnet, den dein Store dir vor dem Abschluss zeigt, und Pro verlängert sich jedes Jahr, bis du kündigst."
  el: "Το Pro ξεκινά με δωρεάν δοκιμή 14 ημερών για νέους συνδρομητές. Ακύρωσε από τις συνδρομές σου στο App Store ή στο Google Play πριν τελειώσει η δοκιμή και δεν πληρώνεις τίποτα· αλλιώς χρεώνεσαι την τιμή που σου δείχνει το κατάστημά σου πριν εγγραφείς, και το Pro ανανεώνεται κάθε χρόνο μέχρι να ακυρώσεις."
  es: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela en tus suscripciones de App Store o Google Play antes de que termine la prueba y no pagas nada; si no, se te cobra el precio que tu tienda te muestra antes de suscribirte, y Pro se renueva cada año hasta que canceles."
  es-419: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela en tus suscripciones de App Store o Google Play antes de que termine la prueba y no pagas nada; si no, se te cobra el precio que tu tienda te muestra antes de suscribirte, y Pro se renueva cada año hasta que canceles."
  es-MX: "Pro empieza con una prueba gratis de 14 días para nuevos suscriptores. Cancela en tus suscripciones de App Store o Google Play antes de que termine la prueba y no pagas nada; si no, se te cobra el precio que tu tienda te muestra antes de suscribirte, y Pro se renueva cada año hasta que canceles."
  fr: "Pro commence par un essai gratuit de 14 jours pour les nouveaux abonnés. Annule dans tes abonnements App Store ou Google Play avant la fin de l'essai et tu ne paies rien ; sinon, tu es débité du prix que ta boutique t'affiche avant l'abonnement, et Pro se renouvelle chaque année jusqu'à ce que tu annules."
  he: "Pro מתחיל בתקופת ניסיון חינם של 14 יום למנויים חדשים. בטלו במינויים שלכם ב-App Store או ב-Google Play לפני שתקופת הניסיון מסתיימת ולא תשלמו כלום; אחרת תחויבו במחיר שהחנות שלכם מציגה לפני ההרשמה, ו-Pro מתחדש מדי שנה עד שתבטלו."
  hi: "Pro नए सदस्यों के लिए 14 दिन के मुफ़्त ट्रायल से शुरू होता है। ट्रायल खत्म होने से पहले अपनी App Store या Google Play सदस्यताओं में रद्द करें तो आपको कुछ नहीं देना होगा; वरना आपसे वह कीमत ली जाएगी जो आपका स्टोर सदस्यता लेने से पहले दिखाता है, और रद्द करने तक Pro हर साल रिन्यू होता रहेगा।"
  id: "Pro dimulai dengan uji coba gratis 14 hari untuk pelanggan baru. Batalkan di langganan App Store atau Google Play-mu sebelum uji coba berakhir dan kamu tidak membayar apa pun; jika tidak, kamu ditagih harga yang ditampilkan toko sebelum kamu berlangganan, dan Pro diperpanjang setiap tahun sampai kamu membatalkan."
  it: "Pro inizia con una prova gratuita di 14 giorni per i nuovi abbonati. Annulla dagli abbonamenti dell'App Store o di Google Play prima che la prova finisca e non paghi nulla; altrimenti ti viene addebitato il prezzo che il tuo store ti mostra prima dell'abbonamento, e Pro si rinnova ogni anno finché non annulli."
  ja: "Pro は新規登録の方向けの14日間の無料トライアルから始まります。トライアル終了前に App Store または Google Play のサブスクリプションからキャンセルすれば料金はかかりません。キャンセルしない場合は、登録前にストアに表示される価格が請求され、Pro はキャンセルするまで毎年更新されます。"
  ko: "Pro는 신규 구독자를 위한 14일 무료 체험으로 시작합니다. 체험이 끝나기 전에 App Store 또는 Google Play 구독에서 취소하면 아무것도 결제되지 않으며, 그렇지 않으면 구독 전에 스토어에 표시되는 가격이 청구되고 Pro는 취소할 때까지 매년 갱신됩니다."
  nl: "Pro begint met een gratis proefperiode van 14 dagen voor nieuwe abonnees. Zeg op in je abonnementen in de App Store of Google Play voordat de proefperiode eindigt en je betaalt niets; anders betaal je de prijs die je store je vóór het abonneren toont, en Pro verlengt zich elk jaar tot je opzegt."
  pl: "Pro zaczyna się od 14-dniowego bezpłatnego okresu próbnego dla nowych subskrybentów. Anuluj w subskrypcjach App Store lub Google Play przed końcem okresu próbnego, a nic nie zapłacisz; w przeciwnym razie zapłacisz cenę, którą sklep pokaże ci przed subskrypcją, a Pro będzie odnawiać się co roku, dopóki nie anulujesz."
  pt: "O Pro começa com um teste grátis de 14 dias para novos assinantes. Cancele nas suas assinaturas da App Store ou do Google Play antes do fim do teste e você não paga nada; caso contrário, você será cobrado o preço que sua loja mostra antes da assinatura, e o Pro é renovado todo ano até você cancelar."
  pt-BR: "O Pro começa com um teste grátis de 14 dias para novos assinantes. Cancele nas suas assinaturas da App Store ou do Google Play antes do fim do teste e você não paga nada; caso contrário, você será cobrado o preço que sua loja mostra antes da assinatura, e o Pro é renovado todo ano até você cancelar."
  pt-PT: "O Pro começa com um período experimental gratuito de 14 dias para novos subscritores. Cancele nas suas subscrições da App Store ou do Google Play antes do fim do período experimental e não paga nada; caso contrário, é-lhe cobrado o preço que a sua loja mostra antes de subscrever, e o Pro renova-se todos os anos até cancelar."
  ru: "Pro начинается с бесплатного 14-дневного пробного периода для новых подписчиков. Отмените подписку в App Store или Google Play до его окончания — и вы ничего не заплатите; иначе с вас спишут цену, которую ваш магазин показывает перед оформлением подписки, и Pro будет продлеваться каждый год, пока вы её не отмените."
  sv: "Pro börjar med en gratis provperiod på 14 dagar för nya prenumeranter. Avsluta i dina prenumerationer i App Store eller Google Play innan provperioden tar slut så betalar du ingenting; annars debiteras du det pris som din butik visar innan du prenumererar, och Pro förnyas varje år tills du avslutar."
  sw: "Pro inaanza na kipindi cha majaribio cha bure cha siku 14 kwa wanaojisajili wapya. Ghairi kwenye usajili wako wa App Store au Google Play kabla ya majaribio kuisha na hutalipa chochote; vinginevyo utatozwa bei ambayo duka lako linaonyesha kabla hujajisajili, na Pro husasishwa kila mwaka hadi utakapoghairi."
  th: "Pro เริ่มต้นด้วยการทดลองใช้ฟรี 14 วันสำหรับสมาชิกใหม่ ยกเลิกในการสมัครสมาชิก App Store หรือ Google Play ของคุณก่อนสิ้นสุดการทดลองใช้แล้วคุณจะไม่ต้องจ่ายอะไรเลย มิฉะนั้นคุณจะถูกเรียกเก็บตามราคาที่สโตร์ของคุณแสดงก่อนสมัคร และ Pro จะต่ออายุทุกปีจนกว่าคุณจะยกเลิก"
  uk: "Pro починається з безкоштовного 14-денного пробного періоду для нових підписників. Скасуйте в підписках App Store або Google Play до його завершення — і нічого не заплатите; інакше з вас спишуть ціну, яку ваш магазин показує перед оформленням підписки, і Pro продовжуватиметься щороку, доки ви не скасуєте."
  vi: "Pro bắt đầu với 14 ngày dùng thử miễn phí cho người đăng ký mới. Hủy trong mục đăng ký App Store hoặc Google Play của bạn trước khi thời gian dùng thử kết thúc thì bạn không phải trả gì; nếu không, bạn sẽ bị tính mức giá mà cửa hàng hiển thị trước khi bạn đăng ký, và Pro sẽ tự gia hạn mỗi năm cho đến khi bạn hủy."
  zh: "Pro 为新订阅用户提供 14 天免费试用。在试用结束前到 App Store 或 Google Play 的订阅中取消，你不需要支付任何费用；否则将按你订阅前商店显示的价格收费，Pro 会每年续订，直到你取消为止。"
  zh-HK: "Pro 為新訂閱用戶提供 14 天免費試用。在試用結束前到 App Store 或 Google Play 的訂閱中取消，你不需要支付任何費用；否則將按你訂閱前商店顯示的價格收費，Pro 會每年續訂，直至你取消為止。"
