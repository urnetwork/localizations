description: "Setup guide and info popup on linux: the honest limits of the device location override. Paired with location_override_coverage_geoclue."
source: "It does not cover everything. Chrome and KDE Plasma never ask GeoClue, and any app that works out your location from your IP address on its own is unaffected. Firefox falls back to its own lookup if the system does not answer quickly."
platforms:
  - linux
localizations:
  ar: "لا تغطي هذه الميزة كل شيء. لا يستعلم Chrome ولا KDE Plasma من GeoClue إطلاقًا، وأي تطبيق يستنتج موقعك من عنوان IP الخاص بك بنفسه لن يتأثر. ويلجأ Firefox إلى بحثه الخاص إذا لم يستجب النظام بسرعة."
  cs: "Nepokrývá vše. Chrome ani KDE Plasma se GeoClue nikdy neptají a jakákoli aplikace, která si vaši polohu sama odvodí z vaší IP adresy, zůstane nedotčena. Firefox se vrátí k vlastnímu zjišťování, pokud systém neodpoví rychle."
  de: "Es deckt nicht alles ab. Chrome und KDE Plasma fragen GeoClue nie ab, und jede App, die deinen Standort selbst aus deiner IP-Adresse ermittelt, bleibt unbeeinflusst. Firefox greift auf seine eigene Abfrage zurück, wenn das System nicht schnell antwortet."
  el: "Δεν καλύπτει τα πάντα. Το Chrome και το KDE Plasma δεν ρωτούν ποτέ το GeoClue, ενώ κάθε εφαρμογή που υπολογίζει μόνη της την τοποθεσία σας από τη διεύθυνση IP σας δεν επηρεάζεται. Ο Firefox καταφεύγει στη δική του αναζήτηση αν το σύστημα δεν απαντήσει γρήγορα."
  en: "It does not cover everything. Chrome and KDE Plasma never ask GeoClue, and any app that works out your location from your IP address on its own is unaffected. Firefox falls back to its own lookup if the system does not answer quickly."
  es: "No lo cubre todo. Chrome y KDE Plasma nunca consultan a GeoClue, y cualquier aplicación que deduzca tu ubicación por su cuenta a partir de tu dirección IP no se ve afectada. Firefox recurre a su propia consulta si el sistema no responde con rapidez."
  es-419: "No lo cubre todo. Chrome y KDE Plasma nunca consultan a GeoClue, y cualquier app que deduzca tu ubicación por su cuenta a partir de tu dirección IP no se ve afectada. Firefox recurre a su propia consulta si el sistema no responde con rapidez."
  es-MX: "No lo cubre todo. Chrome y KDE Plasma nunca consultan a GeoClue, y cualquier app que deduzca tu ubicación por su cuenta a partir de tu dirección IP no se ve afectada. Firefox recurre a su propia consulta si el sistema no responde con rapidez."
  fr: "Cela ne couvre pas tout. Chrome et KDE Plasma n'interrogent jamais GeoClue, et toute application qui déduit elle-même votre position à partir de votre adresse IP n'est pas affectée. Firefox se rabat sur sa propre recherche si le système ne répond pas rapidement."
  he: "זה לא מכסה הכול. Chrome ו-KDE Plasma לעולם אינם פונים ל-GeoClue, וכל אפליקציה שמסיקה בעצמה את מיקומך מכתובת ה-IP שלך אינה מושפעת. Firefox חוזר לחיפוש העצמאי שלו אם המערכת לא עונה במהירות."
  hi: "यह सब कुछ कवर नहीं करता। Chrome और KDE Plasma कभी GeoClue से नहीं पूछते, और ऐसा कोई भी ऐप्लिकेशन जो आपके IP पते से खुद ही आपका स्थान निकाल लेता है, उस पर कोई असर नहीं पड़ता। अगर सिस्टम जल्दी जवाब नहीं देता तो Firefox अपनी खुद की लुकअप पर लौट जाता है।"
  id: "Ini tidak mencakup semuanya. Chrome dan KDE Plasma tidak pernah menanyakan GeoClue, dan aplikasi apa pun yang menentukan lokasi Anda sendiri dari alamat IP Anda tidak terpengaruh. Firefox beralih ke pencariannya sendiri jika sistem tidak menjawab dengan cepat."
  it: "Non copre tutto. Chrome e KDE Plasma non interrogano mai GeoClue e qualsiasi app che ricava da sola la tua posizione dal tuo indirizzo IP non è interessata. Firefox ricorre alla propria ricerca se il sistema non risponde rapidamente."
  ja: "すべてを網羅するわけではありません。Chrome と KDE Plasma は GeoClue に問い合わせることがなく、IP アドレスから独自に位置を割り出すアプリには影響しません。システムがすぐに応答しない場合、Firefox は独自の位置検索にフォールバックします。"
  ko: "모든 경우를 처리하지는 않습니다. Chrome과 KDE Plasma는 GeoClue에 전혀 질의하지 않으며, IP 주소로 위치를 자체적으로 알아내는 앱에는 영향을 주지 않습니다. 시스템이 빠르게 응답하지 않으면 Firefox는 자체 조회로 대체합니다."
  nl: "Het dekt niet alles. Chrome en KDE Plasma raadplegen GeoClue nooit, en elke app die je locatie zelf uit je IP-adres afleidt, blijft onaangetast. Firefox valt terug op zijn eigen opzoeking als het systeem niet snel antwoordt."
  pl: "Nie obejmuje to wszystkiego. Chrome i KDE Plasma nigdy nie pytają GeoClue, a żadna aplikacja, która sama ustala Twoją lokalizację na podstawie adresu IP, nie jest tym objęta. Firefox wraca do własnego wyszukiwania, jeśli system nie odpowie szybko."
  pt: "Não cobre tudo. O Chrome e o KDE Plasma nunca consultam o GeoClue e qualquer aplicação que determine sozinha a sua localização a partir do seu endereço IP não é afetada. O Firefox recorre à sua própria pesquisa se o sistema não responder rapidamente."
  pt-BR: "Não cobre tudo. O Chrome e o KDE Plasma nunca consultam o GeoClue, e qualquer app que descubra sozinho a sua localização a partir do seu endereço IP não é afetado. O Firefox recorre à própria consulta se o sistema não responder rapidamente."
  pt-PT: "Não cobre tudo. O Chrome e o KDE Plasma nunca consultam o GeoClue e qualquer aplicação que determine sozinha a sua localização a partir do seu endereço IP não é afetada. O Firefox recorre à sua própria pesquisa se o sistema não responder rapidamente."
  ru: "Это покрывает не всё. Chrome и KDE Plasma никогда не обращаются к GeoClue, а любое приложение, которое само определяет ваше местоположение по IP-адресу, остаётся незатронутым. Если система не отвечает быстро, Firefox переходит к собственному определению местоположения."
  sv: "Det täcker inte allt. Chrome och KDE Plasma frågar aldrig GeoClue, och appar som själva räknar ut din plats utifrån din IP-adress påverkas inte. Firefox faller tillbaka på sin egen uppslagning om systemet inte svarar snabbt."
  sw: "Haifuniki kila kitu. Chrome na KDE Plasma hazimwulizi GeoClue kamwe, na programu yoyote inayobaini mahali ulipo yenyewe kutokana na anwani yako ya IP haiathiriki. Firefox hurudi kwenye utafutaji wake wenyewe ikiwa mfumo haujibu haraka."
  th: "ฟีเจอร์นี้ไม่ครอบคลุมทุกอย่าง Chrome และ KDE Plasma ไม่เคยสอบถาม GeoClue และแอปใดก็ตามที่คำนวณตำแหน่งของคุณเองจากที่อยู่ IP จะไม่ได้รับผลกระทบ ส่วน Firefox จะย้อนไปใช้การค้นหาของตัวเองหากระบบตอบไม่เร็วพอ"
  uk: "Це охоплює не все. Chrome і KDE Plasma ніколи не звертаються до GeoClue, а будь-який застосунок, який сам визначає ваше місцезнаходження за IP-адресою, не зазнає впливу. Якщо система не відповідає швидко, Firefox переходить до власного визначення."
  vi: "Tính năng này không bao phủ mọi thứ. Chrome và KDE Plasma không bao giờ hỏi GeoClue, và mọi ứng dụng tự suy ra vị trí của bạn từ địa chỉ IP đều không bị ảnh hưởng. Firefox sẽ chuyển sang tra cứu riêng của nó nếu hệ thống không phản hồi nhanh."
  zh: "它并不能覆盖所有情况。Chrome 和 KDE Plasma 从不向 GeoClue 查询，任何自行根据您的 IP 地址推断位置的应用也不受影响。如果系统未能快速响应，Firefox 会回退到它自己的查询。"
  zh-HK: "它並不能涵蓋所有情況。Chrome 和 KDE Plasma 從不向 GeoClue 查詢，任何自行根據你的 IP 位址推斷位置的應用程式也不受影響。如果系統未能快速回應，Firefox 會改用它自己的查詢。"
