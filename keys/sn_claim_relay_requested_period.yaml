description: "Earnings, the settlement v2 tile and the claim sheet, under the queued Claim now: the Claim now limit (once in this many days, 30 today; the count selects the plural form) starts when URnetwork's claim of this balance is paid, not at the tap, so the next Claim now opens this many days after this claim goes through. Claim now is the button's label; keep it recognizable as that label."
source: "Your next Claim now opens %lld days after this claim goes through."
platforms:
  - linux
  - apple
  - android
  - windows
  - site
placeholders:
  - name: days
    type: int
plurals:
  select: days
