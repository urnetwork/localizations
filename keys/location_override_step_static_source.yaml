description: "Setup guide step on linux: keep GeoClue's static location source enabled so the override is read."
source: "Keep GeoClue's static location source enabled. It is on by default; check /etc/geoclue/geoclue.conf if you have changed it."
platforms:
  - linux
localizations:
  ar: "أبقِ مصدر الموقع الثابت في GeoClue مفعّلًا. إنه مفعّل افتراضيًا؛ راجع /etc/geoclue/geoclue.conf إذا كنت قد غيّرته."
  cs: "Ponechte statický zdroj polohy v GeoClue zapnutý. Ve výchozím nastavení je zapnutý; pokud jste jej změnili, zkontrolujte /etc/geoclue/geoclue.conf."
  de: "Lass die statische Standortquelle von GeoClue aktiviert. Sie ist standardmäßig aktiv; prüfe /etc/geoclue/geoclue.conf, falls du sie geändert hast."
  el: "Διατηρήστε ενεργοποιημένη τη στατική πηγή τοποθεσίας του GeoClue. Είναι ενεργή από προεπιλογή· ελέγξτε το /etc/geoclue/geoclue.conf αν την έχετε αλλάξει."
  en: "Keep GeoClue's static location source enabled. It is on by default; check /etc/geoclue/geoclue.conf if you have changed it."
  es: "Mantén activada la fuente de ubicación estática de GeoClue. Está activada de forma predeterminada; revisa /etc/geoclue/geoclue.conf si la has cambiado."
  es-419: "Mantén activada la fuente de ubicación estática de GeoClue. Está activada de forma predeterminada; revisa /etc/geoclue/geoclue.conf si la cambiaste."
  es-MX: "Mantén activada la fuente de ubicación estática de GeoClue. Está activada de forma predeterminada; revisa /etc/geoclue/geoclue.conf si la cambiaste."
  fr: "Laissez la source de position statique de GeoClue activée. Elle est activée par défaut ; vérifiez /etc/geoclue/geoclue.conf si vous l'avez modifiée."
  he: "השאר את מקור המיקום הסטטי של GeoClue מופעל. הוא מופעל כברירת מחדל; בדוק את /etc/geoclue/geoclue.conf אם שינית אותו."
  hi: "GeoClue का स्टैटिक लोकेशन स्रोत चालू रहने दें। यह डिफ़ॉल्ट रूप से चालू होता है; अगर आपने इसे बदला है तो /etc/geoclue/geoclue.conf देखें।"
  id: "Biarkan sumber lokasi statis GeoClue tetap aktif. Secara bawaan sudah aktif; periksa /etc/geoclue/geoclue.conf jika Anda pernah mengubahnya."
  it: "Mantieni attiva la sorgente di posizione statica di GeoClue. È attiva per impostazione predefinita; controlla /etc/geoclue/geoclue.conf se l'hai modificata."
  ja: "GeoClue の静的位置情報ソースを有効のままにしてください。既定では有効です。変更したことがある場合は /etc/geoclue/geoclue.conf を確認してください。"
  ko: "GeoClue의 정적 위치 소스를 사용 설정된 상태로 두세요. 기본적으로 켜져 있으며, 변경한 적이 있다면 /etc/geoclue/geoclue.conf를 확인하세요."
  nl: "Houd de statische locatiebron van GeoClue ingeschakeld. Deze staat standaard aan; controleer /etc/geoclue/geoclue.conf als je die hebt gewijzigd."
  pl: "Pozostaw włączone statyczne źródło lokalizacji GeoClue. Domyślnie jest włączone; jeśli je zmieniałeś, sprawdź /etc/geoclue/geoclue.conf."
  pt: "Mantenha ativada a fonte de localização estática do GeoClue. Está ativada por predefinição; verifique /etc/geoclue/geoclue.conf se a tiver alterado."
  pt-BR: "Mantenha ativada a fonte de localização estática do GeoClue. Ela vem ativada por padrão; verifique /etc/geoclue/geoclue.conf se você a alterou."
  pt-PT: "Mantenha ativada a fonte de localização estática do GeoClue. Está ativada por predefinição; verifique /etc/geoclue/geoclue.conf se a tiver alterado."
  ru: "Оставьте статический источник местоположения GeoClue включённым. По умолчанию он включён; если вы его меняли, проверьте /etc/geoclue/geoclue.conf."
  sv: "Låt GeoClues statiska platskälla vara aktiverad. Den är på som standard; kontrollera /etc/geoclue/geoclue.conf om du har ändrat den."
  sw: "Acha chanzo cha mahali kisichobadilika cha GeoClue kikiwa kimewashwa. Huwa kimewashwa kwa chaguomsingi; angalia /etc/geoclue/geoclue.conf ikiwa umekibadilisha."
  th: "เปิดใช้แหล่งตำแหน่งแบบคงที่ของ GeoClue ไว้ตลอด โดยปกติจะเปิดอยู่แล้ว หากคุณเคยเปลี่ยน ให้ตรวจสอบ /etc/geoclue/geoclue.conf"
  uk: "Залиште статичне джерело місцезнаходження GeoClue увімкненим. Типово воно ввімкнене; якщо ви його змінювали, перевірте /etc/geoclue/geoclue.conf."
  vi: "Hãy để nguồn vị trí tĩnh của GeoClue ở trạng thái bật. Theo mặc định nó đã bật; hãy kiểm tra /etc/geoclue/geoclue.conf nếu bạn từng thay đổi."
  zh: "保持 GeoClue 的静态位置源处于启用状态。它默认是开启的；如果您改动过，请检查 /etc/geoclue/geoclue.conf。"
  zh-HK: "保持 GeoClue 的靜態位置來源處於啟用狀態。它預設是開啟的；如果你更改過，請檢查 /etc/geoclue/geoclue.conf。"
