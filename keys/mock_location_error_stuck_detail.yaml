description: "Recovery instructions in that card, and the only in-app guidance for restoring the device's real GPS."
source: "URnetwork was deselected while active, so Android locked the simulated GPS. Re-select URnetwork in Developer options to restore your real GPS, or restart your phone."
platforms:
  - android
localizations:
  en: "URnetwork was deselected while active, so Android locked the simulated GPS. Re-select URnetwork in Developer options to restore your real GPS, or restart your phone."
  ar: "أُلغي اختيار URnetwork أثناء تفعيل الميزة، لذا جمّد Android موقع GPS الوهمي. أعد اختيار URnetwork في خيارات المطوّرين لاستعادة موقع GPS الحقيقي، أو أعد تشغيل هاتفك."
  cs: "Výběr aplikace URnetwork byl zrušen, když byla funkce aktivní, takže Android zamkl simulovanou polohu GPS. Znovu vyberte URnetwork v možnostech pro vývojáře, aby se obnovila vaše skutečná poloha GPS, nebo restartujte telefon."
  de: "URnetwork wurde abgewählt, während die Funktion aktiv war, deshalb hat Android das simulierte GPS gesperrt. Wähle URnetwork in den Entwickleroptionen erneut aus, um dein echtes GPS wiederherzustellen, oder starte dein Telefon neu."
  el: "Η επιλογή του URnetwork καταργήθηκε ενώ ήταν ενεργό, οπότε το Android κλείδωσε το εικονικό GPS. Επιλέξτε ξανά το URnetwork στις «Επιλογές για προγραμματιστές» για να επαναφέρετε το πραγματικό σας GPS, ή επανεκκινήστε το τηλέφωνό σας."
  es: "Se ha quitado la selección de URnetwork mientras la ubicación simulada estaba activa, así que Android ha bloqueado el GPS simulado. Vuelve a seleccionar URnetwork en las opciones para desarrolladores para recuperar tu GPS real, o reinicia tu teléfono."
  es-419: "Se quitó la selección de URnetwork mientras estaba activo, por lo que Android dejó congelado el GPS simulado. Para restaurar tu GPS real, vuelve a seleccionar URnetwork en las opciones para desarrolladores o reinicia tu teléfono."
  es-MX: "Se quitó la selección de URnetwork mientras estaba activo, por lo que Android bloqueó el GPS simulado. Vuelve a seleccionar URnetwork en las opciones para desarrolladores para recuperar tu GPS real, o reinicia tu teléfono."
  fr: "URnetwork a été désélectionné alors qu'il était actif, Android a donc verrouillé le GPS fictif. Resélectionnez URnetwork dans les options pour les développeurs afin de rétablir votre GPS réel, ou redémarrez votre téléphone."
  he: "בחירת URnetwork בוטלה בזמן שהמיקום המדומה היה פעיל, ולכן Android נעל את ה-GPS המדומה. בחר שוב את URnetwork באפשרויות המפתחים כדי להחזיר את ה-GPS האמיתי שלך, או הפעל מחדש את הטלפון."
  hi: "URnetwork चालू रहते हुए उसका चयन हटा दिया गया, इसलिए Android ने नकली GPS को लॉक कर दिया। अपना असली GPS वापस पाने के लिए डेवलपर विकल्प में URnetwork को फिर से चुनें, या अपना फ़ोन रीस्टार्ट करें।"
  id: "Pilihan URnetwork dibatalkan saat fitur masih aktif, sehingga Android mengunci GPS palsu. Pilih kembali URnetwork di opsi developer untuk memulihkan GPS asli Anda, atau mulai ulang ponsel Anda."
  it: "URnetwork è stato deselezionato mentre era attivo, quindi Android ha bloccato il GPS fittizio. Seleziona di nuovo URnetwork nelle opzioni sviluppatore per ripristinare il GPS reale, oppure riavvia il telefono."
  ja: "この機能がオンの間に URnetwork の選択が解除されたため、Android が GPS を仮の位置情報に固定しました。実際の位置情報に戻すには、開発者向けオプションで URnetwork をもう一度選択するか、スマートフォンを再起動してください。"
  ko: "사용 중에 URnetwork 선택이 해제되어 Android가 모의 GPS를 고정했습니다. 실제 GPS를 복원하려면 개발자 옵션에서 URnetwork를 다시 선택하거나 휴대전화를 다시 시작하세요."
  nl: "URnetwork is gedeselecteerd terwijl het actief was, waardoor Android de gesimuleerde GPS heeft vergrendeld. Selecteer URnetwork opnieuw in de opties voor ontwikkelaars om je echte GPS te herstellen, of start je telefoon opnieuw op."
  pl: "Wybór URnetwork został cofnięty, gdy symulacja była aktywna, więc Android zamroził symulowany GPS. Ponownie wybierz URnetwork w opcjach programisty, aby przywrócić rzeczywisty GPS, albo uruchom telefon ponownie."
  pt: "A URnetwork foi desmarcada enquanto estava ativa, pelo que o Android bloqueou o GPS fictício. Volte a selecionar a URnetwork nas opções de programador para repor o seu GPS real, ou reinicie o telemóvel."
  pt-BR: "O URnetwork foi desmarcado enquanto estava ativo, por isso o Android travou o GPS fictício. Selecione o URnetwork novamente nas opções do desenvolvedor para restaurar o seu GPS real, ou reinicie o dispositivo."
  pt-PT: "A URnetwork foi desmarcada enquanto estava ativa, por isso o Android bloqueou o GPS na localização fictícia. Volte a selecionar a URnetwork nas opções de programador para repor o seu GPS real, ou reinicie o telemóvel."
  ru: "Выбор URnetwork был снят, пока функция была активна, поэтому Android зафиксировал фиктивный GPS. Снова выберите URnetwork в параметрах разработчика, чтобы восстановить реальный GPS, или перезагрузите телефон."
  sv: "URnetwork avmarkerades medan detta var aktivt, så Android låste fast den simulerade GPS-signalen. Välj URnetwork igen under utvecklaralternativen för att återställa din verkliga GPS, eller starta om telefonen."
  sw: "URnetwork iliondolewa kwenye uteuzi wakati kipengele hiki kilipokuwa kimewashwa, kwa hivyo Android ikagandisha GPS ya kuigwa. Chagua tena URnetwork katika chaguo za wasanidi programu ili kurejesha GPS yako halisi, au uwashe upya simu yako."
  th: "URnetwork ถูกยกเลิกการเลือกขณะที่ยังเปิดใช้อยู่ Android จึงล็อก GPS จำลองไว้ เลือก URnetwork อีกครั้งในตัวเลือกสำหรับนักพัฒนาแอปเพื่อกู้คืน GPS จริงของคุณ หรือรีสตาร์ทโทรศัพท์ของคุณ"
  uk: "Вибір URnetwork було скасовано, поки функція працювала, тому Android заморозив фіктивний GPS. Щоб відновити справжній GPS, знову виберіть URnetwork у параметрах розробника або перезавантажте телефон."
  vi: "URnetwork đã bị bỏ chọn khi đang hoạt động, nên Android đã khóa GPS mô phỏng. Hãy chọn lại URnetwork trong tùy chọn cho nhà phát triển để khôi phục GPS thật của bạn, hoặc khởi động lại điện thoại."
  zh: "由于在此功能开启期间取消选择了 URnetwork，Android 锁定了模拟 GPS。请在开发者选项中重新选择 URnetwork 以恢复真实 GPS，或重启手机。"
  zh-HK: "URnetwork 在此功能開啟期間被取消選取，因此 Android 鎖定了模擬 GPS。請在開發人員選項中重新選取 URnetwork 以恢復你的真實 GPS，或重新啟動手機。"
