description: "Transfer Submitted Overlay"
source: "Your transfer has been initiated and will complete once the transaction is processed on chain."
platforms:
  - android
localizations:
  ar: "تمت تهيئة عملية التحويل الخاصة بك وسيتم الانتهاء منها بمجرد معالجة المعاملة على السلسلة."
  cs: "Váš převod byl zahájen a bude dokončen, jakmile bude transakce zpracována na řetězci."
  de: "Deine Überweisung wurde eingeleitet und wird abgeschlossen, sobald die Transaktion in der Chain verarbeitet wurde."
  el: "Η μεταφορά σας ξεκίνησε και θα ολοκληρωθεί μόλις η συναλλαγή υποβληθεί σε επεξεργασία στην αλυσίδα."
  en: "Your transfer has been initiated and will complete once the transaction is processed on chain."
  es: "Tu transferencia se ha iniciado y se completará una vez que la transacción se haya procesado en la cadena."
  es-419: "Tu transferencia se ha iniciado y se completará una vez que la transacción se haya procesado en la cadena."
  es-MX: "Tu transferencia se ha iniciado y se completará una vez que la transacción se haya procesado en la cadena."
  fr: "Votre transfert a été initié et sera terminé une fois la transaction traitée sur la chaîne."
  he: "ההעברה שלך החלה ותושלם לאחר שהעסקה תעובד על השרשרת."
  hi: "आपका हस्तांतरण शुरू हो गया है और चेन पर लेनदेन संसाधित होने के बाद पूरा हो जाएगा।"
  id: "Transfer Anda telah dimulai dan akan selesai setelah transaksi diproses di blockchain."
  it: "Il tuo trasferimento è stato avviato e verrà completato una volta che la transazione sarà elaborata on chain."
  ja: "送金が開始されました。チェーン上で取引が処理されると完了します。"
  ko: "이체가 시작되었으며 블록체인에서 거래가 처리되면 완료됩니다."
  nl: "Je overdracht is gestart en wordt voltooid zodra de transactie op de blockchain is verwerkt."
  pl: "Twój transfer został zainicjowany i zostanie zakończony po przetworzeniu transakcji w łańcuchu."
  pt: "Sua transferência foi iniciada e será concluída assim que a transação for processada na cadeia."
  pt-BR: "Sua transferência foi iniciada e será concluída assim que a transação for processada na cadeia."
  pt-PT: "Sua transferência foi iniciada e será concluída assim que a transação for processada na cadeia."
  ru: "Ваш перевод инициирован и будет завершен после обработки транзакции в сети."
  sv: "Din överföring har initierats och slutförs när transaktionen har behandlats på kedjan."
  sw: "Uhamisho wako umeanza na utakamilika mara tu muamala utakapochakatwa kwenye mnyororo."
  th: "การโอนของคุณได้เริ่มแล้ว และจะได้รับยอดเมื่อรายการประมวลผลเสร็จสิ้นบนเครือข่าย"
  uk: "Ваш переказ розпочато, і він завершиться після обробки транзакції в блокчейні."
  vi: "Lệnh chuyển của bạn đã được khởi tạo và sẽ hoàn tất sau khi giao dịch được xử lý trên chuỗi."
  zh: "您的转账已启动，一旦在链上处理完交易，转账就会完成。"
  zh-HK: "您的轉帳已開始，交易在鏈上處理完成後即會完成。"
