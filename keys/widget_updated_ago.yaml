description: "Dashboard widget footer; the argument is a localized relative time such as '3 min. ago'."
source: "Updated %@"
platforms:
  - apple
  - android
placeholders:
  - name: time
    type: string
localizations:
  ar: "آخر تحديث {time}"
  de: "Aktualisiert {time}"
  en: "Updated {time}"
  es: "Actualizado {time}"
  ru: "Обновлено {time}"
  zh: "更新于 {time}"
