description: "Onboarding email E2, not-activated variant: the whole first step again, then the widget."
source: "Still haven't connected? The whole thing takes about a minute: open URnetwork, tap Connect, done. After that the widget makes it one tap from your lock screen."
platforms:
  - email
localizations:
  en: "Still haven't connected? The whole thing takes about a minute: open URnetwork, tap Connect, done. After that the widget makes it one tap from your lock screen."
  ar: "لم تتصل بعد؟ الأمر كله يستغرق نحو دقيقة: افتح URnetwork، واضغط على «اربط»، وانتهى. بعد ذلك تجعلها الأداة ضغطة واحدة من شاشة القفل."
  cs: "Ještě jste se nepřipojili? Celé to zabere asi minutu: otevřete URnetwork, klepněte na Připojit, hotovo. Pak už je to díky widgetu jedno klepnutí ze zamykací obrazovky."
  de: "Noch nicht verbunden? Das Ganze dauert etwa eine Minute: URnetwork öffnen, auf „Verbinde“ tippen, fertig. Danach macht es das Widget zu einem Tipp vom Sperrbildschirm."
  el: "Δεν έχεις συνδεθεί ακόμα; Όλο κι όλο παίρνει περίπου ένα λεπτό: άνοιξε το URnetwork, πάτησε Σύνδεση, τέλος. Μετά, το γραφικό στοιχείο το κάνει ένα πάτημα από την οθόνη κλειδώματος."
  es: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo. Después, el widget lo deja a un toque desde tu pantalla de bloqueo."
  es-419: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo. Después, el widget lo deja a un toque desde tu pantalla de bloqueo."
  es-MX: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo. Después, el widget lo deja a un toque desde tu pantalla de bloqueo."
  fr: "Toujours pas connecté ? Le tout prend environ une minute : ouvre URnetwork, appuie sur Connecte, c'est fait. Ensuite, le widget met tout ça à un geste de ton écran de verrouillage."
  he: "עדיין לא התחברתם? כל העניין לוקח בערך דקה: פותחים את URnetwork, מקישים על התחבר, וזהו. אחרי זה הווידג'ט הופך את זה להקשה אחת ממסך הנעילה."
  hi: "अभी तक कनेक्ट नहीं किया? पूरी प्रक्रिया में लगभग एक मिनट लगता है: URnetwork खोलें, कनेक्ट करें पर टैप करें, हो गया। उसके बाद विजेट इसे लॉक स्क्रीन से बस एक टैप बना देता है।"
  id: "Belum terhubung juga? Semuanya hanya butuh sekitar semenit: buka URnetwork, ketuk Hubungkan, selesai. Setelah itu widget membuatnya jadi satu ketukan dari layar kunci."
  it: "Non ti sei ancora connesso? Il tutto richiede circa un minuto: apri URnetwork, tocca Connetti, fatto. Dopo, il widget lo rende un tocco dalla schermata di blocco."
  ja: "まだ接続していませんか？全部で1分ほどです。URnetwork を開いて「接続」をタップ、これで完了。そのあとはウィジェットでロック画面からワンタップになります。"
  ko: "아직 연결하지 않으셨나요? 전부 합쳐 1분 정도면 됩니다. URnetwork를 열고 연결을 누르면 끝. 그다음부터는 위젯으로 잠금 화면에서 한 번만 누르면 됩니다."
  nl: "Nog steeds geen verbinding gemaakt? Het hele proces duurt ongeveer een minuut: open URnetwork, tik op Verbinden, klaar. Daarna maakt de widget het één tik vanaf je vergrendelscherm."
  pl: "Wciąż bez połączenia? Całość zajmuje około minuty: otwórz URnetwork, dotknij Połącz, gotowe. Potem widżet sprowadza to do jednego dotknięcia z ekranu blokady."
  pt: "Ainda não se conectou? Tudo leva cerca de um minuto: abra a URnetwork, toque em Conecte, pronto. Depois disso o widget deixa tudo a um toque da tela de bloqueio."
  pt-BR: "Ainda não se conectou? Tudo leva cerca de um minuto: abra a URnetwork, toque em Conecte, pronto. Depois disso o widget deixa tudo a um toque da tela de bloqueio."
  pt-PT: "Ainda não se ligou? Tudo demora cerca de um minuto: abra a URnetwork, toque em Ligar, feito. Depois disso o widget deixa tudo a um toque do ecrã de bloqueio."
  ru: "Ещё не подключались? Всё занимает около минуты: откройте URnetwork, нажмите «Подключить», готово. Дальше виджет сводит это к одному касанию с экрана блокировки."
  sv: "Fortfarande inte ansluten? Det hela tar ungefär en minut: öppna URnetwork, tryck på Anslut, klart. Sedan gör widgeten det till ett tryck från låsskärmen."
  sw: "Bado hujaunganisha? Yote huchukua takribani dakika moja: fungua URnetwork, gonga Unganisha, imekamilika. Baada ya hapo wijeti inafanya iwe mguso mmoja kutoka skrini ya kufunga."
  th: "ยังไม่ได้เชื่อมต่อใช่ไหม ทั้งหมดใช้เวลาประมาณหนึ่งนาที: เปิด URnetwork แตะ เชื่อมต่อ เสร็จแล้ว หลังจากนั้นวิดเจ็ตจะทำให้เหลือแค่แตะครั้งเดียวจากหน้าจอล็อก"
  uk: "Досі не підключалися? Усе займає близько хвилини: відкрийте URnetwork, натисніть «Підключитися», готово. Далі віджет зводить це до одного дотику з екрана блокування."
  vi: "Vẫn chưa kết nối? Tất cả chỉ mất khoảng một phút: mở URnetwork, chạm Kết nối, xong. Sau đó widget biến nó thành một chạm từ màn hình khóa."
  zh: "还没连接？整个过程大约一分钟：打开 URnetwork，点按“连接”，完成。之后小组件让它变成锁屏上的一下点按。"
  zh-HK: "還沒連接？整個過程大約一分鐘：打開 URnetwork，點按「連接」，完成。之後小工具讓它變成鎖定畫面上的一下點按。"
