description: "Onboarding email E2, not-activated variant: the whole first step again. It goes to every platform, the desktop and the web too, so it names no widget (mmm/ONBOARDING-RETENTION.md P19)."
source: "Still haven't connected? The whole thing takes about a minute: open URnetwork, tap Connect, done."
platforms:
  - email
localizations:
  en: "Still haven't connected? The whole thing takes about a minute: open URnetwork, tap Connect, done."
  ar: "لم تتصل بعد؟ الأمر كله يستغرق نحو دقيقة: افتح URnetwork، واضغط على «اربط»، وانتهى."
  cs: "Ještě jste se nepřipojili? Celé to zabere asi minutu: otevřete URnetwork, klepněte na Připojit, hotovo."
  de: "Noch nicht verbunden? Das Ganze dauert etwa eine Minute: URnetwork öffnen, auf „Verbinde“ tippen, fertig."
  el: "Δεν έχεις συνδεθεί ακόμα; Όλο κι όλο παίρνει περίπου ένα λεπτό: άνοιξε το URnetwork, πάτησε Σύνδεση, τέλος."
  es: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo."
  es-419: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo."
  es-MX: "¿Todavía no te has conectado? Todo toma alrededor de un minuto: abre URnetwork, toca Conecta, listo."
  fr: "Toujours pas connecté ? Le tout prend environ une minute : ouvre URnetwork, appuie sur Connecte, c'est fait."
  he: "עדיין לא התחברתם? כל העניין לוקח בערך דקה: פותחים את URnetwork, מקישים על התחבר, וזהו."
  hi: "अभी तक कनेक्ट नहीं किया? पूरी प्रक्रिया में लगभग एक मिनट लगता है: URnetwork खोलें, कनेक्ट करें पर टैप करें, हो गया।"
  id: "Belum terhubung juga? Semuanya hanya butuh sekitar semenit: buka URnetwork, ketuk Hubungkan, selesai."
  it: "Non ti sei ancora connesso? Il tutto richiede circa un minuto: apri URnetwork, tocca Connetti, fatto."
  ja: "まだ接続していませんか？全部で1分ほどです。URnetwork を開いて「接続」をタップ、これで完了。"
  ko: "아직 연결하지 않으셨나요? 전부 합쳐 1분 정도면 됩니다. URnetwork를 열고 연결을 누르면 끝."
  nl: "Nog steeds geen verbinding gemaakt? Het hele proces duurt ongeveer een minuut: open URnetwork, tik op Verbinden, klaar."
  pl: "Wciąż bez połączenia? Całość zajmuje około minuty: otwórz URnetwork, dotknij Połącz, gotowe."
  pt: "Ainda não se conectou? Tudo leva cerca de um minuto: abra a URnetwork, toque em Conecte, pronto."
  pt-BR: "Ainda não se conectou? Tudo leva cerca de um minuto: abra a URnetwork, toque em Conecte, pronto."
  pt-PT: "Ainda não se ligou? Tudo demora cerca de um minuto: abra a URnetwork, toque em Ligar, feito."
  ru: "Ещё не подключались? Всё занимает около минуты: откройте URnetwork, нажмите «Подключить», готово."
  sv: "Fortfarande inte ansluten? Det hela tar ungefär en minut: öppna URnetwork, tryck på Anslut, klart."
  sw: "Bado hujaunganisha? Yote huchukua takribani dakika moja: fungua URnetwork, gonga Unganisha, imekamilika."
  th: "ยังไม่ได้เชื่อมต่อใช่ไหม ทั้งหมดใช้เวลาประมาณหนึ่งนาที: เปิด URnetwork แตะ เชื่อมต่อ เสร็จแล้ว"
  uk: "Досі не підключалися? Усе займає близько хвилини: відкрийте URnetwork, натисніть «Підключитися», готово."
  vi: "Vẫn chưa kết nối? Tất cả chỉ mất khoảng một phút: mở URnetwork, chạm Kết nối, xong."
  zh: "还没连接？整个过程大约一分钟：打开 URnetwork，点按“连接”，完成。"
  zh-HK: "還沒連接？整個過程大約一分鐘：打開 URnetwork，點按「連接」，完成。"
