description: "DNS settings: the name of an adblock provider's preset in \"Family\", which blocks adult sites and, for some adblock providers, ads. Shown alone as the preset's label on the DNS screen, and inserted as is wherever the selected preset is named, as in \"DNS: AdGuard Family\" and \"AdGuard Family isn't answering\", so it reads as a short name that works on its own and inside a sentence. {provider} is the adblock provider's short name, inserted as is (for example AdGuard); keep it first, so the presets of a group stay in alphabetical order."
source: "%@ Family"
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: provider
    type: string
