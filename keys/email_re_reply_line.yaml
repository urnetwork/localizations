description: "Re-engagement emails: closing line inviting a reply. Replies reach the support inbox, so it says where they go and \"tell us\", not \"I read every reply\" (2026-11-13 review)."
source: "If something made you stop, reply and tell us. Every reply reaches our support inbox."
platforms:
  - email
localizations:
  en: "If something made you stop, reply and tell us. Every reply reaches our support inbox."
  ar: "إذا كان هناك ما جعلك تتوقف، فردّ وأخبرنا. كل ردّ يصل إلى صندوق بريد الدعم لدينا."
  cs: "Pokud vás něco přimělo přestat, odpovězte a napište nám to. Každá odpověď dorazí do naší schránky podpory."
  de: "Wenn dich etwas zum Aufhören gebracht hat, antworte und sag es uns. Jede Antwort landet in unserem Support-Postfach."
  el: "Αν κάτι σε έκανε να σταματήσεις, απάντησε και πες μας. Κάθε απάντηση φτάνει στα εισερχόμενα της υποστήριξής μας."
  es: "Si algo hizo que dejaras de conectarte, responde y cuéntanoslo. Cada respuesta llega a nuestra bandeja de soporte."
  es-419: "Si algo hizo que dejaras de conectarte, responde y cuéntanoslo. Cada respuesta llega a nuestra bandeja de soporte."
  es-MX: "Si algo hizo que dejaras de conectarte, responde y cuéntanoslo. Cada respuesta llega a nuestra bandeja de soporte."
  fr: "Si quelque chose t'a fait arrêter, réponds et dis-le-nous. Chaque réponse arrive dans notre boîte de support."
  he: "אם משהו גרם לכם להפסיק, השיבו וספרו לנו. כל תשובה מגיעה לתיבת התמיכה שלנו."
  hi: "अगर किसी वजह से आपने इस्तेमाल बंद किया, तो जवाब देकर हमें बताएं। हर जवाब हमारे सपोर्ट इनबॉक्स में पहुँचता है।"
  id: "Kalau ada yang membuatmu berhenti, balas dan ceritakan kepada kami. Setiap balasan masuk ke kotak masuk dukungan kami."
  it: "Se qualcosa ti ha fatto smettere, rispondi e diccelo. Ogni risposta arriva nella nostra casella dell'assistenza."
  ja: "何かが理由で使わなくなったのなら、返信して私たちに教えてください。返信はすべてサポートの受信箱に届きます。"
  ko: "그만 쓰시게 된 이유가 있다면, 답장으로 저희에게 알려 주세요. 모든 답장은 저희 지원팀 받은편지함으로 전달됩니다."
  nl: "Als je om een bepaalde reden bent gestopt, antwoord dan en vertel het ons. Elk antwoord komt binnen in onze supportinbox."
  pl: "Jeśli coś sprawiło, że przestałeś, odpowiedz i napisz nam. Każda odpowiedź trafia do naszej skrzynki wsparcia."
  pt: "Se algo fez você parar, responda e nos conte. Toda resposta chega à nossa caixa de suporte."
  pt-BR: "Se algo fez você parar, responda e nos conte. Toda resposta chega à nossa caixa de suporte."
  pt-PT: "Se alguma coisa fez com que parasse, responda e diga-nos. Todas as respostas chegam à nossa caixa de apoio."
  ru: "Если что-то заставило вас перестать, ответьте и расскажите нам. Каждый ответ попадает в почтовый ящик нашей поддержки."
  sv: "Om något fick dig att sluta, svara och berätta för oss. Varje svar hamnar i vår supportinkorg."
  sw: "Ikiwa kuna kitu kilichokufanya uache, jibu na utuambie. Kila jibu linafika kwenye kisanduku cha barua cha usaidizi wetu."
  th: "ถ้ามีอะไรทำให้คุณเลิกใช้ ตอบกลับมาบอกเราได้เลย ทุกคำตอบจะส่งถึงกล่องจดหมายฝ่ายซัพพอร์ตของเรา"
  uk: "Якщо щось змусило вас перестати, дайте відповідь і розкажіть нам. Кожна відповідь потрапляє до поштової скриньки нашої підтримки."
  vi: "Nếu có điều gì khiến bạn ngừng dùng, hãy trả lời và cho chúng tôi biết. Mọi câu trả lời đều được gửi đến hộp thư hỗ trợ của chúng tôi."
  zh: "如果有什么原因让你不再使用，回复告诉我们。每一封回复都会送达我们的支持邮箱。"
  zh-HK: "如果有什麼原因令你停用，回覆告訴我們。每一封回覆都會送達我們的支援郵箱。"
