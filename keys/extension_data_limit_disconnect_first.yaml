description: "Browser extension popup, out-of-balance alert for a Pro account at its plan's data, while the extension holds the browser's traffic: ur.io's data packs (the Buy data button) can't load through URnetwork until the user disconnects, and nothing disconnects for them. Disconnect is the button above this line; name it by its own label (the disconnect key). The free plan's counterpart is insufficient_balance_disconnect_first."
source: "To buy data, press Disconnect first. Payment can't get through until you do."
platforms:
  - web
localizations:
  ar: "لشراء بيانات، اختر «قطع الاتصال» أولًا. لا يمكن إتمام الدفع قبل ذلك."
  cs: "Pro nákup dat nejprve zvolte „Odpojení“. Do té doby platba neprojde."
  de: "Um Daten zu kaufen, wähle zuerst „Trennen“. Vorher kommt die Zahlung nicht durch."
  el: "Για να αγοράσετε δεδομένα, επιλέξτε πρώτα «Αποσύνδεση». Μέχρι τότε η πληρωμή δεν μπορεί να ολοκληρωθεί."
  en: "To buy data, press Disconnect first. Payment can't get through until you do."
  es: "Para comprar datos, elige primero «Desconectar». Hasta entonces, el pago no podrá completarse."
  es-419: "Para comprar datos, elige primero \"Desconectar\". Hasta entonces, el pago no podrá completarse."
  es-MX: "Para comprar datos, elige primero \"Desconectar\". Hasta entonces, el pago no podrá completarse."
  fr: "Pour acheter des données, choisissez d’abord « Déconnecter ». Le paiement ne peut pas aboutir avant cela."
  he: "כדי לקנות נתונים, בחר קודם \"התנתק\". עד אז התשלום לא יוכל לעבור."
  hi: "डेटा खरीदने के लिए पहले \"डिस्कनेक्ट करें\" चुनें। तब तक भुगतान पूरा नहीं हो पाएगा।"
  id: "Untuk membeli data, pilih “Putuskan” terlebih dahulu. Pembayaran tidak dapat diproses sebelum itu."
  it: "Per acquistare dati, scegli prima «Disconnetti». Fino ad allora il pagamento non può andare a buon fine."
  ja: "データを購入するには、先に「切断する」を選択してください。それまでは支払いを完了できません。"
  ko: "데이터를 구매하려면 먼저 '연결 해제'를 선택하세요. 그 전에는 결제를 완료할 수 없습니다."
  nl: "Kies eerst ‘Verbinding verbreken’ om data te kopen. Tot die tijd kan de betaling niet doorgaan."
  pl: "Aby kupić dane, najpierw wybierz „Rozłącz”. Do tego czasu płatność nie przejdzie."
  pt: "Para comprar dados, escolha primeiro \"Desconectar\". Até lá, o pagamento não será concluído."
  pt-BR: "Para comprar dados, escolha primeiro \"Desconectar\". Até lá, o pagamento não será concluído."
  pt-PT: "Para comprar dados, escolha primeiro \"Desligar\". Até lá, o pagamento não será concluído."
  ru: "Чтобы купить данные, сначала выберите «Отключить». До этого оплата не пройдёт."
  sv: "Välj först ”Koppla från” för att köpa data. Innan dess går betalningen inte igenom."
  sw: "Ili kununua data, chagua kwanza \"Tenganisha\". Malipo hayawezi kukamilika kabla ya hapo."
  th: "หากต้องการซื้อข้อมูล ให้เลือก “ตัดการเชื่อมต่อ” ก่อน จนกว่าจะถึงตอนนั้น การชำระเงินจะไม่สำเร็จ"
  uk: "Щоб купити дані, спочатку виберіть «Відключитися». Доти оплата не пройде."
  vi: "Để mua dữ liệu, trước tiên hãy chọn “Ngắt kết nối”. Cho đến lúc đó, thanh toán sẽ không thể hoàn tất."
  zh: "要购买数据，请先选择“断开连接”。在此之前，付款无法完成。"
  zh-HK: "要購買數據，請先選擇「斷開連接」。在此之前，付款無法完成。"
