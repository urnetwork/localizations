description: "Browser extension popup, under the button while the status line reads Proxy managed by policy (extension_status_proxy_policy). Keep URnetwork as is."
source: "This browser's proxy settings are managed by policy, so URnetwork can't connect."
platforms:
  - web
localizations:
  ar: "تُدار إعدادات الوكيل في هذا المتصفح بواسطة سياسة، لذا يتعذر على URnetwork الاتصال."
  cs: "Nastavení proxy v tomto prohlížeči spravuje zásada, takže se URnetwork nemůže připojit."
  de: "Die Proxy-Einstellungen dieses Browsers werden per Richtlinie verwaltet, daher kann sich URnetwork nicht verbinden."
  el: "Οι ρυθμίσεις διακομιστή μεσολάβησης αυτού του προγράμματος περιήγησης ελέγχονται από πολιτική, οπότε το URnetwork δεν μπορεί να συνδεθεί."
  en: "This browser's proxy settings are managed by policy, so URnetwork can't connect."
  es: "Los ajustes de proxy de este navegador están gestionados por una política, así que URnetwork no puede conectarse."
  es-419: "La configuración de proxy de este navegador está administrada por una política, así que URnetwork no puede conectarse."
  es-MX: "La configuración de proxy de este navegador está administrada por una política, así que URnetwork no puede conectarse."
  fr: "Les paramètres de proxy de ce navigateur sont gérés par une règle, URnetwork ne peut donc pas se connecter."
  he: "הגדרות הפרוקסי של הדפדפן הזה מנוהלות על ידי מדיניות, ולכן URnetwork לא יכול להתחבר."
  hi: "इस ब्राउज़र की प्रॉक्सी सेटिंग पॉलिसी द्वारा प्रबंधित हैं, इसलिए URnetwork कनेक्ट नहीं हो सकता।"
  id: "Pengaturan proxy browser ini dikelola oleh kebijakan, jadi URnetwork tidak dapat terhubung."
  it: "Le impostazioni proxy di questo browser sono gestite da una norma, quindi URnetwork non può connettersi."
  ja: "このブラウザのプロキシ設定はポリシーで管理されているため、URnetwork は接続できません。"
  ko: "이 브라우저의 프록시 설정은 정책으로 관리되므로 URnetwork가 연결할 수 없습니다."
  nl: "De proxyinstellingen van deze browser worden beheerd door beleid, dus URnetwork kan geen verbinding maken."
  pl: "Ustawieniami serwera proxy tej przeglądarki zarządzają zasady, więc URnetwork nie może się połączyć."
  pt: "As configurações de proxy deste navegador são gerenciadas por uma política, então a URnetwork não consegue se conectar."
  pt-BR: "As configurações de proxy deste navegador são gerenciadas por uma política, então a URnetwork não consegue se conectar."
  pt-PT: "As definições de proxy deste navegador são geridas por uma política, por isso a URnetwork não consegue ligar-se."
  ru: "Настройки прокси в этом браузере управляются правилом, поэтому URnetwork не может подключиться."
  sv: "Proxyinställningarna i den här webbläsaren hanteras av en policy, så URnetwork kan inte ansluta."
  sw: "Mipangilio ya proksi ya kivinjari hiki inasimamiwa na sera, kwa hivyo URnetwork haiwezi kuunganisha."
  th: "การตั้งค่าพร็อกซีของเบราว์เซอร์นี้จัดการโดยนโยบาย URnetwork จึงเชื่อมต่อไม่ได้"
  uk: "Налаштування проксі в цьому браузері задано політикою, тож URnetwork не може підключитися."
  vi: "Cài đặt proxy của trình duyệt này do chính sách quản lý nên URnetwork không thể kết nối."
  zh: "此浏览器的代理设置由政策管理，因此 URnetwork 无法连接。"
  zh-HK: "此瀏覽器的代理設定由政策管理，因此 URnetwork 無法連接。"
