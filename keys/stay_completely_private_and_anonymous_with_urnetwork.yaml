description: |
  Used as a headline in the Initial Auth carousel. The {brand} placeholder should be replaced with "with URnetwork", styled differently (e.g., in <small> tags or a different font).
  Example: "<p>Stay completely private and anonymous</p><small>with URnetwork</small>"
