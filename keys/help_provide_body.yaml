description: "Body of the short help for providing (title: \"What is providing?\"), opened from a '?' button next to the provide controls. Plain and honest: other members' traffic can leave through the user's connection; rewards are possible, not promised. Keep Provide mode as the app's label for that setting."
source: "Providing shares some of your internet with other URnetwork members: their traffic can go out through your connection. Providers can earn rewards for the data they share. Provide mode sets when this device provides, and you can stop at any time."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "التوفير يشارك جزءًا من اتصالك بالإنترنت مع أعضاء URnetwork الآخرين: يمكن أن تخرج حركة مرورهم عبر اتصالك. يمكن للموفّرين كسب مكافآت مقابل البيانات التي يشاركونها. يحدد وضع التوفير متى يوفّر هذا الجهاز، ويمكنك التوقف في أي وقت."
  cs: "Poskytování sdílí část vašeho internetu s ostatními členy URnetwork: jejich provoz může odcházet přes vaše připojení. Poskytovatelé mohou za sdílená data získávat odměny. Režim poskytování určuje, kdy toto zařízení poskytuje, a kdykoli můžete přestat."
  de: "Beim Bereitstellen teilst du einen Teil deines Internets mit anderen URnetwork-Mitgliedern: Ihr Datenverkehr kann über deine Verbindung ins Internet gehen. Anbieter können für die geteilten Daten Belohnungen verdienen. Der Bereitstellungsmodus legt fest, wann dieses Gerät bereitstellt, und du kannst jederzeit aufhören."
  el: "Η παροχή μοιράζεται μέρος του διαδικτύου σας με άλλα μέλη του URnetwork: η κίνησή τους μπορεί να βγαίνει μέσω της σύνδεσής σας. Οι πάροχοι μπορούν να κερδίζουν ανταμοιβές για τα δεδομένα που μοιράζονται. Η λειτουργία παροχής ορίζει πότε παρέχει αυτή η συσκευή και μπορείτε να σταματήσετε οποιαδήποτε στιγμή."
  en: "Providing shares some of your internet with other URnetwork members: their traffic can go out through your connection. Providers can earn rewards for the data they share. Provide mode sets when this device provides, and you can stop at any time."
  es: "La provisión comparte parte de tu internet con otros miembros de URnetwork: su tráfico puede salir a través de tu conexión. Los proveedores pueden ganar recompensas por los datos que comparten. El modo de provisión define cuándo provee este dispositivo, y puedes dejar de hacerlo en cualquier momento."
  es-419: "La provisión comparte parte de tu internet con otros miembros de URnetwork: su tráfico puede salir a través de tu conexión. Los proveedores pueden ganar recompensas por los datos que comparten. El modo de provisión define cuándo provee este dispositivo, y puedes dejar de hacerlo en cualquier momento."
  es-MX: "La provisión comparte parte de tu internet con otros miembros de URnetwork: su tráfico puede salir a través de tu conexión. Los proveedores pueden ganar recompensas por los datos que comparten. El modo de provisión define cuándo provee este dispositivo, y puedes dejar de hacerlo en cualquier momento."
  fr: "La fourniture partage une partie de votre connexion internet avec d’autres membres d’URnetwork : leur trafic peut sortir par votre connexion. Les fournisseurs peuvent gagner des récompenses pour les données qu’ils partagent. Le mode de fourniture définit quand cet appareil fournit, et vous pouvez arrêter à tout moment."
  he: "אספקה משתפת חלק מהאינטרנט שלך עם חברי URnetwork אחרים: התעבורה שלהם יכולה לצאת דרך החיבור שלך. ספקים יכולים להרוויח תגמולים על הנתונים שהם משתפים. מצב האספקה קובע מתי המכשיר הזה מספק, ואפשר להפסיק בכל עת."
  hi: "प्रदान करने से आपका कुछ इंटरनेट URnetwork के अन्य सदस्यों के साथ साझा होता है: उनका ट्रैफ़िक आपके कनेक्शन से बाहर जा सकता है। प्रदाता साझा किए गए डेटा के लिए पुरस्कार कमा सकते हैं। प्रदान मोड तय करता है कि यह डिवाइस कब प्रदान करे, और आप कभी भी रोक सकते हैं।"
  id: "Penyediaan membagikan sebagian internet Anda dengan anggota URnetwork lain: lalu lintas mereka dapat keluar melalui koneksi Anda. Penyedia dapat memperoleh hadiah atas data yang mereka bagikan. Mode penyediaan menentukan kapan perangkat ini menyediakan, dan Anda dapat berhenti kapan saja."
  it: "La fornitura condivide parte della tua connessione internet con altri membri di URnetwork: il loro traffico può uscire dalla tua connessione. I fornitori possono guadagnare ricompense per i dati che condividono. La modalità di fornitura stabilisce quando questo dispositivo fornisce, e puoi smettere in qualsiasi momento."
  ja: "提供とは、インターネット回線の一部を他の URnetwork メンバーと共有することです。メンバーの通信があなたの回線から外部へ出ることがあります。提供者は共有したデータに応じて報酬を得られます。提供モードでこのデバイスが提供するタイミングを設定でき、いつでも停止できます。"
  ko: "제공은 인터넷의 일부를 다른 URnetwork 회원과 공유하는 것입니다. 회원의 트래픽이 사용자의 연결을 통해 나갈 수 있습니다. 제공자는 공유한 데이터에 대해 보상을 받을 수 있습니다. 제공 모드로 이 기기가 제공하는 시점을 정하며, 언제든지 중단할 수 있습니다."
  nl: "Bij leveren deel je een deel van je internet met andere URnetwork-leden: hun verkeer kan via jouw verbinding naar buiten gaan. Leveranciers kunnen beloningen verdienen voor de data die ze delen. De leveringsmodus bepaalt wanneer dit apparaat levert, en je kunt op elk moment stoppen."
  pl: "Udostępnianie dzieli część twojego internetu z innymi członkami URnetwork: ich ruch może wychodzić przez twoje połączenie. Dostawcy mogą zdobywać nagrody za udostępniane dane. Tryb udostępniania określa, kiedy to urządzenie udostępnia, a przestać możesz w każdej chwili."
  pt: "O fornecimento compartilha parte da sua internet com outros membros da URnetwork: o tráfego deles pode sair pela sua conexão. Os fornecedores podem ganhar recompensas pelos dados que compartilham. O modo de fornecimento define quando este dispositivo fornece, e você pode parar a qualquer momento."
  pt-BR: "O fornecimento compartilha parte da sua internet com outros membros da URnetwork: o tráfego deles pode sair pela sua conexão. Os fornecedores podem ganhar recompensas pelos dados que compartilham. O modo de fornecimento define quando este dispositivo fornece, e você pode parar a qualquer momento."
  pt-PT: "O fornecimento partilha parte da sua internet com outros membros da URnetwork: o tráfego deles pode sair pela sua ligação. Os fornecedores podem ganhar recompensas pelos dados que partilham. O modo de fornecimento define quando este dispositivo fornece, e pode parar a qualquer momento."
  ru: "Предоставление делится частью вашего интернета с другими участниками URnetwork: их трафик может выходить через ваше подключение. Поставщики могут получать вознаграждения за переданные данные. Режим предоставления определяет, когда это устройство предоставляет доступ, и вы можете остановиться в любой момент."
  sv: "Tillhandahållande delar en del av ditt internet med andra URnetwork-medlemmar: deras trafik kan gå ut via din anslutning. Leverantörer kan tjäna belöningar för den data de delar. Tillhandahållandeläget avgör när den här enheten tillhandahåller, och du kan sluta när som helst."
  sw: "Utoaji hushiriki sehemu ya intaneti yako na wanachama wengine wa URnetwork: trafiki yao inaweza kutoka kupitia muunganisho wako. Watoaji wanaweza kupata zawadi kwa data wanayoshiriki. Hali ya utoaji huamua lini kifaa hiki kinatoa, na unaweza kuacha wakati wowote."
  th: "การให้บริการคือการแบ่งปันอินเทอร์เน็ตบางส่วนของคุณกับสมาชิก URnetwork คนอื่น ทราฟฟิกของพวกเขาอาจออกผ่านการเชื่อมต่อของคุณ ผู้ให้บริการสามารถรับรางวัลจากข้อมูลที่แบ่งปัน โหมดการให้บริการกำหนดว่าอุปกรณ์นี้จะให้บริการเมื่อใด และคุณหยุดได้ทุกเมื่อ"
  uk: "Надання ділиться частиною вашого інтернету з іншими учасниками URnetwork: їхній трафік може виходити через ваше підключення. Постачальники можуть отримувати винагороди за дані, якими діляться. Режим надання визначає, коли цей пристрій надає доступ, і ви можете зупинитися будь-коли."
  vi: "Cung cấp là chia sẻ một phần internet của bạn với các thành viên URnetwork khác: lưu lượng của họ có thể đi ra qua kết nối của bạn. Nhà cung cấp có thể nhận phần thưởng cho dữ liệu họ chia sẻ. Chế độ cung cấp quyết định khi nào thiết bị này cung cấp, và bạn có thể dừng bất cứ lúc nào."
  zh: "提供是指与其他 URnetwork 成员共享你的一部分网络：他们的流量可以通过你的连接出去。提供者可以凭共享的数据获得奖励。提供模式决定此设备何时提供，你可以随时停止。"
  zh-HK: "提供是指與其他 URnetwork 成員共享你的一部分網絡：他們的流量可以經你的連線出去。提供者可以憑共享的數據獲得獎勵。提供模式決定此裝置何時提供，你可以隨時停止。"
