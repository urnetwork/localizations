description: "Earnings, the settlement v2 tile, the claim sheet and the claim dialog: names the coldkey's account in URnetwork's provider pool (an account whose kind is provider) beside its capture the flag account (sn_ctf_pool), in place of Pool {no_id} (sn_ledger_pool). The provider pool is the settlement v2 pool that pays for the network's usage and the extenders' share. A short title; use the app's word for provider and for pool."
