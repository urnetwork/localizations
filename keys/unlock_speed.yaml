description: "Upgrade subscription overlay"
source: "You’ll unlock even faster speeds, and first dibs on new features like robust anti-censorship measures and data control."
platforms:
  - android
localizations:
  ar: "ستفتح سرعات أعلى وستحصل على أولوية الوصول إلى ميزات جديدة مثل تدابير قوية لمكافحة الرقابة والتحكم في البيانات."
  cs: "Získáte ještě vyšší rychlosti a jako první budete mít přístup k novým funkcím, jako jsou robustní opatření proti cenzuře a kontrola dat."
  de: "Du schaltest noch schnellere Geschwindigkeiten frei und erhältst vorrangigen Zugriff auf neue Funktionen wie robuste Anti-Zensur-Maßnahmen und Datenkontrolle."
  el: "Θα ξεκλειδώσετε ακόμη πιο γρήγορες ταχύτητες και θα έχετε προτεραιότητα σε νέες δυνατότητες όπως ισχυρά μέτρα κατά της λογοκρισίας και έλεγχο δεδομένων."
  en: "You’ll unlock even faster speeds, and first dibs on new features like robust anti-censorship measures and data control."
  es: "Desbloquearás velocidades aún más rápidas y tendrás prioridad en las nuevas funciones, como medidas anti-censura robustas y control de datos."
  es-419: "Desbloquearás velocidades aún más rápidas y tendrás prioridad en las nuevas funciones, como medidas anti-censura robustas y control de datos."
  es-MX: "Desbloquearás velocidades aún más rápidas y tendrás prioridad en las nuevas funciones, como medidas anti-censura robustas y control de datos."
  fr: "Vous débloquerez des vitesses encore plus rapides et vous aurez la priorité sur les nouvelles fonctionnalités telles que des mesures anti-censure robustes et le contrôle des données."
  he: "תוכל לפתוח מהירויות גבוהות יותר, ולקבל גישה ראשונה לתכונות חדשות כמו אמצעי הגנה חזקים נגד צנזורה ושליטה בנתונים."
  hi: "आप और भी तेज़ गति अनलॉक करेंगे और आपको मजबूत सेंसरशिप विरोधी उपायों और डेटा नियंत्रण जैसी नई सुविधाओं पर प्राथमिकता मिलेगी।"
  id: "Anda akan membuka kecepatan yang lebih cepat, dan akses pertama ke fitur baru seperti tindakan anti-penyensoran yang kuat dan kontrol data."
  it: "Sbloccherai velocità ancora più elevate e avrai accesso prioritario a nuove funzionalità come robuste misure anti-censura e controllo dei dati."
  ja: "さらに高速な速度と、強力な検閲対策や制御データなどの新機能への優先アクセスがロック解除されます。"
  ko: "더 빠른 속도와 강력한 검열 방지 조치, 데이터 제어와 같은 새로운 기능에 대한 우선권을 얻을 수 있습니다."
  nl: "Je krijgt nog snellere snelheden en als eerste toegang tot nieuwe functies zoals krachtige anti-censuurmaatregelen en datacontrole."
  pl: "Odblokujesz jeszcze szybsze prędkości i pierwszeństwo do nowych funkcji, takich jak solidne środki przeciw cenzurze i kontrola danych."
  pt: "Você desbloqueará velocidades ainda mais rápidas e terá acesso antecipado a novos recursos como medidas robustas anti-censura e controle de dados."
  pt-BR: "Você desbloqueará velocidades ainda mais rápidas e terá acesso antecipado a novos recursos como medidas robustas anti-censura e controle de dados."
  pt-PT: "Você desbloqueará velocidades ainda mais rápidas e terá acesso antecipado a novos recursos como medidas robustas anti-censura e controle de dados."
  ru: "Вы получите доступ к еще более высоким скоростям и первым получите новые функции, такие как надежные меры по борьбе с цензурой и контроль данных."
  sv: "Du låser upp ännu snabbare hastigheter och får först tillgång till nya funktioner som robusta åtgärder mot censur och datakontroll."
  sw: "Utafungua kasi ya haraka zaidi, na dibs za kwanza kwenye vipengele vipya kama vile hatua thabiti za kupambana na udhibiti na udhibiti wa data."
  th: "คุณจะได้รับการปลดล็อกความเร็วที่เร็วกว่าใครเพื่อน และได้ใช้งานฟังก์ชั่นใหม่ๆ ก่อนใครเช่นการควบคุมข้อมูล หรือการป้องกันการเซ็นเซอร์ต่างๆ"
  uk: "Ви отримаєте ще вищу швидкість та перший доступ до нових функцій, таких як надійні заходи проти цензури та контроль даних."
  vi: "Bạn sẽ mở khóa tốc độ nhanh hơn và được ưu tiên trải nghiệm các tính năng mới như biện pháp chống kiểm duyệt mạnh mẽ và kiểm soát dữ liệu."
  zh: "您将解锁更快的速度，并首先获得强大的反审查措施和数据控制等新功能。"
  zh-HK: "您將解鎖更快的速度，並優先體驗新功能，如強大的反審查措施和數據控制。"
