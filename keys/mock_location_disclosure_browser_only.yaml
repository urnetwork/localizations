description: "Disclosure shown with the browser geolocation override toggle: the simulated location is reported only to pages in this browser, not to the device."
source: "Only pages in this browser see the changed location. Your device's location is unchanged."
platforms:
  - web
localizations:
  ar: "الصفحات في هذا المتصفح فقط هي التي ترى الموقع المتغيّر. ولا يتغيّر موقع جهازك."
  cs: "Změněnou polohu vidí pouze stránky v tomto prohlížeči. Poloha vašeho zařízení zůstává beze změny."
  de: "Nur Seiten in diesem Browser sehen den geänderten Standort. Der Standort deines Geräts bleibt unverändert."
  el: "Μόνο οι σελίδες σε αυτό το πρόγραμμα περιήγησης βλέπουν την αλλαγμένη τοποθεσία. Η τοποθεσία της συσκευής σας δεν αλλάζει."
  en: "Only pages in this browser see the changed location. Your device's location is unchanged."
  es: "Solo las páginas de este navegador ven la ubicación modificada. La ubicación de tu dispositivo no cambia."
  es-419: "Solo las páginas de este navegador ven la ubicación modificada. La ubicación de tu dispositivo no cambia."
  es-MX: "Solo las páginas de este navegador ven la ubicación modificada. La ubicación de tu dispositivo no cambia."
  fr: "Seules les pages de ce navigateur voient la position modifiée. La position de votre appareil reste inchangée."
  he: "רק דפים בדפדפן הזה רואים את המיקום ששונה. מיקום המכשיר שלך אינו משתנה."
  hi: "बदला हुआ स्थान सिर्फ़ इस ब्राउज़र के पेज देखते हैं। आपके डिवाइस का स्थान नहीं बदलता।"
  id: "Hanya halaman di browser ini yang melihat lokasi yang diubah. Lokasi perangkat Anda tidak berubah."
  it: "Solo le pagine in questo browser vedono la posizione modificata. La posizione del tuo dispositivo non cambia."
  ja: "変更された位置情報は、このブラウザーのページにのみ表示されます。デバイスの位置情報は変わりません。"
  ko: "변경된 위치는 이 브라우저의 페이지에만 표시됩니다. 기기의 위치는 그대로입니다."
  nl: "Alleen pagina's in deze browser zien de gewijzigde locatie. De locatie van je apparaat verandert niet."
  pl: "Zmienioną lokalizację widzą tylko strony w tej przeglądarce. Lokalizacja Twojego urządzenia pozostaje bez zmian."
  pt: "Apenas as páginas neste navegador veem a localização alterada. A localização do seu dispositivo não é alterada."
  pt-BR: "Somente as páginas neste navegador veem a localização alterada. A localização do seu dispositivo não muda."
  pt-PT: "Apenas as páginas neste navegador veem a localização alterada. A localização do seu dispositivo não é alterada."
  ru: "Изменённое местоположение видят только страницы в этом браузере. Местоположение устройства не меняется."
  sv: "Bara sidor i den här webbläsaren ser den ändrade platsen. Enhetens plats påverkas inte."
  sw: "Ni kurasa katika kivinjari hiki pekee zinazoona mahali palipobadilishwa. Mahali pa kifaa chako hapabadiliki."
  th: "เฉพาะหน้าเว็บในเบราว์เซอร์นี้เท่านั้นที่เห็นตำแหน่งที่เปลี่ยนไป ตำแหน่งของอุปกรณ์คุณไม่เปลี่ยนแปลง"
  uk: "Змінене місцезнаходження бачать лише сторінки в цьому браузері. Місцезнаходження пристрою не змінюється."
  vi: "Chỉ các trang trong trình duyệt này thấy vị trí đã thay đổi. Vị trí thiết bị của bạn không thay đổi."
  zh: "只有此浏览器中的网页会看到更改后的位置。您设备的位置不会改变。"
  zh-HK: "只有此瀏覽器中的網頁會看到更改後的位置。您裝置的位置不會改變。"
