description: "Title of the in-app notice and of the local notification shown while the platform holds this device off because the account network already has its plan's most devices connected at once (the concurrent client limit). The device does not connect until a slot frees, the user upgrades, or the hold ends; the user's traffic stays in the tunnel. Short, like a heading."
